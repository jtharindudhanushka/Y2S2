<div class="topbar"><div><h1>Lesson 6: Supervised Machine Learning</h1><div class="sub">Predicting numbers and categories from solved examples. Every formula is explained step by step.</div></div><span class="source-tag">Lesson 6 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌱", "n": "The big picture", "h": "<h2>The big picture: learning from solved examples</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> We show the machine examples with answers, and it finds a rule that predicts the answer for new inputs.</div><div class=\"r\"><b>🧪 Example:</b> Hours studied &rarr; predicted GPA (a number). Hours studied &rarr; Pass or Fail (a category).</div><div class=\"r\"><b>✅ Remember:</b> Number = regression (linear regression). Category = classification (logistic regression).</div></div>\n<div class=\"one\">In supervised learning, every training example comes with the right answer. The machine uses these to find a rule. This lesson covers the two most important methods: <b>linear regression</b> (predict a number) and <b>logistic regression</b> (predict a category).</div>\n<div class=\"an\">🌍 <b>Analogy: a ruler on a scatter plot.</b> You scatter dots on paper, one for each student: hours studied across, GPA up. Then you lay a ruler so it passes as close to all the dots as possible. To predict a new student's GPA, you read the height of the ruler at their hours. The ruler is the model.</div>\n<h3>The path of this lesson</h3>\n<ol><li><b>Symbols and maths:</b> a quick refresher so no step feels hard.</li><li><b>Linear regression:</b> the straight-line rule ŷ = w &times; x + b.</li><li><b>Error:</b> how to score how good a line is.</li><li><b>Gradient descent:</b> how the machine finds the best line by itself.</li><li><b>Underfitting and overfitting:</b> when a model is too simple or too wiggly.</li><li><b>Logistic regression:</b> how to predict categories using probabilities.</li></ol>\n<details><summary>Check yourself 1</summary><p>Predicting a student's GPA is regression or classification? <b>Answer:</b> Regression, because GPA is a number.</p></details>\n<details><summary>Check yourself 2</summary><p>Predicting Pass or Fail uses which method in this lesson? <b>Answer:</b> Logistic regression (classification).</p></details>"}, {"i": "🔤", "n": "Symbols and maths", "h": "<h2>The symbols and the maths you need</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A formula is a short sentence. Each letter stands for one thing.</div><div class=\"r\"><b>🧪 Example:</b> ŷ = w &times; x + b reads: prediction = weight &times; input + bias.</div><div class=\"r\"><b>✅ Remember:</b> A hat on a letter (ŷ) means predicted. No hat (y) means the real answer.</div></div>\n<div class=\"wrap\"><table><tr><th>Symbol</th><th>Name</th><th>Plain meaning</th><th>Example</th></tr>\n<tr><td>x</td><td>input (feature)</td><td>What we give the model</td><td>Hours studied = 3</td></tr>\n<tr><td>y</td><td>actual value</td><td>The real answer from the data</td><td>Real GPA = 3.2</td></tr>\n<tr><td>ŷ</td><td>y-hat, prediction</td><td>The answer the model guesses</td><td>Model says 2.8</td></tr>\n<tr><td>w (also written m)</td><td>weight, slope</td><td>How strongly x affects the prediction. A steep line has a big w.</td><td>w = 0.8</td></tr>\n<tr><td>b (also written c or w0)</td><td>bias, intercept</td><td>The starting value of the line when x = 0. It slides the line up or down.</td><td>b = 1.2</td></tr>\n<tr><td>&epsilon;</td><td>error</td><td>Actual minus predicted: &epsilon; = y &minus; ŷ</td><td>3.2 &minus; 2.0 = 1.2</td></tr>\n<tr><td>E or SSE</td><td>total error</td><td>The sum of all the squared errors</td><td>13.65</td></tr>\n<tr><td>&Sigma;</td><td>sigma, sum</td><td>\"Add up this thing for every data point\"</td><td>&Sigma; &epsilon;&sup2;</td></tr>\n<tr><td>&eta; (or &alpha;)</td><td>learning rate</td><td>How big each learning step is</td><td>0.1</td></tr>\n<tr><td>z</td><td>weighted sum</td><td>w &times; x + b before any squashing</td><td>z = 1.5</td></tr>\n<tr><td>&sigma;(z)</td><td>sigmoid</td><td>Squashes any number into 0 to 1</td><td>&sigma;(0) = 0.5</td></tr>\n<tr><td>e (the number)</td><td>Euler's number</td><td>A fixed number, about 2.718, used inside the sigmoid. It is NOT the error. The error uses &epsilon;.</td><td>e &asymp; 2.718</td></tr></table></div>\n<div class=\"why\"><b>Different letters, same idea:</b> some books write the weight as w, m or H, and the bias as b, c or w0. For example ŷ = m x + c and ŷ = w1 x1 + w0 both mean: prediction = (weight &times; input) + bias.</div>\n<h3>Maths refresher</h3>\n<p><b>1. Slope of a straight line</b> = how much it goes up for each step right: <b>rise &divide; run</b>. A line from (0, 1) to (3, 7): rise = 6, run = 3, slope = 2. Positive slope goes up to the right. Negative goes down. Zero is flat.</p>\n<p><b>2. Slope of a curve at one point.</b> A bowl is a curve, so its steepness changes from place to place. The slope at one point is the steepness of a tiny straight piece touching the curve. Trick: <b>move a tiny bit to the right and see how much the height changes.</b></p>\n<p>Example: E(w) = (w &minus; 3)&sup2;. At w = 0: E = 9. At w = 0.001: E = (&minus;2.999)&sup2; = 8.994001. The height changed by &minus;0.005999 over a step of 0.001, so the slope is about <b>&minus;6</b>. Negative slope means moving right makes the error smaller, so downhill is to the right. (Calculus gives the short formula 2 &times; (w &minus; 3); you do not need to derive it.)</p>\n<p><b>3. Squares.</b> Squaring means a number times itself: 4&sup2; = 16. A negative number squared becomes positive: (&minus;4)&sup2; = 16.</p>\n<p><b>4. &Sigma;.</b> For errors 1, &minus;2 and 3: &Sigma; &epsilon;&sup2; = 1 + 4 + 9 = 14.</p>\n<p><b>5. Powers.</b> A negative power means \"one over\": 2<sup>&minus;1</sup> = 0.5. On a calculator use the e<sup>x</sup> button: e<sup>2</sup> = 7.389, so e<sup>&minus;2</sup> = 1 &divide; 7.389 = 0.135.</p>\n<p><b>6. Probability</b> is a number from 0 (impossible) to 1 (certain). Multiply by 100 for a percent: 0.82 is 82%.</p>\n<p><b>7. Words that sound hard.</b> Linear = straight line. Regression = predicting a number. Parameters = the numbers the machine adjusts while learning (w and b). Iteration = one round of updating.</p>\n<details><summary>Check yourself 1</summary><p>A line rises 8 over a run of 4. Slope? <b>Answer:</b> 8 &divide; 4 = 2.</p></details>\n<details><summary>Check yourself 2</summary><p>Errors are 2, &minus;3 and 1. What is &Sigma; &epsilon;&sup2;? <b>Answer:</b> 4 + 9 + 1 = 14.</p></details>"}, {"i": "📈", "n": "Linear regression", "h": "<h2>Linear regression: fitting a straight line</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Draw the best straight line through the dots, then use the line to predict a number.</div><div class=\"r\"><b>🧪 Example:</b> Line: ŷ = 2 &times; x + 1. For x = 3 hours, ŷ = 2 &times; 3 + 1 = 7.</div><div class=\"r\"><b>✅ Remember:</b> The line is ŷ = w x + b. Training means finding good w and b.</div></div>\n<div class=\"one\">Linear regression finds the best straight line through the data so we can predict a number. This is also called <b>curve fitting</b>: finding a function that matches the data.</div>\n<h3>The formula</h3>\n<div class=\"fm\">ŷ = w &times; x + b</div>\n<ul><li><b>x</b> is the input (hours studied).</li><li><b>w</b> (weight) is the slope: how much the prediction rises for each extra hour.</li><li><b>b</b> (bias) is where the line starts when x = 0.</li><li><b>ŷ</b> is the prediction.</li></ul>\n<p><b>Example:</b> if w = 0.8 and b = 1.2, then for x = 2 hours: ŷ = 0.8 &times; 2 + 1.2 = 1.6 + 1.2 = <b>2.8</b>. For x = 5: ŷ = 0.8 &times; 5 + 1.2 = <b>5.2</b>.</p>\n<h3>Fitting means choosing w and b</h3>\n<p>Different w and b make different lines. There are infinitely many possible lines. \"Training\" means finding the w and b that give the best line. The next tab shows how to decide what \"best\" means.</p>\n<h3>Simple vs multiple linear regression</h3>\n<div class=\"wrap\"><table><tr><th>Type</th><th>Inputs</th><th>Formula</th><th>Example</th></tr><tr><td>Simple</td><td>1 feature</td><td>ŷ = w1 x1 + w0</td><td>marks from hours studied</td></tr><tr><td>Multiple</td><td>2 or more features</td><td>ŷ = w0 + w1 x1 + w2 x2 + ...</td><td>marks from hours and attendance</td></tr></table></div>\n<p><b>Multiple example:</b> ŷ = 20 + 5 &times; hours + 0.3 &times; attendance. For 4 hours and 90% attendance: 5 &times; 4 = 20, and 0.3 &times; 90 = 27. So ŷ = 20 + 20 + 27 = <b>67 marks</b>. With two features the model fits a flat <b>plane</b> instead of a line.</p>\n<h3>The x0 = 1 trick</h3>\n<p>We can write ŷ = &Sigma; w_i x_i with x0 = 1. This just means: pretend there is an extra input that is always 1. Then w0 &times; 1 = w0, so the bias is treated like any other weight. It makes the formula shorter and is used in neural networks.</p>\n<details><summary>Check yourself 1</summary><p>ŷ = 0.5 x + 2. Predict for x = 6. <b>Answer:</b> 0.5 &times; 6 + 2 = 5.</p></details>\n<details><summary>Check yourself 2</summary><p>What does the bias b do? <b>Answer:</b> It sets the value of the line when x = 0, sliding the line up or down.</p></details>"}, {"i": "📏", "n": "How good is a line?", "h": "<h2>How good is a line? Error, SSE and R&sup2;</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Measure each miss, square it, add them all. A smaller total means a better line.</div><div class=\"r\"><b>🧪 Example:</b> Misses of 3 and &minus;4 give 9 + 16 = 25 total error.</div><div class=\"r\"><b>✅ Remember:</b> SSE = &Sigma; (y &minus; ŷ)&sup2;. The best line has the smallest SSE.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: fitting a line with least squares</b><br>StatQuest fits a line to dots (mouse weight against mouse size) like this: draw a line, measure how far each dot is from the line (the <b>residuals</b>), square them and add them up. Then <b>rotate the line</b> and measure again. The line with the <b>smallest sum of squares</b> is the best-fitting line. That method is called <b>least squares</b>. Then <b>R&sup2;</b> tells you how much of the variation the line explains.</div>\n<h3>Step 1: the error of one point</h3>\n<p>&epsilon; = y &minus; ŷ. This is the gap between the real value and the prediction, like measuring how far an arrow landed from the bullseye. In statistics this gap is also called a <b>residual</b>.</p>\n<h3>Step 2: square it</h3>\n<ul><li><b>It stops errors cancelling.</b> One point is 5 above the line (+5) and another is 5 below (&minus;5). Adding gives 0, which wrongly says \"perfect\". Squaring gives 25 + 25 = 50.</li><li><b>It punishes big mistakes.</b> An error of 2 becomes 4. An error of 10 becomes 100.</li></ul>\n<h3>Step 3: add them up</h3>\n<div class=\"fm\">SSE = &Sigma; (y &minus; ŷ)&sup2;</div>\n<h3>Worked example: two lines on the same data</h3>\n<p>Data (x = hours, y = GPA): (2, 2.8), (1, 3.2), (3, 3.8), (5, 3.6), (6, 2.9).</p>\n<p><b>Line A:</b> ŷ = 0.8 x + 1.2</p>\n<div class=\"wrap\"><table><tr><th>x</th><th>y (actual)</th><th>ŷ (predicted)</th><th>&epsilon; = y &minus; ŷ</th><th>&epsilon;&sup2;</th></tr><tr><td>2</td><td>2.8</td><td>0.8 &times; 2 + 1.2 = 2.8</td><td>0</td><td>0</td></tr><tr><td>1</td><td>3.2</td><td>0.8 &times; 1 + 1.2 = 2.0</td><td>1.2</td><td>1.44</td></tr><tr><td>3</td><td>3.8</td><td>0.8 &times; 3 + 1.2 = 3.6</td><td>0.2</td><td>0.04</td></tr><tr><td>5</td><td>3.6</td><td>0.8 &times; 5 + 1.2 = 5.2</td><td>&minus;1.6</td><td>2.56</td></tr><tr><td>6</td><td>2.9</td><td>0.8 &times; 6 + 1.2 = 6.0</td><td>&minus;3.1</td><td>9.61</td></tr></table></div>\n<p>SSE of Line A = 0 + 1.44 + 0.04 + 2.56 + 9.61 = <b>13.65</b>.</p>\n<p><b>Line B:</b> ŷ = 0.1 x + 3</p>\n<div class=\"wrap\"><table><tr><th>x</th><th>y</th><th>ŷ</th><th>&epsilon;</th><th>&epsilon;&sup2;</th></tr><tr><td>2</td><td>2.8</td><td>3.2</td><td>&minus;0.4</td><td>0.16</td></tr><tr><td>1</td><td>3.2</td><td>3.1</td><td>0.1</td><td>0.01</td></tr><tr><td>3</td><td>3.8</td><td>3.3</td><td>0.5</td><td>0.25</td></tr><tr><td>5</td><td>3.6</td><td>3.5</td><td>0.1</td><td>0.01</td></tr><tr><td>6</td><td>2.9</td><td>3.6</td><td>&minus;0.7</td><td>0.49</td></tr></table></div>\n<p>SSE of Line B = 0.16 + 0.01 + 0.25 + 0.01 + 0.49 = <b>0.92</b>. That is much smaller than 13.65, so Line B fits far better.</p>\n<h3>Rotating the line (the StatQuest idea) with numbers</h3>\n<p>Take the data (1, 2), (2, 3), (3, 5), (4, 4), (5, 6). The average x is 3 and the average y is 4. Keep each line passing through the point (3, 4) and just <b>rotate</b> it (change the slope):</p>\n<div class=\"wrap\"><table><tr><th>Slope of the line</th><th>Line</th><th>SSE</th></tr><tr><td>0 (flat)</td><td>ŷ = 4</td><td>10</td></tr><tr><td>0.5</td><td>ŷ = 2.5 + 0.5 x</td><td>3.5</td></tr><tr><td>0.9</td><td>ŷ = 1.3 + 0.9 x</td><td><b>1.9</b></td></tr><tr><td>1.2</td><td>ŷ = 0.4 + 1.2 x</td><td>2.8</td></tr></table></div>\n<p>As we rotate from flat, the SSE falls (10, 3.5, 1.9) and then rises again (2.8). The lowest is near slope 0.9. That is the least squares line: ŷ = 1.3 + 0.9 x.</p>\n<h3>R&sup2;: how much does the line explain?</h3>\n<p>Compare two errors: the SSE around the <b>average</b> (the dumb guess: always predict 4) and the SSE around the <b>fitted line</b>.</p>\n<ul><li>Around the average: (2&minus;4)&sup2; + (3&minus;4)&sup2; + (5&minus;4)&sup2; + (4&minus;4)&sup2; + (6&minus;4)&sup2; = 4 + 1 + 1 + 0 + 4 = <b>10</b>.</li><li>Around the line ŷ = 1.3 + 0.9 x (predictions 2.2, 3.1, 4.0, 4.9, 5.8): 0.04 + 0.01 + 1.0 + 0.81 + 0.04 = <b>1.9</b>.</li></ul>\n<div class=\"fm\">R&sup2; = (SSE around the average &minus; SSE around the line) &divide; SSE around the average</div>\n<p>R&sup2; = (10 &minus; 1.9) &divide; 10 = <b>0.81</b>. The line explains <b>81%</b> of the variation. A value near 1 means a very good fit. A value near 0 means the line is no better than just guessing the average.</p>\n<h3>Why SSE depends on w and b</h3>\n<p>The data points are fixed facts. The only things we can change are w and b. So the error depends only on w and b: <b>E = f(w, b)</b>. Plot E for every pair (w, b) and you get a <b>bowl shape</b>. The best line is at the bottom of the bowl.</p>\n<div class=\"an\">🌍 <b>Analogy: a bowl and a marble.</b> Every spot on the bowl is one choice of (w, b). The height at that spot is the error. We want the marble to roll to the bottom.</div>\n<details><summary>Check yourself 1</summary><p>Errors are 3 and &minus;4. SSE? <b>Answer:</b> 9 + 16 = 25.</p></details>\n<details><summary>Check yourself 2</summary><p>SSE around the average is 20 and SSE around the line is 5. R&sup2;? <b>Answer:</b> (20 &minus; 5) &divide; 20 = 0.75, so 75%.</p></details>"}, {"i": "⛰️", "n": "Gradient descent", "h": "<h2>Gradient descent: rolling down the bowl</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Start with a guess. Check the slope. Take a small step downhill. Repeat.</div><div class=\"r\"><b>🧪 Example:</b> w = 0, slope = &minus;6, learning rate 0.1. New w = 0 &minus; 0.1 &times; (&minus;6) = 0.6.</div><div class=\"r\"><b>✅ Remember:</b> New w = old w &minus; &eta; &times; slope. A big &eta; overshoots. A small &eta; is slow.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: gradient descent, step by step</b><br>StatQuest explains it by fitting just the <b>intercept</b> of a line.<ol><li>Start with a random guess for the intercept, for example 0.</li><li>Find the slope (gradient) of the error curve at that point. Say it is &minus;190.</li><li><b>Step size = slope &times; learning rate.</b> With a learning rate of 0.1: &minus;190 &times; 0.1 = &minus;19.</li><li><b>New intercept = old intercept &minus; step size</b> = 0 &minus; (&minus;19) = 19.</li><li>Repeat. The slope gets smaller as we near the bottom, so the steps shrink. After 13 steps the intercept settles at about 95. We stop when the steps are tiny (or after a maximum number of steps).</li></ol></div>\n<div class=\"one\">We cannot try every (w, b). Instead we start somewhere and keep stepping downhill on the error bowl until we reach the bottom.</div>\n<div class=\"an\">🌍 <b>Analogy: walking down a hill in thick fog.</b> You cannot see the bottom, but you can feel which way the ground slopes under your feet. You step that way, then feel again. After many steps you reach the valley.</div>\n<h3>The steps</h3>\n<ol><li>Start with a random guess for w (and b).</li><li>Find the <b>slope</b> of the error at this point. The slope says which direction is uphill.</li><li>Take a step in the <b>opposite</b> direction (downhill).</li><li>Repeat until the steps are very small.</li></ol>\n<div class=\"fm\">new w = old w &minus; &eta; &times; slope</div>\n<p>&eta; (the <b>learning rate</b>) is a small number you choose. <b>Step size = &eta; &times; slope.</b></p>\n<h3>Worked example with one number</h3>\n<p>Let the error be E(w) = (w &minus; 3)&sup2;. This is a bowl whose bottom is at w = 3. Its slope is 2 &times; (w &minus; 3). Take &eta; = 0.1 and start at w = 0.</p>\n<div class=\"wrap\"><table><tr><th>Step</th><th>w now</th><th>Slope = 2(w &minus; 3)</th><th>Step = 0.1 &times; slope</th><th>New w = w &minus; step</th></tr><tr><td>1</td><td>0</td><td>&minus;6</td><td>&minus;0.6</td><td>0.6</td></tr><tr><td>2</td><td>0.6</td><td>&minus;4.8</td><td>&minus;0.48</td><td>1.08</td></tr><tr><td>3</td><td>1.08</td><td>&minus;3.84</td><td>&minus;0.384</td><td>1.464</td></tr><tr><td>4</td><td>1.464</td><td>&minus;3.072</td><td>&minus;0.3072</td><td>1.7712</td></tr></table></div>\n<ul><li>The slope is negative, so the bowl goes down to the right. Subtracting a negative step makes w <b>bigger</b>, moving toward 3.</li><li>The slope gets smaller as we near the bottom (&minus;6, &minus;4.8, &minus;3.84...), so the steps shrink on their own. At the very bottom the slope is 0.</li><li>The error also falls: 9, 5.76, 3.69, 2.36, 1.51.</li></ul>\n<h3>The learning rate matters</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>Just right (&eta; = 0.1)</b><br>Steady steps toward 3.</div><div class=\"L a3\"><b>Too big (&eta; = 1.1)</b><br>w goes 0, 6.6, &minus;1.32, 8.18... It jumps past the bottom and gets worse each time.</div><div class=\"L a2\"><b>Too small (&eta; = 0.001)</b><br>The first step is only 0.006. It would need thousands of steps.</div></div>\n<p><b>Check the too-big case:</b> w = 0, slope &minus;6, step = 1.1 &times; (&minus;6) = &minus;6.6, so w = 6.6. Next slope = 2(6.6 &minus; 3) = 7.2, step = 7.92, w = 6.6 &minus; 7.92 = &minus;1.32. Next slope = 2(&minus;1.32 &minus; 3) = &minus;8.64, step = &minus;9.504, w = &minus;1.32 + 9.504 = 8.184.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> too big = running down the hill and flying across to the other side. Too small = shuffling forward one millimetre at a time.</div>\n<h3>Gradient descent on a real line</h3>\n<p>For linear regression the error E depends on both w and b, so we find two slopes and update both:</p>\n<ul><li>slope for b = &minus;2 &times; &Sigma; (y &minus; ŷ)</li><li>slope for w = &minus;2 &times; &Sigma; x (y &minus; ŷ)</li></ul>\n<p>(The &minus;2 comes from calculus. Just know the pattern.)</p>\n<p><b>Example:</b> data (1, 2), (2, 4), (3, 6). Start w = 0, b = 0, &eta; = 0.01.</p>\n<ol><li>Predictions are all 0. Errors y &minus; ŷ = 2, 4, 6. SSE = 4 + 16 + 36 = <b>56</b>.</li><li>Slope for b = &minus;2 &times; (2 + 4 + 6) = &minus;24.</li><li>Slope for w = &minus;2 &times; (1&times;2 + 2&times;4 + 3&times;6) = &minus;2 &times; 28 = &minus;56.</li><li>New b = 0 &minus; 0.01 &times; (&minus;24) = <b>0.24</b>. New w = 0 &minus; 0.01 &times; (&minus;56) = <b>0.56</b>.</li><li>New predictions: x = 1: 0.56 + 0.24 = 0.80. x = 2: 1.12 + 0.24 = 1.36. x = 3: 1.68 + 0.24 = 1.92.</li><li>New errors: 1.2, 2.64, 4.08. New SSE = 1.44 + 6.97 + 16.65 = <b>25.06</b>.</li></ol>\n<p>One step cut the error from 56 to 25.06. The best line is ŷ = 2x, which has SSE = 0. Many more steps would get there.</p>\n<details><summary>Check yourself 1</summary><p>w = 5, slope = 4, learning rate 0.1. New w? <b>Answer:</b> 5 &minus; 0.1 &times; 4 = 4.6.</p></details>\n<details><summary>Check yourself 2</summary><p>What happens if the learning rate is too big? <b>Answer:</b> The steps overshoot the bottom and the error can bounce around or get worse.</p></details>"}, {"i": "🎢", "n": "Underfit and overfit", "h": "<h2>Underfitting and overfitting</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A model can be too simple (underfit) or too wiggly (overfit). We want the middle.</div><div class=\"r\"><b>🧪 Example:</b> A straight line on S-shaped data misses badly. A zig-zag through every dot memorises noise.</div><div class=\"r\"><b>✅ Remember:</b> Underfit = high bias. Overfit = high variance. Good = balanced.</div></div>\n<div class=\"one\">\"All models are wrong. Some are useful.\" Our goal is a useful model: one that works well on new data.</div>\n<div class=\"an\">🌍 <b>Analogy: studying for an exam.</b> Studying only the chapter titles is underfitting: too shallow. Memorising last year's paper word for word is overfitting: you fail when the questions change. Understanding the ideas is the sweet spot.</div>\n<div class=\"wrap\"><table><tr><th></th><th>Underfitting</th><th>Good fit</th><th>Overfitting</th></tr><tr><td>Also called</td><td>High bias</td><td>Balanced</td><td>High variance</td></tr><tr><td>Model</td><td>Too simple (a straight line for an S-shaped pattern)</td><td>Follows the broad pattern</td><td>Too flexible (a zig-zag touching every dot)</td></tr><tr><td>Training error</td><td>High</td><td>Low</td><td>Almost zero</td></tr><tr><td>Testing error</td><td>High</td><td>Low</td><td>High</td></tr></table></div>\n<ul><li><b>Bias</b> means the model holds a rigid, wrong assumption, such as \"the pattern must be a straight line\", and ignores what the data shows.</li><li><b>Variance</b> means that if you trained on a slightly different sample, the curve would change a lot.</li></ul>\n<p>The <b>bias-variance problem is finding the right model complexity.</b> A more complex model lowers bias but raises variance. A simpler model does the opposite.</p>\n<p><b>Example diagnosis:</b> Model 1 has training error 12 and testing error 13. Both are high, so it is underfitting. Model 2 has training error 1 and testing error 15. The big gap says it is overfitting.</p>\n<details><summary>Check yourself 1</summary><p>Training error 0.5, testing error 9. Diagnosis? <b>Answer:</b> Overfitting (high variance).</p></details>\n<details><summary>Check yourself 2</summary><p>Which has high bias: a straight line fitted to a curve, or a zig-zag through every dot? <b>Answer:</b> The straight line.</p></details>"}, {"i": "🔀", "n": "Logistic regression", "h": "<h2>Logistic regression: predicting categories</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Despite its name, it classifies. It turns z = w x + b into a probability between 0 and 1.</div><div class=\"r\"><b>🧪 Example:</b> Hours studied 5 gives z = 1.5, probability 0.82, so predict Pass.</div><div class=\"r\"><b>✅ Remember:</b> The sigmoid squashes any number into 0 to 1. Probability &ge; 0.5 means class 1.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: Logistic Regression</b><br>The video predicts whether a mouse is <b>obese</b> from its <b>weight</b>. Instead of fitting a straight line, logistic regression fits an <b>S-shaped curve</b> that goes from 0 to 1. The curve tells you the <b>probability</b> that a mouse is obese for its weight: a light mouse has only a small probability, a heavy mouse a high one. It is usually used for <b>classification</b>: if the probability is more than 50%, we classify the mouse as obese. It can also use other kinds of data, such as genotype, to classify. And instead of least squares, it picks the best curve using <b>maximum likelihood</b> (explained below).</div>\n<div class=\"one\">Logistic regression predicts the <b>chance</b> that an input belongs to a class, such as Pass or Fail, Spam or Not spam, Obese or Not obese. The name says \"regression\", but it is a classification method.</div>\n<h3>Why not just use a straight line?</h3>\n<ul><li>A straight line goes on forever. It can give &minus;1.5 or +3.2, but a probability must stay between 0 and 1.</li><li>One extreme data point far to the side can tilt the whole line and change which points are classified correctly.</li></ul>\n<h3>The sigmoid function</h3>\n<p>Step 1: compute the weighted sum, like linear regression: <b>z = w &times; x + b</b>. Step 2: pass z through the sigmoid:</p>\n<div class=\"fm\">ŷ = &sigma;(z) = 1 / (1 + e<sup>&minus;z</sup>)</div>\n<div class=\"wrap\"><table><tr><th>z</th><th>e<sup>&minus;z</sup></th><th>&sigma;(z) = 1 / (1 + e<sup>&minus;z</sup>)</th><th>Meaning</th></tr><tr><td>&minus;5</td><td>148.4</td><td>1 / 149.4 = 0.0067</td><td>almost 0%</td></tr><tr><td>&minus;2</td><td>7.389</td><td>1 / 8.389 = 0.119</td><td>12%</td></tr><tr><td>0</td><td>1</td><td>1 / 2 = 0.5</td><td>50%</td></tr><tr><td>2</td><td>0.135</td><td>1 / 1.135 = 0.881</td><td>88%</td></tr><tr><td>5</td><td>0.0067</td><td>1 / 1.0067 = 0.993</td><td>almost 100%</td></tr></table></div>\n<p>Big positive z gives a probability near 1. Big negative z gives near 0. z = 0 gives exactly 0.5. The curve is a smooth S shape that never leaves the range 0 to 1.</p>\n<h3>From probability to a decision</h3>\n<div class=\"fm\">predict 1 if ŷ &ge; 0.5, predict 0 if ŷ &lt; 0.5</div>\n<p>0.5 is the usual <b>threshold</b>. A spam probability of 0.82 means spam (1). A probability of 0.15 means not spam (0). The place where z = 0 (probability exactly 0.5) is the <b>decision boundary</b>. Data on one side is Class 1 and on the other side is Class 0.</p>\n<h3>Worked example: pass or fail</h3>\n<p>Data (hours, result): (2, 0), (1, 0), (5, 1), (3, 0), (6, 1). Suppose training gave w = 1 and b = &minus;3.5. So z = x &minus; 3.5.</p>\n<div class=\"wrap\"><table><tr><th>Hours x</th><th>z = x &minus; 3.5</th><th>&sigma;(z)</th><th>Predicted class</th><th>Actual</th></tr><tr><td>1</td><td>&minus;2.5</td><td>0.076</td><td>0</td><td>0</td></tr><tr><td>2</td><td>&minus;1.5</td><td>0.182</td><td>0</td><td>0</td></tr><tr><td>3</td><td>&minus;0.5</td><td>0.378</td><td>0</td><td>0</td></tr><tr><td>5</td><td>1.5</td><td>0.818</td><td>1</td><td>1</td></tr><tr><td>6</td><td>2.5</td><td>0.924</td><td>1</td><td>1</td></tr></table></div>\n<p>All 5 are correct. The decision boundary is at z = 0, which means x = 3.5 hours. For a new student with 4 hours: z = 4 &minus; 3.5 = 0.5, &sigma;(0.5) = 1 / (1 + 0.6065) = <b>0.6225</b>. That is above 0.5, so predict <b>Pass (1)</b>.</p>\n<h3>How does the model find w and b?</h3>\n<p>The same way as before: <b>score every choice with an error, then use gradient descent to lower it</b>. One way to score is the SSE with the sigmoid output, E = &Sigma; (y &minus; &sigma;(...))&sup2;. Using the same 5 students:</p>\n<div class=\"wrap\"><table><tr><th>Hours x</th><th>Actual y</th><th>Choice 1: w = 1, b = &minus;3.5, prediction</th><th>&epsilon;&sup2; for choice 1</th><th>Choice 2: w = 0.2, b = 0, prediction</th><th>&epsilon;&sup2; for choice 2</th></tr>\n<tr><td>2</td><td>0</td><td>0.182</td><td>0.033</td><td>0.599</td><td>0.358</td></tr>\n<tr><td>1</td><td>0</td><td>0.076</td><td>0.006</td><td>0.550</td><td>0.302</td></tr>\n<tr><td>5</td><td>1</td><td>0.818</td><td>0.033</td><td>0.731</td><td>0.072</td></tr>\n<tr><td>3</td><td>0</td><td>0.378</td><td>0.143</td><td>0.646</td><td>0.417</td></tr>\n<tr><td>6</td><td>1</td><td>0.924</td><td>0.006</td><td>0.769</td><td>0.054</td></tr>\n<tr><td colspan=\"3\"><b>Total error E (SSE)</b></td><td><b>0.221</b></td><td></td><td><b>1.204</b></td></tr></table></div>\n<p>Choice 1 has a much smaller total error (0.221 against 1.204), so it is the better choice. Gradient descent starts from a poor guess like choice 2 and takes small downhill steps until it reaches something like choice 1.</p>\n<h3>The StatQuest way to score: maximum likelihood</h3>\n<p>Another way to pick the best S-curve asks: <b>\"How likely is the data we actually saw?\"</b> For each obese mouse, the likelihood is the height of the curve at its weight (the probability the curve gives for obese). For each non-obese mouse, the likelihood is 1 minus that height. Multiply all the likelihoods together. The curve with the <b>biggest</b> product is the best.</p>\n<p><b>Example:</b> 3 mice: obese, not obese, obese.</p>\n<ul><li>Curve A gives 0.9, 0.2, 0.7. Likelihood = 0.9 &times; (1 &minus; 0.2) &times; 0.7 = 0.9 &times; 0.8 &times; 0.7 = <b>0.504</b>.</li><li>Curve B gives 0.6, 0.5, 0.5. Likelihood = 0.6 &times; 0.5 &times; 0.5 = <b>0.15</b>.</li></ul>\n<p>Curve A makes the data much more likely, so it is the better curve.</p>\n<h3>More inputs and the hyperplane</h3>\n<p>With several inputs, z = w0 + w1 x1 + w2 x2 + ... (using the x0 = 1 trick). Compare two models:</p>\n<ul><li><b>Model A (linear regression):</b> ŷ = w1 x1 + w2 x2 + w0</li><li><b>Model B (logistic regression):</b> ŷ = 1 / (1 + e<sup>&minus;(w1 x1 + w2 x2 + w0)</sup>)</li></ul>\n<p>Model B is Model A pushed through a sigmoid. The decision boundary is called a <b>hyperplane</b>: a point when there is 1 feature, a line for 2 features, a flat plane for 3 features.</p>\n<h3>Linear vs logistic</h3>\n<div class=\"wrap\"><table><tr><th></th><th>Linear regression</th><th>Logistic regression</th></tr><tr><td>Task</td><td>Regression (a number)</td><td>Classification (a category)</td></tr><tr><td>Output</td><td>Any number</td><td>A probability from 0 to 1</td></tr><tr><td>Equation</td><td>ŷ = w x + b</td><td>ŷ = 1 / (1 + e<sup>&minus;(w x + b)</sup>)</td></tr><tr><td>How the best fit is found</td><td>Least squares (smallest SSE)</td><td>Maximum likelihood (or a small error)</td></tr><tr><td>Example</td><td>House price</td><td>Is this email spam?</td></tr></table></div>\n<details><summary>Check yourself 1</summary><p>With w = 1 and b = &minus;3.5, what class for 3 hours? <b>Answer:</b> z = &minus;0.5, &sigma;(z) = 0.378, which is below 0.5, so class 0 (Fail).</p></details>\n<details><summary>Check yourself 2</summary><p>Curve X has likelihood 0.4 and curve Y has 0.1 for the same data. Which is better? <b>Answer:</b> Curve X, because it makes the data more likely.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the difficult words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Residual = the gap between a real value and the prediction.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Regression</b></td><td>Predicting a number</td></tr>\n<tr><td><b>Classification</b></td><td>Predicting a category</td></tr>\n<tr><td><b>Weight, bias</b></td><td>The slope of the line / where the line starts</td></tr>\n<tr><td><b>Residual, error</b></td><td>The gap between a real value and its prediction</td></tr>\n<tr><td><b>SSE</b></td><td>Sum of squared errors: the total error of a line</td></tr>\n<tr><td><b>Least squares</b></td><td>Choosing the line with the smallest SSE</td></tr>\n<tr><td><b>R&sup2;</b></td><td>How much of the variation the line explains (0 to 1)</td></tr>\n<tr><td><b>Gradient descent</b></td><td>Taking small downhill steps on the error to find the best weights</td></tr>\n<tr><td><b>Learning rate</b></td><td>How big each step is</td></tr>\n<tr><td><b>Slope (gradient)</b></td><td>How steep the error curve is at one spot</td></tr>\n<tr><td><b>Sigmoid</b></td><td>An S-shaped function that squashes any number into 0 to 1</td></tr>\n<tr><td><b>Threshold</b></td><td>The cut-off for deciding a class, usually 0.5</td></tr>\n<tr><td><b>Decision boundary / hyperplane</b></td><td>The place that separates the classes</td></tr>\n<tr><td><b>Maximum likelihood</b></td><td>Choosing the curve that makes the observed data most likely</td></tr>\n<tr><td><b>Bias, variance</b></td><td>Too simple a model / a model that changes a lot with the data</td></tr></table></div>"}];const M=[["Linear regression is used to predict:", ["A category", "A continuous number", "A cluster", "A reward"], 1, "Regression predicts a number, such as marks or price."], ["In ŷ = w x + b, the weight w is:", ["The starting value", "The slope of the line", "The error", "The learning rate"], 1, "w controls how steep the line is."], ["In ŷ = w x + b, the bias b is:", ["The value of the line when x = 0", "The slope", "The final error", "The learning rate"], 0, "b shifts the line up or down."], ["If ŷ = 2x + 1, what is ŷ for x = 3?", ["6", "7", "9", "5"], 1, "2 x 3 + 1 = 7."], ["Actual y = 3.2 and predicted ŷ = 2.0. The error ε = y - ŷ is:", ["-1.2", "1.2", "5.2", "0.6"], 1, "3.2 - 2.0 = 1.2."], ["Why do we square the errors in SSE?", ["To make them negative", "So positive and negative errors do not cancel, and big errors count more", "To make the line straight", "To change the learning rate"], 1, "Squaring removes signs and punishes big mistakes."], ["Errors are 1, -2 and 3. The SSE is:", ["2", "6", "14", "36"], 2, "1 + 4 + 9 = 14."], ["SSE is a function of which two things?", ["x and y", "w and b", "ε and E", "eta and z"], 1, "The data are fixed. Only w and b can change."], ["Line A has SSE 13.65 and Line B has SSE 0.92 on the same data. Which fits better?", ["Line A", "Line B", "Both equal", "Cannot tell"], 1, "A smaller SSE means a better fit."], ["Gradient descent moves:", ["Uphill", "Downhill on the error", "Randomly", "Sideways only"], 1, "It steps in the direction that lowers the error."], ["The update rule is:", ["new w = old w + slope", "new w = old w - learning rate x slope", "new w = slope / learning rate", "new w = old w x slope"], 1, "Subtract learning rate times slope."], ["w = 0, slope = -6, learning rate 0.1. The new w is:", ["-0.6", "0.6", "6", "-6"], 1, "0 - 0.1 x (-6) = 0.6."], ["If the learning rate is too large, gradient descent:", ["Is always perfect", "Overshoots and may bounce around or get worse", "Stops instantly", "Becomes slower than ever"], 1, "Giant steps jump over the bottom."], ["If the learning rate is too small:", ["Training is very slow", "The model overfits", "The error is zero", "w becomes negative"], 0, "Tiny steps need very many iterations."], ["Near the bottom of the bowl, the slope is close to:", ["Large", "0", "Negative infinity", "1"], 1, "A flat bottom has slope 0, so steps shrink."], ["A model that is too simple and has high error on both training and testing data is:", ["Overfitting", "Underfitting (high bias)", "A good fit", "Unsupervised"], 1, "Too simple means high bias."], ["Training error near 0 but testing error high means:", ["Underfitting", "Overfitting (high variance)", "A perfect model", "Bad data only"], 1, "It memorised the training data."], ["Logistic regression is used for:", ["Predicting any number", "Classification", "Clustering", "Reinforcement"], 1, "It outputs a probability used to classify."], ["Why is a straight line a poor way to give a probability?", ["It is too fast", "It can output values below 0 or above 1", "It has no slope", "It needs a queue"], 1, "A probability must stay between 0 and 1."], ["The sigmoid of z = 0 is:", ["0", "0.5", "1", "-1"], 1, "1 / (1 + 1) = 0.5."], ["For a large positive z, the sigmoid output is close to:", ["0", "0.5", "1", "-1"], 2, "e^-z gets tiny, so 1 / (1 + 0) = 1."], ["A model gives probability 0.82. With threshold 0.5 the class is:", ["0", "1", "Unknown", "-1"], 1, "0.82 is at least 0.5, so predict class 1."], ["The decision boundary is where:", ["z = 0", "z = 1", "y = 0", "e = 0"], 0, "z = 0 gives a probability of exactly 0.5."], ["With w = 1 and b = -3.5, what is z for x = 5?", ["1.5", "-1.5", "3.5", "5"], 0, "5 - 3.5 = 1.5."], ["With the same model, x = 3 gives probability 0.378. The class is:", ["1", "0", "Both", "Cannot tell"], 1, "0.378 is below 0.5, so class 0."], ["ŷ = 20 + 5 x hours + 0.3 x attendance. For 4 hours and 90 attendance, ŷ is:", ["47", "67", "87", "27"], 1, "20 + 20 + 27 = 67."], ["The 'x0 = 1 trick' lets us:", ["Remove the bias", "Treat the bias like another weight", "Make the line curved", "Skip training"], 1, "w0 x 1 = w0, so the bias fits in the sum."], ["A hyperplane in this lesson is:", ["A type of neuron", "The decision boundary that separates classes", "A learning rate", "The error bowl"], 1, "It is a point, line or plane depending on the number of features."], ["With 2 input features, the decision boundary of logistic regression is a:", ["Point", "Line", "Plane", "Circle only"], 1, "1 feature = point, 2 = line, 3 = plane."], ["The sigmoid output is always:", ["Any number", "Between 0 and 1", "Negative", "Larger than z"], 1, "It squashes values into the range 0 to 1."], ["The slope of a line that rises 6 over a run of 3 is:", ["18", "2", "3", "0.5"], 1, "Rise divided by run: 6 / 3 = 2."], ["A negative slope on the error curve means:", ["Moving right makes the error smaller", "Moving right makes the error bigger", "The error is zero", "The line is flat"], 0, "Negative slope means the curve goes down to the right, so downhill is to the right."], ["In this lesson, the letter e (the number 2.718) is used in:", ["The sigmoid function", "The error", "The learning rate", "The bias"], 0, "e appears in 1 / (1 + e^-z). The error uses the Greek letter epsilon."], ["Choice 1 has SSE 0.221 and Choice 2 has SSE 1.204 for the same data. Which is better?", ["Choice 1", "Choice 2", "Both equal", "Cannot tell"], 0, "A smaller error means a better fit."], ["R-squared tells you:", ["How much of the variation the line explains", "The learning rate", "The number of data points", "The slope"], 0, "R^2 = (SSE around the average - SSE around the line) / SSE around the average."], ["SSE around the average is 10 and SSE around the line is 1.9. R-squared is:", ["0.19", "0.81", "1.9", "8.1"], 1, "(10 - 1.9) / 10 = 0.81."], ["StatQuest finds the best line by:", ["Rotating the line and choosing the smallest sum of squared residuals", "Choosing the steepest line", "Choosing the flattest line", "Guessing"], 0, "This is called least squares."], ["Logistic regression in the StatQuest video predicts whether a mouse is:", ["Obese or not, from its weight", "Tall or short, from its age", "Fast or slow", "Old or young, from its size only"], 0, "The S-shaped curve gives the probability of obesity for a given weight."], ["Maximum likelihood picks the curve that:", ["Makes the data we saw most likely", "Has the biggest weights", "Has the smallest slope", "Is a straight line"], 0, "Multiply the likelihoods of all observations. The biggest product wins."], ["Curve A gives likelihoods 0.9, 0.8, 0.7 for three mice. The total likelihood is:", ["0.504", "2.4", "0.8", "0.056"], 0, "0.9 x 0.8 x 0.7 = 0.504."], ["In the StatQuest gradient descent example, slope -190 with learning rate 0.1 gives a step size of:", ["-19", "-1900", "19", "-0.19"], 0, "-190 x 0.1 = -19, so the new intercept is 0 - (-19) = 19."]];const K=[["Why do we square the errors? Show with the errors +5 and -5.", "If we just add +5 and -5 we get 0, which wrongly says the model is perfect. Squaring gives 25 and 25, a total of 50, so errors cannot cancel out. Squaring also makes big errors count far more: an error of 2 becomes 4 but an error of 10 becomes 100."], ["Data: (1, 2), (2, 4), (3, 6). Calculate the SSE of the line ŷ = x and of the line ŷ = 2x. Which is better?", "Line ŷ = x gives predictions 1, 2, 3. Errors: 1, 2, 3. SSE = 1 + 4 + 9 = 14. Line ŷ = 2x gives predictions 2, 4, 6. Errors: 0, 0, 0. SSE = 0. The line ŷ = 2x is better because its SSE is smaller."], ["Do 2 steps of gradient descent on E(w) = (w - 3)^2 starting at w = 0 with learning rate 0.2. The slope is 2(w - 3).", "Step 1: slope = 2(0 - 3) = -6. Step = 0.2 x (-6) = -1.2. New w = 0 - (-1.2) = 1.2. Step 2: slope = 2(1.2 - 3) = -3.6. Step = 0.2 x (-3.6) = -0.72. New w = 1.2 + 0.72 = 1.92. w is moving toward 3."], ["Explain a learning rate that is too big and one that is too small. Use an analogy.", "Too big: the steps are so large that w jumps past the bottom of the error bowl and may bounce from side to side or get worse, like running down a hill and flying across the valley. Too small: the steps are tiny, so training takes a very long time, like shuffling down the hill one millimetre at a time. A good learning rate gives steady steps to the bottom."], ["Calculate the sigmoid for z = 2. Which class does it predict? (e^-2 is about 0.135)", "sigma(2) = 1 / (1 + e^-2) = 1 / (1 + 0.135) = 1 / 1.135 = 0.881. This is above 0.5, so the predicted class is 1. The model is about 88% sure."], ["Give two reasons why linear regression is a poor choice for classification.", "(1) A straight line can output values below 0 or above 1, but a probability must stay between 0 and 1. (2) One extreme data point can tilt the line and change the cut-off, so correctly classified points can become wrong. Logistic regression fixes both by squashing z with the sigmoid."], ["Model 1: training error 12, testing error 13. Model 2: training error 1, testing error 15. Diagnose each.", "Model 1 has high error on both, so it is too simple: underfitting (high bias). Model 2 has a tiny training error but a big testing error, so it memorised the training data: overfitting (high variance). A good model has low error on both."], ["Compare linear regression and logistic regression: task, output, equation.", "Linear regression does regression: it predicts any number using y-hat = w x + b. Logistic regression does classification: it predicts a probability between 0 and 1 using y-hat = 1 / (1 + e^-(w x + b)), then uses a threshold such as 0.5 to choose a class."], ["Data (1, 2), (2, 3), (3, 5), (4, 4), (5, 6). The line y-hat = 1.3 + 0.9 x has SSE 1.9, and the SSE around the average (4) is 10. Calculate R-squared and explain it.", "R^2 = (10 - 1.9) / 10 = 0.81. The line explains 81% of the variation in y. A value near 1 is a very good fit. A value near 0 means the line is no better than always guessing the average."], ["Three mice are obese, not obese, obese. Curve A gives probabilities 0.9, 0.2, 0.7 and curve B gives 0.6, 0.5, 0.5. Which curve is better by maximum likelihood?", "Likelihood A = 0.9 x (1 - 0.2) x 0.7 = 0.504. Likelihood B = 0.6 x (1 - 0.5) x 0.5 = 0.15. Curve A makes the observed data more likely, so it is better."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
