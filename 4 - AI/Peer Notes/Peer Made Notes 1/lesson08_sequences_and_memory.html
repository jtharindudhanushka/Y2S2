<main class="main"><div class="inner">
<div class="topbar"><div><h1>Lesson 8: Sequences and Memory</h1><div class="sub">Time series, recurrent networks, gradient problems and LSTM. Every number is worked out.</div></div><span class="source-tag">Lesson 8 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌱", "n": "Start here", "h": "<h2>Why do some problems need memory?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Some answers depend on what came before. A model for these problems needs memory.</div><div class=\"r\"><b>🧪 Example:</b> To predict tomorrow's sales you must look at the last few days, not just one number.</div><div class=\"r\"><b>✅ Remember:</b> RNN = a network with a loop that remembers. LSTM = an RNN with a better memory.</div></div>\n<div class=\"one\">A normal neural network looks at one input and gives one answer. It forgets everything afterwards. That is a problem when the order of things matters.</div>\n<h3>Three everyday stories</h3>\n<ul><li><b>Sales:</b> If sales went 300, 310, 320 in the last three days, tomorrow will probably be about 330. One number alone cannot show the trend.</li><li><b>Sentences:</b> \"I grew up in France, so I speak fluent ___.\" You need the word \"France\" from the start to guess \"French\".</li><li><b>Stock prices:</b> A company may have 10 days of price history, another 30 days. A model must work with any length.</li></ul>\n<p>All of these are <b>sequences</b>: a list of items where the order matters. Models that handle sequences need <b>memory</b>.</p>\n<div class=\"an\">🌍 <b>Analogy: watching a film.</b> You cannot understand the ending if you only see the last second. You remember what happened before. A sequence model does the same: it keeps a short summary of everything it has seen so far.</div>\n<h3>The words you will meet (in plain English)</h3>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Meaning</th></tr>\n<tr><td><b>Sequence</b></td><td>Items in an order, like days or words</td></tr>\n<tr><td><b>Time series</b></td><td>Numbers recorded over time, like daily sales</td></tr>\n<tr><td><b>Lag</b></td><td>An earlier value used to help predict a later one</td></tr>\n<tr><td><b>RNN</b></td><td>Recurrent Neural Network: a network with a loop that feeds its own result back in</td></tr>\n<tr><td><b>Hidden state</b></td><td>The RNN's running summary of what it has seen</td></tr>\n<tr><td><b>Unrolling</b></td><td>Drawing the loop as a row of copies, one for each time step</td></tr>\n<tr><td><b>Gradient</b></td><td>The slope that tells gradient descent which way, and how far, to move a weight</td></tr>\n<tr><td><b>LSTM</b></td><td>Long Short-Term Memory: an RNN with a long-term memory lane and gates</td></tr>\n<tr><td><b>Gate</b></td><td>A control that lets a percentage of something pass through</td></tr></table></div>\n<h3>What we will learn, in order</h3>\n<ol><li>How to turn a list of numbers into a table a model can learn from.</li><li>How an RNN uses a loop to remember.</li><li>Why a simple RNN struggles with long sequences.</li><li>How an LSTM fixes that, one stage at a time.</li></ol>"}, {"i": "📅", "n": "Sequence table", "h": "<h2>Turning a list of numbers into a table</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Slide a small window along the list. The window values are inputs. The next value is the answer.</div><div class=\"r\"><b>🧪 Example:</b> 25, 28, 23, 31, 26 gives (25, 28) &rarr; 23, (28, 23) &rarr; 31, (23, 31) &rarr; 26.</div><div class=\"r\"><b>✅ Remember:</b> Train on the past, test on the future. Never shuffle time.</div></div>\n<div class=\"one\">Before using memory networks, here is the simplest way to forecast: make a normal table from the list, using earlier values as inputs.</div>\n<h3>Step 1: the list</h3>\n<p>Sales on days 1 to 5: <b>25, 28, 23, 31, 26</b>. We want day 6.</p>\n<h3>Step 2: slide a window of 2</h3>\n<p>Take the first two numbers (25, 28) as inputs. The number right after them, 23, is the answer. Move the window one step. Repeat.</p>\n<div class=\"wrap\"><table><tr><th>Two days ago (lag 2)</th><th>Yesterday (lag 1)</th><th>Answer (today)</th></tr><tr><td>25</td><td>28</td><td>23</td></tr><tr><td>28</td><td>23</td><td>31</td></tr><tr><td>23</td><td>31</td><td>26</td></tr><tr><td>31</td><td>26</td><td>? (day 6)</td></tr></table></div>\n<p>The first three rows have answers, so they form an ordinary supervised dataset. The last row has no answer yet. It is the question we want the model to answer: the inputs are the latest two values, (31, 26).</p>\n<p>A simple guess for day 6 is the average of the last two values: (31 + 26) &divide; 2 = <b>28.5</b>. A trained model would learn a better rule from the rows.</p>\n<h3>Step 3: test fairly</h3>\n<ul><li>With 100 days of data, train on days 1 to 80 and test on days 81 to 100.</li><li><b>Never shuffle the days.</b> If day 90 is in the training set while you test on day 50, the model has seen the future. This is called <b>data leakage</b>, and it makes the test score look better than it really is.</li></ul>\n<div class=\"an\">🌍 <b>Analogy:</b> you cannot practise with tomorrow's newspaper to predict today's news.</div>\n<h3>The limit of this table method</h3>\n<p>The window has a fixed size. If the answer depends on something 50 days back, a window of 2 will never see it. Memory networks solve this.</p>\n<details><summary>Check yourself 1</summary><p>From 10, 12, 11, 15 with a window of 2, write the rows. <b>Answer:</b> (10, 12) &rarr; 11 and (12, 11) &rarr; 15. To forecast the next value, use (11, 15).</p></details>\n<details><summary>Check yourself 2</summary><p>Why is shuffling bad for time series? <b>Answer:</b> The model would train on later days and be tested on earlier days, so it has seen the future. That is data leakage.</p></details>"}, {"i": "🔁", "n": "RNN: the loop", "h": "<h2>The recurrent neural network (RNN)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An RNN is a small network with a loop. Each step uses the new input and the result of the previous step.</div><div class=\"r\"><b>🧪 Example:</b> New value = ReLU(1 &times; input + 0.5 &times; previous value). Inputs 0.5, 1, 0.5 give 0.5, 1.25, 1.125.</div><div class=\"r\"><b>✅ Remember:</b> The same weights are used at every step, so one network handles a sequence of any length.</div></div>\n<div class=\"sq\"><b>🎬 The StatQuest way: stock prices in StatLand</b><br>An RNN is like the networks you already know: it has weights, biases, layers and activation functions. The big difference is that it also has a <b>feedback loop</b>. Although it takes only one input value at a time, the loop lets it use a whole sequence, such as stock prices collected over time. To see how, we run yesterday's and today's price through it to predict tomorrow's price.</div>\n<h3>The problem a normal network cannot solve</h3>\n<p>A normal network has a fixed number of inputs, for example exactly 3. But one company has 10 days of prices and another has 30. We would need a different network for every length. An RNN avoids this.</p>\n<h3>How the loop works</h3>\n<ol><li>Look at today's input and the result remembered from the previous step.</li><li>Combine them using weights, add a bias, and apply an activation function.</li><li>The result is both the output of this step and the memory for the next step. It goes round the loop.</li></ol>\n<div class=\"fm\">new memory = f( w<sub>in</sub> &times; input + w<sub>loop</sub> &times; old memory + b )</div>\n<div class=\"an\">🌍 <b>Analogy: a running total on a calculator.</b> Each day you add today's number to what is already on the screen. The screen is the memory. You do not need to remember all the earlier days. They are already folded into the screen.</div>\n<h3>Worked example</h3>\n<p>Scale each stock price so Low = 0, Medium = 0.5, High = 1. Suppose the prices on three days are 0.5, 1, 0.5. Use w<sub>in</sub> = 1, w<sub>loop</sub> = 0.5, b = 0, and the activation ReLU (keeps positives, turns negatives into 0). Start with memory 0.</p>\n<div class=\"wrap\"><table><tr><th>Day</th><th>Input</th><th>Calculation</th><th>New memory</th></tr>\n<tr><td>1</td><td>0.5</td><td>1 &times; 0.5 + 0.5 &times; 0 = 0.5</td><td>0.5</td></tr>\n<tr><td>2</td><td>1.0</td><td>1 &times; 1.0 + 0.5 &times; 0.5 = 1.25</td><td>1.25</td></tr>\n<tr><td>3</td><td>0.5</td><td>1 &times; 0.5 + 0.5 &times; 1.25 = 1.125</td><td>1.125</td></tr></table></div>\n<p>The final memory, 1.125, is built from all three days. Day 1's value still has an effect: it was carried through the loop.</p>\n<h3>Unrolling</h3>\n<p>It is hard to follow a loop. So we <b>unroll</b> it: make a copy of the network for each input and join the copies in a row.</p>\n<div class=\"flow\"><div class=\"chip\">Day 1<br>input 0.5</div><span class=\"arr\">➜</span><div class=\"chip\">Day 2<br>input 1.0</div><span class=\"arr\">➜</span><div class=\"chip\">Day 3<br>input 0.5</div><span class=\"arr\">➜</span><div class=\"chip\">Prediction</div></div>\n<p>Important: <b>all the copies share the same weights and biases.</b> Whether you unroll 3 times or 30 times, the number of weights to train stays the same. That is how one network handles a sequence of any length.</p>\n<details><summary>Check yourself 1</summary><p>Using the same weights, inputs 1 then 0, start 0. What are the two memories? <b>Answer:</b> Day 1: 1 &times; 1 + 0.5 &times; 0 = 1. Day 2: 1 &times; 0 + 0.5 &times; 1 = 0.5. Even with input 0, the memory is 0.5, because it remembers day 1.</p></details>\n<details><summary>Check yourself 2</summary><p>If a sequence has 30 days, do we need 30 sets of weights? <b>Answer:</b> No. The unrolled copies all share one set of weights and biases.</p></details>"}, {"i": "💥", "n": "Why RNNs struggle", "h": "<h2>The big problem: exploding and vanishing gradients</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The loop multiplies by the same weight at every step. Over many steps the result becomes huge or tiny.</div><div class=\"r\"><b>🧪 Example:</b> Weight 2 over 50 steps gives about 1.1 million billion. Weight 0.5 over 50 steps gives almost 0.</div><div class=\"r\"><b>✅ Remember:</b> Weight above 1 explodes. Weight below 1 vanishes. Training breaks either way.</div></div>\n<div class=\"sq\"><b>🎬 The StatQuest way: the Vanishing / Exploding Gradient Problem</b><br>Although the name starts with \"vanishing\", it is easier to see how a gradient can <b>explode</b> first. Then we look at how it can vanish. The cause is the same: the unrolled network uses the loop's weight again and again.</div>\n<h3>Step 1: the loop weight is used many times</h3>\n<p>When we unroll the loop, each copy passes its memory to the next copy through the loop weight w. So a value from the first step is multiplied by w once for each step it travels. After n steps it has been multiplied by w, n times, which is <b>w<sup>n</sup></b>.</p>\n<h3>Step 2: see what happens with different weights</h3>\n<div class=\"wrap\"><table><tr><th>Loop weight w</th><th>After 5 steps</th><th>After 50 steps</th><th>What happens</th></tr>\n<tr><td>2</td><td>32</td><td>1,125,899,906,842,624 (about 10<sup>15</sup>)</td><td>Explodes</td></tr>\n<tr><td>1.5</td><td>7.6</td><td>637,621,500</td><td>Explodes</td></tr>\n<tr><td>1</td><td>1</td><td>1</td><td>Stays the same</td></tr>\n<tr><td>0.9</td><td>0.59</td><td>0.005</td><td>Fades</td></tr>\n<tr><td>0.5</td><td>0.03</td><td>0.0000000000000009 (about 10<sup>&minus;15</sup>)</td><td>Vanishes</td></tr></table></div>\n<h3>Step 3: why it breaks training</h3>\n<p>Training uses gradient descent. The size of each step is <b>learning rate &times; slope (gradient)</b>. The gradient for the loop weight contains the same w<sup>n</sup>.</p>\n<ul><li><b>Exploding:</b> with a slope of 10<sup>15</sup> and a learning rate of 0.01, the step is about 10<sup>13</sup>. The weight is thrown far away every time, so it never settles. Training is unstable.</li><li><b>Vanishing:</b> with a slope of 10<sup>&minus;15</sup>, the step is about 10<sup>&minus;17</sup>. The weight barely moves, so the network does not learn from things that happened long ago.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: the whisper line.</b> A message is passed along 50 people. If each one repeats it twice as loudly, the last person hears a deafening roar (exploding). If each one repeats it half as loudly, the last person hears nothing (vanishing). Either way the message is lost.</div>\n<h3>What this means in real life</h3>\n<p>In \"I grew up in France, so I speak fluent ___\", the word \"France\" is many steps back. With a vanishing gradient the network cannot learn the link between \"France\" and \"French\". Simple RNNs remember only a few steps back.</p>\n<p>The fix is a popular design called <b>Long Short-Term Memory (LSTM)</b>, in the next two tabs.</p>\n<details><summary>Check yourself 1</summary><p>Loop weight 0.5, 10 steps. What is the multiplier? <b>Answer:</b> 0.5<sup>10</sup> = 0.00098, about 0.001, so the signal from 10 steps ago has almost vanished.</p></details>\n<details><summary>Check yourself 2</summary><p>Why does an exploding gradient make training unstable? <b>Answer:</b> The step size is learning rate &times; gradient. A gigantic gradient makes a gigantic step, so the weight jumps around and never settles.</p></details>"}, {"i": "🧠", "n": "LSTM: two memories", "h": "<h2>LSTM: a better memory</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An LSTM keeps two memories: a long-term lane and a short-term memory. Gates decide what to keep.</div><div class=\"r\"><b>🧪 Example:</b> A gate of 0.68 means \"keep 68% of the old long-term memory\".</div><div class=\"r\"><b>✅ Remember:</b> Sigmoid makes percentages (0 to 1). Tanh makes potential memories (&minus;1 to 1).</div></div>\n<div class=\"sq\"><b>🎬 The StatQuest way: LSTM, one stage at a time</b><br>An LSTM fixes the problem of simple RNNs by using <b>two paths</b>: one for <b>long-term memory</b> and one for <b>short-term memory</b>. The long-term memory path does not go through a weight, so it does not blow up or fade the same way. The LSTM then works in <b>three stages</b>: (1) decide the percent of the long-term memory to remember, (2) update the long-term memory, (3) update the short-term memory.</div>\n<div class=\"one\">An LSTM is an RNN with a protected \"memory lane\" (the cell state, which is the long-term memory) and the usual short-term memory (the hidden state). Gates control what goes in and out.</div>\n<div class=\"an\">🌍 <b>Analogy: a notebook and your working memory.</b> The notebook (long-term memory) holds important facts for a long time. Your working memory (short-term memory) holds what you are thinking about right now. Each day you decide how much of the notebook to keep, what to write in it, and what to say aloud.</div>\n<h3>Two tools: sigmoid and tanh</h3>\n<p>An LSTM uses two squashing functions you know from Lesson 7. Each has a special job.</p>\n<div class=\"wrap\"><table><tr><th>z</th><th>Sigmoid(z)</th><th>Tanh(z)</th></tr><tr><td>&minus;4</td><td>0.018</td><td>&minus;0.999</td></tr><tr><td>&minus;2</td><td>0.119</td><td>&minus;0.964</td></tr><tr><td>0</td><td>0.5</td><td>0</td></tr><tr><td>2</td><td>0.881</td><td>0.964</td></tr><tr><td>4</td><td>0.982</td><td>0.999</td></tr></table></div>\n<ul><li><b>Sigmoid</b> turns any number into a value between 0 and 1. We read that as a <b>percentage</b>: 0 = none, 1 = all, 0.68 = 68%. This is the \"gate\" job: how much to let through.</li><li><b>Tanh</b> turns any number into a value between &minus;1 and 1. We use it to create a <b>potential memory</b>: something that could be added (positive) or subtracted (negative).</li></ul>\n<h3>The two memories</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>Long-term memory (cell state)</b><br>The lane that runs along the whole sequence. It has no weights on it. We only multiply it by a percentage and add to it.</div><div class=\"L a2\"><b>Short-term memory (hidden state)</b><br>The working output at each step. It is created by weights, and it is also the LSTM's output.</div></div>\n<details><summary>Check yourself 1</summary><p>Which function gives a percentage, sigmoid or tanh? <b>Answer:</b> Sigmoid, because its output is between 0 and 1.</p></details>\n<details><summary>Check yourself 2</summary><p>What does a gate of 0.25 on the long-term memory mean? <b>Answer:</b> Keep 25% of the old long-term memory and forget 75%.</p></details>"}, {"i": "🪜", "n": "LSTM step by step", "h": "<h2>The three stages of an LSTM, with real numbers</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Stage 1: keep a percent of the old memory. Stage 2: add new memory. Stage 3: make the new short-term memory.</div><div class=\"r\"><b>🧪 Example:</b> Long-term memory 2.0 becomes 1.36 (keep 68%), then 1.92 (after adding 0.56).</div><div class=\"r\"><b>✅ Remember:</b> Forget gate = stage 1, input gate = stage 2, output gate = stage 3.</div></div>\n<div class=\"one\">Setup for our example: previous long-term memory = <b>2.0</b>, previous short-term memory = <b>0.5</b>, and the new input = <b>1.0</b>.</div>\n<p>Every gate looks at the new input and the previous short-term memory, multiplies them by weights, adds a bias, and squashes the answer (sigmoid for percentages, tanh for potential memories). (The weights below are chosen to keep the numbers easy. In a real LSTM they are learned.)</p>\n<h3>Stage 1: what percent of the long-term memory do we keep? (forget gate)</h3>\n<ol><li>Weighted sum: z = 0.5 &times; 0.5 (short-term) + 1 &times; 1.0 (input) &minus; 0.5 (bias) = 0.25 + 1 &minus; 0.5 = <b>0.75</b>.</li><li>Sigmoid: &sigma;(0.75) = <b>0.679</b>, so keep about <b>68%</b>.</li><li>New long-term memory so far: 2.0 &times; 0.679 = <b>1.358</b>.</li></ol>\n<h3>Stage 2: add new information (input gate)</h3>\n<ol><li><b>Potential memory</b> (tanh): z = 1 &times; 0.5 + 1 &times; 1.0 = 1.5, and tanh(1.5) = <b>0.905</b>.</li><li><b>Percent to add</b> (sigmoid): z = 1 &times; 0.5 + 1 &times; 1.0 &minus; 1 = 0.5, and &sigma;(0.5) = <b>0.623</b>.</li><li>Amount added: 0.905 &times; 0.623 = <b>0.563</b>.</li><li>Updated long-term memory: 1.358 + 0.563 = <b>1.922</b>.</li></ol>\n<h3>Stage 3: make the new short-term memory (output gate)</h3>\n<ol><li><b>Potential short-term memory</b> (tanh of the updated long-term memory): tanh(1.922) = <b>0.958</b>.</li><li><b>Percent to output</b> (sigmoid): z = 1 &times; 0.5 + 1 &times; 1.0 &minus; 0.5 = 1.0, and &sigma;(1.0) = <b>0.731</b>.</li><li>New short-term memory: 0.958 &times; 0.731 = <b>0.700</b>. This is also the output of this step.</li></ol>\n<div class=\"wrap\"><table><tr><th></th><th>Before</th><th>After</th></tr><tr><td>Long-term memory</td><td>2.0</td><td>1.922</td></tr><tr><td>Short-term memory</td><td>0.5</td><td>0.700</td></tr></table></div>\n<p>Then the new pair (1.922, 0.700) goes into the next time step, and the three stages repeat.</p>\n<div class=\"an\">🌍 <b>Analogy: a daily diary routine.</b> Stage 1: tear out the pages you no longer need (keep 68%). Stage 2: write today's new idea, but only as much as seems important (62%). Stage 3: decide what part of the diary to say aloud right now (73%).</div>\n<h3>Why this fixes exploding and vanishing</h3>\n<ul><li>The long-term lane is changed only by multiplying with a percentage and by adding. It does <b>not</b> pass through the loop weight again and again.</li><li>If the forget gate is close to 1 (keep everything), the old memory travels almost unchanged. Multiplying by about 1 over 50 steps stays about 1, instead of becoming 10<sup>&minus;15</sup>.</li><li>The same weights and biases are used for every time step, so the number of weights does not grow with the sequence length, just like the RNN.</li></ul>\n<p>So an LSTM can handle longer sequences without the gradient problems of a simple RNN. It is not magic: it still needs careful training and can still forget.</p>\n<details><summary>Check yourself 1</summary><p>Long-term memory 3, forget gate 0.5, potential memory 0.8, add percent 0.5. New long-term memory? <b>Answer:</b> 3 &times; 0.5 = 1.5. Added: 0.8 &times; 0.5 = 0.4. Total: 1.5 + 0.4 = <b>1.9</b>.</p></details>\n<details><summary>Check yourself 2</summary><p>Which stage creates the new short-term memory? <b>Answer:</b> Stage 3 (the output gate): tanh of the long-term memory, times a sigmoid percentage.</p></details>"}];const M=[["A normal neural network struggles with sequences mainly because:", ["It forgets previous inputs and needs a fixed number of inputs", "It has too many weights", "It cannot use activation functions", "It only works on images"], 0, "A feed-forward network sees inputs one set at a time and has a fixed input size."], ["A time series is:", ["Data recorded in time order", "A set of unrelated pictures", "A list of labels only", "A type of gate"], 0, "Time order is what matters."], ["In a forecasting table, a lag is:", ["An earlier value used as an input", "The final answer", "A random number", "The learning rate"], 0, "For example, yesterday's value."], ["From 25, 28, 23 with a window of 2, the answer for the first row is:", ["25", "28", "23", "Unknown"], 2, "(25, 28) predicts 23."], ["To forecast after 25, 28, 23, 31, 26 with a window of 2, the inputs are:", ["(25, 28)", "(31, 26)", "(23, 31)", "(28, 23)"], 1, "Use the latest two values."], ["Why must we not shuffle a time series before splitting it into train and test?", ["It leaks future information into training", "It makes the data smaller", "It removes the bias", "It changes the learning rate"], 0, "The model would see the future."], ["The key new feature of an RNN compared with an ordinary network is:", ["A feedback loop", "Zero weights", "A bigger output layer", "No activation functions"], 0, "The loop feeds the result back in."], ["In the RNN example (w_in = 1, w_loop = 0.5, memory starts at 0), input 0.5 on day 1 gives memory:", ["0.25", "0.5", "1", "0"], 1, "1 x 0.5 + 0.5 x 0 = 0.5."], ["With the same RNN, day 2 input 1.0 and old memory 0.5 give:", ["1.0", "1.25", "0.75", "1.5"], 1, "1 x 1.0 + 0.5 x 0.5 = 1.25."], ["Unrolling an RNN means:", ["Drawing a copy of the network for each time step", "Deleting the weights", "Training with no data", "Stopping the loop"], 0, "It makes the loop easier to see."], ["When an RNN is unrolled for 30 steps, how many sets of weights does it have?", ["30", "One shared set", "Zero", "It depends on the data values"], 1, "All copies share the same weights and biases."], ["If the loop weight is 2, a signal after 50 steps is multiplied by about:", ["100", "10^15", "0.00001", "2"], 1, "2^50 is about 1.1 million billion."], ["If the loop weight is 0.5, a signal after 50 steps is multiplied by about:", ["25", "0.5", "10^-15", "1"], 2, "0.5^50 is about 9 x 10^-16."], ["Weights above 1 in the loop lead to:", ["An exploding gradient", "A vanishing gradient", "A perfect model", "No change"], 0, "w^n becomes huge."], ["Weights below 1 in the loop lead to:", ["An exploding gradient", "A vanishing gradient", "More data", "A bigger output"], 1, "w^n becomes tiny."], ["A gradient step is calculated as:", ["Learning rate x gradient", "Learning rate + gradient", "Gradient / weight", "Weight x weight"], 0, "A huge gradient gives a huge step. A tiny gradient gives a tiny step."], ["Why does a vanishing gradient hurt learning?", ["The weights barely change, so old events are not learned", "The model memorises everything", "The loss becomes zero", "The loop is removed"], 0, "Tiny steps mean no learning from far back."], ["An LSTM was designed to:", ["Handle long sequences without the gradient problems of simple RNNs", "Classify images only", "Replace gradient descent", "Remove the need for data"], 0, "It keeps useful information over longer spans."], ["The two memories in an LSTM are:", ["Long-term (cell state) and short-term (hidden state)", "Input and output", "Queue and stack", "Training and testing"], 0, "C_t and h_t."], ["The sigmoid function gives values between:", ["0 and 1", "-1 and 1", "0 and 100", "-infinity and infinity"], 0, "We read them as percentages."], ["The tanh function gives values between:", ["0 and 1", "-1 and 1", "0 and 100", "1 and 2"], 1, "We use it for potential memories."], ["In Stage 1, a gate of 0.68 means:", ["Keep 68% of the old long-term memory", "Delete 68% of the input", "Add 68 to the memory", "Stop training"], 0, "It is a percentage to remember."], ["Old long-term memory 2.0 and keep-percent 0.679. The kept memory is:", ["1.358", "2.679", "0.679", "1.0"], 0, "2.0 x 0.679 = 1.358."], ["Stage 2 of an LSTM:", ["Adds a percentage of a potential new memory to the long-term memory", "Creates the output only", "Resets the weights", "Computes the loss"], 0, "Potential memory (tanh) times percent (sigmoid), added to the long-term memory."], ["Stage 3 of an LSTM:", ["Makes the new short-term memory from the long-term memory", "Deletes the long-term memory", "Makes the input", "Calculates the gradient"], 0, "tanh of the new long-term memory times a sigmoid percentage."], ["Long-term memory 3, forget gate 0.5, potential memory 0.8, add percent 0.5. The new long-term memory is:", ["1.9", "1.5", "2.3", "0.4"], 0, "3 x 0.5 + 0.8 x 0.5 = 1.5 + 0.4 = 1.9."], ["Why does the LSTM long-term path avoid the exploding/vanishing problem?", ["It is changed only by a percentage and by adding, not by repeated multiplication with a loop weight", "It has no memory", "It uses a bigger learning rate", "It uses random numbers"], 0, "A forget gate near 1 lets the memory pass almost unchanged."], ["Do an LSTM's unrolled copies share weights?", ["Yes, the same weights and biases are reused at every step", "No, each step has new weights", "Only the first step", "Only the last step"], 0, "As with the RNN, the number of weights does not grow with the sequence length."]];const K=[["Make the rows of a two-lag table from 10, 12, 11, 15, 14 and say which pair forecasts the next value.", "Rows: (10, 12) -> 11, (12, 11) -> 15, (11, 15) -> 14. The latest pair (15, 14) is the input to forecast the next unknown value. Keep time order when testing."], ["Explain why an RNN can handle sequences of different lengths.", "An RNN has a feedback loop and uses the same weights and biases at every step. We unroll it by making one copy per input, but all copies share the same weights. So the number of weights stays the same for 3 inputs or 30 inputs."], ["An RNN has w_in = 1, w_loop = 0.5, b = 0, ReLU, and starts with memory 0. Inputs are 1 then 0. Calculate both memories and say what you notice.", "Day 1: ReLU(1 x 1 + 0.5 x 0) = 1. Day 2: ReLU(1 x 0 + 0.5 x 1) = 0.5. Although the day 2 input is 0, the memory is 0.5, because the network remembers day 1 through the loop."], ["Explain the exploding and vanishing gradient problem using numbers.", "When an RNN is unrolled, a value is multiplied by the loop weight w once per step, so after n steps it is multiplied by w^n. With w = 2 and 50 steps, 2^50 is about 10^15, so the gradient explodes and gradient descent takes giant, unstable steps. With w = 0.5, 0.5^50 is about 10^-15, so the gradient vanishes and the weight barely changes, so the network cannot learn from events far back."], ["Describe the three stages of an LSTM and what the long-term and short-term memories are.", "Long-term memory (cell state) is a lane that carries information along the sequence. Short-term memory (hidden state) is the working output. Stage 1 (forget gate): a sigmoid percentage of the long-term memory is kept. Stage 2 (input gate): a tanh potential memory is multiplied by a sigmoid percentage and added to the long-term memory. Stage 3 (output gate): tanh of the new long-term memory is multiplied by a sigmoid percentage to give the new short-term memory."], ["Previous long-term memory is 4, forget percent 0.5, potential memory 0.6, add percent 0.5. Calculate the new long-term memory.", "Kept part: 4 x 0.5 = 2. Added part: 0.6 x 0.5 = 0.3. New long-term memory = 2 + 0.3 = 2.3."], ["Why does an LSTM cope with long sequences better than a simple RNN?", "In a simple RNN the signal is repeatedly multiplied by the loop weight, so it explodes or vanishes (w^n). In an LSTM the long-term memory lane is changed only by multiplying with a percentage and by adding new information. If the forget gate is close to 1, the old memory passes almost unchanged, so the learning signal is not destroyed. It does not give perfect memory, but it helps a lot."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;

const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}

function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];

$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
