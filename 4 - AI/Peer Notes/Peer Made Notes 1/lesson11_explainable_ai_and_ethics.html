<div class="topbar"><div><h1>Lesson 11: Explainable AI and Ethics</h1><div class="sub">Why we need to understand AI decisions, how to explain them (permutation importance, LIME, SHAP), and how to use AI ethically and legally.</div></div><span class="source-tag">Lesson 11 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "⬛", "n": "The black-box problem", "h": "<h2>The black-box problem</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Many powerful AI models give very good answers but cannot say why.</div><div class=\"r\"><b>🧪 Example:</b> A bank's AI rejects your loan and nobody can tell you the reason.</div><div class=\"r\"><b>✅ Remember:</b> Explainable AI (XAI) = methods that let humans understand why a model decided something.</div></div>\n<div class=\"one\">A <b>black box</b> is a machine where you can see what goes in and what comes out, but not what happens inside. Many modern ML models work like this.</div>\n<h3>Start with a story</h3>\n<p>Imagine you apply for a student loan. Within seconds the bank's AI says <b>\"Rejected\"</b>. You ask why. The bank says: \"The computer decided.\" Nobody can tell you which fact about you caused the rejection: your income, your address, your age, or something else. You cannot fix the problem, you cannot check whether the decision was fair, and the bank cannot check either.</p>\n<div class=\"an\">🌍 <b>Analogy: two doctors.</b> Doctor A says \"Take this medicine, trust me.\" Doctor B says \"Your blood test shows low iron, and that causes your tiredness, so take this medicine.\" Both may be right, but you can only check and trust Doctor B. A black-box AI is Doctor A.</div>\n<h3>Why does this happen?</h3>\n<p>Modern machine learning often puts <b>predictive performance first</b> and transparency second. Complex models (like deep neural networks) reach outstanding accuracy, but their decision logic is spread across <b>millions of numbers</b> (weights and biases). No human can read millions of numbers and see a reason.</p>\n<h3>Why it matters most when the stakes are high</h3>\n<div class=\"wrap\"><table><tr><th>Area</th><th>What can go wrong if the model cannot be explained</th></tr><tr><td><b>Medical diagnosis</b></td><td>A wrong or unexplained result can risk a patient's life.</td></tr><tr><td><b>Credit scoring</b></td><td>People can lose money or opportunities, with no way to challenge.</td></tr><tr><td><b>Autonomous driving</b></td><td>After an accident, who is legally responsible, and why did the car do it?</td></tr></table></div>\n<p><b>Interpretability</b> (also called explainability) means how well a human can understand why a model made its decisions.</p>\n<details><summary>Check yourself 1</summary><p>Why is a deep neural network called a \"black box\"? <b>Answer:</b> Its decision logic is hidden inside millions of parameters, so we can see inputs and outputs but not the reasoning.</p></details>\n<details><summary>Check yourself 2</summary><p>Name two areas where unexplainable AI is risky. <b>Answer:</b> For example medical diagnosis, credit scoring and autonomous driving.</p></details>"}, {"i": "🎯", "n": "Goals of XAI", "h": "<h2>Why we want explanations: three goals</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> XAI helps us trust a model, debug it, and check that it is fair.</div><div class=\"r\"><b>🧪 Example:</b> A photo model that says \"wolf\" because of snow in the picture, not because of the animal.</div><div class=\"r\"><b>✅ Remember:</b> Trust, Debugging, Fairness and auditing.</div></div>\n<div class=\"grid\"><div class=\"L a1\"><b>01 TRUST</b><br>Check that predictions rely on real, sensible reasons and not on accidental patterns (spurious correlations).</div><div class=\"L a2\"><b>02 DEBUGGING</b><br>Find where, how and why the model makes mistakes, especially on unusual cases.</div><div class=\"L a3\"><b>03 FAIRNESS &amp; AUDITING</b><br>Make sure decisions do not discriminate on protected attributes such as gender, race or religion.</div></div>\n<h3>Goal 1: Trust, and the spurious correlation trap</h3>\n<p>A <b>spurious correlation</b> is a pattern that exists in the data by accident but has nothing to do with the real cause.</p>\n<div class=\"an\">🌍 <b>Analogy.</b> Ice-cream sales and sunburn both rise in summer. If a model learns \"ice cream sales cause sunburn\" it has found a spurious correlation. The real cause is the hot sunny weather.</div>\n<p><b>A famous AI example:</b> researchers trained a model to tell huskies from wolves. In the training photos, the wolves were almost always standing on snow. The model got high accuracy, but an explanation method showed it was mostly looking at the <b>snow</b>, not the animal. The model was right for the wrong reason, and it would fail on a husky in the snow. Without an explanation nobody would have noticed.</p>\n<h3>Goal 2: Debugging</h3>\n<p>If a medical model fails on older patients, an explanation can show which feature is misleading it. You can then fix the data or the model, like a mechanic who opens the bonnet instead of guessing.</p>\n<h3>Goal 3: Fairness and auditing</h3>\n<p><b>Auditing</b> means checking from the outside, like an inspector. If an explanation shows that a hiring model gives a big weight to gender, or to a feature that stands in for gender (such as a name), the model is unfair and must be fixed. A well-known reported case: an experimental company recruiting tool learned from past hiring data and began to mark down CVs that contained signs of being female. The company stopped using it.</p>\n<details><summary>Check yourself 1</summary><p>What is a spurious correlation? <b>Answer:</b> A pattern that appears in the data by accident and is not the real cause.</p></details>\n<details><summary>Check yourself 2</summary><p>Which XAI goal asks \"does the model discriminate?\" <b>Answer:</b> Fairness and auditing.</p></details>"}, {"i": "⚖️", "n": "Accuracy vs clarity", "h": "<h2>The accuracy versus interpretability trade-off</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The simplest models are the easiest to understand. The most powerful ones are the hardest.</div><div class=\"r\"><b>🧪 Example:</b> A decision tree is easy to read. A transformer has billions of weights.</div><div class=\"r\"><b>✅ Remember:</b> Glass-box = clear. Ensemble = in between. Deep learning = most powerful, least clear.</div></div>\n<div class=\"one\">Often you have to choose: a model you can understand, or a model that is a bit more accurate.</div>\n<div class=\"wrap\"><table><tr><th>Model type</th><th>Examples</th><th>Interpretability</th><th>Predictive power</th></tr>\n<tr><td><b>Glass-box</b> (intrinsic)</td><td>Linear regression, decision trees, logistic regression</td><td>Very high</td><td>Moderate</td></tr>\n<tr><td><b>Ensemble models</b></td><td>Random forest, XGBoost, LightGBM</td><td>Moderate</td><td>High</td></tr>\n<tr><td><b>Deep learning</b></td><td>Convolutional networks, transformers</td><td>Low</td><td>Very high</td></tr></table></div>\n<h3>What do these words mean?</h3>\n<ul><li><b>Glass-box</b> model: you can see right through it. The model itself is the explanation. This is called <b>intrinsic interpretability</b>.</li><li><b>Ensemble</b> model: a team of many small models whose answers are combined. A <b>random forest</b> is many decision trees that vote. <b>XGBoost</b> and <b>LightGBM</b> build trees one after another, each fixing the mistakes of the earlier ones. One tree is easy to read, but a hundred trees voting are not.</li><li><b>Deep learning</b>: neural networks with many layers (Lessons 7 and 10). Powerful, but unreadable.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: recipes.</b> A simple recipe card (glass-box) tells you every step. A famous restaurant's dish made by ten chefs with secret steps (ensemble) is harder to follow. A dish made by a robot using millions of micro-adjustments (deep learning) tastes amazing but nobody can write down the recipe.</div>\n<h3>The solution: explain the hard ones afterwards</h3>\n<p>If we need a powerful black-box model, we can use <b>post-hoc</b> explanation methods (\"post-hoc\" means \"after the fact\"). Three important ones in this lesson are <b>permutation feature importance</b>, <b>LIME</b> and <b>SHAP</b>.</p>\n<details><summary>Check yourself 1</summary><p>Which model type is the most interpretable? <b>Answer:</b> Glass-box models such as linear regression and decision trees.</p></details>\n<details><summary>Check yourself 2</summary><p>What is a random forest? <b>Answer:</b> Many decision trees whose votes are combined. It is an ensemble model.</p></details>"}, {"i": "🔓", "n": "Glass-box models", "h": "<h2>Glass-box models: explanation built in</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> In linear models the coefficients are the explanation. In trees the IF-THEN rules are the explanation.</div><div class=\"r\"><b>🧪 Example:</b> Price = 10 + 5 &times; bedrooms + 0.2 &times; area. One more bedroom adds 5.</div><div class=\"r\"><b>✅ Remember:</b> Simple models explain themselves.</div></div>\n<h3>1. Linear and logistic regression</h3>\n<p>Each feature has a <b>coefficient</b> (a weight, from Lesson 6). The coefficient tells you the expected change in the answer for each one-unit increase in that feature, while the others stay the same.</p>\n<p><b>Example:</b> house price in lakhs = 10 + 5 &times; bedrooms + 0.2 &times; area (m&sup2;).</p>\n<ul><li>A house with 3 bedrooms and 100 m&sup2;: 10 + 5&times;3 + 0.2&times;100 = 10 + 15 + 20 = <b>45</b>.</li><li>Add one bedroom (4 bedrooms, same area): 10 + 20 + 20 = <b>50</b>. So one more bedroom adds <b>5</b>.</li><li>Add 10 m&sup2;: it adds 0.2 &times; 10 = 2.</li></ul>\n<p>We can read the whole explanation straight from the formula. For <b>logistic regression</b> a positive coefficient pushes the probability of the class up, and a negative coefficient pushes it down.</p>\n<h3>2. Decision trees</h3>\n<p>A decision tree is a set of <b>IF-THEN</b> rules that match how people think. Loan example:</p>\n<div class=\"tree\">IF income &ge; 50,000:\n   IF debt &lt; 20,000  -> APPROVE\n   ELSE               -> REJECT\nELSE (income &lt; 50,000) -> REJECT</div>\n<p>A person with income 60,000 and debt 25,000 is rejected. The explanation is the exact path: \"income is at least 50,000, but debt is not below 20,000.\"</p>\n<div class=\"why\"><b>Limits:</b> a very large tree with hundreds of rules is no longer easy to read. And glass-box models may be less accurate on complex problems such as images.</div>\n<details><summary>Check yourself 1</summary><p>Price = 10 + 5 &times; bedrooms + 0.2 &times; area. What price for 2 bedrooms and 50 m&sup2;? <b>Answer:</b> 10 + 10 + 10 = 30.</p></details>\n<details><summary>Check yourself 2</summary><p>Using the loan tree, is income 70,000 with debt 10,000 approved? <b>Answer:</b> Yes. Income is at least 50,000 and debt is below 20,000.</p></details>"}, {"i": "🔭", "n": "Global vs local", "h": "<h2>Two scopes of explanation: global and local</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Global explains the whole model. Local explains one single decision.</div><div class=\"r\"><b>🧪 Example:</b> Global: \"Income matters most overall.\" Local: \"Why was THIS person rejected?\"</div><div class=\"r\"><b>✅ Remember:</b> Global = the big picture. Local = one case.</div></div>\n<div class=\"two\"><div class=\"good\"><b>🌍 Global interpretability</b><br>Understanding the overall logic of the model across the <b>entire dataset</b>.<br><b>Key question:</b> \"Which features drive predictions overall?\"</div>\n<div class=\"bad\"><b>🔬 Local interpretability</b><br>Explaining why the model made a <b>specific decision for one individual</b> data point.<br><b>Key question:</b> \"Why was this specific loan application rejected?\"</div></div>\n<div class=\"an\">🌍 <b>Analogy: a school.</b> Global: \"In this school, study time and attendance are what mostly decide results.\" Local: \"Why did Nimal fail?\" Maybe for Nimal the biggest reason was missed attendance.</div>\n<h3>Why both are needed</h3>\n<ul><li><b>Global</b> helps engineers and auditors check the model's general behaviour, such as whether gender plays a big role overall.</li><li><b>Local</b> helps the affected person, and the person making the decision. It is the kind of explanation a rejected applicant needs (\"what could I change?\").</li></ul>\n<p>The three methods in the next tabs: <b>Permutation importance</b> is mainly global. <b>LIME</b> is local. <b>SHAP</b> can be used for both.</p>\n<details><summary>Check yourself 1</summary><p>\"Which features matter most overall?\" Global or local? <b>Answer:</b> Global.</p></details>\n<details><summary>Check yourself 2</summary><p>\"Why was Kamal's application rejected?\" Global or local? <b>Answer:</b> Local.</p></details>"}, {"i": "🔀", "n": "Permutation importance", "h": "<h2>Permutation feature importance</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Shuffle one feature's values. If the model gets much worse, that feature was important.</div><div class=\"r\"><b>🧪 Example:</b> Shuffling \"hours studied\" drops accuracy from 90% to 62%. Shuffling \"shoe size\" changes nothing.</div><div class=\"r\"><b>✅ Remember:</b> Importance = the drop in performance after shuffling.</div></div>\n<div class=\"one\">Permutation importance measures how much a model's performance <b>decreases</b> when one feature's values are randomly shuffled.</div>\n<div class=\"an\">🌍 <b>Analogy: removing a team member.</b> If a football team plays much worse when one player is removed, that player was important. If the team plays the same, that player did little.</div>\n<h3>The steps</h3>\n<ol><li>Measure the model's score on test data (for example accuracy = 90%).</li><li>Take <b>one</b> feature column and <b>shuffle</b> its values randomly among the rows. This breaks the link between that feature and the answer.</li><li>Measure the score again.</li><li>Importance = original score &minus; new score.</li><li>Repeat for every feature and rank them.</li></ol>\n<h3>Worked example</h3>\n<p>A model predicts pass or fail from three features. Baseline accuracy = 90%.</p>\n<div class=\"wrap\"><table><tr><th>Feature shuffled</th><th>Accuracy after shuffling</th><th>Drop (importance)</th><th>Meaning</th></tr><tr><td>Hours studied</td><td>62%</td><td>90 &minus; 62 = <b>28</b></td><td>High impact: the model relied heavily on it</td></tr><tr><td>Attendance</td><td>80%</td><td>90 &minus; 80 = <b>10</b></td><td>Some impact</td></tr><tr><td>Shoe size</td><td>90%</td><td>90 &minus; 90 = <b>0</b></td><td>Low impact: the model ignored it</td></tr></table></div>\n<ul><li><b>High impact:</b> shuffling breaks the accuracy, so the model relied heavily on that feature.</li><li><b>Low impact:</b> performance stays unchanged, so the feature was largely ignored.</li></ul>\n<h3>Good to know</h3>\n<ul><li>It works with <b>any</b> model, because it only needs inputs and predictions.</li><li>It is a <b>global</b> method. It does not explain one individual decision.</li><li>If two features carry the same information (such as height in cm and height in inches), shuffling one may show little drop because the other covers for it. So correlated features can hide their importance.</li><li>It tells you <b>that</b> a feature matters, not <b>how</b> (higher or lower values).</li></ul>\n<details><summary>Check yourself 1</summary><p>Baseline accuracy 85%. After shuffling feature X it is 85%. How important is X? <b>Answer:</b> Not important: the drop is 0.</p></details>\n<details><summary>Check yourself 2</summary><p>Baseline 90%. Shuffling A gives 70% and shuffling B gives 85%. Which is more important? <b>Answer:</b> A (a drop of 20, against 5 for B).</p></details>"}, {"i": "🔍", "n": "LIME", "h": "<h2>LIME: explaining one prediction with a simple local model</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Zoom in on one prediction. Near that point the complex model looks nearly flat, so a straight line explains it.</div><div class=\"r\"><b>🧪 Example:</b> For f(x) = x&sup2; near x = 3, the local slope is about 6.</div><div class=\"r\"><b>✅ Remember:</b> LIME = Local Interpretable Model-agnostic Explanations.</div></div>\n<div class=\"one\">LIME builds a <b>simple, interpretable model</b> (such as linear regression) that copies the complex model's behaviour <b>only in the neighbourhood of one prediction</b>.</div>\n<h3>What the name means</h3>\n<ul><li><b>Local:</b> it explains one prediction, near one point.</li><li><b>Interpretable:</b> the explaining model is simple enough to read.</li><li><b>Model-agnostic:</b> it works with any model, since it only needs to ask the model for predictions.</li></ul>\n<div class=\"an\">🌍 <b>Geometric analogy: a winding map.</b> A hilly landscape has curves everywhere. But if you zoom in very close to one spot, the ground looks flat. LIME draws a straight line across that small flat patch. The line is only valid there.</div>\n<h3>The steps</h3>\n<ol><li>Pick the prediction you want to explain.</li><li>Create many slightly changed copies of the input (nearby points).</li><li>Ask the complex model what it predicts for each copy.</li><li>Give more weight to the copies that are closer to the original.</li><li>Fit a simple model (like a straight line) to those predictions.</li><li>Read the simple model's coefficients. That is the explanation.</li></ol>\n<h3>A tiny worked example</h3>\n<p>Pretend the \"complex model\" is f(x) = x&sup2;, a curve. We want to explain the prediction at x = 3 (f = 9). Take two nearby points:</p>\n<div class=\"wrap\"><table><tr><th>Nearby x</th><th>Model output x&sup2;</th></tr><tr><td>2.9</td><td>8.41</td></tr><tr><td>3.0</td><td>9.00</td></tr><tr><td>3.1</td><td>9.61</td></tr></table></div>\n<p>The straight line through the nearby points has slope (9.61 &minus; 8.41) &divide; (3.1 &minus; 2.9) = 1.20 &divide; 0.2 = <b>6</b>. So the local explanation is: \"Near x = 3, each +1 in x raises the output by about 6.\" But look at x = 0: the real curve is flat there (slope 0). So the explanation is correct <b>only locally</b>.</p>\n<h3>A real-style example</h3>\n<p>For one rejected loan, LIME might report the local effects:</p>\n<div class=\"wrap\"><table><tr><th>Feature of this applicant</th><th>Effect on \"approve\" in this neighbourhood</th></tr><tr><td>Debt is high</td><td>&minus;0.30 (pushes toward rejection)</td></tr><tr><td>Income is medium</td><td>+0.10 (pushes toward approval)</td></tr><tr><td>Age = 24</td><td>+0.02 (almost nothing)</td></tr></table></div>\n<p>(Illustrative numbers.) The applicant sees that high debt caused the rejection.</p>\n<h3>Limits</h3>\n<ul><li>It explains only <b>one point</b>, not the whole model.</li><li>Because the nearby copies are random, the explanation can change a little from run to run.</li><li>The simple line is an <b>approximation</b>, not the model itself.</li></ul>\n<details><summary>Check yourself 1</summary><p>Why does LIME use a straight line? <b>Answer:</b> Near one point a complicated curved surface looks almost flat, so a line is a good local copy.</p></details>\n<details><summary>Check yourself 2</summary><p>Does a LIME explanation describe the whole model? <b>Answer:</b> No. It is valid only near the one prediction it explains.</p></details>"}, {"i": "🤝", "n": "SHAP", "h": "<h2>SHAP: sharing the credit fairly</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> SHAP shares a prediction fairly among the features, like sharing a team prize among players.</div><div class=\"r\"><b>🧪 Example:</b> Baseline 50, prediction 90. Income gets +25, Debt gets +15, and 25 + 15 = 40 = 90 &minus; 50.</div><div class=\"r\"><b>✅ Remember:</b> Additivity: contributions add up to prediction minus baseline.</div></div>\n<div class=\"one\">SHAP uses <b>Shapley values</b> from cooperative game theory to measure how much each feature contributed to a prediction.</div>\n<div class=\"an\">🌍 <b>Game analogy.</b> A team wins a cash prize. The prediction is the prize. The players are the features. How much did each player deserve? Some players only help when others are present. SHAP calculates each player's fair share by checking <b>every possible group (coalition) of players, with and without that player</b>.</div>\n<h3>The baseline</h3>\n<p>The <b>baseline</b> is the average prediction of the model when we know nothing about this person (here: 50). SHAP explains how the features move the prediction away from the baseline to the actual prediction (here: 90).</p>\n<h3>A worked example with two features</h3>\n<p>A loan model gives a score. We know these predictions when only some features are revealed:</p>\n<div class=\"wrap\"><table><tr><th>Known features</th><th>Model's score</th></tr><tr><td>None (baseline)</td><td>50</td></tr><tr><td>Income only</td><td>70</td></tr><tr><td>Debt only</td><td>60</td></tr><tr><td>Income and Debt</td><td>90</td></tr></table></div>\n<p>To find Income's fair share, look at <b>every order</b> in which the features could be added, and see how much Income adds each time:</p>\n<ul><li><b>Income first, then Debt:</b> Income adds 70 &minus; 50 = <b>20</b>.</li><li><b>Debt first, then Income:</b> Income adds 90 &minus; 60 = <b>30</b>.</li><li>Average = (20 + 30) &divide; 2 = <b>25</b>. This is Income's SHAP value.</li></ul>\n<p>Debt's share in the same way:</p>\n<ul><li>Debt first: 60 &minus; 50 = 10. Debt after Income: 90 &minus; 70 = 20. Average = (10 + 20) &divide; 2 = <b>15</b>.</li></ul>\n<p><b>Check:</b> 25 + 15 = 40, and the prediction minus the baseline is 90 &minus; 50 = 40. The shares add up exactly.</p>\n<h3>Three features</h3>\n<p>With a third feature, Age, the same method checks all 6 orders. In one made-up model the results are: Income +25, Debt +15, Age +2. Their sum is 42, which equals 92 &minus; 50 (the prediction 92 minus the baseline 50).</p>\n<h3>Two key properties (the \"axioms\")</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>1. Consistency</b><br>If a model changes so that a feature's contribution increases or stays the same, its SHAP value will not decrease.</div><div class=\"L a2\"><b>2. Additivity</b><br>The sum of the feature contributions equals the difference between the actual prediction and the average baseline prediction.</div></div>\n<p><b>Consistency example.</b> Change the model so that Income alone now scores 80 and Income with Debt scores 100. Income's contributions are now 30 and 40, so its SHAP value is 35. It went up from 25 and did not decrease. Debt's contributions (10 and 20) did not change, so it stays 15.</p>\n<h3>Cost</h3>\n<p>With n features there are 2<sup>n</sup> possible coalitions: 8 for 3 features, 1,024 for 10, and 1,048,576 for 20. So for big models SHAP uses clever shortcuts and approximations.</p>\n<h3>Using SHAP</h3>\n<ul><li><b>Local:</b> the SHAP values for one person (\"Income +25, Debt +15\") explain that person's decision.</li><li><b>Global:</b> average the sizes of the SHAP values over many people to see which features matter most overall.</li><li>Contributions can be negative, which means the feature pushed the score down.</li></ul>\n<details><summary>Check yourself 1</summary><p>Baseline 40, prediction 75, two features. A has SHAP +20. What is B's SHAP value? <b>Answer:</b> The total is 75 &minus; 40 = 35, so B = 35 &minus; 20 = 15.</p></details>\n<details><summary>Check yourself 2</summary><p>How many coalitions for 4 features? <b>Answer:</b> 2<sup>4</sup> = 16.</p></details>"}, {"i": "🧰", "n": "Choosing a method", "h": "<h2>Comparing the methods and their limits</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Each method answers a different question. Pick the one that matches yours.</div><div class=\"r\"><b>🧪 Example:</b> Overall ranking: permutation. One rejected loan: LIME or SHAP.</div><div class=\"r\"><b>✅ Remember:</b> Explanations help judgement. They do not replace it.</div></div>\n<div class=\"wrap\"><table><tr><th>Method</th><th>Scope</th><th>Main idea</th><th>Strength</th><th>Weakness</th></tr>\n<tr><td><b>Glass-box model</b></td><td>Both</td><td>The model itself is readable</td><td>Exact and simple</td><td>Less powerful on complex data</td></tr>\n<tr><td><b>Permutation importance</b></td><td>Global</td><td>Shuffle a feature and see the score drop</td><td>Simple, works with any model</td><td>Weak with correlated features</td></tr>\n<tr><td><b>LIME</b></td><td>Local</td><td>A simple model near one point</td><td>Easy to read, any model</td><td>Approximate, can vary run to run</td></tr>\n<tr><td><b>SHAP</b></td><td>Local and global</td><td>Fair sharing by Shapley values</td><td>Additive and consistent</td><td>Costly for many features</td></tr></table></div>\n<h3>Warnings every learner should know</h3>\n<ul><li><b>An explanation is not the same as a cause.</b> \"Income mattered to the model\" does not mean income causes loan repayment.</li><li><b>Explanations can be wrong or misleading,</b> because they are approximations.</li><li><b>Explaining a bad model does not make it good.</b> It only shows what the model does, including bad habits.</li><li><b>Show the explanation to the right audience.</b> A doctor, a regulator and a patient need different levels of detail.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: X-ray vs treatment.</b> An X-ray shows what is inside, but it does not cure anything. XAI shows what the model is doing, but people must still decide what to do about it.</div>\n<details><summary>Check yourself 1</summary><p>Which method do you use to explain why one applicant was rejected? <b>Answer:</b> A local method: LIME or SHAP.</p></details>\n<details><summary>Check yourself 2</summary><p>Does a SHAP explanation prove that a feature causes the outcome? <b>Answer:</b> No. It shows what the model used, not what causes things in the real world.</p></details>"}, {"i": "🧭", "n": "Ethical foundations", "h": "<h2>Ethical foundations of using (Gen)AI</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Nine principles for using AI responsibly in study and research.</div><div class=\"r\"><b>🧪 Example:</b> You use AI to check your grammar, you say so, and you take responsibility for every word.</div><div class=\"r\"><b>✅ Remember:</b> Integrity, Originality, Transparency, Accountability, Compliance, Security, Intellectual property, Fairness and bias, Human oversight.</div></div>\n<div class=\"one\">Generative AI (like chatbots) is powerful. Ethics means choosing to use it in a way that is honest, fair, safe and responsible. The nine foundations below are written for proposals, theses, publications and presentations.</div>\n<div class=\"wrap\"><table><tr><th>Principle</th><th>What it means</th><th>Student example</th></tr>\n<tr><td><b>1. Integrity</b></td><td>Uphold academic honesty. Never use AI to misrepresent authorship or fabricate information.</td><td>Do not hand in an AI-written report as your own. Do not include references the AI invented (AI can make up convincing but fake sources).</td></tr>\n<tr><td><b>2. Originality</b></td><td>AI must support, not replace, human intellect. Core scholarly output must reflect your own knowledge and critical analysis.</td><td>Use AI to improve grammar or explain a concept. The ideas, analysis and conclusions must be yours.</td></tr>\n<tr><td><b>3. Transparency</b></td><td>Clearly acknowledge and document all AI tool use.</td><td>Add a note: \"I used [tool] to [purpose]. I reviewed and edited the output.\"</td></tr>\n<tr><td><b>4. Accountability</b></td><td>You remain fully responsible for outputs and conclusions. AI does not reduce your responsibility.</td><td>If the AI gives a wrong number and you copy it, the mistake is yours.</td></tr>\n<tr><td><b>5. Compliance</b></td><td>Follow legal, regulatory and institutional rules, including data protection laws and ethics approvals.</td><td>If your research uses surveys about people, get ethics approval and follow data-protection rules first.</td></tr>\n<tr><td><b>6. Security</b></td><td>Protect data confidentiality and intellectual property. Be careful with third-party platforms.</td><td>Do not paste private data, unpublished results or personal details into a public AI tool.</td></tr>\n<tr><td><b>7. Intellectual property</b></td><td>Respect other people's IP rights, and make sure the tool's licence terms fit your institution's policy.</td><td>Do not copy copyrighted text from AI output without checking. Read what the tool's terms say about your inputs.</td></tr>\n<tr><td><b>8. Fairness and bias</b></td><td>Critically evaluate outputs to spot algorithmic bias and prevent unfair or discriminatory outcomes.</td><td>If AI ranks job applicants or describes people with stereotypes, question it. It learned from biased data.</td></tr>\n<tr><td><b>9. Human oversight</b></td><td>Keep meaningful human judgement in all activities. Final decisions are made by qualified people.</td><td>A teacher, not a chatbot, decides the final grade.</td></tr></table></div>\n<h3>How explainable AI connects to ethics</h3>\n<ul><li><b>Transparency</b> and <b>accountability</b>: you can only be accountable if you can explain how a result came about.</li><li><b>Fairness</b>: explanations (like SHAP) can reveal if a model leans on a protected attribute.</li><li><b>Human oversight</b>: a human can only supervise a decision they can understand.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: a calculator in an exam.</b> A calculator helps you, but you still must know what you are calculating, tell the examiner if you used one, and own your answer.</div>\n<details><summary>Check yourself 1</summary><p>An AI gives you a reference that looks real. Which principle says to check it? <b>Answer:</b> Integrity (and accountability): never include fabricated information, and you are responsible for what you submit.</p></details>\n<details><summary>Check yourself 2</summary><p>Why should you not paste private research data into a public chatbot? <b>Answer:</b> Security: it may leak confidential data or intellectual property.</p></details>"}, {"i": "📜", "n": "The EU AI Act", "h": "<h2>The EU AI Act explained in plain English</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The EU AI Act is a law that sorts AI systems by how risky they are and sets rules for each level.</div><div class=\"r\"><b>🧪 Example:</b> A spam filter is minimal risk. A tool that scores job applicants is high risk. Social scoring is banned.</div><div class=\"r\"><b>✅ Remember:</b> Four risk levels plus a special part for general-purpose AI. Fines up to &euro;35 million or 7%.</div></div>\n<div class=\"one\">The <b>Artificial Intelligence Act</b> is <b>Regulation (EU) 2024/1689</b>. It is the European Union's law for AI, and the first big law of its kind. It entered into force on <b>1 August 2024</b> and its rules start in stages.</div>\n<div class=\"an\">🌍 <b>Analogy: traffic and safety rules.</b> A bicycle needs few rules. A car needs a licence and tests. A plane needs very strict checks. The AI Act works the same way: the riskier the AI, the stricter the rules.</div>\n<h3>The four risk levels</h3>\n<div class=\"wrap\"><table><tr><th>Level</th><th>What it means</th><th>Examples</th></tr>\n<tr><td><b>Unacceptable risk</b></td><td>Banned outright</td><td>Social scoring; manipulative AI that exploits people's weaknesses; untargeted scraping of face images; emotion recognition in workplaces and schools (with narrow exceptions); real-time remote biometric identification in public places for police (with narrow exceptions)</td></tr>\n<tr><td><b>High risk</b></td><td>Allowed, but with strict duties</td><td>AI used in hiring, education and exams, credit scoring, essential services, law enforcement, migration and border control, justice, critical infrastructure and some safety parts of products</td></tr>\n<tr><td><b>Limited risk</b></td><td>Transparency duties</td><td>Chatbots (must say you are talking to AI); AI-generated or manipulated images, audio and video such as deepfakes (must be labelled)</td></tr>\n<tr><td><b>Minimal risk</b></td><td>No specific duties</td><td>Spam filters, AI in video games</td></tr></table></div>\n<h3>What high-risk systems must do</h3>\n<ul><li><b>Risk management</b> across the whole life of the system.</li><li><b>Data governance:</b> training data must be relevant and examined for bias.</li><li><b>Technical documentation</b> that shows how the system works.</li><li><b>Record-keeping:</b> automatic logs of events.</li><li><b>Transparency:</b> clear instructions and information for the people who use it.</li><li><b>Human oversight:</b> people must be able to monitor and step in.</li><li><b>Accuracy, robustness and cybersecurity.</b></li></ul>\n<p>Notice how much this overlaps with explainable AI: documentation, logs, transparency and human oversight all depend on being able to understand what a system does.</p>\n<h3>General-purpose AI (GPAI) models</h3>\n<p>These are very flexible models, such as large language models. Their providers must keep technical documentation, give information to those who build on the model, put a <b>copyright policy</b> in place and publish a <b>summary of the training content</b>. Models with <b>systemic risk</b> (the Act presumes this for training above 10<sup>25</sup> operations) have extra duties: evaluations, adversarial testing, reporting serious incidents and strong cybersecurity. A voluntary Code of Practice was published in July 2025 to help providers show compliance.</p>\n<h3>Who enforces it, and the fines</h3>\n<p>A European AI Office and national authorities supervise it. The maximum fines are:</p>\n<div class=\"wrap\"><table><tr><th>Breach</th><th>Fine up to</th></tr><tr><td>Prohibited practices</td><td>&euro;35 million or 7% of worldwide yearly turnover (the higher one)</td></tr><tr><td>Most other duties (such as high-risk and transparency rules)</td><td>&euro;15 million or 3%</td></tr><tr><td>Giving false information to authorities</td><td>&euro;7.5 million or 1%</td></tr></table></div>\n<h3>The timeline (it has been changing)</h3>\n<ul><li><b>1 Aug 2024:</b> the Act enters into force.</li><li><b>2 Feb 2025:</b> bans and the AI literacy duty apply.</li><li><b>2 Aug 2025:</b> rules for general-purpose AI models and governance apply.</li><li><b>2 Aug 2026:</b> general application, including transparency duties for things like chatbots and AI-generated content.</li><li>The strictest rules for <b>high-risk</b> systems were first planned for 2026, but recent summaries say an EU amendment (the \"Digital Omnibus\") has postponed them to <b>2 Dec 2027</b> (the listed use areas) and <b>2 Aug 2028</b> (AI in regulated products). It also adds new bans, such as AI that creates non-consensual intimate images. Check the official text for exact dates before you quote them in your report.</li></ul>\n<details><summary>Check yourself 1</summary><p>Which risk level are social scoring systems in? <b>Answer:</b> Unacceptable risk. They are banned.</p></details>\n<details><summary>Check yourself 2</summary><p>Does the AI Act ban all chatbots? <b>Answer:</b> No. Chatbots are limited risk: they must tell users that they are AI, not be banned.</p></details>"}, {"i": "📝", "n": "Assignment guide", "h": "<h2>How to approach your 5-page report</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Plan the report around three questions: what are the concerns, how are they addressed, what else is needed.</div><div class=\"r\"><b>🧪 Example:</b> Concern: biased hiring AI. Addressed by: data governance and human oversight rules. Gap: who checks small companies?</div><div class=\"r\"><b>✅ Remember:</b> Write it in your own words and acknowledge any AI help.</div></div>\n<div class=\"one\">The task: read the EU AI Act (Regulation (EU) 2024/1689) and prepare a 5-page report on three things: <b>(1) key concerns raised, (2) how the concerns are addressed, (3) what additional guardrails or regulations will be required and why.</b></div>\n<div class=\"why\">This tab helps you understand and plan. The report itself must be your own work, written in your own words, with any AI help acknowledged. That is the integrity and transparency principle from the ethics tab.</div>\n<h3>A suggested page plan</h3>\n<div class=\"wrap\"><table><tr><th>Part</th><th>About</th><th>Pages</th></tr><tr><td>Introduction</td><td>What the Act is and why it exists</td><td>0.5</td></tr><tr><td>1. Key concerns</td><td>The risks the law responds to</td><td>1.5</td></tr><tr><td>2. How they are addressed</td><td>The rules and mechanisms</td><td>1.5</td></tr><tr><td>3. Additional guardrails</td><td>Your reasoned view of gaps and needs</td><td>1.25</td></tr><tr><td>Conclusion and references</td><td>Summary and sources</td><td>0.25</td></tr></table></div>\n<h3>Part 1: the concerns, and where to look</h3>\n<p>Think about harms that AI can cause. The Act addresses concerns such as:</p>\n<ul><li><b>Bias and discrimination</b> (hiring, credit, education).</li><li><b>Opacity</b> (\"black boxes\") and lack of accountability.</li><li><b>Safety and reliability</b> (health, transport, infrastructure).</li><li><b>Manipulation and mass surveillance</b> (subliminal techniques, social scoring, face scraping).</li><li><b>Loss of human control.</b></li><li><b>Misinformation and deepfakes.</b></li><li><b>Copyright and the use of training data.</b></li><li><b>Systemic risks of very powerful general-purpose models.</b></li></ul>\n<h3>Part 2: concern to response, a map you can check against the text</h3>\n<div class=\"wrap\"><table><tr><th>Concern</th><th>How the Act responds</th></tr>\n<tr><td>Bias and discrimination</td><td>Data and data-governance requirements for high-risk systems (Article 10); bans on some practices</td></tr>\n<tr><td>Black-box decisions</td><td>Technical documentation (Article 11), logging (Article 12), information for deployers (Article 13)</td></tr>\n<tr><td>Loss of human control</td><td>Human oversight (Article 14)</td></tr>\n<tr><td>Safety and reliability</td><td>Risk management (Article 9); accuracy, robustness and cybersecurity (Article 15)</td></tr>\n<tr><td>Manipulation and surveillance</td><td>Prohibited practices (Article 5)</td></tr>\n<tr><td>Deepfakes and AI interaction</td><td>Transparency duties (Article 50)</td></tr>\n<tr><td>Training data, copyright and powerful models</td><td>General-purpose AI rules (Articles 53 to 55)</td></tr>\n<tr><td>Enforcement</td><td>AI Office, national authorities and fines (Article 99)</td></tr></table></div>\n<p>Open the real regulation and find each article yourself. Read the exact words, then explain them in your own words. Article numbers are good evidence in a report.</p>\n<h3>Part 3: questions to help you form your own view</h3>\n<p>Use these to find gaps. Then argue <b>why</b> each extra guardrail is needed, with reasons.</p>\n<ul><li>Who checks that rules are really followed, and does that body have enough staff and technical skill?</li><li>The Act asks for transparency and documentation. Is there a clear standard for what a \"good enough\" explanation is?</li><li>If a high-risk system harms someone, how easily can the person get an explanation and a remedy?</li><li>How can the rules keep up with fast-changing technology and new kinds of models?</li><li>What about harms to jobs, the environment (energy use) and the information space?</li><li>What happens with AI made outside the EU, or in countries with no AI law? What would your own country need?</li><li>Do small companies and universities have the means to comply?</li></ul>\n<h3>Quality checklist</h3>\n<ul><li>Each concern is tied to a specific part of the Act.</li><li>Each claim has an article number or a reliable source.</li><li>Dates are checked against the official text (they have been changing).</li><li>Part 3 gives reasons, not only a wish list.</li><li>An acknowledgement of any AI tool use is included.</li></ul>\n<details><summary>Check yourself 1</summary><p>Which article covers human oversight? <b>Answer:</b> Article 14.</p></details>\n<details><summary>Check yourself 2</summary><p>Why should you open the real Act and not only a summary? <b>Answer:</b> To read the exact wording, give correct article numbers and check dates that may have changed.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Post-hoc = explaining after the model is already built.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Black box</b></td><td>A model whose inside logic cannot be understood</td></tr>\n<tr><td><b>XAI</b></td><td>Explainable AI: methods to understand why a model decided something</td></tr>\n<tr><td><b>Interpretability</b></td><td>How well a human can understand a model's decisions</td></tr>\n<tr><td><b>Glass-box (intrinsic)</b></td><td>A model that explains itself, like a decision tree</td></tr>\n<tr><td><b>Ensemble</b></td><td>Many small models combined (random forest, XGBoost)</td></tr>\n<tr><td><b>Post-hoc</b></td><td>Explaining after the model is built</td></tr>\n<tr><td><b>Global / local</b></td><td>Explaining the whole model / explaining one prediction</td></tr>\n<tr><td><b>Spurious correlation</b></td><td>An accidental pattern that is not the real cause</td></tr>\n<tr><td><b>Permutation importance</b></td><td>The drop in score when a feature is shuffled</td></tr>\n<tr><td><b>LIME</b></td><td>A simple local model that explains one prediction</td></tr>\n<tr><td><b>SHAP / Shapley value</b></td><td>A fair share of a prediction for each feature, from game theory</td></tr>\n<tr><td><b>Baseline</b></td><td>The model's average prediction with no information</td></tr>\n<tr><td><b>Coalition</b></td><td>A group of features (or players) considered together</td></tr>\n<tr><td><b>Additivity, consistency</b></td><td>SHAP shares add up to prediction minus baseline / a feature that matters more never gets less credit</td></tr>\n<tr><td><b>Accountability</b></td><td>Being responsible for the results</td></tr>\n<tr><td><b>Algorithmic bias</b></td><td>Unfair results caused by biased data or design</td></tr>\n<tr><td><b>Regulation</b></td><td>A legal rule that must be followed</td></tr>\n<tr><td><b>High-risk AI</b></td><td>AI in sensitive areas that must meet strict duties under the EU AI Act</td></tr>\n<tr><td><b>GPAI</b></td><td>General-purpose AI model, such as a large language model</td></tr></table></div>"}];const M=[["A 'black box' model is one where:", ["We can see inputs and outputs but not the reasoning inside", "Everything is visible", "The data is black", "The model has no inputs"], 0, "The decision logic is hidden, for example inside millions of parameters."], ["Modern machine learning often prioritizes:", ["Predictive performance over transparency", "Transparency over everything", "Fewer parameters", "Slower models"], 0, "Complex models reach high accuracy but hide their logic."], ["Which area is a high-stakes use of AI where unexplainable failure is risky?", ["Medical diagnosis", "Choosing a font", "Sorting your playlist", "Naming a file"], 0, "A wrong, unexplained result can risk a patient's life."], ["Which is NOT one of the key goals of XAI?", ["Trust", "Debugging", "Fairness and auditing", "Making the model bigger"], 3, "The goals are trust, debugging, and fairness and auditing."], ["A spurious correlation is:", ["An accidental pattern that is not the real cause", "A perfect cause", "A type of model", "A kind of data file"], 0, "Like ice-cream sales and sunburn both rising in summer."], ["In the husky-and-wolf example, the model mostly looked at:", ["The snow in the picture", "The animal's fur", "The animal's size", "The camera model"], 0, "It was right for the wrong reason."], ["Which goal asks whether a model discriminates on protected attributes?", ["Fairness and auditing", "Debugging", "Speed", "Compression"], 0, "Fairness and auditing checks for discrimination."], ["Which model type is the most interpretable?", ["Glass-box models like decision trees", "Deep learning", "Transformers", "Convolutional networks"], 0, "Glass-box models explain themselves."], ["Which pair is an ensemble model?", ["Random forest and XGBoost", "Linear regression and logistic regression", "Transformers and CNNs", "LIME and SHAP"], 0, "Ensembles combine many small models."], ["Which model type has very high predictive power but low interpretability?", ["Deep learning", "Linear regression", "A single decision tree", "Logistic regression"], 0, "Deep networks are powerful but unreadable."], ["Intrinsic interpretability means:", ["The model itself is readable", "We explain it afterwards", "The model is hidden", "The data is small"], 0, "The model is its own explanation."], ["Post-hoc explanation means:", ["Explaining a model after it has been built", "Explaining before training", "Skipping explanation", "Deleting the model"], 0, "Permutation importance, LIME and SHAP are post-hoc methods."], ["Price = 10 + 5 x bedrooms + 0.2 x area. One extra bedroom (same area) changes the price by:", ["+5", "+0.2", "+10", "+50"], 0, "The coefficient of bedrooms is 5."], ["Price = 10 + 5 x bedrooms + 0.2 x area. For 3 bedrooms and 100 m2 the price is:", ["45", "35", "55", "60"], 0, "10 + 15 + 20 = 45."], ["Decision trees explain themselves because they use:", ["IF-THEN rules", "Millions of weights", "Random numbers", "Colours"], 0, "The path of rules is the explanation."], ["Using the loan tree (income >= 50,000 and debt < 20,000 means approve), income 60,000 and debt 25,000 gives:", ["Reject", "Approve", "Unknown", "Approve with a bonus"], 0, "Income is high but debt is not below 20,000."], ["'Which features drive predictions overall?' is a question about:", ["Global interpretability", "Local interpretability", "Data cleaning", "Model size"], 0, "It looks at the whole model across the dataset."], ["'Why was this loan application rejected?' is a question about:", ["Local interpretability", "Global interpretability", "Hardware", "Storage"], 0, "It explains one specific decision."], ["Permutation feature importance measures:", ["How much performance drops when a feature is shuffled", "How many rows there are", "The model's size", "The number of layers"], 0, "A big drop means the feature was important."], ["Baseline accuracy is 90%. After shuffling feature X it is 62%. The importance of X is:", ["28", "62", "90", "152"], 0, "90 - 62 = 28."], ["If shuffling a feature leaves the accuracy unchanged, the feature was:", ["Largely ignored by the model", "Very important", "A label", "Always positive"], 0, "Low impact."], ["Permutation importance is mainly:", ["Global", "Local only", "A glass-box model", "A type of neural network"], 0, "It ranks features over the whole dataset."], ["LIME stands for:", ["Local Interpretable Model-agnostic Explanations", "Linear Inference Model Evaluation", "Large Image Model Engine", "Layered Input Matrix Estimation"], 0, "Local, interpretable, model-agnostic."], ["LIME explains:", ["One prediction using a simple local model", "The whole model equally everywhere", "Only images", "Only text"], 0, "It copies the complex model only near one point."], ["Why does a straight line work for LIME?", ["Near one point a curved surface looks almost flat", "Curves do not exist", "Lines are always exact", "Data is always linear"], 0, "Zooming in makes the surface look flat."], ["'Model-agnostic' means:", ["It works with any kind of model", "It only works for trees", "It only works for images", "It needs no data"], 0, "It only needs the model's predictions."], ["For f(x) = x^2 near x = 3, the local slope LIME would find is about:", ["6", "3", "9", "0"], 0, "(9.61 - 8.41) / 0.2 = 6."], ["SHAP is based on:", ["Shapley values from cooperative game theory", "Gradient descent", "Convolution", "Clustering"], 0, "It shares the prediction fairly among the features."], ["In the SHAP team-prize analogy, the features are:", ["The players", "The prize", "The coach", "The referee"], 0, "The prediction is the prize and the features are the players."], ["Baseline 50, prediction 90, two features. Income has SHAP +25. What is Debt's SHAP value?", ["15", "25", "40", "65"], 0, "The total is 90 - 50 = 40, so Debt = 40 - 25 = 15."], ["Additivity says that:", ["SHAP values add up to prediction minus baseline", "Features must be positive", "The model must be linear", "Only one feature matters"], 0, "The contributions sum to the difference."], ["Consistency says that if a feature's contribution increases or stays the same, its SHAP value:", ["Will not decrease", "Must double", "Becomes zero", "Becomes negative"], 0, "A feature that matters more never gets less credit."], ["How many coalitions are there for 3 features?", ["8", "6", "3", "9"], 0, "2^3 = 8."], ["Which method can explain both one decision and the whole model?", ["SHAP", "Only LIME", "Only permutation", "None"], 0, "Average SHAP sizes over many people for a global view."], ["Which statement is true?", ["An explanation shows what the model used, not necessarily what causes the outcome", "An explanation proves cause and effect", "Explaining a bad model makes it good", "Explanations are never approximate"], 0, "Be careful not to confuse explanation with cause."], ["Which ethical principle says you remain fully responsible for AI-assisted outputs?", ["Accountability", "Originality", "Security", "Compliance"], 0, "AI does not reduce your responsibility."], ["Which principle says to clearly acknowledge and document AI tool use?", ["Transparency", "Security", "Fairness", "Originality"], 0, "Say which tool you used and for what."], ["Which principle says AI must support, not replace, your own thinking?", ["Originality", "Compliance", "Security", "Intellectual property"], 0, "Core work must reflect your own knowledge and analysis."], ["Pasting unpublished research data into a public AI tool risks which principle?", ["Security", "Originality", "Fairness", "Transparency"], 0, "Data confidentiality and IP could leak."], ["Which principle says final decisions must be made by qualified people?", ["Human oversight", "Integrity", "Originality", "Security"], 0, "Meaningful human judgement stays in the loop."], ["Including a reference that an AI invented and you never checked breaks mainly:", ["Integrity", "Security", "Intellectual property only", "Compliance only"], 0, "Never use AI to fabricate information."], ["The EU AI Act is:", ["Regulation (EU) 2024/1689", "A programming language", "A neural network", "A dataset"], 0, "It is the European Union's AI law."], ["Under the EU AI Act, social scoring is:", ["Prohibited (unacceptable risk)", "High risk", "Limited risk", "Minimal risk"], 0, "It is banned outright."], ["A chatbot under the EU AI Act is mainly:", ["Limited risk with transparency duties", "Banned", "Always high risk", "Exempt from everything"], 0, "Users must be told they are talking to AI."], ["Which is a high-risk use area under the Act?", ["AI used in hiring", "A spam filter", "AI in video games", "A calculator app"], 0, "Employment is a listed high-risk area."], ["Which article covers human oversight for high-risk systems?", ["Article 14", "Article 5", "Article 50", "Article 99"], 0, "Article 14 is about human oversight."], ["Which article lists the prohibited practices?", ["Article 5", "Article 9", "Article 14", "Article 53"], 0, "Article 5 covers prohibited AI practices."], ["The maximum fine for prohibited practices is:", ["EUR 35 million or 7% of worldwide turnover", "EUR 1,000", "EUR 7.5 million or 1%", "EUR 15 million or 3%"], 0, "The higher of the two amounts applies."], ["General-purpose AI providers must:", ["Keep technical documentation, a copyright policy and a training-content summary", "Do nothing", "Delete all training data", "Only publish the weights"], 0, "These are the transparency duties for GPAI models."], ["Which pair of items in the EU AI Act relate most to explainability?", ["Documentation and transparency to users", "Colour and font", "Fines and taxes", "Speed and price"], 0, "Documentation, logs, transparency and oversight all need understandable systems."]];const K=[["Explain the black-box problem and why it matters in high-stakes areas.", "A black-box model gives predictions but its decision logic is hidden inside millions of parameters, so we cannot see why it decided something. This matters most where errors are costly: in medical diagnosis (patient safety), credit scoring (financial loss and fairness) and autonomous driving (legal responsibility). Without explanations we cannot trust, debug or audit the model."], ["Describe the three goals of XAI with one example each.", "Trust: check that predictions use real reasons, for example finding that a photo model looks at snow, not the animal. Debugging: find where and why a model fails, for example on older patients, so the data or model can be fixed. Fairness and auditing: check that decisions do not discriminate on protected attributes, for example finding a hiring model that leans on gender."], ["Explain the accuracy versus interpretability trade-off with the three model groups.", "Glass-box models (linear regression, decision trees, logistic regression) are very interpretable but have moderate predictive power. Ensemble models (random forest, XGBoost, LightGBM) have moderate interpretability and high power. Deep learning (CNNs, transformers) has very high power but low interpretability. Powerful models are harder to explain, so we use post-hoc methods for them."], ["Baseline accuracy is 88%. Shuffling hours gives 60%, attendance 80% and shoe size 88%. Calculate and rank the importance of each feature.", "Importance = baseline - new accuracy. Hours: 88 - 60 = 28. Attendance: 88 - 80 = 8. Shoe size: 88 - 88 = 0. Ranking: hours (most important), attendance, shoe size (ignored by the model)."], ["Explain how LIME works and its main limitation. Use the analogy of zooming into a curved map.", "LIME explains one prediction. It creates many slightly changed copies of the input, gets the complex model's predictions, weights the copies by closeness, and fits a simple model such as a straight line. Like zooming in on a curved map until the ground looks flat, the line is accurate only near that one point. Limitation: it explains one point only, is an approximation, and can vary from run to run."], ["A model gives these scores: no features 40, Income only 60, Debt only 50, Income and Debt 80. Calculate the SHAP values for Income and Debt and check additivity.", "Income: first then Debt = 60 - 40 = 20; after Debt = 80 - 50 = 30; average = 25. Debt: first = 50 - 40 = 10; after Income = 80 - 60 = 20; average = 15. Check: 25 + 15 = 40, and prediction minus baseline = 80 - 40 = 40. Additivity holds."], ["Compare permutation importance, LIME and SHAP: scope, idea and one weakness each.", "Permutation importance: global; shuffle a feature and measure the performance drop; weak with correlated features. LIME: local; a simple model near one point; approximate and can vary. SHAP: local and global; fair Shapley shares that add up to prediction minus baseline; costly with many features because there are 2^n coalitions."], ["Pick five of the nine ethical foundations of using (Gen)AI and explain each with a student example.", "For example: Integrity: do not submit AI text as your own or use invented references. Originality: use AI to support, but the analysis must be yours. Transparency: acknowledge which tool you used and for what. Accountability: you are responsible for any error in AI output you submit. Security: do not paste confidential or unpublished data into public tools. (Others: compliance, intellectual property, fairness and bias, human oversight.)"], ["Describe the four risk levels of the EU AI Act with one example each.", "Unacceptable risk: banned, for example social scoring. High risk: allowed with strict duties, for example AI used in hiring or credit scoring. Limited risk: transparency duties, for example chatbots must say they are AI and deepfakes must be labelled. Minimal risk: no specific duties, for example spam filters."], ["Link explainable AI to the requirements the EU AI Act puts on high-risk systems.", "High-risk systems need technical documentation, record-keeping (logs), transparency and information for users, and human oversight, plus data governance and risk management. All of these depend on being able to understand and explain what the system does, so XAI methods help meet the duties and let humans supervise and challenge decisions."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
