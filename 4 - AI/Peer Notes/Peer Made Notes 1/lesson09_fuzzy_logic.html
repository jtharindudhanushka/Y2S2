<div class="topbar"><div><h1>Lesson 9: Fuzzy Logic</h1><div class="sub">Soft categories like "warm" and "hot": membership degrees, rules and how a controller picks one action.</div></div><span class="source-tag">Lesson 9 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌡️", "n": "Why fuzzy?", "h": "<h2>Why do we need \"fuzzy\" logic?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Normal logic says true or false. Fuzzy logic allows \"partly true\", with a degree from 0 to 1.</div><div class=\"r\"><b>🧪 Example:</b> 27&deg;C can be 0.6 \"warm\" and 0.2 \"hot\" at the same time.</div><div class=\"r\"><b>✅ Remember:</b> A fuzzy degree is NOT a probability. It says how much something belongs to a category.</div></div>\n<div class=\"one\">Many everyday ideas are not sharp: warm, tall, fast, cheap. Fuzzy logic is a way to let a computer handle these soft ideas.</div>\n<h3>Start with a story: the sharp edge</h3>\n<p>Imagine a fan that turns on when the temperature is <b>at least 30&deg;C</b>. At 29.9&deg;C the fan is off. At 30&deg;C it is on. A tiny change of 0.1&deg;C flips the decision completely. Real life does not feel like that. A temperature slowly becomes warmer, then hotter.</p>\n<div class=\"an\">🌍 <b>Analogy: a light switch vs a dimmer.</b> A normal (crisp) rule is a light switch: only ON or OFF. A fuzzy rule is a dimmer: it can be a little on, half on, or mostly on.</div>\n<h3>Crisp logic and crisp sets</h3>\n<ul><li>A <b>proposition</b> is a statement that is true or false, like \"the heater is on\". The logic operators AND, OR and NOT combine statements. \"Cold AND occupied\" is true only if both parts are true.</li><li>A <b>crisp set</b> has membership of exactly 0 or 1. \"Temperature at least 30&deg;C\": 29.9 is outside (0), 30 is inside (1).</li></ul>\n<h3>Fuzzy sets</h3>\n<p>A <b>fuzzy set</b> gives every value a <b>degree of membership</b> between 0 and 1, written &mu;(x). The function that gives the degree is the <b>membership function</b>.</p>\n<ul><li>Example: &mu;<sub>warm</sub>(27) = 0.7 means \"27&deg;C belongs to the set 'warm' to degree 0.7\".</li><li>Sets can <b>overlap</b>. 27&deg;C can be partly warm and partly hot at the same time.</li><li>You must say which values are being described, for example \"temperatures from 0 to 50&deg;C\" (the <b>universe of discourse</b>).</li></ul>\n<div class=\"why\"><b>Do not confuse:</b> a degree of 0.7 for \"warm\" does <b>not</b> mean \"a 70% chance that it is warm\". It means the chosen \"warm\" curve gives 0.7 at that temperature. The temperature itself is known exactly. Probability is about uncertainty. A fuzzy degree is about how much something fits a soft category.</div>\n<h3>Linguistic variables and hedges</h3>\n<p>A <b>linguistic variable</b> is a variable whose values are words. Example: <b>temperature</b> with labels <b>cold, warm, hot</b>. A <b>hedge</b> such as \"very\" changes a set. A common rule is &mu;<sub>very A</sub>(x) = &mu;<sub>A</sub>(x)&sup2;. If &mu;<sub>warm</sub> = 0.6, then \"very warm\" = 0.6 &times; 0.6 = <b>0.36</b>. (Always state the rule you use.)</p>\n<details><summary>Check yourself 1</summary><p>A crisp set allows which membership values? <b>Answer:</b> Only 0 or 1.</p></details>\n<details><summary>Check yourself 2</summary><p>&mu;<sub>warm</sub>(28) = 0.7. Is there a 70% chance that 28&deg;C is warm? <b>Answer:</b> No. It means the chosen \"warm\" curve gives degree 0.7 at 28&deg;C. It is not a probability.</p></details>"}, {"i": "📐", "n": "Membership functions", "h": "<h2>Membership functions: the shape of a word</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A membership function is a curve that says how much each value fits a word like \"warm\".</div><div class=\"r\"><b>🧪 Example:</b> Triangle (20, 25, 30): at 23&deg;C the degree is (23 &minus; 20) &divide; (25 &minus; 20) = 0.6.</div><div class=\"r\"><b>✅ Remember:</b> Triangle: up to the peak, then down. Trapezoid has a flat top. Shoulder stays high at one end.</div></div>\n<div class=\"one\">We draw the word \"warm\" as a shape. The height of the shape at a temperature is how \"warm\" that temperature is.</div>\n<h3>1. Triangular function</h3>\n<p>Pick three ordered points a &lt; b &lt; c. The degree rises in a straight line from 0 at a to 1 at b (the peak), then falls to 0 at c. Outside a to c the degree is 0.</p>\n<p><b>Example:</b> \"warm\" with (a, b, c) = (20, 25, 30)&deg;C.</p>\n<div class=\"wrap\"><table><tr><th>Temperature</th><th>Calculation</th><th>&mu;<sub>warm</sub></th></tr><tr><td>20</td><td>start of the triangle</td><td>0</td></tr><tr><td>23</td><td>(23 &minus; 20) &divide; (25 &minus; 20) = 3 &divide; 5</td><td>0.6</td></tr><tr><td>25</td><td>the peak</td><td>1</td></tr><tr><td>27</td><td>(30 &minus; 27) &divide; (30 &minus; 25) = 3 &divide; 5</td><td>0.6</td></tr><tr><td>28</td><td>(30 &minus; 28) &divide; 5 = 2 &divide; 5</td><td>0.4</td></tr><tr><td>30</td><td>end of the triangle</td><td>0</td></tr></table></div>\n<p>Left side formula: (x &minus; a) &divide; (b &minus; a). Right side formula: (c &minus; x) &divide; (c &minus; b). Always say the units (&deg;C) and the domain.</p>\n<h3>2. Trapezoidal function</h3>\n<p>Four ordered points a &le; b &le; c &le; d. The degree rises from a to b, stays at <b>1</b> from b to c, then falls from c to d.</p>\n<p><b>Example:</b> (a, b, c, d) = (20, 25, 30, 35). At 22: (22 &minus; 20) &divide; 5 = 0.4. At 28: it is between 25 and 30, so 1. At 33: (35 &minus; 33) &divide; 5 = 0.4.</p>\n<h3>3. Shoulder functions</h3>\n<p>A <b>left shoulder</b> or <b>right shoulder</b> keeps a flat high region toward one end. Example: \"hot\" rises from 0 at 25&deg;C to 1 at 30&deg;C and stays 1 for everything hotter. At 28: (28 &minus; 25) &divide; 5 = 0.6.</p>\n<h3>4. Gaussian (bell) function</h3>\n<p>A smooth bell centred at m with spread &sigma; &gt; 0.</p>\n<div class=\"fm\">&mu;(x) = exp( &minus;(x &minus; m)&sup2; &divide; (2 &sigma;&sup2;) )</div>\n<p><b>Example:</b> m = 25, &sigma; = 3, x = 28. (28 &minus; 25)&sup2; = 9. 2 &times; 3&sup2; = 18. So &mu; = exp(&minus;9 &divide; 18) = exp(&minus;0.5) = <b>0.607</b>.</p>\n<h3>5. Singleton</h3>\n<p>A singleton has a non-zero degree at one chosen point and 0 everywhere else. It is useful for representing a single output value.</p>\n<div class=\"an\">🌍 <b>Analogy: shapes of a tent.</b> A triangle is a pointed tent. A trapezoid is a tent with a flat roof. A shoulder is a ramp that ends in a long flat platform. A Gaussian is a smooth hill.</div>\n<details><summary>Check yourself 1</summary><p>Triangle (20, 25, 30). Degree at 25? <b>Answer:</b> 1, because 25 is the peak.</p></details>\n<details><summary>Check yourself 2</summary><p>Triangle (10, 20, 30). Degree at 15? <b>Answer:</b> (15 &minus; 10) &divide; (20 &minus; 10) = 0.5.</p></details>"}, {"i": "🔗", "n": "Fuzzy AND, OR, NOT", "h": "<h2>Combining fuzzy statements: AND, OR, NOT</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> AND takes the smaller degree, OR takes the larger, NOT is 1 minus the degree.</div><div class=\"r\"><b>🧪 Example:</b> warm = 0.6, humid = 0.8. AND = 0.6, OR = 0.8, NOT warm = 0.4.</div><div class=\"r\"><b>✅ Remember:</b> min for AND, max for OR, 1 &minus; x for NOT.</div></div>\n<div class=\"one\">In normal logic, AND, OR and NOT work on true and false. In fuzzy logic they work on numbers between 0 and 1. The most common choice (Zadeh's operators) is:</div>\n<div class=\"wrap\"><table><tr><th>Operation</th><th>Rule</th><th>Meaning</th></tr><tr><td><b>AND</b> (intersection)</td><td>min(&mu;A, &mu;B)</td><td>Both must be true, so we take the smaller degree</td></tr><tr><td><b>OR</b> (union)</td><td>max(&mu;A, &mu;B)</td><td>Either is enough, so we take the larger degree</td></tr><tr><td><b>NOT</b> (complement)</td><td>1 &minus; &mu;A</td><td>The opposite degree</td></tr></table></div>\n<div class=\"an\">🌍 <b>Analogy: a chain and a rope.</b> AND is like a chain: it is only as strong as its weakest link (the minimum). OR is like two ropes: the stronger one holds (the maximum).</div>\n<h3>Worked example</h3>\n<p>At some input, \"warm\" has degree 0.6 and \"humid\" has degree 0.8.</p>\n<ul><li>warm AND humid = min(0.6, 0.8) = <b>0.6</b></li><li>warm OR humid = max(0.6, 0.8) = <b>0.8</b></li><li>NOT warm = 1 &minus; 0.6 = <b>0.4</b></li></ul>\n<p>Other families of fuzzy operators exist (for example products instead of min), so always say which one you use.</p>\n<h3>Fuzzy rules</h3>\n<p>A fuzzy rule has an <b>antecedent</b> (the IF part) and a <b>consequent</b> (the THEN part).</p>\n<p><b>Example rule:</b> IF temperature is hot AND humidity is high THEN fan speed is fast.</p>\n<p>The antecedent's degree is its <b>firing strength</b>. If \"hot\" = 0.7 and \"humidity high\" = 0.9, then the strength is min(0.7, 0.9) = <b>0.7</b>. The rule fires at 0.7. If the strength is 0, the rule does not contribute.</p>\n<div class=\"why\">Not every rule of normal logic carries over unchanged to fuzzy logic. For example, in normal logic \"A OR NOT A\" is always true. In fuzzy logic, with A = 0.6: max(0.6, 0.4) = 0.6, which is not 1.</div>\n<details><summary>Check yourself 1</summary><p>A = 0.3 and B = 0.9. A AND B, A OR B and NOT A? <b>Answer:</b> 0.3, 0.9 and 0.7.</p></details>\n<details><summary>Check yourself 2</summary><p>In \"IF hot THEN fast\", which part is the antecedent? <b>Answer:</b> \"hot\", the IF part.</p></details>"}, {"i": "🧰", "n": "Expert systems", "h": "<h2>Expert systems and fuzzy systems</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An expert system stores an expert's rules. A fuzzy system lets rules apply partially.</div><div class=\"r\"><b>🧪 Example:</b> Crisp: IF temp &ge; 30 THEN fan on. Fuzzy: warm contributes a little, hot contributes a lot.</div><div class=\"r\"><b>✅ Remember:</b> They are not opposites. A system can be both.</div></div>\n<h3>Expert system</h3>\n<p>An <b>expert system</b> stores knowledge from a field, usually as IF-THEN rules, and uses an <b>inference engine</b> to reach conclusions or advice. The stored rules are the <b>knowledge base</b>.</p>\n<p><b>Crisp rule example:</b> IF temperature &ge; 30&deg;C THEN switch the fan on. It has a hard boundary.</p>\n<h3>Fuzzy system</h3>\n<p>A <b>fuzzy system</b> uses fuzzy sets, membership functions and fuzzy inference, so overlapping terms such as \"warm\" and \"hot\" can each contribute partially.</p>\n<div class=\"wrap\"><table><tr><th></th><th>Crisp expert system</th><th>Fuzzy system</th></tr><tr><td>Categories</td><td>Sharp: in or out</td><td>Soft: a degree from 0 to 1</td></tr><tr><td>Rule firing</td><td>Fires or does not</td><td>Fires partly, several rules at once</td></tr><tr><td>Strength</td><td>Readable rules, traceable decisions</td><td>Readable rules, traceable decisions</td></tr><tr><td>Limit</td><td>Someone must write, check and maintain the rules</td><td>Same, plus the curves must be designed and tested</td></tr></table></div>\n<ul><li>\"Expert system\" describes the <b>purpose or structure</b> (a knowledge base plus an inference engine).</li><li>\"Fuzzy logic\" describes a <b>way to represent and combine soft values</b>.</li><li>A fuzzy rule system whose rules come from human experts can be both.</li><li>Neither learns new facts on its own unless learning is added.</li></ul>\n<div class=\"an\">🌍 <b>Analogy:</b> a crisp expert system is a strict teacher with a pass mark of 50: 49 is a fail, 50 is a pass. A fuzzy system is a teacher who says \"mostly good, a bit weak on this part\".</div>\n<details><summary>Check yourself 1</summary><p>What are the two parts of a traditional expert system? <b>Answer:</b> A knowledge base (the rules) and an inference engine.</p></details>\n<details><summary>Check yourself 2</summary><p>Can a fuzzy rule system also be an expert system? <b>Answer:</b> Yes, if experts provide the rules.</p></details>"}, {"i": "🔎", "n": "Fuzzification and rules", "h": "<h2>Fuzzification and the rule base</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Turn a measured number into degrees (fuzzify), then see which rules fire.</div><div class=\"r\"><b>🧪 Example:</b> 28&deg;C is 0.4 warm and 0.6 hot, so both the \"warm\" rule and the \"hot\" rule fire.</div><div class=\"r\"><b>✅ Remember:</b> Measure, fuzzify, infer, defuzzify.</div></div>\n<div class=\"one\">A fuzzy controller follows four steps, like a small factory line.</div>\n<div class=\"flow\"><div class=\"chip\">1. Measure<br><small>crisp input</small></div><span class=\"arr\">➜</span><div class=\"chip\">2. Fuzzify<br><small>degrees</small></div><span class=\"arr\">➜</span><div class=\"chip\">3. Infer<br><small>rules</small></div><span class=\"arr\">➜</span><div class=\"chip\">4. Defuzzify<br><small>crisp action</small></div></div>\n<h3>Step 1 and 2: measure and fuzzify</h3>\n<p><b>Fuzzification</b> means: take a measured (crisp) value and evaluate every relevant membership function. Our example curves:</p>\n<ul><li><b>Warm:</b> triangle (20, 25, 30)&deg;C.</li><li><b>Hot:</b> right shoulder: 0 at 25&deg;C, rising to 1 at 30&deg;C, and 1 above.</li></ul>\n<p>The sensor reads <b>28&deg;C</b>. Then warm = (30 &minus; 28) &divide; 5 = <b>0.4</b> and hot = (28 &minus; 25) &divide; 5 = <b>0.6</b>.</p>\n<h3>The rule base</h3>\n<p>A <b>rule base</b> is a list of IF-THEN rules, often written with help from experts. Example for an air conditioner:</p>\n<ul><li>IF temperature is cold THEN cooling is low.</li><li>IF temperature is warm THEN cooling is medium.</li><li>IF temperature is hot THEN cooling is high.</li></ul>\n<p>At 28&deg;C, \"warm\" is 0.4 and \"hot\" is 0.6, so <b>two rules fire together</b>: medium at strength 0.4 and high at strength 0.6. The rule for \"cold\" has strength 0, so it does not contribute.</p>\n<h3>Rules with two inputs</h3>\n<p>A rule can use two inputs: IF temperature is hot AND temperature is rising fast THEN cooling is high. If \"hot\" = 0.6 and \"rising fast\" = 0.7, the strength is min(0.6, 0.7) = <b>0.6</b>.</p>\n<h3>Designing a rule base: a checklist</h3>\n<ul><li>Define the input ranges and curves.</li><li>Check that the rules cover every case (no gaps).</li><li>Define the output categories.</li><li>Check sensible behaviour at the extremes.</li><li>Test against real cases: experts can write rules, but the numbers still need testing.</li></ul>\n<details><summary>Check yourself 1</summary><p>With triangle (20, 25, 30), what is \"warm\" at 22? <b>Answer:</b> (22 &minus; 20) &divide; 5 = 0.4.</p></details>\n<details><summary>Check yourself 2</summary><p>\"Hot\" = 0.5 and \"rising fast\" = 0.8, rule uses AND (min). Strength? <b>Answer:</b> 0.5.</p></details>"}, {"i": "🧩", "n": "Mamdani inference", "h": "<h2>Mamdani inference: rule strength, clipping and combining</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Each rule's strength cuts (clips) its output curve. Then all clipped curves are combined.</div><div class=\"r\"><b>🧪 Example:</b> A curve of height 0.9 clipped at strength 0.4 becomes 0.4. Combining 0.4 and 0.5 by max gives 0.5.</div><div class=\"r\"><b>✅ Remember:</b> Clip with min, combine with max.</div></div>\n<div class=\"one\">Mamdani inference is the classic way to turn rule strengths into a fuzzy output. It has three small steps.</div>\n<h3>Step 1: antecedent</h3>\n<p>Evaluate each rule's IF part. AND uses min, OR uses max. A rule with strength 0 does not contribute.</p>\n<h3>Step 2: implication (clipping)</h3>\n<p>The THEN part is a fuzzy output set, such as \"medium cooling\". We <b>clip</b> its curve at the rule's strength &alpha;:</p>\n<div class=\"fm\">&mu;<sub>rule</sub>(y) = min(&alpha;, &mu;<sub>consequent</sub>(y))</div>\n<p>(Another method, <b>product implication</b>, scales the curve instead of cutting it, so results can differ. Always state which one you use.)</p>\n<div class=\"an\">🌍 <b>Analogy: a ceiling over a hill.</b> The output curve is a hill. The rule strength is a ceiling. Anything of the hill above the ceiling is chopped off.</div>\n<h3>Step 3: aggregation</h3>\n<p>After every rule has produced a clipped curve, <b>combine</b> them into one output curve. The common choice is the pointwise <b>maximum</b>: &mu;<sub>combined</sub>(y) = max of the clipped curves at each y. (Sum or probabilistic-sum are other options.)</p>\n<h3>Worked point</h3>\n<p>\"Medium cooling\" fires at 0.4. \"High cooling\" fires at 0.6. At one output value y, the original curves are 0.9 (medium) and 0.5 (high).</p>\n<ul><li>Clipped medium = min(0.4, 0.9) = <b>0.4</b>.</li><li>Clipped high = min(0.6, 0.5) = <b>0.5</b>.</li><li>Combined (max) = max(0.4, 0.5) = <b>0.5</b> at this y.</li></ul>\n<p>Repeat at every output value y to build the whole combined curve.</p>\n<details><summary>Check yourself 1</summary><p>A rule fires at 0.3. Its output curve is 0.8 at some y. What is the clipped value? <b>Answer:</b> min(0.3, 0.8) = 0.3.</p></details>\n<details><summary>Check yourself 2</summary><p>Clipped values 0.2 and 0.5 combined by max? <b>Answer:</b> 0.5.</p></details>"}, {"i": "🎯", "n": "Defuzzification, Sugeno", "h": "<h2>Defuzzification: from a fuzzy curve to one number</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The controller needs one crisp number, like a fan speed. The centroid is the balance point of the output curve.</div><div class=\"r\"><b>🧪 Example:</b> Memberships 0.2, 0.5, 0.3 at speeds 20, 50, 80 give a centroid of 53.</div><div class=\"r\"><b>✅ Remember:</b> Centroid = &Sigma; y&middot;&mu; &divide; &Sigma; &mu;. Sugeno uses constants and a weighted average.</div></div>\n<div class=\"one\">The combined output is a fuzzy curve, but a fan needs a single speed. <b>Defuzzification</b> converts the curve into one number.</div>\n<h3>The centroid (centre of gravity)</h3>\n<p>The centroid is the balance point of the curve, like the point where you could balance a cardboard cut-out of the shape on a finger. For samples y<sub>i</sub> with degrees &mu;(y<sub>i</sub>):</p>\n<div class=\"fm\">output = &Sigma; y<sub>i</sub> &mu;(y<sub>i</sub>) &divide; &Sigma; &mu;(y<sub>i</sub>)</div>\n<p><b>Example:</b> degrees 0.2, 0.5, 0.3 at speeds 20, 50, 80.</p>\n<ol><li>Top: 20 &times; 0.2 + 50 &times; 0.5 + 80 &times; 0.3 = 4 + 25 + 24 = <b>53</b>.</li><li>Bottom: 0.2 + 0.5 + 0.3 = <b>1.0</b>.</li><li>Output = 53 &divide; 1.0 = <b>53</b>.</li></ol>\n<p>It is a weighted average: the speeds with bigger degrees pull the answer toward them. (The bottom total must be above 0.)</p>\n<h3>Other methods</h3>\n<p>The <b>maxima methods</b> pick from the points where the combined curve is highest: the first, middle, last or mean of those points. Different methods can give different answers, especially when the curve has two peaks.</p>\n<h3>Sugeno inference (a simpler cousin)</h3>\n<p>In zero-order <b>Sugeno</b>, the THEN part is a <b>constant number</b> (such as \"fan speed = 30\") instead of a fuzzy curve. The outputs are combined by a weighted average using the firing strengths &alpha;:</p>\n<div class=\"fm\">output = &Sigma; &alpha;<sub>i</sub> z<sub>i</sub> &divide; &Sigma; &alpha;<sub>i</sub></div>\n<p><b>Example:</b> rule 1 (medium) outputs z = 50 with strength 0.4. Rule 2 (high) outputs z = 80 with strength 0.6. Output = (0.4 &times; 50 + 0.6 &times; 80) &divide; (0.4 + 0.6) = (20 + 48) &divide; 1.0 = <b>68</b>.</p>\n<div class=\"wrap\"><table><tr><th></th><th>Mamdani</th><th>Sugeno</th></tr><tr><td>THEN part</td><td>A fuzzy set (a curve)</td><td>A constant, or a function of the inputs</td></tr><tr><td>Steps</td><td>Clip, aggregate, then defuzzify</td><td>Weighted average of the constants</td></tr><tr><td>Strength</td><td>Easy to explain with words like \"medium\"</td><td>Convenient for optimization and numeric control</td></tr></table></div>\n<div class=\"why\"><b>When no rule fires:</b> every strength is 0, so the bottom of the formula is 0 and the answer cannot be calculated. A safe design needs a fallback rule or better coverage.</div>\n<details><summary>Check yourself 1</summary><p>Degrees 0.5 and 0.5 at speeds 40 and 60. Centroid? <b>Answer:</b> (40 &times; 0.5 + 60 &times; 0.5) &divide; 1.0 = 50.</p></details>\n<details><summary>Check yourself 2</summary><p>Sugeno: z = 20 with strength 0.5 and z = 60 with strength 0.5. Output? <b>Answer:</b> (10 + 30) &divide; 1.0 = 40.</p></details>"}, {"i": "🏭", "n": "A full controller", "h": "<h2>A full fuzzy controller from sensor to fan</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Follow one reading all the way: fuzzify, fire the rules, clip, combine, defuzzify.</div><div class=\"r\"><b>🧪 Example:</b> A 28&deg;C reading gives a fan speed of about 73 (Mamdani) or 68 (Sugeno).</div><div class=\"r\"><b>✅ Remember:</b> The exact output needs the output curves. Always test the edges and \"no rule fires\" cases.</div></div>\n<div class=\"one\">We design a small air-conditioner fan controller and trace one reading, 28&deg;C, from sensor to fan speed (0 to 100).</div>\n<h3>The design</h3>\n<ul><li><b>Inputs:</b> Warm = triangle (20, 25, 30)&deg;C. Hot = 0 at 25&deg;C, rising to 1 at 30&deg;C, then 1.</li><li><b>Outputs (fan speed, 0 to 100):</b> Medium = triangle (30, 50, 70). High = 0 at 50, rising to 1 at 80, then 1.</li><li><b>Rule 1:</b> IF warm THEN fan is medium. <b>Rule 2:</b> IF hot THEN fan is high.</li></ul>\n<h3>Step 1: fuzzify 28&deg;C</h3>\n<p>Warm = (30 &minus; 28) &divide; 5 = <b>0.4</b>. Hot = (28 &minus; 25) &divide; 5 = <b>0.6</b>.</p>\n<h3>Step 2: fire the rules</h3>\n<p>Rule 1 fires at strength 0.4. Rule 2 fires at strength 0.6. Both fire.</p>\n<h3>Step 3: clip and combine (Mamdani)</h3>\n<p>We sample the fan speed every 10 units. Clip \"medium\" at 0.4 and \"high\" at 0.6, then take the maximum:</p>\n<div class=\"wrap\"><table><tr><th>Speed y</th><th>Medium at y</th><th>High at y</th><th>Clipped medium</th><th>Clipped high</th><th>Combined (max)</th></tr>\n<tr><td>0 to 30</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>\n<tr><td>40</td><td>0.5</td><td>0</td><td>0.4</td><td>0</td><td>0.4</td></tr>\n<tr><td>50</td><td>1.0</td><td>0</td><td>0.4</td><td>0</td><td>0.4</td></tr>\n<tr><td>60</td><td>0.5</td><td>0.33</td><td>0.4</td><td>0.33</td><td>0.4</td></tr>\n<tr><td>70</td><td>0</td><td>0.67</td><td>0</td><td>0.6</td><td>0.6</td></tr>\n<tr><td>80</td><td>0</td><td>1.0</td><td>0</td><td>0.6</td><td>0.6</td></tr>\n<tr><td>90</td><td>0</td><td>1.0</td><td>0</td><td>0.6</td><td>0.6</td></tr>\n<tr><td>100</td><td>0</td><td>1.0</td><td>0</td><td>0.6</td><td>0.6</td></tr></table></div>\n<h3>Step 4: defuzzify (centroid)</h3>\n<ol><li>Top: 40 &times; 0.4 + 50 &times; 0.4 + 60 &times; 0.4 + 70 &times; 0.6 + 80 &times; 0.6 + 90 &times; 0.6 + 100 &times; 0.6 = 16 + 20 + 24 + 42 + 48 + 54 + 60 = <b>264</b>.</li><li>Bottom: 0.4 &times; 3 + 0.6 &times; 4 = 1.2 + 2.4 = <b>3.6</b>.</li><li>Fan speed = 264 &divide; 3.6 = <b>73.3</b>.</li></ol>\n<p>The fan runs at about 73, between medium (50) and high (80), closer to high because \"hot\" (0.6) is stronger than \"warm\" (0.4).</p>\n<h3>The same reading with Sugeno</h3>\n<p>If medium = 50 and high = 80 as constants: (0.4 &times; 50 + 0.6 &times; 80) &divide; (0.4 + 0.6) = 68.</p>\n<h3>Where fuzzy systems are used, and their limits</h3>\n<ul><li><b>Uses:</b> climate control, decision support, and labelling things with soft categories.</li><li>A fuzzy system is <b>understandable</b>, but it does <b>not</b> learn the right rules or curves from data by itself.</li><li><b>Validate it:</b> test boundary readings, contradictory rules, units, sensor errors, cases where no rule fires, and whether the final output is safe and useful.</li><li>Remember: fuzzy degree is not the same as measurement uncertainty.</li></ul>\n<details><summary>Check yourself 1</summary><p>At 27&deg;C with the warm triangle (20, 25, 30), what is warm? <b>Answer:</b> (30 &minus; 27) &divide; 5 = 0.6.</p></details>\n<details><summary>Check yourself 2</summary><p>Why can't Mamdani give a fan speed without the output curves? <b>Answer:</b> The centroid is calculated from the combined output curve, so the curves must be defined.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Fuzzification = turning a measured number into degrees.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Crisp set</b></td><td>Membership is only 0 or 1</td></tr>\n<tr><td><b>Fuzzy set</b></td><td>Membership is a degree from 0 to 1</td></tr>\n<tr><td><b>Membership function &mu;(x)</b></td><td>A curve giving the degree for each value</td></tr>\n<tr><td><b>Universe of discourse</b></td><td>The range of values we are describing</td></tr>\n<tr><td><b>Linguistic variable</b></td><td>A variable whose values are words, like cold, warm, hot</td></tr>\n<tr><td><b>Hedge</b></td><td>A word like \"very\" that changes a set (for example squaring the degree)</td></tr>\n<tr><td><b>Antecedent, consequent</b></td><td>The IF part / the THEN part of a rule</td></tr>\n<tr><td><b>Firing strength</b></td><td>The degree to which a rule's IF part is true</td></tr>\n<tr><td><b>Fuzzification</b></td><td>Turning a crisp number into membership degrees</td></tr>\n<tr><td><b>Rule base</b></td><td>The list of IF-THEN rules</td></tr>\n<tr><td><b>Inference</b></td><td>Using the rules to reach an output</td></tr>\n<tr><td><b>Aggregation</b></td><td>Combining the outputs of all rules (often by max)</td></tr>\n<tr><td><b>Defuzzification</b></td><td>Turning the fuzzy output into one crisp number</td></tr>\n<tr><td><b>Centroid</b></td><td>The balance point of a curve</td></tr>\n<tr><td><b>Mamdani, Sugeno</b></td><td>Two inference styles: fuzzy-set outputs / constant outputs</td></tr></table></div>"}];const M=[["A crisp set allows membership values of:", ["Only 0 or 1", "Any value from 0 to 1", "Only negative values", "Only values above 100"], 0, "Crisp membership is binary."], ["A fuzzy set gives each value a membership of:", ["Only 0 or 1", "A degree from 0 to 1", "A probability of a measurement error", "Always 0.5"], 1, "The membership function gives a degree in [0, 1]."], ["mu_warm(28) = 0.7 means:", ["There is a 70% chance the sensor is right", "The degree of membership in 'warm' is 0.7", "The temperature is 70 degrees", "The set is invalid"], 1, "A fuzzy degree is not automatically a probability."], ["Why is a fuzzy dimmer-switch idea better than a crisp rule 'fan on at 30 degrees'?", ["It avoids a sudden flip from off to on at one value", "It needs no rules", "It always learns", "It uses images"], 0, "Fuzzy rules change gradually."], ["A linguistic variable is:", ["A variable whose values are words, like cold, warm, hot", "A random number", "A weight", "An image"], 0, "For example temperature with labels cold, warm, hot."], ["If mu_warm = 0.6 and the hedge 'very' squares the degree, 'very warm' is:", ["0.36", "0.6", "1.2", "0.77"], 0, "0.6 x 0.6 = 0.36."], ["A triangle (20, 25, 30) has a membership at 25 of:", ["0", "0.5", "1", "2"], 2, "The peak has membership 1."], ["For the same triangle, the membership at 23 is:", ["0.3", "0.6", "1", "1.6"], 1, "(23 - 20) / (25 - 20) = 0.6."], ["For the same triangle, the membership at 28 is:", ["0.4", "0.6", "0.2", "1"], 0, "(30 - 28) / 5 = 0.4."], ["Trapezoid (20, 25, 30, 35). The membership at 28 is:", ["1", "0.5", "0.4", "0"], 0, "28 is between 25 and 30, the flat top."], ["A Gaussian membership function is:", ["A smooth bell centred at m", "Only two points", "A straight line", "A random number"], 0, "mu(x) = exp(-(x - m)^2 / (2 sigma^2))."], ["With A = 0.6 and B = 0.8, min-AND equals:", ["0.2", "0.6", "0.8", "1.4"], 1, "The smaller degree."], ["With A = 0.6 and B = 0.8, max-OR equals:", ["0.6", "0.8", "1.4", "0.2"], 1, "The larger degree."], ["With mu_A = 0.6, the standard complement NOT A is:", ["0.2", "0.4", "0.6", "1"], 1, "1 - 0.6 = 0.4."], ["In 'IF hot THEN fast', the antecedent is:", ["hot", "fast", "IF", "THEN"], 0, "The IF part."], ["Which statement is true?", ["A fuzzy system can also be an expert system if experts provide its rules", "Fuzzy and expert systems can never be combined", "Fuzzy systems always learn from data", "Expert systems have no rules"], 0, "They describe different things: structure versus soft values."], ["What defines a traditional expert system?", ["A knowledge base and inference", "Only a convolution", "Only unlabelled data", "Random search"], 0, "Stored domain rules plus an inference engine."], ["Fuzzification maps:", ["A crisp input to membership degrees", "Rules to pixels", "Output to a test set", "Weights to labels"], 0, "Membership functions evaluate a measured input."], ["Warm = 0.4 and hot = 0.6. How many of the simple rules (warm to medium, hot to high) fire?", ["None", "Only one", "Both", "Exactly three"], 2, "Overlapping memberships let both fire partially."], ["Hot = 0.6 and rising fast = 0.7, with min-AND. The rule strength is:", ["0.6", "0.7", "1.3", "0"], 0, "min(0.6, 0.7) = 0.6."], ["Mamdani min implication does what?", ["Clips the consequent curve at the rule strength", "Returns only a class label", "Reverses time", "Adds weights to the input"], 0, "mu_rule(y) = min(alpha, mu_consequent(y))."], ["Clipped contributions 0.4 and 0.5 aggregate by max to:", ["0.2", "0.4", "0.5", "0.9"], 2, "The pointwise maximum is 0.5."], ["A curve of height 0.9 is clipped at rule strength 0.4. The result at that point is:", ["0.4", "0.9", "0.5", "1.3"], 0, "min(0.4, 0.9) = 0.4."], ["Degrees 0.2, 0.5, 0.3 at speeds 20, 50, 80. The centroid is:", ["35", "50", "53", "80"], 2, "(4 + 25 + 24) / 1.0 = 53."], ["Zero-order Sugeno uses as the THEN part:", ["A constant number", "A fuzzy output curve only", "A state tree", "An image tensor"], 0, "The rule outputs a constant."], ["Sugeno: z = 50 with strength 0.4 and z = 80 with strength 0.6. The output is:", ["68", "65", "60", "70"], 0, "(20 + 48) / 1.0 = 68."], ["In the full controller at 28 degrees (warm triangle 20, 25, 30; hot shoulder 25 to 30), hot is:", ["0.6", "0.4", "1", "0"], 0, "(28 - 25) / 5 = 0.6."], ["In the same controller, the Mamdani centroid for the fan speed is about:", ["73", "50", "80", "40"], 0, "264 / 3.6 = 73.3."], ["What happens if no rule fires in a Sugeno system?", ["The denominator is 0, so a fallback is needed", "The answer is always 1", "The answer is always 0.5", "Nothing at all"], 0, "The formula cannot be applied as written."]];const K=[["Compare a crisp set and a fuzzy set using the temperature 'warm'.", "A crisp set gives membership of only 0 or 1, so a temperature is either warm or not, with a sharp edge. A fuzzy set gives a degree between 0 and 1 using a membership function, so 27 degrees can be 0.6 warm and also partly hot, and categories can overlap. The degree is not a probability."], ["A triangle for 'warm' is (20, 25, 30). Calculate the membership at 22 and at 28.", "At 22: (22 - 20) / (25 - 20) = 2/5 = 0.4. At 28: (30 - 28) / (30 - 25) = 2/5 = 0.4."], ["Calculate fuzzy AND, OR and NOT for A = 0.6 and B = 0.8 (Zadeh operators).", "AND = min(0.6, 0.8) = 0.6. OR = max(0.6, 0.8) = 0.8. NOT A = 1 - 0.6 = 0.4."], ["Explain Mamdani inference in three steps.", "1) Antecedent: evaluate each rule's IF part (min for AND, max for OR) to get its firing strength. 2) Implication: clip each rule's output curve at its strength, mu = min(alpha, mu_consequent). 3) Aggregation: combine the clipped curves, commonly by the pointwise maximum. Then defuzzify to get one number."], ["Degrees 0.2, 0.5 and 0.3 at speeds 20, 50 and 80. Find the centroid.", "Top = 20 x 0.2 + 50 x 0.5 + 80 x 0.3 = 4 + 25 + 24 = 53. Bottom = 0.2 + 0.5 + 0.3 = 1.0. Centroid = 53 / 1.0 = 53."], ["Compare Mamdani and zero-order Sugeno.", "Mamdani has a fuzzy set as the THEN part: clip, aggregate, then defuzzify (often by centroid). Zero-order Sugeno has a constant as the THEN part and uses a firing-strength weighted average of the constants. Mamdani is easy to explain with words. Sugeno is convenient for numeric control. Both need a fallback when no rule fires."], ["Trace a fuzzy controller from a 28 degree reading to a fan action. Name the checks you would do before using it.", "Fuzzify: warm = 0.4 and hot = 0.6 under the chosen curves. Fire the rules (warm to medium at 0.4, hot to high at 0.6). Clip the output curves and combine them with max. Defuzzify, for example by centroid, once the output curves are defined. Checks: boundary readings, contradictory rules, units, sensor errors, cases where no rule fires, and whether the output is safe and useful."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
