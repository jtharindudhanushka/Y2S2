<main class="main"><div class="inner">
<div class="topbar"><div><h1>Lesson 7: Neural Networks</h1><div class="sub">From a drug-dose squiggle to hidden layers: how neural networks work, step by step with real numbers.</div></div><span class="source-tag">Lesson 7 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌱", "n": "The big idea", "h": "<h2>The big idea: a squiggle-fitting machine</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A neural network is a team of tiny calculators that together can fit a curvy \"squiggle\" to data.</div><div class=\"r\"><b>🧪 Example:</b> A drug works at a medium dose but not at a low or high dose. A straight line cannot fit that. A neural network can.</div><div class=\"r\"><b>✅ Remember:</b> Input layer, hidden layer(s), output layer. Weights and biases are the numbers it learns.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"Neural Networks Pt. 1: Inside the Black Box\"</b><br>Josh Starmer says that a neural network is just a <b>\"big fancy squiggle-fitting machine\"</b>. Give it some data and it fits a squiggle to it. People call neural networks \"black boxes\", but the video opens the box and shows there is nothing mysterious inside: just weights, biases and curved lines (activation functions) added together. The video uses a drug-dose example, which is the one used in this lesson.</div>\n<h3>The problem a straight line cannot solve</h3>\n<p>A drug is tested at three doses:</p>\n<div class=\"wrap\"><table><tr><th>Dose</th><th>Effective?</th><th>Value</th></tr><tr><td>Low</td><td>No</td><td>0</td></tr><tr><td>Medium</td><td>Yes</td><td>1</td></tr><tr><td>High</td><td>No (too much)</td><td>0</td></tr></table></div>\n<p>The pattern goes <b>0, then 1, then 0</b>. It rises and then falls, like a hill. A straight line (linear regression, Lesson 6) can only go up or down, so it cannot follow a hill. We need something that can bend.</p>\n<div class=\"an\">🌍 <b>Analogy: bending wire.</b> A straight ruler cannot trace a hill. But if you have a few pieces of bendy wire, you can stretch, flip and join them to make almost any shape. A neural network does this with curved lines. Each tiny calculator (a neuron) makes one bendy wire. The network joins them into a squiggle.</div>\n<h3>The parts, in plain words</h3>\n<ul><li><b>Neuron (node):</b> one tiny calculator. It takes numbers in and gives one number out.</li><li><b>Layer:</b> a row of neurons. <b>Input layer</b> receives the data. <b>Hidden layer</b> sits in the middle (hidden because we do not directly see its values). <b>Output layer</b> gives the answer.</li><li><b>Weight (w):</b> a number that multiplies an input. A big weight means that input matters more.</li><li><b>Bias (b):</b> a number added afterwards. It shifts the result up or down.</li><li><b>Activation function:</b> a curved line that bends the number a neuron produces. This is what lets the network make curves.</li></ul>\n<details><summary>Check yourself 1</summary><p>Why can't a straight line fit the drug data 0, 1, 0? <b>Answer:</b> The pattern rises and then falls, but a straight line can only go in one direction.</p></details>\n<details><summary>Check yourself 2</summary><p>What is a hidden layer? <b>Answer:</b> A layer of neurons between the input and output layers.</p></details>"}, {"i": "🧠", "n": "Inside a neuron", "h": "<h2>Inside one neuron: two steps</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Step 1: weight the input and add the bias. Step 2: pass the result through an activation function.</div><div class=\"r\"><b>🧪 Example:</b> Inputs 2 and 3, weights 0.5 and &minus;1, bias 1 give z = &minus;1.</div><div class=\"r\"><b>✅ Remember:</b> z = &Sigma; w x + b, then a = f(z).</div></div>\n<div class=\"one\">Every neuron does the same two things, one after the other: <b>combine</b>, then <b>bend</b>.</div>\n<div class=\"an\">🌍 <b>Analogy: deciding whether to go to a party.</b> You ask your friends. Each friend's opinion (input) counts more or less for you (weight). You add up the opinions and add your own mood (bias). That total is z. Then you decide how excited to feel (activation).</div>\n<h3>Step 1: the weighted sum</h3>\n<div class=\"fm\">z = w1 x1 + w2 x2 + ... + b</div>\n<p>With just one input it is simply <b>z = w &times; x + b</b>, the same line formula as Lesson 6.</p>\n<h3>Step 2: the activation function</h3>\n<div class=\"fm\">a = f(z)</div>\n<p>The activation function bends z into the neuron's output a.</p>\n<h3>Worked example</h3>\n<p>Inputs x1 = 2 and x2 = 3. Weights w1 = 0.5 and w2 = &minus;1. Bias b = 1.</p>\n<p>z = (0.5 &times; 2) + (&minus;1 &times; 3) + 1 = 1 &minus; 3 + 1 = <b>&minus;1</b>.</p>\n<div class=\"wrap\"><table><tr><th>Activation</th><th>Output f(&minus;1)</th></tr><tr><td>Linear f(z) = z</td><td>&minus;1</td></tr><tr><td>Sigmoid</td><td>1 / (1 + e<sup>1</sup>) = 1 / 3.718 = 0.269</td></tr><tr><td>Tanh</td><td>&minus;0.762</td></tr><tr><td>ReLU max(0, z)</td><td>0</td></tr><tr><td>SoftPlus ln(1 + e<sup>z</sup>)</td><td>ln(1 + 0.368) = 0.313</td></tr></table></div>\n<p>The same z gives different outputs. The activation function you choose changes what the neuron does.</p>\n<h3>Real brain cells inspired this</h3>\n<div class=\"wrap\"><table><tr><th>Real neuron part</th><th>What it does</th><th>Artificial version</th></tr>\n<tr><td>Dendrites</td><td>Receive signals from nearby cells</td><td>Inputs (x)</td></tr>\n<tr><td>Synapse strength</td><td>How strong a connection is. It can grow or shrink with experience.</td><td>Weights (w)</td></tr>\n<tr><td>Cell body</td><td>Collects all the incoming charges</td><td>The sum (&Sigma;)</td></tr>\n<tr><td>Axon hillock</td><td>Checks if the total passes a threshold (about &minus;55 mV)</td><td>Activation function and bias</td></tr>\n<tr><td>Axon</td><td>Sends a spike to the next cells</td><td>The output</td></tr></table></div>\n<p><b>Warm mug vs hot stove:</b> a warm mug sends weak signals that barely reach the threshold, so the neuron fires slowly. A hot stove sends strong signals far past the threshold, so it fires at full strength and you pull your hand away. A real neuron fires fully or not at all (the all-or-none law). Activation functions are a smoother maths version of that rule.</p>\n<details><summary>Check yourself 1</summary><p>x = (1, 4), w = (2, &minus;0.5), b = 0.5. What is z? <b>Answer:</b> 2 &minus; 2 + 0.5 = 0.5.</p></details>\n<details><summary>Check yourself 2</summary><p>In an artificial neuron, what plays the role of synapse strength? <b>Answer:</b> The weights.</p></details>"}, {"i": "〰️", "n": "Building the squiggle", "h": "<h2>Building the squiggle, step by step</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Two hidden neurons each make a curve. We scale the curves, add them and add a bias to get the squiggle.</div><div class=\"r\"><b>🧪 Example:</b> Dose 0 gives about 0, dose 0.5 gives about 1, dose 1 gives about 0.</div><div class=\"r\"><b>✅ Remember:</b> Input &rarr; weight and bias &rarr; activation &rarr; scale by weight &rarr; add &rarr; add bias.</div></div>\n<div class=\"sq\"><b>🎬 The StatQuest network</b><br>The video's network has <b>one input</b> (the dose), <b>two hidden nodes</b> and <b>one output</b>. Each hidden node uses the same curved activation function, <b>SoftPlus</b>, but each has different weights and biases, so each makes a differently shaped curve. The network stretches and flips those curves and adds them together to make a squiggle that fits the data.</div>\n<h3>The SoftPlus curve</h3>\n<p>SoftPlus is f(x) = ln(1 + e<sup>x</sup>). It is a smooth curve that is almost 0 for negative x and then curves up into a rising line. Examples: f(&minus;5) &asymp; 0.007, f(0) = 0.693, f(2.14) = 2.25.</p>\n<h3>The numbers (the dose has been scaled to run from 0 to 1)</h3>\n<div class=\"wrap\"><table><tr><th>Connection</th><th>Weight</th><th>Bias</th></tr><tr><td>Input to hidden node 1</td><td>&minus;34.4</td><td>2.14</td></tr><tr><td>Input to hidden node 2</td><td>&minus;2.52</td><td>1.29</td></tr><tr><td>Hidden node 1 to output</td><td>&minus;1.3</td><td></td></tr><tr><td>Hidden node 2 to output</td><td>2.28</td><td></td></tr><tr><td>Final bias on the output</td><td></td><td>&minus;0.58</td></tr></table></div>\n<h3>Predict for dose = 0</h3>\n<ol><li><b>Hidden node 1:</b> x = &minus;34.4 &times; 0 + 2.14 = 2.14. SoftPlus gives <b>2.25</b>.</li><li><b>Hidden node 2:</b> x = &minus;2.52 &times; 0 + 1.29 = 1.29. SoftPlus gives <b>1.53</b>.</li><li><b>Scale the curves:</b> 2.25 &times; (&minus;1.3) = &minus;2.93. And 1.53 &times; 2.28 = 3.49.</li><li><b>Add them and the final bias:</b> &minus;2.93 + 3.49 &minus; 0.58 = <b>&minus;0.01</b>, which is about 0. Not effective, as the data says.</li></ol>\n<h3>Predict for dose = 0.5</h3>\n<ol><li>Node 1: x = &minus;34.4 &times; 0.5 + 2.14 = &minus;15.06. SoftPlus is almost <b>0</b>.</li><li>Node 2: x = &minus;2.52 &times; 0.5 + 1.29 = 0.03. SoftPlus gives <b>0.71</b>.</li><li>Scale: 0 &times; (&minus;1.3) = 0. And 0.71 &times; 2.28 = 1.61.</li><li>Add the final bias: 0 + 1.61 &minus; 0.58 = <b>1.03</b>, about 1. Effective, as the data says.</li></ol>\n<h3>The whole squiggle</h3>\n<div class=\"wrap\"><table><tr><th>Dose</th><th>Node 1 curve (after SoftPlus)</th><th>Node 2 curve (after SoftPlus)</th><th>Output = &minus;1.3 &times; node 1 + 2.28 &times; node 2 &minus; 0.58</th></tr>\n<tr><td>0</td><td>2.25</td><td>1.53</td><td>&minus;0.01</td></tr>\n<tr><td>0.25</td><td>0.00</td><td>1.08</td><td>1.87</td></tr>\n<tr><td>0.5</td><td>0.00</td><td>0.71</td><td>1.03</td></tr>\n<tr><td>0.75</td><td>0.00</td><td>0.44</td><td>0.42</td></tr>\n<tr><td>1</td><td>0.00</td><td>0.26</td><td>0.00</td></tr></table></div>\n<p>The output starts near 0, rises above 1, then falls back to 0 at dose 1. It makes a hill, which is exactly the squiggle the data needs. At the three data doses (0, 0.5, 1) the network gives about 0, 1, 0.</p>\n<h3>Why it works</h3>\n<ul><li>Node 1 makes a curve that is high at the start and drops quickly to 0. Its weight <b>&minus;1.3 flips</b> it upside down.</li><li>Node 2 makes a gentle falling curve. Its weight <b>2.28 stretches</b> it taller.</li><li>Adding the flipped, stretched curves, plus the bias that shifts everything, gives a hill.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: building a hill from bendy wires.</b> One wire is stretched and flipped, another is stretched. Lay them together, slide them up or down with the bias, and you have a hill.</div>\n<p>The <b>hidden layer</b> here has two nodes. A bigger network with more nodes can make a more detailed squiggle. The <b>weights and biases</b> are the numbers that training finds. Training is explained in the \"How a network learns\" tab.</p>\n<details><summary>Check yourself 1</summary><p>In the network above, what is the output at dose 1? <b>Answer:</b> Node 1 &asymp; 0, node 2 &asymp; 0.26, so 0 + 2.28 &times; 0.26 &minus; 0.58 = 0.01, about 0.</p></details>\n<details><summary>Check yourself 2</summary><p>What does the weight &minus;1.3 do to node 1's curve? <b>Answer:</b> It scales it and flips it upside down.</p></details>"}, {"i": "⚡", "n": "Activation functions", "h": "<h2>Activation functions</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An activation function bends z into the neuron's output and lets the network learn curves.</div><div class=\"r\"><b>🧪 Example:</b> For z = 2: linear 2, sigmoid 0.88, tanh 0.96, ReLU 2.</div><div class=\"r\"><b>✅ Remember:</b> Output layer: linear for regression, sigmoid for yes/no. Hidden layers: usually ReLU (or SoftPlus).</div></div>\n<h3>Why we need them: without one, layers collapse</h3>\n<p>Say layer 1 is z1 = 2x + 1 and layer 2 is z2 = 3 &times; z1 &minus; 2. Put layer 1 into layer 2: z2 = 3(2x + 1) &minus; 2 = 6x + 3 &minus; 2 = <b>6x + 1</b>. Two layers became one straight line. Check with x = 2: layer 1 gives 5, layer 2 gives 3 &times; 5 &minus; 2 = 13, and 6 &times; 2 + 1 = 13. A network made only of straight-line steps is still just a straight line, however deep. An activation function bends the signal and stops this. (This is why the drug network needs SoftPlus.)</p>\n<h3>The functions</h3>\n<div class=\"wrap\"><table><tr><th>Name</th><th>Formula</th><th>Output range</th><th>Shape</th></tr>\n<tr><td><b>Linear</b></td><td>f(z) = z</td><td>&minus;&infin; to +&infin;</td><td>Straight line</td></tr>\n<tr><td><b>Sigmoid</b></td><td>f(z) = 1 / (1 + e<sup>&minus;z</sup>)</td><td>0 to 1</td><td>S-shape</td></tr>\n<tr><td><b>Tanh</b></td><td>f(z) = (e<sup>z</sup> &minus; e<sup>&minus;z</sup>) / (e<sup>z</sup> + e<sup>&minus;z</sup>)</td><td>&minus;1 to 1</td><td>S-shape through (0, 0)</td></tr>\n<tr><td><b>ReLU</b></td><td>f(z) = max(0, z)</td><td>0 to +&infin;</td><td>Flat then a rising line</td></tr>\n<tr><td><b>SoftPlus</b></td><td>f(z) = ln(1 + e<sup>z</sup>)</td><td>0 to +&infin;</td><td>A smooth version of ReLU</td></tr></table></div>\n<div class=\"wrap\"><table><tr><th>z</th><th>Linear</th><th>Sigmoid</th><th>Tanh</th><th>ReLU</th></tr><tr><td>&minus;2</td><td>&minus;2</td><td>0.119</td><td>&minus;0.964</td><td>0</td></tr><tr><td>0</td><td>0</td><td>0.5</td><td>0</td><td>0</td></tr><tr><td>2</td><td>2</td><td>0.881</td><td>0.964</td><td>2</td></tr></table></div>\n<h3>1. Linear: f(z) = z</h3>\n<p>What goes in comes out. <b>Use:</b> the output layer for regression (house price, temperature). <b>Limit:</b> in hidden layers it makes the layers collapse into one line.</p>\n<h3>2. Sigmoid</h3>\n<p>Squashes any number into 0 to 1. Big positive z gives near 1. Big negative z gives near 0. z = 0 gives exactly 0.5. <b>Use:</b> the output layer for yes/no classification, because the output is a probability (0.88 means 88% chance).</p>\n<p><b>Limit 1: vanishing gradient.</b> At very large or very small z the curve is almost flat. The slope of the sigmoid is &sigma;(1 &minus; &sigma;). At z = 0 the slope is 0.5 &times; 0.5 = <b>0.25</b>. At z = 2 it is 0.881 &times; 0.119 = <b>0.105</b>. At z = 5 it is 0.993 &times; 0.007 = <b>0.0066</b>. When the slope is near 0, gradient descent takes tiny steps, so the early layers almost stop learning.</p>\n<p><b>Limit 2: not zero-centred.</b> All outputs are positive, so the weight updates lean the same way and zig-zag.</p>\n<h3>3. Tanh</h3>\n<p>A scaled, shifted sigmoid with range &minus;1 to +1, crossing (0, 0). <b>Advantage:</b> outputs are centred around zero, which balances the updates. <b>Limit:</b> it also flattens at the extremes, so the vanishing gradient problem remains.</p>\n<h3>4. ReLU (Rectified Linear Unit)</h3>\n<p>A one-way valve: it blocks negatives and lets positives pass. If z &le; 0 the output is 0. If z &gt; 0 the output is z. It makes a bent line, and bent lines can be added up to build squiggles too (StatQuest's \"ReLU in Action\" uses this idea).</p>\n<ul><li><b>Cheap:</b> it only needs an \"is it above 0?\" check.</li><li><b>No flat part for positives:</b> the slope is exactly 1, so gradients do not vanish.</li><li><b>Sparse:</b> negatives become 0, so many neurons stay quiet.</li><li><b>Limit, dying ReLU:</b> if a neuron's input is always negative, it always outputs 0 with slope 0 and stops learning for good.</li></ul>\n<h3>5. SoftPlus</h3>\n<p>A smooth version of ReLU (the one used in the drug network). It has no sharp corner, which makes the slope easier to work with.</p>\n<h3>Where to use which</h3>\n<div class=\"wrap\"><table><tr><th>Function</th><th>Zero-centred?</th><th>Vanishing gradient?</th><th>Typical use</th></tr><tr><td>Linear</td><td>Yes (if the input is)</td><td>No</td><td>Output layer, regression</td></tr><tr><td>Sigmoid</td><td>No</td><td>Yes, at the extremes</td><td>Output layer, yes/no</td></tr><tr><td>Tanh</td><td>Yes</td><td>Yes, at the extremes</td><td>Hidden layers (older style)</td></tr><tr><td>ReLU / SoftPlus</td><td>No</td><td>None for z &gt; 0 (ReLU freezes if z &le; 0)</td><td>Hidden layers (most common today)</td></tr></table></div>\n<details><summary>Check yourself 1</summary><p>ReLU(&minus;3) and ReLU(4.5)? <b>Answer:</b> 0 and 4.5.</p></details>\n<details><summary>Check yourself 2</summary><p>Which activation suits the output of a yes/no classifier? <b>Answer:</b> Sigmoid, because its output is a probability from 0 to 1.</p></details>"}, {"i": "🎓", "n": "How a network learns", "h": "<h2>How a network learns</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Guess, measure the error, find which weights caused it, nudge them, repeat.</div><div class=\"r\"><b>🧪 Example:</b> A bias of 0 gives error 1.04. After one nudge (&minus;0.35) the error is 0.17.</div><div class=\"r\"><b>✅ Remember:</b> Forward pass, loss, backpropagation, update. One epoch = the whole data once.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"Neural Networks Pt. 2: Backpropagation Main Ideas\"</b><br>Backpropagation uses the <b>chain rule</b> to find the slope of the error for every weight and bias, and then uses <b>gradient descent</b> to nudge them. The video starts with the simplest case: <b>optimize only the last bias, b3</b>, and keep every other number fixed. The same steps then work for every other parameter. That is the example below.</div>\n<div class=\"an\">🌍 <b>Analogy: practising with past papers.</b> You attempt a paper (forward pass). You get your marks (loss). You work out which misunderstanding caused each lost mark (backpropagation). You study those parts again (update the weights). Doing the whole pile of papers once is one epoch.</div>\n<h3>The 5 steps</h3>\n<ol><li>Start with a guess for the weights and biases.</li><li><b>Forward pass:</b> send the data through to get predictions.</li><li><b>Loss:</b> measure the error. We use the sum of squared residuals (SSR), like SSE in Lesson 6.</li><li><b>Backpropagation:</b> find the slope of the loss for each weight and bias.</li><li><b>Gradient descent:</b> new value = old value &minus; learning rate &times; slope.</li></ol>\n<p><b>Backpropagation finds the slopes. Gradient descent uses them to update the values.</b></p>\n<h3>The chain rule, in plain words</h3>\n<p>If A changes B, and B changes C, then how much A changes C = (how much A changes B) &times; (how much B changes C). <b>Example:</b> 1 hour of work earns 10 dollars. 1 dollar buys 3 sweets. So 1 hour buys 10 &times; 3 = <b>30 sweets</b>.</p>\n<h3>Worked example: optimizing the last bias b3</h3>\n<p>Use the drug network. The data: dose 0 &rarr; 0, dose 0.5 &rarr; 1, dose 1 &rarr; 0. Keep every weight and bias fixed except the final bias b3. Before adding b3, the three predictions are 0.569, 1.615 and 0.585.</p>\n<p><b>The slope.</b> The loss SSR depends on the predictions, and each prediction depends on b3 (adding b3 raises it one-for-one). By the chain rule: <b>slope = &Sigma; &minus;2 &times; (observed &minus; predicted) &times; 1</b>.</p>\n<p>Start with b3 = 0 and learning rate 0.1:</p>\n<ul><li>Predictions: 0.569, 1.615, 0.585. Residuals (observed &minus; predicted): &minus;0.569, &minus;0.615, &minus;0.585.</li><li>SSR = 0.324 + 0.378 + 0.342 = <b>1.04</b>.</li><li>Slope = &minus;2 &times; (&minus;0.569 &minus; 0.615 &minus; 0.585) = &minus;2 &times; (&minus;1.769) = <b>3.54</b>.</li><li>Step size = 0.1 &times; 3.54 = 0.354. New b3 = 0 &minus; 0.354 = <b>&minus;0.354</b>.</li></ul>\n<div class=\"wrap\"><table><tr><th>Round</th><th>b3</th><th>SSR</th><th>Slope</th><th>New b3</th></tr><tr><td>1</td><td>0</td><td>1.044</td><td>3.537</td><td>&minus;0.354</td></tr><tr><td>2</td><td>&minus;0.354</td><td>0.168</td><td>1.415</td><td>&minus;0.495</td></tr><tr><td>3</td><td>&minus;0.495</td><td>0.028</td><td>0.566</td><td>&minus;0.552</td></tr><tr><td>4</td><td>&minus;0.552</td><td>0.005</td><td>0.226</td><td>&minus;0.574</td></tr><tr><td>5</td><td>&minus;0.574</td><td>0.002</td><td>0.091</td><td>&minus;0.584</td></tr></table></div>\n<p>The error falls from 1.04 to almost 0, and the slope shrinks toward 0 as b3 settles near <b>&minus;0.58</b>, the value used in the network above. We stop when the steps are tiny.</p>\n<h3>Epoch</h3>\n<p>One <b>epoch</b> = one complete pass of the whole training set through the network, forward and backward. With 1,000 samples, seeing all 1,000 once is 1 epoch. Training for 20 epochs is 20 full passes. <b>Why many epochs?</b> One pass is not enough to learn everything, just as you read a chapter several times to remember it.</p>\n<h3>Worked example: one learning step on one neuron</h3>\n<p>One neuron with a sigmoid, inputs x1 = 1 and x2 = 1, and the bias input x0 = 1. Target y = 1. All weights start at 0. Learning rate &eta; = 1. Error E = (y &minus; ŷ)&sup2;.</p>\n<ol><li><b>Forward pass:</b> z = 0 + 0 + 0 = 0, so ŷ = &sigma;(0) = 0.5.</li><li><b>Loss:</b> (1 &minus; 0.5)&sup2; = 0.25.</li><li><b>Slope for each weight</b> = &minus;2 (y &minus; ŷ) &times; ŷ (1 &minus; ŷ) &times; x. These three parts are the chain rule: how the error depends on ŷ, the slope of the sigmoid, and how the weight affects z. Here: &minus;2 &times; 0.5 &times; 0.25 &times; 1 = <b>&minus;0.25</b>.</li><li><b>Update:</b> new w = 0 &minus; 1 &times; (&minus;0.25) = <b>0.25</b> for every weight.</li><li><b>Check:</b> new z = 0.75, so ŷ = &sigma;(0.75) = <b>0.679</b>. It moved from 0.5 toward the target 1.</li></ol>\n<div class=\"why\">Some books write the weight change as &Delta;w = &eta; &times; (slope of the error) with the minus sign hidden inside the slope. To go downhill the step must be <b>minus</b> the slope, as in Lesson 6. Either way, the weights always move to lower the error.</div>\n<details><summary>Check yourself 1</summary><p>Slope 2, learning rate 0.1, b3 = 1. New b3? <b>Answer:</b> 1 &minus; 0.1 &times; 2 = 0.8.</p></details>\n<details><summary>Check yourself 2</summary><p>What does backpropagation compute? <b>Answer:</b> The slope of the loss for every weight and bias, using the chain rule. Gradient descent then uses these slopes.</p></details>"}, {"i": "🚪", "n": "AND, XOR and layers", "h": "<h2>Logic gates: why we need hidden layers</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A single neuron can learn AND but cannot learn XOR. XOR needs a hidden layer.</div><div class=\"r\"><b>🧪 Example:</b> AND gives 1 only for (1, 1). XOR gives 1 when exactly one input is 1.</div><div class=\"r\"><b>✅ Remember:</b> AND is linearly separable. XOR is not.</div></div>\n<div class=\"one\">A logic gate takes inputs of 0 or 1 and gives an output of 0 or 1. We can train a neuron using the input and output rows of a gate.</div>\n<h3>The AND gate</h3>\n<div class=\"wrap\"><table><tr><th>x1</th><th>x2</th><th>AND</th></tr><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td></tr><tr><td>1</td><td>1</td><td>1</td></tr></table></div>\n<p>The neuron computes z = w0 + w1 x1 + w2 x2 and then ŷ = f(z). Training adjusts the weights until the outputs match, using the error E = &Sigma; (y &minus; ŷ)&sup2; and gradient descent. Suppose training ends with w0 = &minus;6, w1 = 4, w2 = 4:</p>\n<div class=\"wrap\"><table><tr><th>x1</th><th>x2</th><th>z = &minus;6 + 4 x1 + 4 x2</th><th>&sigma;(z)</th><th>Rounded</th></tr><tr><td>0</td><td>0</td><td>&minus;6</td><td>0.0025</td><td>0</td></tr><tr><td>0</td><td>1</td><td>&minus;2</td><td>0.119</td><td>0</td></tr><tr><td>1</td><td>0</td><td>&minus;2</td><td>0.119</td><td>0</td></tr><tr><td>1</td><td>1</td><td>2</td><td>0.881</td><td>1</td></tr></table></div>\n<p>All four match AND. <b>Why one neuron can do AND:</b> the class 0 points (0,0), (0,1), (1,0) and the class 1 point (1,1) can be split by one straight line. So AND is <b>linearly separable</b>.</p>\n<h3>The XOR gate</h3>\n<div class=\"wrap\"><table><tr><th>x1</th><th>x2</th><th>XOR</th></tr><tr><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr><tr><td>1</td><td>0</td><td>1</td></tr><tr><td>1</td><td>1</td><td>0</td></tr></table></div>\n<p>XOR means \"exactly one of the two is 1\". Class 1 points: (0,1) and (1,0). Class 0 points: (0,0) and (1,1). Draw the four corners of a square. The two class 1 points sit on one diagonal and the two class 0 points on the other. <b>No single straight line can put both class 1 points on one side and both class 0 points on the other.</b> So XOR is <b>not linearly separable</b>, and a single neuron (or basic logistic regression) cannot solve it. It is a famous problem in AI history. A network that does solve XOR gives outputs like 0.03, 0.97, 0.96 and 0.04 for the four rows, which round to 0, 1, 1, 0.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> try to separate two chess-board colours with one straight ruler. It cannot be done. You need two cuts.</div>\n<h3>How a hidden layer solves XOR</h3>\n<p>XOR = (x1 OR x2) AND NOT (x1 AND x2). So use 2 hidden neurons, one for OR and one for AND, and an output neuron that says \"OR is on and AND is off\". Example weights:</p>\n<ul><li>Hidden 1 (OR): a1 = &sigma;(20 x1 + 20 x2 &minus; 10)</li><li>Hidden 2 (AND): a2 = &sigma;(20 x1 + 20 x2 &minus; 30)</li><li>Output: &sigma;(20 a1 &minus; 20 a2 &minus; 10)</li></ul>\n<div class=\"wrap\"><table><tr><th>x1</th><th>x2</th><th>a1 (OR)</th><th>a2 (AND)</th><th>Output z = 20 a1 &minus; 20 a2 &minus; 10</th><th>Output</th></tr><tr><td>0</td><td>0</td><td>&asymp;0</td><td>&asymp;0</td><td>&minus;10</td><td>&asymp;0</td></tr><tr><td>0</td><td>1</td><td>&asymp;1</td><td>&asymp;0</td><td>10</td><td>&asymp;1</td></tr><tr><td>1</td><td>0</td><td>&asymp;1</td><td>&asymp;0</td><td>10</td><td>&asymp;1</td></tr><tr><td>1</td><td>1</td><td>&asymp;1</td><td>&asymp;1</td><td>&minus;10</td><td>&asymp;0</td></tr></table></div>\n<p>The outputs are 0, 1, 1, 0, which is XOR. Check one row: for (1, 1), a1 = &sigma;(30) &asymp; 1 and a2 = &sigma;(10) &asymp; 1, so z = 20 &minus; 20 &minus; 10 = &minus;10 and the output is &sigma;(&minus;10) &asymp; 0. Each hidden neuron draws one straight boundary. The output neuron combines the two boundaries into a shape no single line can make. This is why adding more neurons becomes necessary.</p>\n<details><summary>Check yourself 1</summary><p>What is XOR of (1, 0)? <b>Answer:</b> 1, because exactly one input is 1.</p></details>\n<details><summary>Check yourself 2</summary><p>Why can't one neuron solve XOR? <b>Answer:</b> XOR is not linearly separable: no single straight line splits the classes.</p></details>"}, {"i": "🏗️", "n": "Hidden layers and MLP", "h": "<h2>Hidden layers and the Multi-Layer Perceptron (MLP)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An MLP has an input layer, at least one hidden layer and an output layer.</div><div class=\"r\"><b>🧪 Example:</b> 2 inputs, 3 hidden neurons, 1 output: 9 weights and 4 biases.</div><div class=\"r\"><b>✅ Remember:</b> Each hidden neuron makes its own boundary. Activation functions add non-linear behaviour.</div></div>\n<div class=\"one\">A <b>hidden layer</b> is a middle layer between the input and output layers. An <b>MLP</b> is a neural network with an input layer, at least one hidden layer and an output layer. The drug network (1 input, 2 hidden nodes, 1 output) is a small MLP.</div>\n<p>Take 2 inputs (x1, x2), 3 hidden neurons (giving a1, a2, a3) and one output neuron. The output is:</p>\n<div class=\"fm\">z = a1 w7 + a2 w8 + a3 w9 + bias, then ŷ = 1 / (1 + e<sup>&minus;z</sup>)</div>\n<h3>Counting the weights</h3>\n<ul><li>Input to hidden: 2 inputs &times; 3 hidden neurons = <b>6 weights</b> (w1 to w6).</li><li>Hidden to output: 3 &times; 1 = <b>3 weights</b> (w7 to w9).</li><li>Total weights = 9. Biases: 3 for the hidden neurons + 1 for the output = 4. So <b>13 numbers</b> are trained.</li></ul>\n<h3>Worked forward pass</h3>\n<p>Input x = (1, 2). Use ReLU in the hidden layer, no hidden biases. Hidden weights (for x1, x2): neuron 1 = (0.5, &minus;1), neuron 2 = (1, 1), neuron 3 = (&minus;0.5, 0.5). Output weights = (1, 0.5, 2), output bias = &minus;1, with a sigmoid output.</p>\n<ol><li>Hidden 1: z = 0.5 &times; 1 + (&minus;1) &times; 2 = &minus;1.5. ReLU gives <b>0</b>.</li><li>Hidden 2: z = 1 &times; 1 + 1 &times; 2 = 3. ReLU gives <b>3</b>.</li><li>Hidden 3: z = &minus;0.5 &times; 1 + 0.5 &times; 2 = 0.5. ReLU gives <b>0.5</b>.</li><li>Output: z = 0 &times; 1 + 3 &times; 0.5 + 0.5 &times; 2 &minus; 1 = 1.5.</li><li>ŷ = &sigma;(1.5) = 1 / (1 + 0.223) = <b>0.818</b>: about an 82% chance of class 1.</li></ol>\n<h3>What each hidden neuron does</h3>\n<ul><li>One neuron gives one straight (linear) boundary. Hidden neuron 1 makes boundary 1. Hidden neuron 2 makes boundary 2. The output neuron combines them.</li><li>Hidden layers let a network solve XOR and fit squiggles.</li><li>The <b>activation functions</b> add non-linear behaviour. Without them, all the layers would collapse into one straight line.</li><li>Neural networks work well with both numerical data (like prices) and categorical data (like Pass or Fail).</li></ul>\n<h3>Simple models cannot fit every dataset</h3>\n<p>Data shaped like a bump cannot be followed by a straight line or a simple S-curve. <b>Underfitting:</b> the model is too simple to capture the pattern. <b>Overfitting:</b> the model is so complex that it memorises the training data, including its noise. So we add enough neurons to capture the pattern, but not so many that it memorises (see Lessons 5 and 6).</p>\n<details><summary>Check yourself 1</summary><p>2 inputs, 4 hidden neurons, 1 output. How many weights? <b>Answer:</b> 2 &times; 4 + 4 &times; 1 = 12.</p></details>\n<details><summary>Check yourself 2</summary><p>What does a hidden neuron contribute? <b>Answer:</b> Its own boundary or curve, which the output layer combines with the others.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the difficult words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Epoch = one full pass of the training data.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Neuron (node)</b></td><td>One tiny calculator that takes numbers in and gives one out</td></tr>\n<tr><td><b>Input, hidden, output layer</b></td><td>Front door / middle rooms / exit of the network</td></tr>\n<tr><td><b>Weight, bias</b></td><td>A multiplier on an input / a number added afterwards</td></tr>\n<tr><td><b>Aggregation</b></td><td>Adding up the weighted inputs plus the bias</td></tr>\n<tr><td><b>Activation function</b></td><td>A curved line that bends the sum into the neuron's output</td></tr>\n<tr><td><b>Forward pass</b></td><td>Sending data from input to output to get a prediction</td></tr>\n<tr><td><b>Loss</b></td><td>A score of how wrong the predictions are (SSR or SSE)</td></tr>\n<tr><td><b>Backpropagation</b></td><td>Working backward to find each weight's share of the error</td></tr>\n<tr><td><b>Chain rule</b></td><td>If A changes B and B changes C, multiply the two changes to get how A changes C</td></tr>\n<tr><td><b>Epoch</b></td><td>One full pass of the whole training data</td></tr>\n<tr><td><b>Linearly separable</b></td><td>Two groups that one straight line can split</td></tr>\n<tr><td><b>Vanishing gradient</b></td><td>The slope is almost 0, so learning stops</td></tr>\n<tr><td><b>MLP</b></td><td>Multi-Layer Perceptron: input, at least one hidden, output layer</td></tr></table></div>"}];const M=[["Logistic regression is the same as a neural network with:", ["No neurons", "A single neuron using a sigmoid", "Three hidden layers", "A ReLU output"], 1, "One neuron with weighted sum plus sigmoid is logistic regression."], ["A neural network is made of these layers:", ["Input, hidden and output layers", "Only an input layer", "Only hidden layers", "Reward and penalty layers"], 0, "An MLP has an input layer, one or more hidden layers and an output layer."], ["Aggregation in a neuron means:", ["Applying the activation function", "Computing the weighted sum plus bias", "Calculating the loss", "Resetting the weights"], 1, "z = w1 x1 + ... + wn xn + b."], ["Inputs x = (2, 3), weights w = (0.5, -1), bias b = 1. z is:", ["-1", "1", "3", "0"], 0, "0.5 x 2 - 1 x 3 + 1 = 1 - 3 + 1 = -1."], ["The activation function:", ["Counts the epochs", "Turns z into the neuron's output", "Stores the data", "Picks the learning rate"], 1, "a = f(z)."], ["Why do networks need non-linear activation functions?", ["Without them, stacked layers collapse into one straight line", "To make training slower", "To remove the bias", "To add more inputs"], 0, "Linear layers combined are still linear."], ["In a real neuron, the dendrites correspond to:", ["Weights", "Inputs (x)", "The output", "The bias"], 1, "Dendrites receive incoming signals."], ["Synapse strength corresponds to:", ["Weights (w)", "The loss", "The epoch", "The output"], 0, "A stronger connection means a larger weight."], ["The axon hillock checking a threshold corresponds to:", ["Inputs", "Activation function and bias", "The loss function", "Epochs"], 1, "It decides whether the neuron fires."], ["The all-or-none law says a biological neuron:", ["Fires partially", "Fires completely or not at all", "Never fires", "Fires only for warm things"], 1, "Activation functions are a smoothed version of this."], ["The correct order of weight training is:", ["Update, forward pass, loss, backpropagation", "Forward pass, loss, backpropagation, update", "Loss, update, forward pass, backpropagation", "Backpropagation, loss, update, forward pass"], 1, "Guess, measure, trace the error back, then update."], ["Backpropagation is used to:", ["Make the first guess", "Work backward to find each weight's share of the error", "Pick the dataset", "Stop training"], 1, "It computes the slopes. Gradient descent then uses them."], ["One epoch is:", ["One weight update", "One full pass of the whole training set", "One neuron", "One layer"], 1, "The entire data goes through forward and backward once."], ["Why train for many epochs?", ["The network cannot learn every pattern in one pass", "To waste time", "To remove noise from the output", "Because epochs reduce the number of layers"], 0, "Like re-reading a chapter several times."], ["The output layer for predicting house prices usually uses:", ["Linear activation", "Sigmoid", "Tanh", "ReLU only"], 0, "Regression needs an unbounded number."], ["The output layer for a yes/no probability usually uses:", ["Linear", "Sigmoid", "ReLU", "None"], 1, "Sigmoid gives a value between 0 and 1."], ["The output range of tanh is:", ["0 to 1", "-1 to 1", "0 to infinity", "-infinity to infinity"], 1, "Tanh is a scaled sigmoid centred at 0."], ["ReLU(-3) equals:", ["-3", "3", "0", "1"], 2, "max(0, -3) = 0."], ["ReLU(4.5) equals:", ["0", "4.5", "-4.5", "1"], 1, "max(0, 4.5) = 4.5."], ["Sigmoid(0) equals:", ["0", "0.5", "1", "-1"], 1, "1 / (1 + 1) = 0.5."], ["The vanishing gradient problem happens because:", ["The curve is nearly flat, so the slope is almost 0 and weights barely update", "The weights are too big", "There are too many epochs", "The bias is zero"], 0, "Tiny slopes give tiny steps."], ["Which activation is zero-centred?", ["Sigmoid", "Tanh", "ReLU", "None of them"], 1, "Tanh gives negative and positive outputs."], ["The 'dying ReLU' problem is when a neuron:", ["Always outputs 0 and stops learning", "Outputs only 1", "Has too many inputs", "Overflows"], 0, "Its input is always negative, so the slope is 0."], ["Which activation is the most common choice for hidden layers today?", ["Linear", "Sigmoid", "ReLU", "None"], 2, "It is cheap and does not vanish for positive values."], ["The sigmoid slope at z = 0 is:", ["0", "0.25", "0.5", "1"], 1, "0.5 x (1 - 0.5) = 0.25."], ["In the AND gate, the output is 1 when:", ["Both inputs are 1", "Either input is 1", "Neither is 1", "Exactly one is 1"], 0, "AND is 1 only for (1, 1)."], ["In the XOR gate, the output for inputs (1, 1) is:", ["1", "0", "0.5", "Undefined"], 1, "XOR is 1 only when exactly one input is 1."], ["Why can a single neuron not solve XOR?", ["XOR is not linearly separable", "It has no bias", "It cannot use sigmoid", "It needs more epochs"], 0, "No single straight line can split the two classes."], ["What allows a network to solve XOR?", ["A hidden layer", "A smaller learning rate", "More epochs on one neuron", "Removing the bias"], 0, "Hidden neurons make several boundaries that the output combines."], ["An MLP is a network with:", ["An input layer, at least one hidden layer and an output layer", "Only one neuron", "No weights", "Only an output layer"], 0, "Multi-Layer Perceptron."], ["A network has 2 inputs, 3 hidden neurons and 1 output. How many weights are there?", ["5", "6", "9", "13"], 2, "2 x 3 = 6, plus 3 x 1 = 3, total 9. With 4 biases that is 13 parameters."], ["With the same network, the total number of weights plus biases is:", ["9", "10", "13", "16"], 2, "9 weights + 3 hidden biases + 1 output bias = 13."], ["One hidden neuron represents:", ["One boundary or intermediate pattern", "The whole dataset", "The loss", "One epoch"], 0, "Each hidden neuron makes its own boundary."], ["A model too simple to capture the pattern is:", ["Overfitting", "Underfitting", "Perfect", "Clustering"], 1, "Too simple means underfitting."], ["Which describes the relationship between backpropagation and gradient descent?", ["Backpropagation computes the slopes and gradient descent uses them to update weights", "They are the same", "Gradient descent computes the loss only", "Backpropagation picks the dataset"], 0, "One finds the slopes, the other takes the steps."], ["1 hour of work earns 10 dollars, and 1 dollar buys 3 sweets. By the chain rule, 1 hour buys:", ["13 sweets", "30 sweets", "3.3 sweets", "7 sweets"], 1, "10 x 3 = 30."], ["One neuron with a linear activation and one input is equivalent to:", ["Linear regression", "Clustering", "Reinforcement learning", "A hidden layer"], 0, "z = w x + b is a straight line."], ["In the StatQuest example, the drug is effective at a medium dose but not at low or high doses. Why can't a straight line fit this?", ["The pattern rises and then falls", "The data has no numbers", "A line is too curved", "There is too little data"], 0, "A straight line can only go in one direction."], ["The StatQuest neural network example has:", ["One input, two hidden nodes and one output", "Two inputs, no hidden nodes", "Ten hidden layers", "No weights"], 0, "It is a small network that fits a squiggle."], ["Which activation function does the StatQuest drug network use in its hidden nodes?", ["SoftPlus", "Step function", "Linear", "None"], 0, "SoftPlus is ln(1 + e^x), a smooth curved line."], ["In the drug network, hidden node 1 has weight -34.4 and bias 2.14. For dose 0, its input to SoftPlus is:", ["2.14", "-34.4", "-32.26", "0"], 0, "-34.4 x 0 + 2.14 = 2.14."], ["The network output for dose 0.5 is about:", ["1", "0", "-1", "5"], 0, "0 + 0.71 x 2.28 - 0.58 = 1.03."], ["In a neural network, the weights and biases are changed during:", ["Training", "Printing", "Testing only", "Decoding"], 0, "Training finds the weights and biases that fit the data."], ["Backpropagation uses which idea from maths to find slopes?", ["The chain rule", "Pythagoras", "The mean", "The mode"], 0, "It multiplies the changes along the path from the weight to the loss."], ["Optimizing only the last bias b3 with slope 3.54 and learning rate 0.1 starting at 0 gives a new b3 of:", ["-0.354", "0.354", "-3.54", "-0.0354"], 0, "0 - 0.1 x 3.54 = -0.354."]];const K=[["Inputs x = (1, 4), weights w = (2, -0.5), bias b = 0.5. Calculate z, then the output with a sigmoid and with ReLU.", "z = 2 x 1 + (-0.5) x 4 + 0.5 = 2 - 2 + 0.5 = 0.5. Sigmoid: 1 / (1 + e^-0.5) = 1 / (1 + 0.6065) = 0.6225. ReLU: max(0, 0.5) = 0.5."], ["Why do we need activation functions? Show with two straight-line layers.", "Without an activation function, layers are just straight-line formulas, and combining them gives another straight line. Example: z1 = 2x + 1 and z2 = 3 z1 - 2 give z2 = 3(2x + 1) - 2 = 6x + 1. Two layers became one line. An activation function bends the signal, so the network can learn curves and complex patterns."], ["Explain epoch, and why a network needs many epochs.", "An epoch is one complete pass of the whole training set through the network, forward and backward. One pass is not enough to learn all the patterns, so the weights are improved a little each epoch. Like re-reading a chapter several times to remember it, the network needs dozens or hundreds of epochs."], ["Which activation would you use at the output layer for (a) predicting a house price, (b) predicting whether a tumour is present? Which for hidden layers? Give reasons.", "(a) Linear, because the price is an unbounded real number. (b) Sigmoid, because the output is a probability between 0 and 1 and we can use a 0.5 cutoff. Hidden layers usually use ReLU: it is cheap to compute, its slope for positive values is 1 so gradients do not vanish, and it keeps many neurons quiet, making the network light."], ["Explain the vanishing gradient problem using sigmoid slopes.", "The sigmoid slope is sigma x (1 - sigma). At z = 0 it is 0.25, at z = 2 it is 0.105, and at z = 5 it is only 0.0066. When inputs are very large or very small the curve is almost flat, so the slope is close to 0. Gradient descent steps are slope-sized, so the weights in early layers barely change and learning almost stops."], ["Why can a single neuron learn AND but not XOR?", "AND is linearly separable: the class 1 point (1,1) can be split from (0,0), (0,1) and (1,0) by one straight line, so one neuron can learn it. In XOR the class 1 points (0,1) and (1,0) sit on one diagonal and the class 0 points (0,0) and (1,1) on the other. No single line can separate them, so a single neuron cannot solve it."], ["Explain how a hidden layer can solve XOR.", "XOR equals (x1 OR x2) AND NOT (x1 AND x2). One hidden neuron learns OR, another learns AND. The output neuron says 'OR is on and AND is off'. Each hidden neuron draws one straight boundary. The output neuron combines two boundaries into a shape that no single line can make."], ["Inputs x = (1, 2). A hidden layer with ReLU has neurons with weights (0.5, -1), (1, 1) and (-0.5, 0.5). The output neuron has weights (1, 0.5, 2), bias -1 and a sigmoid. Calculate the output.", "Hidden 1: 0.5 - 2 = -1.5, ReLU 0. Hidden 2: 1 + 2 = 3, ReLU 3. Hidden 3: -0.5 + 1 = 0.5, ReLU 0.5. Output z = 0 x 1 + 3 x 0.5 + 0.5 x 2 - 1 = 1.5. Sigmoid(1.5) = 1 / (1 + 0.223) = 0.818."], ["Match the parts of a real neuron to the parts of an artificial neuron.", "Dendrites are the inputs (x). Synapse strength is the weights (w). The cell body adds up the signals, which is the summation. The axon hillock checks a threshold, which is the activation function and bias. The axon sends the output (a or y)."], ["Calculate the output of the drug network for dose 0.5. Hidden node 1: weight -34.4, bias 2.14. Hidden node 2: weight -2.52, bias 1.29. Output weights -1.3 and 2.28, final bias -0.58. SoftPlus(x) = ln(1 + e^x).", "Node 1 input = -34.4 x 0.5 + 2.14 = -15.06, SoftPlus is about 0. Node 2 input = -2.52 x 0.5 + 1.29 = 0.03, SoftPlus = ln(1 + e^0.03) = 0.71. Output = 0 x (-1.3) + 0.71 x 2.28 - 0.58 = 1.62 - 0.58 = 1.03, so about 1 (effective)."], ["Explain how a neural network builds a squiggle from curved lines.", "Each hidden node sends the input through a weight, a bias and an activation function (a curve). The curves from different hidden nodes have different shapes. Each curve is multiplied by a weight (stretched or flipped), the results are added together, and a final bias shifts everything up or down. The sum is a squiggle that can fit patterns a straight line cannot."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;

const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}

function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
