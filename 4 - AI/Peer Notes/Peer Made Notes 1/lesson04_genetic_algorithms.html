<div class="topbar"><div><h1>Lesson 4: Genetic Algorithms</h1><div class="sub">Solving problems the way nature does: start with a crowd of answers, keep the best, mix them, repeat. Every number is worked out.</div></div><span class="source-tag">Lesson 4 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🎯", "n": "The problem", "h": "<h2>Step 1: What problem are we solving?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Optimization means finding the best answer among many possible answers.</div><div class=\"r\"><b>🧪 Example:</b> Which study timetable gives the highest total marks?</div><div class=\"r\"><b>✅ Remember:</b> Every optimization problem has decision variables, an objective function and constraints.</div></div>\n<div class=\"one\">Optimization = finding the <b>best</b> answer. A genetic algorithm (GA) is a way to find very good answers when we cannot just calculate them.</div>\n<h3>The three parts of any optimization problem</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>1. Decision variables</b><br>The things we can change. Example: how many hours to study each subject.</div><div class=\"L a2\"><b>2. Objective function</b><br>The score we want to make as big (or small) as possible. Example: total marks.</div><div class=\"L a3\"><b>3. Constraints</b><br>The limits we must obey. Example: only 10 hours in a day.</div></div>\n<h3>The old way: use the slope</h3>\n<p>If we have a formula f(x), we can look for the top of the hill. At the very top you stop going up and start going down, so for a moment the ground is flat. The <b>slope</b> there is 0.</p>\n<p><b>Example:</b> f(x) = 9 &minus; (x &minus; 3)&sup2;. Then f(2) = 8, f(3) = 9, f(4) = 8. The values rise to 9 at x = 3 and then fall, so the top is at x = 3.</p>\n<div class=\"why\"><b>What is a slope?</b> It is how steep the ground is at one spot. Uphill is positive, downhill is negative, and a flat top is 0.</div>\n<h3>The problem with the old way</h3>\n<p>In real life we often <b>do not have a neat formula</b>. Then we cannot find the slope. We need a method that works without one.</p>\n<div class=\"an\">🌍 <b>Analogy: finding the highest hill in thick fog.</b> You cannot see the whole landscape and you have no map. A GA sends out many hikers. Each hiker checks how high they are. The ones who are higher get to \"have children\": new hikers who start near the good spots. After many rounds the group gathers near the top.</div>\n<p>The big idea: <b>copy how nature solves problems.</b> Nature found animals that survive in tough places by evolution. A GA copies that.</p>\n<details><summary>Check yourself 1</summary><p>Name the 3 parts of an optimization problem. <b>Answer:</b> Decision variables, objective function, constraints.</p></details>\n<details><summary>Check yourself 2</summary><p>Why can't we always use the slope method? <b>Answer:</b> Often there is no formula f(x), so we cannot find its slope.</p></details>"}, {"i": "🔤", "n": "What is f(x)?", "h": "<h2>Step 2: The example problem and what f(x) means</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> f(x) is a machine: you put x in and a score comes out.</div><div class=\"r\"><b>🧪 Example:</b> f(x) = x&sup2;. Put in 7 and get 49.</div><div class=\"r\"><b>✅ Remember:</b> In a GA, f(x) is the fitness function. z = f(x) is the same thing.</div></div>\n<div class=\"one\">We will use one simple problem all through this lesson: <b>find the whole number x from 0 to 31 that makes x&sup2; as big as possible.</b> (We can see the answer is 31, but we will let the GA discover it, so we can check that the GA works.)</div>\n<h3>What is a function?</h3>\n<p>A function is a <b>machine</b>. You put a number in and one number comes out. <b>f(x)</b> is read \"f of x\". It means \"the output when the input is x\". It is <b>not</b> f multiplied by x. The letter f is just the name of the machine.</p>\n<div class=\"an\">🌍 <b>Analogy: a juice machine.</b> Put in 1 orange and get 1 glass. The rule inside the machine is the function. f(x) is \"how much juice you get when you put in x oranges\".</div>\n<h3>What does x&sup2; mean?</h3>\n<p>The small 2 means \"squared\": multiply the number by itself. (You may also see x2 or x^2.)</p>\n<div class=\"wrap\"><table><tr><th>Input x</th><th>Rule: x &times; x</th><th>Output f(x)</th></tr><tr><td>2</td><td>2 &times; 2</td><td>4</td></tr><tr><td>7</td><td>7 &times; 7</td><td>49</td></tr><tr><td>18</td><td>18 &times; 18</td><td>324</td></tr><tr><td>31</td><td>31 &times; 31</td><td>961</td></tr></table></div>\n<h3>Reading the problem line by line</h3>\n<p><b>Max z = x&sup2;, 0 &le; x &lt; 32, x is a whole number</b></p>\n<ul><li><b>Max z = x&sup2;:</b> make the score z as big as possible. This is the <b>objective function</b>. z is just another name for f(x).</li><li><b>x:</b> the number we are free to choose. This is the <b>decision variable</b>.</li><li><b>0 &le; x &lt; 32:</b> x can be 0, 1, 2 ... up to 31. This is a <b>constraint</b>.</li><li><b>x is a whole number:</b> another constraint.</li></ul>\n<p>In a real problem nobody gives you x&sup2;. You write your own f(x) to measure what you care about, such as profit, distance or cost. The GA steps stay exactly the same. Only f(x) changes.</p>\n<details><summary>Check yourself 1</summary><p>What is f(5) if f(x) = x&sup2;? <b>Answer:</b> 5 &times; 5 = 25.</p></details>\n<details><summary>Check yourself 2</summary><p>In \"Max z = x&sup2;\", which part is the decision variable? <b>Answer:</b> x, the number we choose.</p></details>"}, {"i": "🧬", "n": "Nature's idea", "h": "<h2>Step 3: The idea from nature</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Keep the fittest answers, mix them to make new ones, and repeat.</div><div class=\"r\"><b>🧪 Example:</b> A farmer saves seeds from the best plants every year, so the crop gets stronger.</div><div class=\"r\"><b>✅ Remember:</b> Population, chromosome, gene, fitness, selection, crossover, mutation, generation.</div></div>\n<div class=\"one\">Darwin's idea: the fittest survive and have children. Children inherit good traits. Over many generations the group gets better. A GA does this with <b>answers</b> instead of animals.</div>\n<div class=\"an\">🌍 <b>Analogy: a farmer saving seeds.</b> Every year the farmer keeps seeds from the best plants and plants them again. After many years the crop is much stronger.</div>\n<h3>The words of a GA, with a picture for each</h3>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Meaning in a GA</th><th>Think of it as</th></tr>\n<tr><td><b>Population</b></td><td>A group of possible answers</td><td>A crowd of hikers</td></tr>\n<tr><td><b>Chromosome</b></td><td>One answer, written as a string</td><td>One person's DNA code</td></tr>\n<tr><td><b>Gene</b></td><td>One part of a chromosome</td><td>One letter of the code</td></tr>\n<tr><td><b>Fitness</b></td><td>A score of how good an answer is</td><td>A survival score</td></tr>\n<tr><td><b>Selection</b></td><td>Choosing good answers as parents</td><td>Picking who has children</td></tr>\n<tr><td><b>Crossover</b></td><td>Mixing two parents to make children</td><td>A child gets features from mum and dad</td></tr>\n<tr><td><b>Mutation</b></td><td>Randomly changing a gene</td><td>A rare random change in DNA</td></tr>\n<tr><td><b>Generation</b></td><td>One full cycle of the algorithm</td><td>One generation of a family</td></tr></table></div>\n<h3>How an answer becomes a chromosome</h3>\n<p>Computers write numbers with 0s and 1s (binary). Each position has a <b>place value</b>. From the right they are 1, 2, 4, 8, 16, each double the one before. A bit of 1 means \"count this place\" and a bit of 0 means \"ignore it\".</p>\n<div class=\"wrap\"><table><tr><th>Place value</th><td>16</td><td>8</td><td>4</td><td>2</td><td>1</td></tr><tr><th>Chromosome 10010</th><td class=\"bits\">1</td><td class=\"bits\">0</td><td class=\"bits\">0</td><td class=\"bits\">1</td><td class=\"bits\">0</td></tr><tr><th>Bit &times; place value</th><td>16</td><td>0</td><td>0</td><td>2</td><td>0</td></tr></table></div>\n<p>So 10010 stands for 16 + 0 + 0 + 2 + 0 = <b>18</b>. Other examples: 00111 = 4 + 2 + 1 = 7. 10000 = 16. 00010 = 2. Each 0 or 1 is a <b>gene</b>.</p>\n<p><b>Why 5 genes?</b> With n bits we can make 2<sup>n</sup> different numbers. 2<sup>5</sup> = 32 numbers, which covers 0 to 31.</p>\n<div class=\"why\">Some books call the string the <b>chromosome</b> (genotype) and call the real solution you get after decoding it the <b>phenotype</b>. Here, 10010 is the chromosome and 18 is the solution it stands for.</div>\n<details><summary>Check yourself 1</summary><p>Decode 01101. <b>Answer:</b> 8 + 4 + 1 = 13.</p></details>\n<details><summary>Check yourself 2</summary><p>How many genes do we need to write the numbers 0 to 31? <b>Answer:</b> 5, because 2<sup>5</sup> = 32.</p></details>"}, {"i": "🔁", "n": "The GA loop", "h": "<h2>Step 4: The GA loop</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Make random answers. Then repeat: select, crossover, mutate, replace.</div><div class=\"r\"><b>🧪 Example:</b> Population 2, 7, 16, 18. The fitter ones are more likely to be picked as parents.</div><div class=\"r\"><b>✅ Remember:</b> Selection = who. Crossover = mix. Mutation = surprise.</div></div>\n<div class=\"one\">A GA is a loop. Each trip around the loop is one <b>generation</b>.</div>\n<div class=\"flow\"><div class=\"chip\">1. Decide the population size</div><span class=\"arr\">▼</span><div class=\"chip\">2. Decide how to write a chromosome</div><span class=\"arr\">▼</span><div class=\"chip\">3. Decide the fitness formula</div><span class=\"arr\">▼</span>\n<div class=\"chip d\">4.1 Selection: pick two good parents</div><span class=\"arr\">▼</span><div class=\"chip d\">4.2 Crossover: make children</div><span class=\"arr\">▼</span><div class=\"chip d\">4.3 Mutation: randomly change genes</div><span class=\"arr\">▼</span><div class=\"chip\">More children to make? Yes: go back to 4.1</div><span class=\"arr\">▼</span><div class=\"chip\">5. The children become the new population</div><span class=\"arr\">▼</span><div class=\"chip\">Stopping rule met? No: repeat. Yes: STOP</div></div>\n<h3>Why each step exists</h3>\n<ul><li><b>Selection</b> pushes the group toward good answers. Without it, the search is just random.</li><li><b>Crossover</b> combines good parts of two good answers. Two good answers together may make an even better one.</li><li><b>Mutation</b> adds fresh variety so the group does not get stuck with the same ideas.</li></ul>\n<h3>Setting up (steps 1 to 3)</h3>\n<p><b>Step 1: population size N</b> is how many chromosomes are in the group. Too small means too little variety and the GA gets stuck. Too large means each generation takes longer. Real GAs often use tens or hundreds. In this lesson we use N = 4 so you can do the sums on paper.</p>\n<p><b>The labels you may see:</b> N is the initial population. <b>G0</b> is generation 0 (the first random group), <b>G1</b> is the group after one cycle, <b>G2</b> after two cycles, and so on. A chromosome is written x = (x1, x2, ..., x6): each x with a small number is one gene, which is one decision variable. And <b>z = f(x)</b> is that chromosome's fitness.</p>\n<p><b>Step 2: how to write a chromosome</b> depends on the problem:</p>\n<div class=\"wrap\"><table><tr><th>Problem</th><th>Chromosome</th><th>Why this form</th></tr>\n<tr><td>Maximize x&sup2; for x from 0 to 31</td><td class=\"bits\">10010 (5 bits)</td><td>5 bits cover 0 to 31</td></tr>\n<tr><td>Contact or skip 5 donors</td><td class=\"bits\">1 1 0 1 1</td><td>One yes/no gene per donor</td></tr>\n<tr><td>Order of 6 cities (travelling salesman)</td><td>Random keys (see Special cases)</td><td>Always gives a valid route</td></tr>\n<tr><td>Continuous settings like speed or temperature</td><td>Real numbers: (0.25, 1.73, 4.62, 2.15)</td><td>The variables are naturally continuous</td></tr></table></div>\n<p><b>Step 3: the fitness formula</b> must give a <b>higher score to a better answer</b>. For x&sup2;, fitness = x&sup2;. For a shortest-route problem we want a small distance, so a common trick is fitness = 1 &divide; total distance. A 100 km route gives 1 &divide; 100 = 0.01 and an 80 km route gives 1 &divide; 80 = 0.0125, so the shorter route scores higher.</p>\n<details><summary>Check yourself 1</summary><p>Which GA step makes sure the group improves instead of searching randomly? <b>Answer:</b> Selection.</p></details>\n<details><summary>Check yourself 2</summary><p>For a shortest-route problem, why use fitness = 1 &divide; distance? <b>Answer:</b> A shorter route gives a bigger number, so a better route gets a higher fitness.</p></details>"}, {"i": "🎡", "n": "Selection", "h": "<h2>Step 5: Selection, choosing the parents</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Better answers get a bigger chance of becoming parents.</div><div class=\"r\"><b>🧪 Example:</b> Fitness 4, 49, 256, 324 (total 633). The best has 324 &divide; 633 = 51.2% of the wheel.</div><div class=\"r\"><b>✅ Remember:</b> Probability = fitness &divide; total fitness.</div></div>\n<div class=\"one\">Our group (N = 4) is 00010, 00111, 10000 and 10010. We call them A, B, C and D.</div>\n<h3>First, score every chromosome</h3>\n<div class=\"wrap\"><table><tr><th>Chromosome</th><th>Decode to x</th><th>Fitness = x &times; x</th></tr><tr><td>A 00010</td><td>2</td><td>4</td></tr><tr><td>B 00111</td><td>4 + 2 + 1 = 7</td><td>49</td></tr><tr><td>C 10000</td><td>16</td><td>256</td></tr><tr><td>D 10010</td><td>16 + 2 = 18</td><td>324</td></tr></table></div>\n<h3>Method 1: the roulette wheel</h3>\n<p>Imagine a wheel where each answer has a slice. A better fitness means a bigger slice, so a better chance of being picked. Even weak answers keep a small chance, which keeps the group varied.</p>\n<div class=\"fm\">P(i) = f(i) &divide; F</div>\n<p>P(i) is the chance of picking answer i, f(i) is its fitness, and F is the total fitness. Here F = 4 + 49 + 256 + 324 = <b>633</b>.</p>\n<ul><li>P(A) = 4 &divide; 633 = 0.0063, which is <b>0.6%</b></li><li>P(B) = 49 &divide; 633 = 0.0774, which is <b>7.7%</b></li><li>P(C) = 256 &divide; 633 = 0.4044, which is <b>40.4%</b></li><li>P(D) = 324 &divide; 633 = 0.5118, which is <b>51.2%</b></li></ul>\n<p>Check: the shares add up to about 100%. D and C have the biggest slices because their x is large.</p>\n<h3>How a computer spins the wheel</h3>\n<p>A computer cannot spin a wheel. It lines the slices up on a ruler from 0 to 1 using a <b>running total</b>, then picks a random number r between 0 and 1. Whoever owns that spot on the ruler is picked.</p>\n<div class=\"wrap\"><table><tr><th>Chromosome</th><th>P</th><th>Running total</th><th>Owns this part of the ruler</th></tr><tr><td>A</td><td>0.0063</td><td>0.0063</td><td>0 to 0.0063</td></tr><tr><td>B</td><td>0.0774</td><td>0.0063 + 0.0774 = 0.0837</td><td>0.0063 to 0.0837</td></tr><tr><td>C</td><td>0.4044</td><td>0.0837 + 0.4044 = 0.4881</td><td>0.0837 to 0.4881</td></tr><tr><td>D</td><td>0.5118</td><td>0.4881 + 0.5118 = 1.0</td><td>0.4881 to 1.0</td></tr></table></div>\n<ul><li>r = 0.30 is between 0.0837 and 0.4881, so <b>C</b> is picked.</li><li>r = 0.75 is between 0.4881 and 1.0, so <b>D</b> is picked.</li><li>r = 0.05 is between 0.0063 and 0.0837, so <b>B</b> is picked.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: a lucky draw.</b> Fitter answers hold more tickets, so they win more often. But even a few tickets can win.</div>\n<h3>Method 2: binary tournament</h3>\n<p>Pick two answers at random. The one with the better fitness wins. Example: A (fitness 4) against C (fitness 256). C wins. No division is needed.</p>\n<details><summary>Check yourself 1</summary><p>Fitness values are 10, 30 and 60. What is the roulette chance of 30? <b>Answer:</b> Total = 100, so 30 &divide; 100 = 0.30 = 30%.</p></details>\n<details><summary>Check yourself 2</summary><p>Running totals are A 0.1, B 0.4, C 1.0. Which is picked for r = 0.25? <b>Answer:</b> B, because 0.25 is between 0.1 and 0.4.</p></details>"}, {"i": "✂️", "n": "Crossover", "h": "<h2>Step 6: Crossover, how two parents make children</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Cut two parents at the same place and swap the tails.</div><div class=\"r\"><b>🧪 Example:</b> 10|010 and 00|111 give 10111 and 00010.</div><div class=\"r\"><b>✅ Remember:</b> Children get pieces of both parents. Crossover only reshuffles genes that already exist.</div></div>\n<div class=\"one\">Crossover takes <b>two</b> parents, cuts both at the same place, and swaps the pieces after the cut. This makes <b>two</b> children.</div>\n<div class=\"an\">🌍 <b>Analogy: two answer sheets.</b> Student 1 got the first half of the exam right. Student 2 got the second half right. You make a new sheet with the first half from student 1 and the second half from student 2. It could score higher than both.</div>\n<h3>Why does it help?</h3>\n<p>Take D = 10010 (x = 18) and B = 00111 (x = 7). D is strong because its first gene is 1, worth 16. B is weak overall, but its last three genes (111) are worth 7. Put D's strong front with B's strong back and you get 10111 = 23, better than both parents. Crossover <b>combines the good parts of two answers</b>.</p>\n<h3>The 4 steps</h3>\n<ol><li>Take two parents (from selection).</li><li>Choose a <b>cut point</b>, a random place between two genes. A chromosome with 5 genes has 4 possible cut points.</li><li>Split both parents at the cut into a <b>front</b> and a <b>back</b>.</li><li>Swap the backs. Child 1 = front of Parent 1 + back of Parent 2. Child 2 = front of Parent 2 + back of Parent 1.</li></ol>\n<h3>Worked example</h3>\n<p>Parent 1 = <span class=\"bits\"><span class=\"f1\">001</span> | <span class=\"f1\">100</span></span> and Parent 2 = <span class=\"bits\"><span class=\"f2\">010</span> | <span class=\"f2\">000</span></span>, cut after gene 3. Purple = from Parent 1, pink = from Parent 2.</p>\n<ul><li>Child 1 = <span class=\"bits\"><span class=\"f1\">001</span><span class=\"f2\">000</span></span></li><li>Child 2 = <span class=\"bits\"><span class=\"f2\">010</span><span class=\"f1\">100</span></span></li></ul>\n<p>Another: D = 10|010 and B = 00|111, cut after gene 2. Child 1 = 10 + 111 = 10111 = 16 + 4 + 2 + 1 = <b>23</b> (fitness 529). Child 2 = 00 + 010 = 00010 = <b>2</b> (fitness 4). Child 1 beats both parents (324 and 49).</p>\n<h3>Does the cut point matter? Yes</h3>\n<p>Take P1 = 11001 (x = 25, fitness 625) and P2 = 00110 (x = 6, fitness 36). Try every cut:</p>\n<div class=\"wrap\"><table><tr><th>Cut after gene</th><th>Child 1</th><th>Child 2</th><th>Fitness of the children</th></tr>\n<tr><td>1</td><td class=\"bits\">1|0110 = 22</td><td class=\"bits\">0|1001 = 9</td><td>484 and 81</td></tr>\n<tr><td>2</td><td class=\"bits\">11|110 = 30</td><td class=\"bits\">00|001 = 1</td><td>900 and 1</td></tr>\n<tr><td>3</td><td class=\"bits\">110|10 = 26</td><td class=\"bits\">001|01 = 5</td><td>676 and 25</td></tr>\n<tr><td>4</td><td class=\"bits\">1100|0 = 24</td><td class=\"bits\">0011|1 = 7</td><td>576 and 49</td></tr></table></div>\n<p>The same parents give different children for different cuts. With the cut after gene 2, a child scored 900, better than both parents (625 and 36). The cut is chosen at random, and no cut is always best.</p>\n<h3>Limits of crossover</h3>\n<ul><li><b>It only reshuffles genes that already exist.</b> If every parent has 0 in gene 5, every child will too. (This is why we need mutation.)</li><li><b>Identical fronts give copies.</b> If both parents share the same genes before the cut, the children look like the parents and nothing new appears.</li><li><b>It can break some problems.</b> In the travelling salesman problem it makes invalid routes (see Special cases).</li></ul>\n<details><summary>Check yourself 1</summary><p>P1 = 101|10 and P2 = 010|01, cut after gene 3. Find the children and their x. <b>Answer:</b> Child 1 = 101 + 01 = 10101 = 21. Child 2 = 010 + 10 = 01010 = 10.</p></details>\n<details><summary>Check yourself 2</summary><p>Why can crossover alone never create a 1 in gene 5 if every parent has 0 there? <b>Answer:</b> It only swaps genes that already exist.</p></details>"}, {"i": "🎲", "n": "Mutation", "h": "<h2>Step 7: Mutation, a small random change</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Randomly flip a gene (0 to 1, or 1 to 0).</div><div class=\"r\"><b>🧪 Example:</b> 10111 (23) becomes 11111 (31).</div><div class=\"r\"><b>✅ Remember:</b> Mutation is rare and small. It adds new variety and helps escape local optima.</div></div>\n<div class=\"one\">Mutation randomly changes one or a few genes of a child. In a binary chromosome it flips 0 to 1 or 1 to 0.</div>\n<div class=\"an\">🌍 <b>Analogy: a typing mistake while copying.</b> You copy a recipe by hand and write 2 spoons of sugar instead of 1. Usually the dish gets worse. Once in a while it becomes a new favourite. In nature mutation is a small random change in DNA, and sometimes it helps survival.</div>\n<h3>How it works</h3>\n<ol><li>Take a child made by crossover.</li><li>Pick a gene at random. (Usually each gene has only a small chance of being picked.)</li><li><b>Flip it.</b> 0 becomes 1, and 1 becomes 0.</li></ol>\n<p><b>Example:</b> Child = 001000. Flip gene 4: 001<span class=\"hi\">1</span>00. Before: 001000 = 8, fitness 64. After: 001100 = 12, fitness 144. It <b>improved</b>.</p>\n<h3>Which gene you flip matters</h3>\n<p>Take 10111 (x = 23, fitness 529) and flip each gene, one at a time:</p>\n<div class=\"wrap\"><table><tr><th>Gene flipped</th><th>New chromosome</th><th>x</th><th>Fitness</th><th>Result</th></tr>\n<tr><td>1 (worth 16)</td><td class=\"bits\">00111</td><td>7</td><td>49</td><td>Much worse</td></tr>\n<tr><td>2 (worth 8)</td><td class=\"bits\">11111</td><td>31</td><td>961</td><td>Much better</td></tr>\n<tr><td>3 (worth 4)</td><td class=\"bits\">10011</td><td>19</td><td>361</td><td>Worse</td></tr>\n<tr><td>4 (worth 2)</td><td class=\"bits\">10101</td><td>21</td><td>441</td><td>Worse</td></tr>\n<tr><td>5 (worth 1)</td><td class=\"bits\">10110</td><td>22</td><td>484</td><td>Slightly worse</td></tr></table></div>\n<p>Three lessons: (1) mutation can <b>help or hurt</b>. (2) Flipping a high-value gene changes the answer a lot. (3) A bad mutation is not a disaster: the weak child scores low, so selection rarely picks it as a parent, and it fades away.</p>\n<h3>Why we really need mutation</h3>\n<p>Imagine the group 10010 (18), 10100 (20), 11000 (24) and 10000 (16). The last gene of all four is <b>0</b>. Crossover only swaps genes between parents, so every child also has 0 in the last gene, forever. The best the group can reach is 11110 = 30. The true best answer 11111 = 31 needs a 1 in the last gene, and <b>no parent has one to give</b>. Only mutation can create a brand-new gene value: flip the last gene once and the group can reach 31.</p>\n<div class=\"an\">🌍 <b>Analogy: a library where everyone has read every book.</b> Mixing chapters from those books (crossover) never gives a completely new idea. A new author writing a brand-new page (mutation) can.</div>\n<h3>Not too much, not too little</h3>\n<ul><li><b>Too little:</b> the group loses variety and gets stuck.</li><li><b>Too much:</b> good answers are destroyed again and again, and the GA becomes a random guess.</li></ul>\n<p>If genes are real numbers, such as (0.25, 1.73, 4.62, 2.15), we cannot flip a bit. We nudge a gene to a slightly higher or lower value, such as 4.62 to 4.80.</p>\n<details><summary>Check yourself 1</summary><p>Flip gene 3 of 11001. <b>Answer:</b> Gene 3 is 0, so it becomes 1: 11101 = 29 (fitness 841, up from 25 and 625).</p></details>\n<details><summary>Check yourself 2</summary><p>Why can crossover alone not find 11111 from the group above? <b>Answer:</b> No parent has a 1 in the last gene, and crossover cannot create new gene values. Only mutation can.</p></details>"}, {"i": "🧮", "n": "One full round", "h": "<h2>Step 8: One full round, put together</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Score, select, cross, mutate, replace. Then compare the new group with the old.</div><div class=\"r\"><b>🧪 Example:</b> Average fitness goes from 158.25 to 517.5 in one round.</div><div class=\"r\"><b>✅ Remember:</b> If the average fitness rises, the whole group is improving.</div></div>\n<div class=\"one\">We now follow the group A, B, C, D (2, 7, 16, 18) through one generation.</div>\n<ol><li><b>Score them.</b> Fitness: 4, 49, 256, 324. Total 633. Average = 633 &divide; 4 = <b>158.25</b>. Best = 324.</li><li><b>Select parents.</b> D and B are picked by the roulette wheel (D is very likely, B less so).</li><li><b>Crossover</b> D = 10|010 and B = 00|111 to get 10111 (23) and 00010 (2).</li><li><b>Mutate.</b> Flip gene 2 of 10111 to get 11111 (31).</li><li><b>Repeat</b> selection, crossover and mutation until the new group is full. One possible new group is {31, 23, 18, 16}.</li></ol>\n<div class=\"wrap\"><table><tr><th></th><th>Generation 1</th><th>New generation</th></tr><tr><td>Chromosomes (x)</td><td>2, 7, 16, 18</td><td>31, 23, 18, 16</td></tr><tr><td>Fitness</td><td>4, 49, 256, 324</td><td>961, 529, 324, 256</td></tr><tr><td>Total fitness</td><td>633</td><td>961 + 529 + 324 + 256 = 2070</td></tr><tr><td>Average fitness</td><td>633 &divide; 4 = 158.25</td><td>2070 &divide; 4 = 517.5</td></tr><tr><td>Best fitness</td><td>324</td><td>961</td></tr></table></div>\n<p>(Real runs use random numbers, so the exact new group changes each time. This is one possible result.) Both the best and the average went up, so the group improved.</p>\n<h3>The fitness graph</h3>\n<ul><li>At the start, fitness is <b>low</b>.</li><li>As generations pass, better answers appear and fitness <b>rises</b>.</li><li>Later the improvement becomes tiny and the curve goes flat. This is called <b>convergence</b>: the GA has settled on a good answer.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: learning a new sport.</b> You improve quickly in the first weeks. Later each extra week makes only a small difference.</div>\n<details><summary>Check yourself 1</summary><p>A group has fitness 10, 20, 30, 40. What is the average fitness? <b>Answer:</b> (10 + 20 + 30 + 40) &divide; 4 = 25.</p></details>\n<details><summary>Check yourself 2</summary><p>What does a flat fitness graph show? <b>Answer:</b> The GA has converged: it has settled on a good answer and further improvement is tiny.</p></details>"}, {"i": "⛰️", "n": "Best vs good enough", "h": "<h2>Step 9: Best, nearly best, and when to stop</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A global optimum is the best of all. A local optimum is the best nearby, but not overall.</div><div class=\"r\"><b>🧪 Example:</b> Mount Everest versus a small hill in the fog.</div><div class=\"r\"><b>✅ Remember:</b> Stop at a maximum number of generations, a target fitness, or no improvement for several generations.</div></div>\n<div class=\"grid\"><div class=\"L a1\"><b>🏔️ Global optimum</b><br>The best answer among ALL answers.</div><div class=\"L a2\"><b>⛰️ Local optimum</b><br>Better than its neighbours, but NOT the best overall.</div><div class=\"L a3\"><b>🥈 Near optimum</b><br>Very close to the global optimum but not exactly the best.</div></div>\n<div class=\"an\">🌍 <b>Analogy: hiking in fog.</b> You climb until every step goes down. You think you are at the top, but you are on a small hill (local optimum). Mount Everest (global optimum) is somewhere else. A near optimum is a peak a few metres below the very top.</div>\n<h3>How GA escapes a small hill</h3>\n<p>Use 3-bit chromosomes for x = 0 to 7 with these fitness values: x = 0: 1, 1: 3, 2: 6, 3: 3, 4: 2, 5: 5, 6: 9, 7: 4. The small hill is x = 2 (fitness 6). The highest peak is x = 6 (fitness 9). Suppose the whole group sits near the small hill: 001 (1), 010 (2), 011 (3). All three start with 0. Crossover can never make a first gene of 1, so it can never reach 6 = 110. <b>Mutation</b> flips the first gene of 010 to get 110 = 6, fitness 9, and the group climbs a higher peak.</p>\n<p>A GA also keeps a whole population spread over the landscape, and roulette selection gives weaker answers a small chance. These keep variety and help find the global optimum.</p>\n<h3>When does the GA stop?</h3>\n<ul><li>A <b>maximum number of generations</b> is reached (like a time limit).</li><li>A <b>desired fitness</b> is reached (like hitting a target score).</li><li>There is <b>no improvement for several generations</b> (progress has stalled).</li></ul>\n<details><summary>Check yourself 1</summary><p>What is a local optimum? <b>Answer:</b> An answer better than its neighbours but not the best overall.</p></details>\n<details><summary>Check yourself 2</summary><p>Name two ways to decide when a GA stops. <b>Answer:</b> Maximum generations reached, desired fitness reached, or no improvement for several generations.</p></details>"}, {"i": "🗺️", "n": "Special cases", "h": "<h2>Step 10: Special cases</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Some problems need special tools: travelling salesman (Random Keys), real numbers, and several goals at once.</div><div class=\"r\"><b>🧪 Example:</b> Keys 0.15, 0.32, 0.48 ... sorted give the route 4, 6, 5 ...</div><div class=\"r\"><b>✅ Remember:</b> Random Keys always give a valid route.</div></div>\n<h3>1. The travelling salesman problem (TSP)</h3>\n<div class=\"one\">TSP: visit every city once, in an order that makes the total distance as small as possible. A chromosome is an order of cities, such as 1 4 3 6 5 2.</div>\n<p><b>Why normal crossover fails.</b> P1 = 1 4 3 | 6 5 2 and P2 = 3 2 1 | 6 4 5. Swapping tails gives the child 1 4 3 | 6 4 5. City 4 appears twice and city 2 is missing. A route must visit each city <b>exactly once</b>, so this child is invalid.</p>\n<h3>2. Random Keys: the fix</h3>\n<p>Give every city a random number between 0 and 1, its <b>key</b>. Then <b>sort the keys from smallest to largest</b> and read off the cities in that order. That order is the route, and it can never repeat or miss a city.</p>\n<div class=\"wrap\"><table><tr><th>City</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th></tr><tr><td>Random key (P1)</td><td>0.97</td><td>0.68</td><td>0.72</td><td>0.15</td><td>0.48</td><td>0.32</td></tr></table></div>\n<p>Sorted: 0.15 (city 4), 0.32 (city 6), 0.48 (city 5), 0.68 (city 2), 0.72 (city 3), 0.97 (city 1). <b>Route: 4, 6, 5, 2, 3, 1.</b></p>\n<p>Another parent P2 has keys 0.62, 0.38, 0.87, 0.92, 0.16, 0.32. Sorted: 0.16 (city 5), 0.32 (city 6), 0.38 (city 2), 0.62 (city 1), 0.87 (city 3), 0.92 (city 4). <b>Route: 5, 6, 2, 1, 3, 4.</b></p>\n<p><b>Crossover now works.</b> Cross over the keys, cutting after position 3:</p>\n<ul><li>C1 keys = first 3 of P1 + last 3 of P2 = 0.97, 0.68, 0.72, 0.92, 0.16, 0.32. Sorted: 0.16 (city 5), 0.32 (6), 0.68 (2), 0.72 (3), 0.92 (4), 0.97 (1). Route: <b>5, 6, 2, 3, 4, 1</b>.</li><li>C2 keys = first 3 of P2 + last 3 of P1 = 0.62, 0.38, 0.87, 0.15, 0.48, 0.32. Sorted: 0.15 (city 4), 0.32 (6), 0.38 (2), 0.48 (5), 0.62 (1), 0.87 (3). Route: <b>4, 6, 2, 5, 1, 3</b>.</li></ul>\n<p>Both children are valid routes.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> students pick random lottery numbers and then line up from smallest to largest. Everyone appears exactly once, however the numbers fall.</div>\n<h3>3. Real-coded GA</h3>\n<p>Instead of 0s and 1s, genes are real numbers, such as (0.25, 1.73, 4.62, 2.15). Use it when the variables are naturally continuous, like speed, length or temperature.</p>\n<h3>4. Combinatorial and multi-objective optimization</h3>\n<ul><li><b>Combinatorial optimization:</b> finding the best from a huge number of combinations, such as the shortest route, scheduling, travelling salesman, resource allocation and job assignment.</li><li><b>Multi-objective optimization:</b> chasing two or more goals at the same time, such as minimizing both cost and CO&#8322; emissions. These often fight each other: the cheapest option may pollute more. So there is no single best answer, only good trade-offs.</li></ul>\n<div class=\"an\">🌍 <b>Analogy:</b> choosing a phone. You want it cheap and you want a great camera. The cheapest has a poor camera, and the best camera costs more. You choose a balance.</div>\n<details><summary>Check yourself 1</summary><p>Keys for cities 1 to 4 are 0.9, 0.2, 0.5, 0.1. What is the route? <b>Answer:</b> Sort: 0.1 (city 4), 0.2 (city 2), 0.5 (city 3), 0.9 (city 1). Route: 4, 2, 3, 1.</p></details>\n<details><summary>Check yourself 2</summary><p>Why does Random Keys always give a valid route? <b>Answer:</b> Each city has exactly one key, so sorting lists every city exactly once.</p></details>"}, {"i": "📐", "n": "Formulas", "h": "<h2>All the formulas in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Every formula in this lesson is a short sentence in symbols.</div><div class=\"r\"><b>🧪 Example:</b> P(i) = f(i) &divide; F. For D: 324 &divide; 633 = 51.2%.</div><div class=\"r\"><b>✅ Remember:</b> Learn what each letter means, not just the shape.</div></div>\n<div class=\"wrap\"><table><tr><th>What</th><th>Formula</th><th>Meaning of the symbols</th></tr>\n<tr><td>Decode binary</td><td>x = sum of (bit &times; place value)</td><td>Place values from the right: 1, 2, 4, 8, 16, ...</td></tr>\n<tr><td>Genes needed</td><td>2<sup>n</sup> &ge; number of values</td><td>n = number of genes. 32 values need n = 5.</td></tr>\n<tr><td>Fitness (this lesson)</td><td>f(x) = x&sup2;</td><td>The score of an answer. The formula changes with the problem.</td></tr>\n<tr><td>Fitness for shortest route</td><td>1 &divide; total distance</td><td>A shorter route scores higher</td></tr>\n<tr><td>Total fitness</td><td>F = f(1) + f(2) + ... + f(N)</td><td>N = population size</td></tr>\n<tr><td>Selection probability</td><td>P(i) = f(i) &divide; F</td><td>Share of the wheel for answer i</td></tr>\n<tr><td>Running total</td><td>C(i) = P(1) + ... + P(i)</td><td>Used with a random number r</td></tr>\n<tr><td>Average fitness</td><td>F &divide; N</td><td>Shows if the whole group improves</td></tr>\n<tr><td>Crossover (cut after k genes)</td><td>Child 1 = P1[first k] + P2[rest]<br>Child 2 = P2[first k] + P1[rest]</td><td>P1, P2 = parents</td></tr>\n<tr><td>Mutation</td><td>flip 0 and 1 at a chosen gene</td><td>A small random change</td></tr>\n<tr><td>Random keys</td><td>sort keys ascending, read the city numbers</td><td>The smallest key goes first</td></tr></table></div>\n<h3>Method for a GA calculation question</h3>\n<ol><li>Decode each chromosome to x.</li><li>Calculate fitness f(x).</li><li>Add them to get the total F.</li><li>Calculate P(i) = f(i) &divide; F. Check they add to 1.</li><li>Use selection to pick parents.</li><li>Do crossover at the given cut. Then mutation at the given gene.</li><li>Decode the children and calculate their fitness. Say whether it improved.</li></ol>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Chromosome = one answer written as a string like 10010.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Optimization</b></td><td>Finding the best answer</td></tr>\n<tr><td><b>Objective function</b></td><td>The score we want to make big or small</td></tr>\n<tr><td><b>Constraint</b></td><td>A limit we must obey</td></tr>\n<tr><td><b>Slope</b></td><td>How steep the ground is at one spot</td></tr>\n<tr><td><b>Binary</b></td><td>Numbers written with only 0 and 1</td></tr>\n<tr><td><b>Population (N)</b></td><td>The group of answers</td></tr>\n<tr><td><b>Chromosome, gene</b></td><td>One answer as a string / one position in it</td></tr>\n<tr><td><b>Fitness</b></td><td>The score of an answer</td></tr>\n<tr><td><b>Generation (G0, G1...)</b></td><td>One cycle of the algorithm</td></tr>\n<tr><td><b>Crossover, mutation</b></td><td>Mix two parents / randomly change a gene</td></tr>\n<tr><td><b>Convergence</b></td><td>The improvement becomes tiny because the GA has settled</td></tr>\n<tr><td><b>Global / local optimum</b></td><td>The best of all / the best nearby only</td></tr>\n<tr><td><b>Combinatorial</b></td><td>Choosing the best from a huge number of combinations</td></tr>\n<tr><td><b>Multi-objective</b></td><td>Two or more goals at once</td></tr></table></div>"}];const M=[["What is the objective function called in a GA?", ["Gene", "Fitness function", "Mutation", "Population"], 1, "In GA the objective function is the fitness function. It scores each solution."], ["Which is NOT one of the 3 things every optimization problem needs?", ["Decision variables", "Objective function", "Constraints", "Roulette wheel"], 3, "Roulette wheel is a selection method in GA, not part of the problem definition."], ["Why can't we always use calculus (f'(x) = 0) to optimize?", ["It is too old", "We often do not know the formula f(x)", "It only works for GA", "Computers cannot do it"], 1, "In many real problems the function is unknown, so we cannot find its slope."], ["In a GA, a group of possible solutions is called a:", ["Gene", "Generation", "Population", "Fitness"], 2, "Population = the whole crowd of solutions."], ["In roulette wheel selection, the chance of picking solution i is:", ["Equal for all", "Its fitness / total fitness", "1 / population size", "Random only"], 1, "A higher fitness gives a bigger slice and a higher chance."], ["In binary tournament selection, you:", ["Pick the 2 worst", "Pick two at random and keep the one with better fitness", "Sort the whole population", "Flip all bits"], 1, "It is a duel between two random chromosomes."], ["Crossover does what?", ["Flips a random gene", "Combines parts of two parents to make children", "Decodes the chromosome", "Counts the generations"], 1, "Parts after the crossover point are exchanged."], ["Parents P1 = 001|100 and P2 = 010|000. With a cut after gene 3, C1 is:", ["001000", "010100", "001100", "010000"], 0, "C1 = first 3 genes of P1 (001) + last 3 genes of P2 (000) = 001000."], ["Mutation is used mainly to:", ["Make the algorithm slower", "Add new variety and avoid local optima", "Choose parents", "Stop the algorithm"], 1, "It keeps diversity so the GA does not get stuck."], ["Decode the chromosome 10010 as a binary number.", ["10", "16", "18", "20"], 2, "16 + 2 = 18."], ["With fitness x², chromosomes 2, 7, 16, 18 have total fitness:", ["633", "600", "580", "341"], 0, "4 + 49 + 256 + 324 = 633."], ["Which chromosome has the highest roulette chance in that example?", ["x = 2", "x = 7", "x = 16", "x = 18"], 3, "18² = 324 is the largest, 324/633 is about 51%."], ["A local optimum is:", ["The best overall solution", "Better than its neighbours but not the best overall", "The worst solution", "Equal to the global optimum"], 1, "Like a small hill that is not the highest mountain."], ["A solution very close to the global optimum but not exactly the best is a:", ["Local optimum", "Near optimum", "Global optimum", "Worst case"], 1, "That is the definition of near optimum."], ["Which is NOT a stopping criterion?", ["Maximum generations reached", "Desired fitness achieved", "No improvement for several generations", "The first mutation happens"], 3, "Mutation happens every generation. It is not a reason to stop."], ["Why does normal crossover fail for TSP?", ["It is too slow", "It can create routes with repeated or missing cities", "It only works for numbers", "It has no cut point"], 1, "A route must visit each city exactly once."], ["In the Random Keys algorithm, you get the city order by:", ["Sorting the keys in ascending order", "Adding the keys", "Choosing the biggest key only", "Using a stack"], 0, "Smallest key first, giving a valid order every time."], ["Keys for cities 1 to 4 are 0.9, 0.2, 0.5, 0.1. The route is:", ["1,2,3,4", "4,2,3,1", "2,4,3,1", "1,3,2,4"], 1, "Ascending keys: 0.1 (city 4), 0.2 (city 2), 0.5 (city 3), 0.9 (city 1)."], ["A real-coded GA is best when:", ["Variables are only yes/no", "Variables are naturally continuous numbers", "There is no fitness", "The population is 1"], 1, "Genes are real numbers like (0.25, 1.73, 4.62)."], ["Minimizing cost AND emissions at the same time is:", ["Single objective", "Multi-objective optimization", "Random search", "Classification"], 1, "Two or more objectives together."], ["Decode the chromosome 01101.", ["11", "13", "15", "9"], 1, "8 + 4 + 1 = 13 (place values 16, 8, 4, 2, 1 with bits 0, 1, 1, 0, 1)."], ["How many genes (bits) are needed to represent the numbers 0 to 31?", ["4", "5", "6", "31"], 1, "2^5 = 32 values, so 5 bits."], ["With f(x) = x^2, the fitness of chromosome 01101 is:", ["13", "26", "169", "196"], 2, "01101 = 13 and 13 x 13 = 169."], ["Fitness values are 4, 49, 256, 324 (total 633). The selection probability of 256 is about:", ["7.7%", "25.6%", "40.4%", "51.2%"], 2, "256 / 633 = 0.4044, which is about 40.4%."], ["Cumulative values are A 0.0063, B 0.0837, C 0.4881, D 1.0. A random number r = 0.30 picks:", ["A", "B", "C", "D"], 2, "0.30 is above 0.0837 and below 0.4881, so it falls in C's range."], ["P1 = 10110 and P2 = 01001. Cut after gene 2. Child 1 is:", ["10001", "01110", "10110", "11001"], 0, "Child 1 = front 2 genes of P1 (10) + last 3 genes of P2 (001) = 10001."], ["Generation 1 has fitness 4, 49, 256, 324. Its average fitness is:", ["158.25", "316.5", "633", "81"], 0, "Total 633 divided by 4 chromosomes = 158.25."], ["Flip gene 3 (from the left) of 10010. The new x is:", ["18", "20", "22", "26"], 2, "10010 becomes 10110 = 16 + 4 + 2 = 22."], ["A population that is too small mostly causes:", ["Slow calculation", "Too little variety, so the GA can get stuck", "Perfect results", "No fitness"], 1, "Few chromosomes means few different ideas."], ["You must choose 5 donors to contact or skip. How many genes does the chromosome need?", ["1", "5", "10", "32"], 1, "One yes/no gene per donor."], ["For TSP we want a short route but GA needs a higher fitness for better answers. A common fix is fitness =", ["distance x 2", "1 / total distance", "total distance", "random"], 1, "A shorter distance gives a bigger 1 / distance."], ["P2 keys are 0.62, 0.38, 0.87, 0.92, 0.16, 0.32. The route is:", ["5, 6, 2, 1, 3, 4", "1, 2, 3, 4, 5, 6", "4, 3, 1, 2, 6, 5", "6, 5, 4, 3, 2, 1"], 0, "Sorted keys: 0.16 (5), 0.32 (6), 0.38 (2), 0.62 (1), 0.87 (3), 0.92 (4)."], ["All chromosomes in a group start with gene 1 = 0. Which operator can create a 1 there?", ["Crossover", "Selection", "Mutation", "Decoding"], 2, "Crossover only reshuffles existing genes. Mutation can create a new one."]];const K=[["Explain in your own words how a GA is like evolution in nature.", "A population of solutions is like a group of animals. Fitness decides who survives. Selection picks the fitter ones as parents, crossover mixes their traits in the children, and mutation adds small random changes. Over generations the population gets better, just as species adapt to survive."], ["Why do we use both crossover AND mutation? What if we use only one?", "Crossover mixes good parts of existing solutions, which speeds up improvement. Mutation adds new genes that are not in the population, which keeps variety and helps escape local optima. With only crossover the population can run out of new ideas. With only mutation the search is mostly random and slow."], ["Explain why a GA can be stuck at a local optimum, and how GA features reduce this problem.", "A local optimum is better than its neighbours but not the best overall, so small changes do not improve it. A GA has a population spread over many places, uses mutation for random jumps, and roulette selection gives weaker solutions a small chance too. These keep diversity and help the search find the global optimum."], ["Show how the Random Keys algorithm turns keys 0.40 0.90 0.10 0.60 into a route, and say why it is better than normal crossover for TSP.", "Sort ascending: 0.10 (city 3), 0.40 (city 1), 0.60 (city 4), 0.90 (city 2). Route: 3, 1, 4, 2. Every city appears exactly once, so the route is always valid. Normal crossover can repeat or lose cities."], ["Using x = 2, 7, 16, 18 with fitness x², explain which parents roulette wheel is likely to pick and why.", "Fitness: 4, 49, 256, 324, total 633. Chances: about 1%, 8%, 40%, 51%. So x = 18 and x = 16 are most likely picked because their fitness is highest. x = 2 is rarely picked, but it can be, which keeps some variety."], ["Population 3, 5, 10 with f(x) = x^2. Calculate the roulette probabilities and cumulative values.", "Decode is not needed: x is given. Fitness: 9, 25, 100. Total F = 134. P = 9/134 = 0.067 (6.7%), 25/134 = 0.187 (18.7%), 100/134 = 0.746 (74.6%). Check: 0.067 + 0.187 + 0.746 = 1.0. Cumulative: 0.067, 0.067 + 0.187 = 0.254, 0.254 + 0.746 = 1.0. If r = 0.40, it is above 0.254, so x = 10 is picked."], ["P1 = 11001 and P2 = 00110. Cross over after gene 2, then mutate gene 5 of child 1. Give both children as numbers and fitness.", "Child 1 = 11 + 110 = 11110. Child 2 = 00 + 001 = 00001. Mutate gene 5 of child 1: 11110 becomes 11111. Child 1 = 31, fitness 961. Child 2 = 1, fitness 1. The mutation raised child 1 from 30 (fitness 900) to 31 (fitness 961)."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
