<div class="topbar"><div><h1>Lesson 2: Prompting</h1><div class="sub">How to talk to an AI so you get a clear, useful answer the first time.</div></div><span class="source-tag">Lesson 2 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "✍️", "n": "What is a prompt?", "h": "<h2>Lesson 2: Talking to an AI</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A prompt is the instruction you type to an AI. A clear prompt gets a better answer.</div><div class=\"r\"><b>🧪 Example:</b> \"Write an email\" gives a boring answer. \"Write a 100-word friendly email to a customer about a late delivery\" gives a useful one.</div><div class=\"r\"><b>✅ Remember:</b> The AI cannot read your mind. It only knows what you tell it.</div></div>\n<div class=\"one\">A <b>prompt</b> is the text you type to tell an AI what to do. <b>Prompt engineering</b> means writing it clearly so you get a good answer the first time.</div>\n<h3>Start with a picture</h3>\n<div class=\"an\">🌍 <b>Analogy: taxi directions.</b> If you tell a taxi driver \"take me somewhere\", you get nowhere useful. If you say \"take me to the airport by the fastest road, I have 2 bags\", you get exactly what you need. The AI is the driver. Your prompt is the directions.</div>\n<h3>Vague prompt vs clear prompt</h3>\n<div class=\"two\"><div class=\"bad\"><b>❌ Vague</b><br>\"Write an email about saving money.\"<br><small>The AI does not know who is writing, who will read it, how long it should be or what style to use. So it guesses, and you get a long, dull, generic email.</small></div>\n<div class=\"good\"><b>✅ Clear</b><br>\"You are a friendly finance coach. Write a short email with 3 tips to save money on groceries, for busy college students. Under 150 words, casual tone, bullet points.\"</div></div>\n<p>The clear prompt answers questions the AI would otherwise have to guess: Who am I? What must I do? Who is reading? How long? What style? The next tab turns these questions into a simple memory framework.</p>\n<details><summary>Check yourself 1</summary><p>Why does a vague prompt give a generic answer? <b>Answer:</b> The AI has to guess the missing details, so it gives a general answer.</p></details>\n<details><summary>Check yourself 2</summary><p>What is prompt engineering? <b>Answer:</b> Writing the prompt clearly so the AI gives a good answer the first time.</p></details>"}, {"i": "🧩", "n": "The TRADE framework", "h": "<h2>TRADE: five parts of a great prompt</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> TRADE lists the five things a good prompt tells the AI.</div><div class=\"r\"><b>🧪 Example:</b> Task: write 3 tips. Role: finance coach. Audience: students. Details: under 150 words. Example: a sample tip.</div><div class=\"r\"><b>✅ Remember:</b> Task, Role, Audience, Details, Example.</div></div>\n<div class=\"an\">🌍 <b>Analogy: briefing a new employee.</b> Tell them the <b>task</b>, who they are acting as (<b>role</b>), who the <b>customer</b> is (audience), the <b>rules</b> (details), and show an <b>example</b> of good work. Then they get it right the first time.</div>\n<div class=\"grid\"><div class=\"L a1\"><b class=\"big\">T</b> <b>Task</b> (the WHAT)<br>Use an action verb: write, summarize, draft, analyze, explain.</div>\n<div class=\"L a2\"><b class=\"big\">R</b> <b>Role</b> (the WHO)<br>Give the AI an identity: \"You are a senior engineer\" or \"a 5th grade teacher\". It changes the words and depth of the answer.</div>\n<div class=\"L a3\"><b class=\"big\">A</b> <b>Audience</b> (the WHOM)<br>Who will read it: a beginner or a CEO? This sets how simple or advanced the answer is.</div>\n<div class=\"L a4\"><b class=\"big\">D</b> <b>Details</b> (the RULES)<br>Length, format (bullets, table) and tone (casual, formal).</div>\n<div class=\"L a5\"><b class=\"big\">E</b> <b>Example</b> (the MODEL)<br>Show a sample of the answer you want. This is called <b>few-shot prompting</b>.</div></div>\n<h3>Build a prompt in 5 steps</h3>\n<p>Start with the vague prompt \"Explain photosynthesis\" and add one TRADE part at a time.</p>\n<ol><li><b>Task:</b> Explain photosynthesis.</li><li><b>Role:</b> You are a friendly science teacher. Explain photosynthesis.</li><li><b>Audience:</b> ...for Grade 6 students.</li><li><b>Details:</b> ...in under 120 words, using simple words and 4 bullet points.</li><li><b>Example:</b> ...Use this style: \"Step 1: Sunlight. Leaves catch it.\"</li></ol>\n<p>Each step makes the answer more exact. The final prompt tells the AI who it is, what to do, who is listening, how to format the answer and what it should look like.</p>\n<h3>Zero-shot and few-shot</h3>\n<ul><li><b>Zero-shot prompting:</b> you ask with no examples. \"Say if this review is Positive or Negative: 'Love the camera'.\"</li><li><b>Few-shot prompting:</b> you give one or more solved examples first so the AI copies the pattern.</li></ul>\n<div class=\"tree\">Review: \"Great phone\"          -> Positive\nReview: \"Battery dies fast\"     -> Negative\nReview: \"Love the camera\"       -> ?</div>\n<p>With the two examples above, the AI sees the pattern and answers \"Positive\".</p>\n<details><summary>Check yourself 1</summary><p>In \"You are a vet. Write 5 bullet tips on feeding puppies for first-time owners, under 100 words\", find Role, Task, Audience and Details. <b>Answer:</b> Role: a vet. Task: write 5 tips on feeding puppies. Audience: first-time owners. Details: 5 bullets, under 100 words.</p></details>\n<details><summary>Check yourself 2</summary><p>What is few-shot prompting? <b>Answer:</b> Giving the AI examples of the answer you want so it copies the pattern.</p></details>"}, {"i": "🛠️", "n": "Techniques and practice", "h": "<h2>Prompt engineering techniques, uses and limits</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Five techniques change how you ask: zero-shot, few-shot, chain-of-thought, role and constraint prompting.</div><div class=\"r\"><b>🧪 Example:</b> 'Think step by step' helps the AI show its reasoning.</div><div class=\"r\"><b>✅ Remember:</b> Prompts guide the AI but never guarantee a perfect answer.</div></div>\n<div class=\"one\"><b>Prompt engineering</b> is the process of creating clear and effective inputs for an AI system to guide it toward the desired output.</div>\n<h3>Why it is important</h3>\n<ul><li>It <b>improves accuracy</b> by reducing vague or irrelevant responses.</li><li>It <b>saves time</b>: you get useful results in fewer attempts.</li><li>It <b>enhances creativity</b> when generating ideas, stories or designs.</li><li>It <b>supports problem solving</b> by guiding the AI through logical steps.</li><li>It <b>increases reliability</b> in tasks such as summarizing, coding and analysis.</li></ul>\n<h3>Elements of a good prompt</h3>\n<div class=\"wrap\"><table><tr><th>Element</th><th>Meaning</th><th>TRADE part</th></tr><tr><td><b>Clear instruction</b></td><td>State exactly what you want the AI to do</td><td>Task</td></tr><tr><td><b>Context</b></td><td>Give background information when necessary</td><td>Role and Audience</td></tr><tr><td><b>Specific details</b></td><td>Mention the format, length, audience or style</td><td>Details</td></tr><tr><td><b>Constraints</b></td><td>Limits such as word count, tone or scope</td><td>Details</td></tr><tr><td><b>Examples</b></td><td>Sample input and output pairs when a pattern is needed</td><td>Example</td></tr></table></div>\n<h3>Five prompting techniques</h3>\n<ol><li><b>Zero-shot prompting:</b> ask the AI to do a task <b>without examples</b>.</li><li><b>Few-shot prompting:</b> give <b>a few examples</b> before asking the AI to complete a similar task.</li><li><b>Chain-of-thought prompting:</b> encourage the AI to <b>explain its reasoning step by step</b>.</li><li><b>Role prompting:</b> assign a role, such as \"act as a teacher\" or \"act as a software engineer\".</li><li><b>Constraint-based prompting:</b> add rules, such as \"explain in 100 words\".</li></ol>\n<h3>Chain-of-thought example</h3>\n<p><b>Plain prompt:</b> \"A pen costs 20 rupees. I buy 3 pens and pay with a 100 rupee note. What is my change?\"</p>\n<p><b>Chain-of-thought prompt:</b> \"...Think step by step.\" The AI then reasons: 3 pens cost 3 &times; 20 = 60 rupees. Change = 100 &minus; 60 = <b>40 rupees</b>. Showing the steps makes mistakes easier to spot.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> a maths teacher who says \"show your working\". When the steps are visible you can see where a mistake happened.</div>\n<h3>Weak prompt and improved prompt</h3>\n<p><b>Weak:</b> \"Explain photosynthesis.\"</p>\n<p><b>Improved:</b> \"Explain photosynthesis in simple terms for a grade 8 student in about 100 words.\" (It has an audience and a length constraint.)</p>\n<h3>Applications</h3>\n<ul><li>Content generation.</li><li>Code generation and debugging.</li><li>Question answering and tutoring.</li><li>Data analysis and summarization.</li><li>Chatbots and virtual assistants.</li></ul>\n<h3>Best practices</h3>\n<ul><li>Use simple and direct language.</li><li>Provide enough context for the AI to understand the task.</li><li>Specify the expected output format.</li><li>Avoid ambiguous or overly broad instructions.</li></ul>\n<h3>Limitations</h3>\n<ul><li>AI responses may still contain <b>errors or outdated information</b>.</li><li>Poorly designed prompts can lead to <b>biased, incomplete or irrelevant</b> outputs.</li><li>Prompt engineering <b>does not guarantee perfect results</b>. Always check important facts.</li></ul>\n<details><summary>Check yourself 1</summary><p>Which technique asks the AI to explain its reasoning step by step? <b>Answer:</b> Chain-of-thought prompting.</p></details>\n<details><summary>Check yourself 2</summary><p>\"Act as a teacher\" is which technique? <b>Answer:</b> Role prompting.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Zero-shot = no examples in the prompt.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Prompt</b></td><td>The instruction or question you give to an AI</td></tr>\n<tr><td><b>Prompt engineering</b></td><td>Writing the prompt clearly so the AI gives a good answer first time</td></tr>\n<tr><td><b>Task</b></td><td>What you want the AI to do (the verb)</td></tr>\n<tr><td><b>Role</b></td><td>Who the AI should act as</td></tr>\n<tr><td><b>Audience</b></td><td>Who will read the answer</td></tr>\n<tr><td><b>Details</b></td><td>The rules: length, format and tone</td></tr>\n<tr><td><b>Example</b></td><td>A sample of the answer you want</td></tr>\n<tr><td><b>Zero-shot prompting</b></td><td>A prompt with no examples</td></tr>\n<tr><td><b>Few-shot prompting</b></td><td>A prompt with one or more solved examples for the AI to copy</td></tr></table></div>"}];const M=[["What is a prompt?", ["The AI's answer", "The instruction or question you give to an AI", "A type of neural network", "A programming language"], 1, "The prompt is your input text."], ["In TRADE, what does T stand for?", ["Tone", "Task", "Training", "Topic"], 1, "T = Task, the WHAT."], ["'You are a senior software engineer.' is which part?", ["Task", "Role", "Audience", "Example"], 1, "Giving the AI an identity is the Role."], ["'Explain it to a complete beginner.' mainly sets the:", ["Role", "Details", "Audience", "Task"], 2, "It says who will read the answer."], ["'Under 150 words, bullet points, casual tone' is:", ["Details", "Example", "Role", "Audience"], 0, "Length, format and tone are Details."], ["Giving the AI a sample of the answer you want is called:", ["Zero-shot prompting", "Few-shot prompting", "Role play", "Fine-tuning"], 1, "Examples that show a pattern = few-shot prompting."], ["Zero-shot prompting means:", ["Giving no examples in the prompt", "Giving many examples", "Using zero words", "Asking twice"], 0, "Zero examples. Few-shot gives examples."], ["Why is 'Write an email about saving money' weak?", ["It is too short to read", "It has no role, audience, details or example", "It has no verb", "AI cannot write emails"], 1, "The AI must guess everything, so the result is generic."], ["Which prompt contains a Role?", ["Write 3 tips.", "You are a vet. Write 3 tips on feeding puppies.", "Tips please", "Dogs"], 1, "'You are a vet' gives the AI an identity."], ["'Use a table with two columns' is which TRADE part?", ["Task", "Role", "Details", "Audience"], 2, "Format instructions are Details."], ["In a few-shot prompt, the examples are placed:", ["Before the new question, to show the pattern", "After the answer", "Nowhere", "Only in the title"], 0, "The AI copies the pattern."], ["'For busy college students' is which TRADE part?", ["Audience", "Role", "Task", "Example"], 0, "It says who will read the answer."], ["Which technique asks the AI to explain its reasoning step by step?", ["Chain-of-thought prompting", "Zero-shot prompting", "Role prompting", "Constraint prompting"], 0, "It makes the reasoning visible."], ["'Act as a software engineer' is an example of:", ["Role prompting", "Few-shot prompting", "Zero-shot prompting", "Chain-of-thought prompting"], 0, "You assign a role."], ["'Explain in 100 words' is an example of:", ["Constraint-based prompting", "Role prompting", "Few-shot prompting", "Chain-of-thought prompting"], 0, "It adds a rule about length."], ["Which is a limitation of prompt engineering?", ["It does not guarantee perfect results", "It always gives correct facts", "It removes all bias", "It needs no checking"], 0, "Responses may still contain errors or outdated information."], ["Which is a best practice?", ["Specify the expected output format", "Use vague words", "Make the request very broad", "Hide the context"], 0, "Clear format and context help the AI."]];const K=[["Rewrite 'Explain photosynthesis' as a TRADE prompt.", "Role: You are a friendly science teacher. Task: Explain photosynthesis. Audience: Grade 6 students. Details: under 120 words, simple words, 4 bullet points. Example: 'Step 1: Sunlight. Leaves catch it.'"], ["Why does giving the AI a Role change its answer?", "The role makes the AI choose the words, depth and style of that person. A senior engineer uses technical words. A 5th grade teacher uses simple words and examples."], ["Which TRADE parts are in this prompt? 'Write a short poem about rain for kids, under 8 lines.'", "Task (write a poem about rain), Audience (kids), Details (short, under 8 lines). Missing: Role and Example."], ["Write a few-shot prompt that teaches an AI to label reviews as Positive or Negative, then asks about 'Love the camera'.", "Review: 'Great phone' -> Positive. Review: 'Battery dies fast' -> Negative. Review: 'Love the camera' -> ? The two solved examples show the pattern, so the AI answers Positive."], ["Explain the five prompting techniques with one example each.", "Zero-shot: ask with no examples. Few-shot: give a few solved examples first. Chain-of-thought: ask the AI to explain its reasoning step by step (for example 'think step by step'). Role prompting: assign a role such as 'act as a teacher'. Constraint-based prompting: add rules such as 'explain in 100 words'."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
