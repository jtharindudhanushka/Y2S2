<div class="topbar"><div><h1>Lesson 10: Images and Convolutional Neural Networks</h1><div class="sub">How a computer sees a picture, and how filters, pooling and a small network recognise what is in it.</div></div><span class="source-tag">Lesson 10 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🖼️", "n": "Images as numbers", "h": "<h2>How a computer sees a picture</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A picture is a grid of numbers. Each number is a pixel.</div><div class=\"r\"><b>🧪 Example:</b> A 128&times;128 colour photo is 128 &times; 128 &times; 3 numbers.</div><div class=\"r\"><b>✅ Remember:</b> Colour image = 3 channels (red, green, blue). Grayscale = 1 channel.</div></div>\n<div class=\"one\">A computer does not see a cat. It sees a grid of numbers. A <b>pixel</b> is one number that says how bright (or what colour) one tiny square of the picture is.</div>\n<h3>Channels</h3>\n<ul><li>A <b>grayscale</b> image has <b>one channel</b>: one number per pixel, from dark (0) to bright.</li><li>A colour <b>RGB</b> image has <b>three channels</b>: red, green and blue. Each pixel has three numbers.</li><li>A 128&times;128 RGB image is stored as a 128 &times; 128 &times; 3 array of numbers (width &times; height &times; channels; the order can differ between software libraries). That is 49,152 numbers.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: a mosaic.</b> A picture is a wall of tiny coloured tiles. Each tile is a pixel. Your computer only knows the colour code of each tile, not the picture they make together.</div>\n<h3>A tiny example: the letter X on a 6&times;6 grid</h3>\n<p>1 means a dark pixel and 0 means a blank pixel.</p>\n<div class=\"wrap\"><table style=\"width:auto\"><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>1</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr><td>1</td><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td></tr></table></div>\n<p>You can see the X in the 1s. We will use this image in the next tabs.</p>\n<h3>Three jobs a computer can do with images</h3>\n<div class=\"wrap\"><table><tr><th>Task</th><th>The answer is...</th><th>Example</th></tr><tr><td><b>Classification</b></td><td>One label for the whole image</td><td>\"This is a cat\"</td></tr><tr><td><b>Object detection</b></td><td>Labels and boxes (locations) for several objects</td><td>\"A dog here, a car there\"</td></tr><tr><td><b>Image generation</b></td><td>New pixels</td><td>Colouring a black-and-white photo</td></tr></table></div>\n<h3>Preparing images</h3>\n<ul><li><b>Resize</b> all images to the same size (resizing can lose detail).</li><li><b>Normalize</b> the numbers in the same way for training and testing images.</li><li>Keep each image's <b>labels, boxes and train/test split</b> matched up.</li></ul>\n<details><summary>Check yourself 1</summary><p>How many numbers are in a 10&times;10 RGB image? <b>Answer:</b> 10 &times; 10 &times; 3 = 300.</p></details>\n<details><summary>Check yourself 2</summary><p>Which task gives a box and a label for each object? <b>Answer:</b> Object detection.</p></details>"}, {"i": "🤔", "n": "Why not a normal network?", "h": "<h2>Why a normal (dense) network is a poor fit for images</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A dense network needs millions of weights for a photo and ignores which pixels are neighbours.</div><div class=\"r\"><b>🧪 Example:</b> 49,152 inputs &times; 100 hidden units = 4,915,200 weights.</div><div class=\"r\"><b>✅ Remember:</b> A CNN reuses a small filter everywhere, so it needs far fewer weights.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"Neural Networks Part 8: Image Classification with Convolutional Neural Networks (CNNs)\"</b><br>The video starts with image classification using a normal neural network and shows the trouble: every pixel needs its own input node, so big images need a huge number of weights. A normal network also does not use the fact that <b>neighbouring pixels are related</b>, and it is upset by small <b>shifts</b> of the picture. Then it gives the main ideas of a CNN: (1) <b>reduce the number of input nodes</b> using a <b>filter</b>, (2) take advantage of the <b>correlation between neighbouring pixels</b>, and (3) <b>tolerate small shifts</b> in the image. The video walks through creating a feature map with a filter, <b>pooling</b>, using the pooled values as input for a neural network, and classifying an image of the letter \"X\" (and a shifted X).</div>\n<h3>Problem 1: far too many weights</h3>\n<p>Flatten a 128&times;128 RGB image into one long list: 49,152 numbers. Connect each to just 100 hidden neurons:</p>\n<div class=\"fm\">49,152 &times; 100 = 4,915,200 weights</div>\n<p>(plus 100 biases). That is almost five million numbers to train, for only one layer.</p>\n<h3>Problem 2: the layout is lost</h3>\n<p>When we flatten the picture into one long list, the network no longer knows which pixels were neighbours. But nearby pixels form meaningful patterns such as edges and corners.</p>\n<div class=\"an\">🌍 <b>Analogy: a jigsaw puzzle in a heap.</b> If you pour all pieces into a bag and list them one by one, you lose how they fit together. A CNN looks at small patches of the picture, so it keeps the neighbourhoods.</div>\n<h3>The CNN idea</h3>\n<ul><li><b>Filter (kernel):</b> a small grid of numbers (for example 3&times;3) that slides across the image.</li><li><b>Shared weights:</b> the <b>same</b> filter numbers are used at every position, so the number of weights does not grow with the image size.</li><li><b>Feature map:</b> the grid of results made by the filter. It shows where the filter's pattern was found.</li><li><b>Receptive field:</b> each value in a feature map depends only on a small local patch.</li></ul>\n<p>Count: one 3&times;3 filter on an RGB image has 3 &times; 3 &times; 3 = <b>27 weights</b> plus 1 bias, however big the image is. Compare with 4,915,200 for the dense layer.</p>\n<p>Stacking several convolution layers lets later layers combine small patterns (edges) into bigger ones (shapes, then objects).</p>\n<h3>Shifts</h3>\n<p>Because the same filter scans every position, a shifted pattern produces a shifted response in the feature map. This is called <b>translation equivariance</b>. With pooling, a CNN becomes more tolerant to <b>small</b> shifts. But it is not automatic for every shift or rotation, so training and design still matter.</p>\n<details><summary>Check yourself 1</summary><p>How many weights does a 3&times;3 filter on a 1-channel (grayscale) image have? <b>Answer:</b> 3 &times; 3 = 9 (plus 1 bias).</p></details>\n<details><summary>Check yourself 2</summary><p>Why does a filter need so few weights? <b>Answer:</b> The same small set of weights is reused at every position of the image.</p></details>"}, {"i": "🔍", "n": "Filters and feature maps", "h": "<h2>The convolution: sliding a filter</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Place a filter on a patch, multiply matching numbers, add them up. That is one feature-map value.</div><div class=\"r\"><b>🧪 Example:</b> Patch [1,0;2,1] with filter [1,0;0,1] gives 1&times;1 + 0&times;0 + 2&times;0 + 1&times;1 = 2.</div><div class=\"r\"><b>✅ Remember:</b> Output size = floor((N + 2P &minus; K) &divide; S) + 1 for each side.</div></div>\n<div class=\"one\">A <b>convolution</b> slides a small filter over an image. At each position it multiplies the filter with the patch underneath, entry by entry, and adds the results. The result goes into a <b>feature map</b>.</div>\n<div class=\"an\">🌍 <b>Analogy: a stencil and a torch.</b> Hold a small stencil over part of a picture and ask \"how well does this part match my stencil?\". Slide the stencil across the whole picture. The scores form a new picture: the feature map.</div>\n<h3>Worked example: one patch</h3>\n<p>Image (3&times;3):</p>\n<div class=\"wrap\"><table style=\"width:auto\"><tr><td>1</td><td>0</td><td>2</td></tr><tr><td>2</td><td>1</td><td>0</td></tr><tr><td>0</td><td>1</td><td>1</td></tr></table></div>\n<p>Filter (2&times;2): rows [1, 0] and [0, 1]. Stride 1, no padding, bias 0.</p>\n<ol><li>Upper-left patch is [1, 0; 2, 1]. Multiply with the filter: 1&times;1 + 0&times;0 + 2&times;0 + 1&times;1 = <b>2</b>.</li><li>Slide one step right: patch [0, 2; 1, 0]. 0&times;1 + 2&times;0 + 1&times;0 + 0&times;1 = <b>0</b>.</li><li>Slide down to the left: patch [2, 1; 0, 1]. 2&times;1 + 1&times;0 + 0&times;0 + 1&times;1 = <b>3</b>.</li><li>Slide right: patch [1, 0; 1, 1]. 1&times;1 + 0&times;0 + 1&times;0 + 1&times;1 = <b>2</b>.</li></ol>\n<p>The feature map is [2, 0; 3, 2]. (In deep learning the \"convolution\" usually does not flip the filter. Strictly that is called cross-correlation. Because the filter numbers are learned, the name does not matter for training.)</p>\n<h3>Stride and padding</h3>\n<ul><li><b>Stride (S):</b> how many pixels the filter moves each step. Stride 1 moves one pixel. Stride 2 moves two.</li><li><b>Padding (P):</b> extra border pixels (usually 0) added around the image so the edge pixels get used and the output stays larger.</li></ul>\n<div class=\"fm\">output size = floor( (N + 2P &minus; K) &divide; S ) + 1</div>\n<p>N = input size, K = filter size, P = padding, S = stride, for each side. (floor means round down.)</p>\n<ul><li>3&times;3 input, 2&times;2 filter, S = 1, P = 0: floor((3 + 0 &minus; 2) &divide; 1) + 1 = <b>2</b>. So the output is 2&times;2.</li><li>5&times;5 input, 3&times;3 filter, S = 2, P = 1: floor((5 + 2 &minus; 3) &divide; 2) + 1 = floor(2) + 1 = <b>3</b>. So the output is 3&times;3.</li></ul>\n<h3>Channels and counting weights</h3>\n<ul><li>Each filter spans <b>all</b> the input channels and makes <b>one</b> output channel (one feature map).</li><li>Eight filters make eight feature maps.</li><li>Weights = kernel height &times; kernel width &times; input channels &times; output channels, plus one bias per output channel. Example: eight 3&times;3 filters on an RGB image = 3 &times; 3 &times; 3 &times; 8 = 216 weights + 8 biases = <b>224</b> numbers.</li></ul>\n<details><summary>Check yourself 1</summary><p>Output size for a 7&times;7 input, 3&times;3 filter, stride 1, padding 0? <b>Answer:</b> floor((7 &minus; 3) &divide; 1) + 1 = 5, so 5&times;5.</p></details>\n<details><summary>Check yourself 2</summary><p>Patch [2, 1; 0, 3] and filter [1, 0; 0, 1]. Result? <b>Answer:</b> 2&times;1 + 1&times;0 + 0&times;0 + 3&times;1 = 5.</p></details>"}, {"i": "🧮", "n": "A tiny CNN, start to end", "h": "<h2>A tiny CNN: recognising the letter X</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Filter, ReLU, pool, then feed the numbers to a small network.</div><div class=\"r\"><b>🧪 Example:</b> The X image gives pooled values 3, 0, 0, 3 for the \"\\\" filter and 0, 3, 3, 0 for the \"/\" filter.</div><div class=\"r\"><b>✅ Remember:</b> Image &rarr; feature maps &rarr; ReLU &rarr; pooling &rarr; flatten &rarr; classifier.</div></div>\n<div class=\"one\">We take the 6&times;6 X from the first tab and run it through two filters, ReLU and max pooling. This is the same journey the StatQuest video follows for the letter \"X\".</div>\n<div class=\"flow\"><div class=\"chip\">Image<br>6&times;6</div><span class=\"arr\">➜</span><div class=\"chip\">Filter<br>feature map 4&times;4</div><span class=\"arr\">➜</span><div class=\"chip\">ReLU</div><span class=\"arr\">➜</span><div class=\"chip\">Max pool<br>2&times;2</div><span class=\"arr\">➜</span><div class=\"chip\">Flatten<br>4 numbers</div><span class=\"arr\">➜</span><div class=\"chip\">Classifier</div></div>\n<h3>Filter 1: a \"\\\" diagonal detector</h3>\n<p>Filter (3&times;3): [1, &minus;1, &minus;1], [&minus;1, 1, &minus;1], [&minus;1, &minus;1, 1]. It scores high when the patch has 1s on the \"\\\" diagonal and 0s elsewhere. Slide it over the 6&times;6 image (stride 1, no padding), giving a 4&times;4 feature map (floor((6 &minus; 3) &divide; 1) + 1 = 4):</p>\n<div class=\"wrap\"><table style=\"width:auto\"><tr><td>3</td><td>&minus;1</td><td>&minus;3</td><td>&minus;1</td></tr><tr><td>&minus;1</td><td>1</td><td>&minus;3</td><td>&minus;3</td></tr><tr><td>&minus;3</td><td>&minus;3</td><td>1</td><td>&minus;1</td></tr><tr><td>&minus;1</td><td>&minus;3</td><td>&minus;1</td><td>3</td></tr></table></div>\n<p>Check the top-left value: the patch is [1, 0, 0; 0, 1, 0; 0, 0, 1]. The diagonal gives 1+1+1 = 3. The six other cells are 0, so they add 0. Total = <b>3</b>. The big values (3) sit at the two ends of the \"\\\" stroke of the X.</p>\n<h3>ReLU</h3>\n<p>Replace every negative number by 0:</p>\n<div class=\"wrap\"><table style=\"width:auto\"><tr><td>3</td><td>0</td><td>0</td><td>0</td></tr><tr><td>0</td><td>1</td><td>0</td><td>0</td></tr><tr><td>0</td><td>0</td><td>1</td><td>0</td></tr><tr><td>0</td><td>0</td><td>0</td><td>3</td></tr></table></div>\n<h3>Max pooling (2&times;2 windows, no overlap)</h3>\n<p>Keep the largest value in each 2&times;2 window:</p>\n<ul><li>Top-left window [3, 0; 0, 1] gives <b>3</b>. Top-right [0, 0; 0, 0] gives <b>0</b>.</li><li>Bottom-left [0, 0; 0, 0] gives <b>0</b>. Bottom-right [1, 0; 0, 3] gives <b>3</b>.</li></ul>\n<p>Pooled map: [3, 0; 0, 3].</p>\n<h3>Filter 2: a \"/\" diagonal detector</h3>\n<p>With the mirror filter [&minus;1, &minus;1, 1], [&minus;1, 1, &minus;1], [1, &minus;1, &minus;1], the same steps give a pooled map of [0, 3; 3, 0].</p>\n<h3>Flatten and classify</h3>\n<p>Join the pooled values into one list: [3, 0, 0, 3, 0, 3, 3, 0]. These 8 numbers go to a small normal neural network as inputs. The network learned that an X has high values for both diagonals. We reduced 36 pixels to 8 numbers, and we kept the useful information.</p>\n<div class=\"an\">🌍 <b>Analogy: a detective with two magnifying glasses.</b> One glass looks for \"\\\" strokes and one for \"/\" strokes. The detective reports only the strongest sign of each in each part of the picture. Both strokes present in the right places means \"X\".</div>\n<h3>Why pooling helps with small shifts</h3>\n<p>Say a strong response of 3 moves by one cell, but stays inside the same 2&times;2 window: [3, 0; 0, 0] becomes [0, 3; 0, 0]. Max pooling gives <b>3</b> in both cases. So the pooled result does not change for small shifts inside a window. A bigger shift can move the response into another window, so tolerance is partial.</p>\n<details><summary>Check yourself 1</summary><p>Max pooling of [1, 4; 2, 3]? <b>Answer:</b> 4.</p></details>\n<details><summary>Check yourself 2</summary><p>A 6&times;6 image goes through a 3&times;3 filter, stride 1, no padding, then 2&times;2 pooling. What is the final size? <b>Answer:</b> 4&times;4 after the filter, then 2&times;2 after pooling.</p></details>"}, {"i": "⬇️", "n": "ReLU, pooling, the head", "h": "<h2>ReLU, pooling and the classifier head</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> After each convolution: ReLU, optional pooling. At the end a classifier turns the features into labels.</div><div class=\"r\"><b>🧪 Example:</b> Pooling [1,3;2,0] gives 3. Softmax turns scores into probabilities that add up to 1.</div><div class=\"r\"><b>✅ Remember:</b> The filters are learned by backpropagation, not hand-written.</div></div>\n<h3>ReLU after a convolution</h3>\n<p>ReLU(z) = max(0, z): negatives become 0 and positives stay. It adds the bend (non-linearity) that lets a network learn complicated patterns. A feature map after ReLU shows <b>where</b> a filter responded strongly.</p>\n<h3>Max pooling</h3>\n<p>Take the largest value in each local window. Example 4&times;4 feature map and 2&times;2 windows:</p>\n<div class=\"wrap\"><table style=\"width:auto\"><tr><td>1</td><td>3</td><td>0</td><td>2</td></tr><tr><td>2</td><td>0</td><td>1</td><td>1</td></tr><tr><td>4</td><td>1</td><td>2</td><td>3</td></tr><tr><td>0</td><td>2</td><td>5</td><td>1</td></tr></table></div>\n<p>Top-left [1, 3; 2, 0] gives 3. Top-right [0, 2; 1, 1] gives 2. Bottom-left [4, 1; 0, 2] gives 4. Bottom-right [2, 3; 5, 1] gives 5. The pooled map is [3, 2; 4, 5].</p>\n<ul><li>Pooling reduces the size (4&times;4 became 2&times;2) and makes the result less sensitive to small shifts.</li><li>But it throws away some detail.</li><li>A pooling window has no weights to learn.</li></ul>\n<h3>The classifier head</h3>\n<p>A simple CNN repeats <b>convolution, then ReLU, then (optional) pooling</b> several times. Then it uses flattening (or global pooling) and one or more dense layers to produce a score for each class.</p>\n<p>For classes that exclude each other (cat, dog or bird), <b>softmax</b> turns the scores into probabilities that add up to 1. Example: scores 2, 1, 0 give e<sup>2</sup> = 7.39, e<sup>1</sup> = 2.72, e<sup>0</sup> = 1. The total is 11.11. The probabilities are 7.39 &divide; 11.11 = <b>0.665</b>, 2.72 &divide; 11.11 = <b>0.245</b> and 1 &divide; 11.11 = <b>0.090</b>.</p>\n<h3>How a CNN learns</h3>\n<ol><li>Predict a label for a training image (forward pass).</li><li>Compare with the true label and calculate the loss.</li><li>Use backpropagation to find the slopes (Lesson 7).</li><li>Update <b>all</b> the weights together: the filter numbers and the classifier weights.</li></ol>\n<p>The filters are <b>learned from examples</b>. Nobody types in a \"cat detector\". The early filters often find edges. Later layers combine them into shapes.</p>\n<details><summary>Check yourself 1</summary><p>ReLU(&minus;2) and ReLU(5)? <b>Answer:</b> 0 and 5.</p></details>\n<details><summary>Check yourself 2</summary><p>What do softmax outputs add up to? <b>Answer:</b> 1.</p></details>"}, {"i": "🎨", "n": "Colourizing photos (U-Net)", "h": "<h2>Colourizing a grayscale photo with a U-Net</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Give the network the lightness of a photo. It predicts the colour channels.</div><div class=\"r\"><b>🧪 Example:</b> Input L is 1&times;128&times;128. Output a and b is 2&times;128&times;128.</div><div class=\"r\"><b>✅ Remember:</b> The colours are plausible guesses, not guaranteed true colours.</div></div>\n<div class=\"one\">A project example: take old black-and-white photos and predict plausible colours using a CNN with an encoder and a decoder (a U-Net).</div>\n<h3>The Lab colour space</h3>\n<p>Instead of red, green and blue, <b>Lab</b> splits a colour into three channels:</p>\n<ul><li><b>L:</b> lightness (this is the grayscale picture).</li><li><b>a and b:</b> two channels that carry the colour information.</li></ul>\n<p>Colourizing becomes: <b>input L, predict a and b</b>. Then put L, a and b back together and convert to RGB.</p>\n<h3>The steps</h3>\n<ol><li>Resize the RGB training images to 128&times;128. Convert RGB to Lab.</li><li>Input = L, shape 1&times;128&times;128. Target = a and b, shape 2&times;128&times;128 (channels first, as in PyTorch).</li><li>Train: predict a and b, calculate the <b>mean squared error</b> against the true a and b, update the weights. Track training and validation scores over 15 to 20 epochs. Keep an evaluation set aside if you can.</li><li>Use it: take the L channel of a grayscale photo, predict a and b, combine with L, convert Lab back to RGB, and show the grayscale input and the final colour output.</li></ol>\n<p>The Lab scaling and normalization used in training must be the same when rebuilding the colour image.</p>\n<h3>The U-Net shape</h3>\n<ul><li><b>Encoder:</b> convolutions that squeeze the image into smaller, more abstract feature maps.</li><li><b>Decoder:</b> layers that make the maps bigger again until they return to the original size.</li><li><b>Skip connections:</b> shortcuts that pass detailed (high-resolution) encoder features straight to the matching decoder stage. They help bring back edges and fine detail.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: summarising and redrawing.</b> The encoder squeezes a picture into a short summary. The decoder redraws it from the summary. The skip connections are sticky notes with fine details that are handed straight to the decoder so it does not forget them.</div>\n<h3>An honest limit</h3>\n<p>One grayscale photo can match several plausible colour versions (a jacket could be red or blue). The network learns <b>plausible</b> colours, not the true historical colours. Mean squared error also tends to average uncertain colours, so results can look muted.</p>\n<details><summary>Check yourself 1</summary><p>In Lab colourization, which channel is the input? <b>Answer:</b> L (lightness).</p></details>\n<details><summary>Check yourself 2</summary><p>What do skip connections do in a U-Net? <b>Answer:</b> They pass high-resolution encoder features to the decoder to recover fine detail.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Stride = how many pixels the filter moves each step.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Pixel</b></td><td>One number for one tiny square of the picture</td></tr>\n<tr><td><b>Channel</b></td><td>One layer of numbers in an image (grayscale 1, RGB 3)</td></tr>\n<tr><td><b>CNN</b></td><td>Convolutional Neural Network: a network that uses filters on images</td></tr>\n<tr><td><b>Filter (kernel)</b></td><td>A small grid of numbers that slides over the image</td></tr>\n<tr><td><b>Convolution</b></td><td>Multiplying a filter by a patch and adding the results</td></tr>\n<tr><td><b>Feature map</b></td><td>The grid of filter results</td></tr>\n<tr><td><b>Stride</b></td><td>How many pixels the filter moves each step</td></tr>\n<tr><td><b>Padding</b></td><td>Extra border pixels added around the image</td></tr>\n<tr><td><b>Receptive field</b></td><td>The local patch a feature-map value depends on</td></tr>\n<tr><td><b>Pooling</b></td><td>Shrinking a feature map, for example by keeping the maximum of each window</td></tr>\n<tr><td><b>Flatten</b></td><td>Turning a grid into one long list</td></tr>\n<tr><td><b>Softmax</b></td><td>Turns scores into probabilities that add up to 1</td></tr>\n<tr><td><b>Lab</b></td><td>A colour system: L is lightness, a and b carry colour</td></tr>\n<tr><td><b>Encoder, decoder</b></td><td>Squeezing an image down / rebuilding it to full size</td></tr>\n<tr><td><b>Skip connection</b></td><td>A shortcut that passes detail from the encoder to the decoder</td></tr></table></div>"}];const M=[["How many channels does a 128x128 RGB image have?", ["1", "2", "3", "128"], 2, "Red, green and blue."], ["A grayscale image usually has how many channels?", ["1", "3", "4", "0"], 0, "One brightness number per pixel."], ["A pixel is:", ["One number (or set of numbers) for one tiny square of the picture", "A whole image", "A type of filter", "A class label"], 0, "A picture is a grid of pixels."], ["Which task gives a label and a box for multiple objects?", ["Classification only", "Object detection", "Forecasting", "Clustering"], 1, "Detection localises objects as well as labelling them."], ["How many numbers are in a 128x128 RGB image?", ["16,384", "49,152", "128", "384"], 1, "128 x 128 x 3 = 49,152."], ["Connecting 49,152 inputs to 100 dense units needs how many weights (ignoring biases)?", ["49,152", "491,520", "4,915,200", "27"], 2, "49,152 x 100 = 4,915,200."], ["A 3x3 filter on an RGB image has how many weights (excluding the bias)?", ["9", "27", "100", "49,152"], 1, "3 x 3 x 3 = 27."], ["Why does a CNN need far fewer weights than a dense layer for an image?", ["The same small filter is reused at every position", "It ignores the image", "It uses colours only", "It has no layers"], 0, "Shared weights."], ["The StatQuest video says CNNs help because they:", ["Reduce the number of input nodes, use neighbouring pixels and tolerate small shifts", "Always need more weights", "Ignore neighbouring pixels", "Cannot classify shifted images"], 0, "These are the main ideas of CNNs."], ["A filter slides over the image and the grid of results is called a:", ["Feature map", "Label", "Channel", "Softmax"], 0, "The feature map shows where the filter's pattern was found."], ["Patch [1, 0; 2, 1] with filter [1, 0; 0, 1] gives:", ["1", "2", "3", "4"], 1, "1x1 + 0x0 + 2x0 + 1x1 = 2."], ["Patch [2, 1; 0, 1] with filter [1, 0; 0, 1] gives:", ["1", "2", "3", "4"], 2, "2x1 + 1x0 + 0x0 + 1x1 = 3."], ["For a 3x3 input, 2x2 kernel, stride 1 and padding 0, the output size is:", ["1x1", "2x2", "3x3", "4x4"], 1, "floor((3 - 2) / 1) + 1 = 2."], ["For a 5x5 input, 3x3 kernel, stride 2 and padding 1, the output size is:", ["2x2", "3x3", "4x4", "5x5"], 1, "floor((5 + 2 - 3) / 2) + 1 = 3."], ["For a 6x6 input, 3x3 filter, stride 1 and no padding, the feature map is:", ["3x3", "4x4", "5x5", "6x6"], 1, "floor((6 - 3) / 1) + 1 = 4."], ["Eight 3x3 filters on an RGB image have how many weights plus biases?", ["72", "216", "224", "27"], 2, "3 x 3 x 3 x 8 = 216 weights, plus 8 biases = 224."], ["What does stride mean?", ["How many pixels the filter moves each step", "The number of channels", "The image size", "The learning rate"], 0, "Stride 2 moves two pixels at a time."], ["What does padding do?", ["Adds border pixels around the image", "Removes the border", "Changes the colours", "Deletes filters"], 0, "It keeps edge pixels in use and keeps the output larger."], ["ReLU(-2) equals:", ["0", "-2", "2", "0.5"], 0, "max(0, -2) = 0."], ["Max pooling of the window [1, 3; 2, 0] gives:", ["0", "1", "2", "3"], 3, "The largest value is 3."], ["A 4x4 feature map goes through 2x2 max pooling with no overlap. The output is:", ["1x1", "2x2", "3x3", "4x4"], 1, "4 / 2 = 2 on each side."], ["Pooling does what?", ["Reduces size and makes the result less sensitive to small shifts", "Adds more weights", "Colours the image", "Increases the learning rate"], 0, "But it discards some detail."], ["Which class-probability function is used for classes that exclude each other?", ["Softmax", "ReLU", "Padding", "Stride"], 0, "Softmax makes the probabilities add up to 1."], ["How are CNN filters obtained?", ["Learned from examples by backpropagation", "Typed in by hand as a cat detector", "Chosen at random and never changed", "Copied from the image"], 0, "Filters and classifier weights are updated together."], ["In Lab colourization, the model input is usually:", ["a and b", "L (lightness)", "Only red", "A class index"], 1, "The grayscale L channel goes in, a and b come out."], ["The Lab output channels a and b have the shape (for 128x128 images):", ["1x128x128", "2x128x128", "3x128x128", "128x128x1x1"], 1, "Two colour channels."], ["What do U-Net skip connections supply?", ["High-resolution encoder features to the decoder", "Random labels", "A lower learning rate", "A guarantee of true colour"], 0, "They help recover edges and fine detail."], ["Why can't a colourization network recover true historical colours?", ["One grayscale image can match several plausible colours", "It has no layers", "It uses too many channels", "It needs fewer pixels"], 0, "It estimates plausible colours only."], ["Pooling a 4x4 map [1,3,0,2; 2,0,1,1; 4,1,2,3; 0,2,5,1] with 2x2 windows gives [3, 2; 4, 5]. The bottom-right value 5 comes from the window:", ["[2, 3; 5, 1]", "[4, 1; 0, 2]", "[1, 3; 2, 0]", "[0, 2; 1, 1]"], 0, "The bottom-right window is [2, 3; 5, 1] and its maximum is 5."]];const K=[["Explain classification, object detection and colourization from pixel data.", "Classification gives one label for the whole image. Object detection gives labels and bounding boxes for several objects. Colourization is image generation: from the grayscale lightness channel the network estimates the colour channels, and the final picture is rebuilt by combining them."], ["Why is a dense network a poor fit for a 128x128 RGB image? How does a CNN fix it?", "Flattening gives 49,152 inputs. Connecting each to 100 hidden units needs 4,915,200 weights, and the flattened list loses which pixels are neighbours. A CNN uses small filters that slide over local patches and reuse the same weights everywhere (for example 3 x 3 x 3 = 27 weights per filter), so it needs far fewer weights and keeps the local layout."], ["Patch [1, 0, 2; 2, 1, 0; 0, 1, 1] and filter [1, 0; 0, 1], stride 1, no padding. Calculate the feature map and its size.", "Size = floor((3 - 2) / 1) + 1 = 2, so 2x2. Entries: top-left 1x1 + 0x0 + 2x0 + 1x1 = 2; top-right 0x1 + 2x0 + 1x0 + 0x1 = 0; bottom-left 2x1 + 1x0 + 0x0 + 1x1 = 3; bottom-right 1x1 + 0x0 + 1x0 + 1x1 = 2. Feature map [2, 0; 3, 2]."], ["Explain stride, padding and the output-size formula. Calculate the output size for a 5x5 input, 3x3 filter, stride 2, padding 1.", "Stride is how many pixels the filter moves each step. Padding adds a border of extra pixels. Output size = floor((N + 2P - K) / S) + 1. Here floor((5 + 2 - 3) / 2) + 1 = 2 + 1 = 3, so the output is 3x3."], ["Trace a simple CNN classifier from image to label.", "Convolution makes feature maps (each filter slides over the image). ReLU replaces negatives by 0 for non-linearity. Optional max pooling keeps the largest value in each window, reducing size and sensitivity to small shifts. The result is flattened and fed to dense layers to give class scores, often with softmax for classes that exclude each other. All filters and weights are learned together by backpropagation."], ["Explain how max pooling helps with small shifts. Use numbers.", "Max pooling keeps the largest value in each window. If a strong response of 3 moves by one cell but stays in the same 2x2 window, [3, 0; 0, 0] becomes [0, 3; 0, 0], and max pooling gives 3 in both cases. A larger shift can move it into another window, so the tolerance is partial and not guaranteed."], ["Outline the colourization project and one limitation.", "Resize images to 128x128 and convert RGB to Lab. Input L (1x128x128) and predict a and b (2x128x128) with a U-Net encoder-decoder with skip connections, using mean squared error and training for about 15 to 20 epochs. Then combine L with the predicted a and b and convert to RGB. Limitation: one grayscale image can match several plausible colours, so the output is a plausible estimate, not the true colour, and MSE can give muted colours."]];
