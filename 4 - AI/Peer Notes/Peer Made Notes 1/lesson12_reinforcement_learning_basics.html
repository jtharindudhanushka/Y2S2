<div class="topbar"><div><h1>Lesson 12: Reinforcement Learning Basics</h1><div class="sub">How an agent learns by trial and reward: states, actions, returns, exploration, Q-learning and policy gradients.</div></div><span class="source-tag">Lesson 12 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🎮", "n": "The big idea", "h": "<h2>The big idea: learning by trial and reward</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An agent learns what to do by trying actions and getting rewards or penalties.</div><div class=\"r\"><b>🧪 Example:</b> A dog sits and gets a treat. A game character falls in lava and loses points.</div><div class=\"r\"><b>✅ Remember:</b> No answer sheet. Only feedback after the action.</div></div>\n<div class=\"one\"><b>Reinforcement learning (RL)</b> is a type of machine learning where an <b>agent</b> learns by interacting with an <b>environment</b> and receiving feedback as <b>rewards</b> (+) or <b>penalties</b> (&minus;).</div>\n<div class=\"an\">🌍 <b>Analogy: training a puppy.</b> You do not give the puppy a book of rules. You ask it to sit. If it sits, you give a treat (reward). If it jumps on the sofa, you say \"no\" (penalty). After many tries, the puppy learns which actions lead to treats.</div>\n<h3>How RL is different from the other types</h3>\n<div class=\"wrap\"><table><tr><th>Type</th><th>What the machine gets</th><th>Picture</th></tr>\n<tr><td><b>Supervised</b></td><td>Examples with the correct answers</td><td>A teacher with an answer sheet</td></tr>\n<tr><td><b>Unsupervised</b></td><td>Data with no answers</td><td>Sorting buttons into groups</td></tr>\n<tr><td><b>Reinforcement</b></td><td>Only a reward or penalty after it acts</td><td>Learning to ride a bike by trying and falling</td></tr></table></div>\n<p>In RL nobody tells the agent the right action. It must <b>discover</b> good actions by trying them, and a good action may only pay off later (like a chess move that wins the game 30 moves later).</p>\n<h3>Real examples</h3>\n<ul><li><b>Robots:</b> Boston Dynamics builds robots (some walk on four legs like dogs). Robots can use RL ideas to learn suitable movements through interaction and feedback.</li><li><b>Games:</b> programs learn to play by playing millions of games and getting a reward for winning.</li><li><b>Driving and control:</b> learning to steer, brake and plan a route.</li><li><b>Chatbots:</b> reward signals from human feedback are used to make answers more helpful and human-like.</li></ul>\n<details><summary>Check yourself 1</summary><p>In RL, what does the agent get instead of the correct answers? <b>Answer:</b> A reward or penalty after it acts.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is RL harder than supervised learning? <b>Answer:</b> Nobody tells the agent the right action, and rewards may come much later.</p></details>"}, {"i": "🔄", "n": "The RL loop", "h": "<h2>The RL loop and its vocabulary</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The agent sees a state, picks an action, and the environment gives a new state and a reward. Repeat.</div><div class=\"r\"><b>🧪 Example:</b> &pi;(s1, lift leg) = 0.7: in state s1 the policy lifts the leg with probability 0.7.</div><div class=\"r\"><b>✅ Remember:</b> State, action, reward, policy.</div></div>\n<div class=\"flow\"><div class=\"chip\">Agent<br><small>chooses an action</small></div><span class=\"arr\">➜ action ➜</span><div class=\"chip\">Environment<br><small>reacts</small></div><span class=\"arr\">➜ new state + reward ➜</span><div class=\"chip\">Agent<br><small>learns, acts again</small></div></div>\n<h3>The words, with a robot example</h3>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Symbol</th><th>Meaning</th><th>Robot example</th></tr>\n<tr><td><b>Agent</b></td><td></td><td>The learner that acts</td><td>The robot</td></tr>\n<tr><td><b>Environment</b></td><td></td><td>Everything the agent interacts with</td><td>The floor, steps, obstacles</td></tr>\n<tr><td><b>State</b></td><td>s</td><td>The current situation</td><td>Standing in front of a step</td></tr>\n<tr><td><b>Action</b></td><td>a</td><td>What the agent does</td><td>Lift the leg, turn, or wait</td></tr>\n<tr><td><b>Reward</b></td><td>r</td><td>The feedback number after an action</td><td>+1 for climbing, &minus;1 for falling</td></tr>\n<tr><td><b>Policy</b></td><td>&pi;</td><td>The rule for choosing actions</td><td>\"In front of a step, usually lift the leg\"</td></tr>\n<tr><td><b>Episode</b></td><td></td><td>One full try from start to end</td><td>One walk across the room</td></tr></table></div>\n<h3>The policy formula: &pi;(s, a) = p</h3>\n<p>Read it as: \"In state s, the policy &pi; picks action a with probability p.\" Example: in state s1 (in front of a step), &pi;(s1, lift leg) = 0.7, &pi;(s1, turn) = 0.2, &pi;(s1, wait) = 0.1. The probabilities add up to 1 (0.7 + 0.2 + 0.1 = 1.0), because the robot must pick something.</p>\n<p><b>Learning means changing these probabilities</b> so that actions that earn rewards become more likely.</p>\n<h3>A tiny world to keep in mind</h3>\n<p>A corridor with three squares: A (start), B, and C (the goal, which gives a reward of +10). From A the robot can only go right (to B). From B it can go left (to A) or right (to C). The best policy is \"always go right\". We will use this tiny world in the next tabs.</p>\n<details><summary>Check yourself 1</summary><p>What is a policy? <b>Answer:</b> The rule the agent uses to choose actions in each state.</p></details>\n<details><summary>Check yourself 2</summary><p>Can a policy for one state have probabilities 0.5, 0.4 and 0.3? <b>Answer:</b> No. They must add up to 1, and these add up to 1.2.</p></details>"}, {"i": "💰", "n": "Reward and return", "h": "<h2>Reward, return and the discount factor</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The agent wants the biggest total reward over time, and rewards that come sooner count a bit more.</div><div class=\"r\"><b>🧪 Example:</b> Rewards 0, 0, 10 with &gamma; = 0.9 give a return of 0.81 &times; 10 = 8.1.</div><div class=\"r\"><b>✅ Remember:</b> Return G = r1 + &gamma; r2 + &gamma;&sup2; r3 + ...</div></div>\n<div class=\"one\">A single reward is not the goal. The goal is the <b>total reward over a whole episode</b>, called the <b>return</b>.</div>\n<h3>Why total reward?</h3>\n<p>A chess move that wins a piece now may lose the game later. A move that gives no reward now may set up a win. The agent must look at the big picture.</p>\n<h3>The discount factor &gamma; (gamma)</h3>\n<p>A reward now is usually worth more than the same reward later (it is uncertain, and time passes). We multiply later rewards by a number &gamma; between 0 and 1.</p>\n<div class=\"fm\">G = r<sub>1</sub> + &gamma; r<sub>2</sub> + &gamma;&sup2; r<sub>3</sub> + ...</div>\n<p><b>Example:</b> the corridor gives rewards 0, 0, then +10 on reaching C (three steps).</p>\n<ul><li>With &gamma; = 0.9: G = 0 + 0.9 &times; 0 + 0.81 &times; 10 = <b>8.1</b>.</li><li>With &gamma; = 0.5: G = 0 + 0.5 &times; 0 + 0.25 &times; 10 = <b>2.5</b>.</li><li>With &gamma; close to 1, the agent is patient. With &gamma; close to 0, it only cares about rewards right now.</li></ul>\n<div class=\"an\">🌍 <b>Analogy: money in the bank.</b> 100 rupees today is worth more to you than 100 rupees in a year. The discount factor says how much less.</div>\n<h3>Value: the expected return</h3>\n<p>The <b>value</b> of a state is the return the agent can expect from that state if it follows its policy. In the corridor, B is one step from the goal, so under \"always go right\" its value is 10. A is two steps away, so its value is 0.9 &times; 10 = <b>9</b>. States nearer the reward have higher value.</p>\n<details><summary>Check yourself 1</summary><p>Rewards 0, 5 with &gamma; = 0.8. What is the return? <b>Answer:</b> 0 + 0.8 &times; 5 = 4.</p></details>\n<details><summary>Check yourself 2</summary><p>If &gamma; is close to 0, what does the agent care about? <b>Answer:</b> Mostly the reward right now.</p></details>"}, {"i": "🧭", "n": "Explore or exploit", "h": "<h2>Exploration versus exploitation</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> The agent must balance trying new things (explore) and using what it already knows (exploit).</div><div class=\"r\"><b>🧪 Example:</b> &epsilon;-greedy with &epsilon; = 0.3 and 3 actions picks the best one with probability 0.8.</div><div class=\"r\"><b>✅ Remember:</b> Too much exploiting misses better options. Too much exploring wastes time.</div></div>\n<div class=\"one\">Should the agent <b>exploit</b> (repeat the action that has worked best so far) or <b>explore</b> (try something different that might be even better)?</div>\n<div class=\"an\">🌍 <b>Analogy: choosing where to eat.</b> You have a favourite restaurant (exploit). But a new restaurant down the street might be even better (explore). If you only ever go to your favourite, you will never find out.</div>\n<h3>The &epsilon;-greedy rule</h3>\n<p>With a small probability &epsilon; (epsilon) the agent explores by choosing a random action. Otherwise (probability 1 &minus; &epsilon;) it picks the action it currently thinks is best.</p>\n<p><b>Example:</b> 3 actions and &epsilon; = 0.3.</p>\n<ul><li>The random exploration is shared among all 3 actions: 0.3 &divide; 3 = <b>0.1</b> each.</li><li>The best-known action: (1 &minus; 0.3) + 0.1 = 0.7 + 0.1 = <b>0.8</b>.</li><li>Each other action: <b>0.1</b>.</li><li>Check: 0.8 + 0.1 + 0.1 = 1.0.</li></ul>\n<p>A common plan is to start with a large &epsilon; (lots of exploring) and make it smaller as the agent learns.</p>\n<details><summary>Check yourself 1</summary><p>&epsilon; = 0.1 with 2 actions. Probability of the best action? <b>Answer:</b> 0.9 + 0.05 = 0.95.</p></details>\n<details><summary>Check yourself 2</summary><p>What goes wrong if the agent never explores? <b>Answer:</b> It may stay stuck with a mediocre action and never discover a better one.</p></details>"}, {"i": "🧮", "n": "Q-learning", "h": "<h2>Q-learning: learning the value of each action</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Keep a score Q(state, action) for every choice and improve it after every step.</div><div class=\"r\"><b>🧪 Example:</b> Q(B, right) goes 0, 5, 7.5, 8.75 toward the true value 10.</div><div class=\"r\"><b>✅ Remember:</b> New Q = old Q + &alpha; &times; (reward + &gamma; &times; best next Q &minus; old Q).</div></div>\n<div class=\"one\"><b>Q-learning</b> learns a table of <b>Q-values</b>. Q(s, a) is how good it is to take action a in state s (the expected return). The agent then picks the action with the highest Q.</div>\n<h3>The update rule</h3>\n<div class=\"fm\">Q(s, a) &larr; Q(s, a) + &alpha; [ r + &gamma; &times; max Q(s', a') &minus; Q(s, a) ]</div>\n<ul><li><b>&alpha;</b> (alpha) is the learning rate: how big a step to take.</li><li><b>r</b> is the reward just received.</li><li><b>&gamma;</b> is the discount factor.</li><li><b>max Q(s', a')</b> is the best Q-value in the next state s'.</li><li>The part in brackets is the <b>error</b>: \"what I just saw\" minus \"what I expected\". We move Q a fraction &alpha; of the way toward what we saw.</li></ul>\n<h3>Worked example in the corridor (A, B, goal C)</h3>\n<p>&alpha; = 0.5 and &gamma; = 0.9. All Q-values start at 0. The agent walks A &rarr; B &rarr; C each episode. Reaching C gives +10 and ends the episode.</p>\n<p><b>Episode 1.</b></p>\n<ul><li>A &rarr; B (reward 0): Q(A, right) = 0 + 0.5 &times; [0 + 0.9 &times; 0 &minus; 0] = <b>0</b>.</li><li>B &rarr; C (reward 10): Q(B, right) = 0 + 0.5 &times; [10 + 0 &minus; 0] = <b>5</b>.</li></ul>\n<p><b>Episode 2.</b></p>\n<ul><li>A &rarr; B: Q(A, right) = 0 + 0.5 &times; [0 + 0.9 &times; 5 &minus; 0] = 0.5 &times; 4.5 = <b>2.25</b>.</li><li>B &rarr; C: Q(B, right) = 5 + 0.5 &times; [10 &minus; 5] = 5 + 2.5 = <b>7.5</b>.</li></ul>\n<div class=\"wrap\"><table><tr><th>After episode</th><th>Q(B, right)</th><th>Q(A, right)</th></tr><tr><td>1</td><td>5</td><td>0</td></tr><tr><td>2</td><td>7.5</td><td>2.25</td></tr><tr><td>3</td><td>8.75</td><td>4.5</td></tr><tr><td>4</td><td>9.375</td><td>6.19</td></tr><tr><td>5</td><td>9.69</td><td>7.31</td></tr><tr><td>True values</td><td>10</td><td>9</td></tr></table></div>\n<p>The reward information spreads backward: first B learns it is good (it is next to the goal), then A learns that moving toward B is good. The numbers keep climbing toward the true values 10 and 9. Because Q(B, right) is bigger than Q(B, left), the agent will choose \"right\".</p>\n<div class=\"an\">🌍 <b>Analogy: a rumour spreading backward.</b> The treasure is found at C. B hears \"C is great\" first. Then A hears from B. Each step passes the good news one square further back.</div>\n<details><summary>Check yourself 1</summary><p>Q(B, right) = 5, &alpha; = 0.5, reward 10 and the episode ends. New Q(B, right)? <b>Answer:</b> 5 + 0.5 &times; (10 &minus; 5) = 7.5.</p></details>\n<details><summary>Check yourself 2</summary><p>Why does A's Q-value rise only after B's? <b>Answer:</b> A's update uses the best Q-value of the next state (B), which is 0 until B learns about the goal.</p></details>"}, {"i": "🍟", "n": "Policy gradients", "h": "<h2>Policy gradients: learning with a neural network (the StatQuest way)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A neural network picks actions. We make a guess, get a reward, and use the reward to push the network's parameter up or down.</div><div class=\"r\"><b>🧪 Example:</b> Derivative 0.5 &times; reward 1.0 = 0.5. With learning rate 1.0 the step size is 0.5.</div><div class=\"r\"><b>✅ Remember:</b> Multiply the derivative by the reward. A negative reward reverses the direction.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"Reinforcement Learning with Neural Networks: Essential Concepts\"</b><br>The video reviews backpropagation, then shows why standard backpropagation falls short in reinforcement learning: <b>we do not know the correct answer</b> to compute the error. The fix, called <b>policy gradients</b>: take a <b>guess</b> to calculate the derivative, then use a <b>reward</b> to update that derivative, and finally update the parameter with the updated derivative. It explains this with a story about choosing which fries restaurant to go to, depending on how hungry you are.</div>\n<h3>The problem with ordinary backpropagation</h3>\n<p>Backpropagation (Lesson 7) needs the <b>correct answer</b> to work out the error and the slopes. In RL we usually do not know the correct action. We only find out later whether the action was good or bad, through a reward. So we need a way to learn from rewards.</p>\n<h3>The fries story</h3>\n<p>A small neural network decides where to go for fries: <b>Norm's</b> or <b>Squatch's</b>. Its input is your <b>hunger level</b> (0 = not hungry, 1 = very hungry). Its outputs are two probabilities, P(go to Norm's) and P(go to Squatch's), which add up to 1. Squatch's gives a small portion and Norm's a big one. If you are not hungry, the small portion is the right choice.</p>\n<h3>Step by step (hunger = 0.0)</h3>\n<ol><li><b>Use the network to decide.</b> At hunger 0.0 the network outputs P(Norm's) = 0.5 and P(Squatch's) = 0.5. A random number picks the restaurant. The random number is 0.2, which falls in the first half (0 to 0.5), so we go to <b>Squatch's</b>.</li><li><b>Make a guess:</b> assume going to Squatch's was the right choice. The ideal probabilities would then be P(Squatch's) = 1.0 and P(Norm's) = 0.0.</li><li><b>Calculate the derivative</b> from the difference between the ideal (1.0) and the actual (0.5) probability for Squatch's. For the bias being trained, this gives a derivative of <b>0.5</b>.</li><li><b>Find the reward</b> from the environment. We order fries at Squatch's and get a small portion. Because we are not hungry, a small portion is good. So the guess was correct and the <b>reward = +1.0</b>. (If we had received a large portion, the guess would have been wrong and the reward would be &minus;1.0.)</li><li><b>Update the derivative with the reward:</b> 0.5 &times; 1.0 = <b>0.5</b>.</li><li><b>Update the parameter</b> with gradient descent. With a learning rate of 1.0, step size = 1.0 &times; 0.5 = <b>0.5</b>.</li></ol>\n<h3>What the reward does</h3>\n<ul><li>A <b>positive reward</b> keeps the derivative's direction. The update makes the guessed action <b>more likely</b>.</li><li>A <b>negative reward</b> flips the sign. The update pushes the other way and makes the guessed action <b>less likely</b>.</li><li>The <b>size</b> of the reward changes the size of the step. The video also looks at alternative rewards, such as other numbers instead of +1 and &minus;1.</li></ul>\n<div class=\"wrap\"><table><tr><th>Step</th><th>Value in the example</th></tr><tr><td>Network output at hunger 0</td><td>P(Norm's) = 0.5, P(Squatch's) = 0.5</td></tr><tr><td>Random number and choice</td><td>0.2, so Squatch's</td></tr><tr><td>Derivative</td><td>0.5</td></tr><tr><td>Reward</td><td>+1.0 (small portion when not hungry)</td></tr><tr><td>Updated derivative</td><td>0.5 &times; 1.0 = 0.5</td></tr><tr><td>Step size (learning rate 1.0)</td><td>0.5</td></tr></table></div>\n<div class=\"an\">🌍 <b>Analogy: a coach's whistle.</b> You try a move. The coach cannot tell you the perfect move, but gives a thumbs up (+1) or thumbs down (&minus;1). A thumbs up makes you repeat it more. A thumbs down makes you do it less.</div>\n<h3>The summary of the policy gradient process</h3>\n<ol><li>Use the neural network to make a decision.</li><li>Get the actual reward from the environment.</li><li>Multiply the derivative by the reward.</li><li>Apply gradient descent with the updated derivative.</li></ol>\n<details><summary>Check yourself 1</summary><p>Derivative 0.5, reward &minus;1.0, learning rate 1.0. What is the updated derivative and step size? <b>Answer:</b> 0.5 &times; (&minus;1.0) = &minus;0.5, and the step size is 1.0 &times; (&minus;0.5) = &minus;0.5, so the update goes the opposite way.</p></details>\n<details><summary>Check yourself 2</summary><p>Why do policy gradients need a guess? <b>Answer:</b> We do not know the correct answer in advance, so we guess one, and the reward tells us whether to trust the guess.</p></details>"}, {"i": "🌍", "n": "Uses and problems", "h": "<h2>Where RL is used, and what can go wrong</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> RL works well for games, robots and control. The reward must be designed carefully.</div><div class=\"r\"><b>🧪 Example:</b> A cleaning robot rewarded for \"no dirt visible\" learns to hide the dirt.</div><div class=\"r\"><b>✅ Remember:</b> The agent does exactly what the reward asks, not what you meant.</div></div>\n<h3>Uses</h3>\n<ul><li><b>Games:</b> winning board and video games by self-play.</li><li><b>Robotics:</b> learning to walk, grasp and balance (for example, legged robots).</li><li><b>Self-driving and control:</b> steering, braking and energy management.</li><li><b>Recommendation and operations:</b> choosing what to show or how to schedule, learning from user responses.</li><li><b>Language models:</b> human-feedback rewards help to make chatbot answers more helpful and human-like.</li></ul>\n<h3>Problems to know</h3>\n<ul><li><b>Reward hacking:</b> the agent finds a cheat that earns reward without doing what you wanted. Example: a robot rewarded for \"no dirt visible\" hides dirt under a rug. So the reward must match the real goal.</li><li><b>Lots of trial and error:</b> RL can need millions of tries. That is easy in a game and risky or costly for a real robot or car.</li><li><b>Safe exploration:</b> random actions in the real world can cause harm, so exploration must be limited.</li><li><b>Delayed reward:</b> it is hard to tell which of many earlier actions deserves the credit (the credit assignment problem).</li><li><b>Explainability:</b> a learned policy may be hard to explain (see the explainable AI lesson).</li></ul>\n<div class=\"an\">🌍 <b>Analogy: a genie.</b> The agent is like a genie that gives exactly what you wished for, not what you meant. Wish carefully.</div>\n<h3>Putting it together</h3>\n<div class=\"wrap\"><table><tr><th>Idea</th><th>What it does</th></tr><tr><td>Reward and return</td><td>Define what is good, now and over time</td></tr><tr><td>Discount &gamma;</td><td>Weights near rewards more than far ones</td></tr><tr><td>Explore and exploit</td><td>Balance trying new things and using what works</td></tr><tr><td>Q-learning</td><td>Learns a score for every state-action pair</td></tr><tr><td>Policy gradients</td><td>A neural network learns the policy directly, using rewards to scale its updates</td></tr></table></div>\n<details><summary>Check yourself 1</summary><p>What is reward hacking? <b>Answer:</b> The agent earns reward by a cheat instead of doing the intended task.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is real-world RL risky? <b>Answer:</b> It needs lots of trial and error, and random exploring can cause harm or cost.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Episode = one full try from start to end.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Agent</b></td><td>The learner that takes actions</td></tr>\n<tr><td><b>Environment</b></td><td>Everything the agent interacts with</td></tr>\n<tr><td><b>State (s), action (a)</b></td><td>The situation / what the agent does</td></tr>\n<tr><td><b>Reward (r)</b></td><td>The feedback number after an action</td></tr>\n<tr><td><b>Policy (&pi;)</b></td><td>The rule for choosing actions, often probabilities</td></tr>\n<tr><td><b>Episode</b></td><td>One full try from start to end</td></tr>\n<tr><td><b>Return (G)</b></td><td>The total (discounted) reward over time</td></tr>\n<tr><td><b>Discount factor (&gamma;)</b></td><td>How much later rewards are worth compared with now</td></tr>\n<tr><td><b>Value</b></td><td>The expected return from a state</td></tr>\n<tr><td><b>Q-value</b></td><td>The expected return of taking a particular action in a particular state</td></tr>\n<tr><td><b>Exploration / exploitation</b></td><td>Trying new actions / using the best known action</td></tr>\n<tr><td><b>&epsilon;-greedy</b></td><td>Explore with probability &epsilon;, otherwise exploit</td></tr>\n<tr><td><b>Learning rate (&alpha;)</b></td><td>How big each update step is</td></tr>\n<tr><td><b>Policy gradient</b></td><td>Updating a policy network by multiplying its derivative by the reward</td></tr>\n<tr><td><b>Reward hacking</b></td><td>Earning reward by a cheat instead of the intended task</td></tr></table></div>"}];const M=[["In reinforcement learning, the learner is called the:", ["Agent", "Label", "Cluster", "Feature"], 0, "The agent takes actions in an environment."], ["What feedback does an RL agent get?", ["Rewards and penalties", "The correct answer for every example", "Cluster names", "Pixel values"], 0, "There is no answer sheet, only reward feedback."], ["Which learning type has a dog sitting for a treat?", ["Reinforcement learning", "Supervised learning", "Unsupervised learning", "Clustering"], 0, "Learning from rewards by trial and error."], ["The environment in RL is:", ["Everything the agent interacts with", "The agent's policy", "The reward formula only", "The Q-table"], 0, "It reacts to actions and gives states and rewards."], ["A state is:", ["The current situation", "A type of reward", "The learning rate", "The final answer"], 0, "For example, the robot in front of a step."], ["A policy is:", ["The rule for choosing actions", "The total reward", "The environment", "The discount factor"], 0, "It can be a table of probabilities."], ["The notation pi(s, a) = p means:", ["In state s the policy picks action a with probability p", "The reward of action a is p", "The value of state s is p", "The learning rate is p"], 0, "It is the probability of choosing action a in state s."], ["The probabilities of all actions in one state of a policy must add up to:", ["1", "0", "10", "100"], 0, "The agent must choose something."], ["An episode is:", ["One full try from start to end", "One reward", "One action", "One neural network layer"], 0, "For example one walk across the room."], ["The return is:", ["The total (discounted) reward over time", "The last reward only", "The learning rate", "The number of states"], 0, "Return = r1 + gamma r2 + gamma^2 r3 + ..."], ["Rewards 0, 0, 10 with gamma = 0.9 give a return of:", ["8.1", "9", "10", "0.9"], 0, "0.81 x 10 = 8.1."], ["Rewards 0, 0, 10 with gamma = 0.5 give a return of:", ["2.5", "5", "10", "0.5"], 0, "0.25 x 10 = 2.5."], ["A discount factor close to 0 makes the agent care about:", ["Mostly the reward right now", "Only far-away rewards", "Nothing", "Only penalties"], 0, "Later rewards are multiplied by tiny numbers."], ["The value of a state is:", ["The expected return from that state under the policy", "The reward just received", "The number of actions", "The learning rate"], 0, "States nearer rewards have higher value."], ["In the corridor, with gamma = 0.9 and a goal reward of 10, the value of A (two steps from the goal) is:", ["9", "10", "8.1", "0"], 0, "0.9 x 10 = 9."], ["Exploration means:", ["Trying new or random actions", "Repeating the best action only", "Stopping learning", "Deleting rewards"], 0, "It helps discover better options."], ["Exploitation means:", ["Using the action that currently seems best", "Choosing at random", "Ignoring rewards", "Resetting the agent"], 0, "It uses what is already known."], ["In epsilon-greedy, epsilon is the probability of:", ["Exploring with a random action", "Exploiting", "Getting a reward", "Ending the episode"], 0, "Otherwise the agent picks the best known action."], ["Epsilon = 0.3 with 3 actions. The probability of picking the best-known action is:", ["0.8", "0.7", "0.3", "0.9"], 0, "0.7 + 0.3/3 = 0.8."], ["Q(s, a) represents:", ["How good it is to take action a in state s", "The probability of state s", "The learning rate", "The number of episodes"], 0, "It is the expected return of that action."], ["In the Q-learning update, alpha is the:", ["Learning rate", "Discount factor", "Reward", "State"], 0, "It controls the step size."], ["The Q-learning target uses:", ["Reward plus gamma times the best Q of the next state", "Only the reward", "Only the old Q", "The policy probabilities"], 0, "r + gamma x max Q(s', a')."], ["Q(B, right) = 0, alpha = 0.5, reward 10, episode ends. The new Q(B, right) is:", ["5", "10", "0", "2.5"], 0, "0 + 0.5 x (10 - 0) = 5."], ["Q(B, right) = 5, alpha = 0.5, reward 10, episode ends. The new Q(B, right) is:", ["7.5", "10", "5", "15"], 0, "5 + 0.5 x (10 - 5) = 7.5."], ["Q(A, right) = 0, Q(B, right) = 5, alpha = 0.5, gamma = 0.9, reward 0. The new Q(A, right) is:", ["2.25", "4.5", "0", "5"], 0, "0.5 x (0 + 0.9 x 5) = 2.25."], ["In the corridor, why does Q(A, right) start rising only after Q(B, right) does?", ["Its update depends on the best Q of the next state B", "A has no actions", "The reward is at A", "Q-learning ignores B"], 0, "Reward information spreads backward from the goal."], ["Why does standard backpropagation fall short in RL (StatQuest)?", ["We do not know the correct answer to compute the error", "It is too fast", "It cannot use derivatives", "It needs no data"], 0, "RL gives rewards, not correct answers."], ["In the StatQuest policy gradient method, we first take a:", ["Guess to calculate the derivative", "Random weight reset", "Test set", "Cluster"], 0, "The reward then tells us how to update it."], ["In the fries example at hunger 0.0, the network's two output probabilities add up to:", ["1", "0", "2", "0.5"], 0, "0.5 + 0.5 = 1."], ["Derivative 0.5 and reward +1.0 give an updated derivative of:", ["0.5", "1.5", "-0.5", "0"], 0, "0.5 x 1.0 = 0.5."], ["Derivative 0.5 and reward -1.0 give an updated derivative of:", ["-0.5", "0.5", "1.5", "0"], 0, "A negative reward flips the direction."], ["With a learning rate of 1.0 and an updated derivative of 0.5, the step size is:", ["0.5", "1.0", "1.5", "0"], 0, "1.0 x 0.5 = 0.5."], ["A negative reward in policy gradients makes the guessed action:", ["Less likely", "More likely", "Certain", "Unchanged"], 0, "The update goes the opposite way."], ["Reward hacking means:", ["Earning reward by a cheat instead of the intended task", "Hacking a computer", "Having no reward", "A kind of exploration"], 0, "For example hiding dirt instead of cleaning it."], ["Which is a challenge of real-world RL?", ["Many trials may be costly or unsafe", "It needs no interaction", "It always has labels", "Rewards are always immediate"], 0, "Random exploring can cause harm."], ["Boston Dynamics robots are an example of:", ["Using RL ideas to learn movements through feedback", "Clustering customers", "Image classification only", "Spelling checks"], 0, "Robots can learn suitable actions through interaction."]];const K=[["Explain reinforcement learning using a dog-training example. Name the agent, environment, action, reward and penalty.", "The dog is the agent and its home is the environment. Sitting when told is an action. A treat is the reward. Jumping on the sofa gets a 'no', which is the penalty. Over many tries the dog does more of the actions that earn rewards. There is no answer sheet, only feedback."], ["Describe state, action, reward and policy with a robot example, and explain pi(s, a) = p.", "State: the robot in front of a step. Action: lift the leg, turn or wait. Reward: +1 for climbing, -1 for falling. Policy: the rule for choosing actions. pi(s, a) = p means that in state s the policy chooses action a with probability p, for example pi(s1, lift) = 0.7, pi(s1, turn) = 0.2, pi(s1, wait) = 0.1, adding up to 1."], ["Rewards in a 4-step episode are 0, 0, 0, 8 and gamma = 0.5. Calculate the return. What does gamma do?", "G = 0 + 0.5 x 0 + 0.25 x 0 + 0.125 x 8 = 1. Gamma discounts later rewards. A value near 1 makes the agent patient. A value near 0 makes it care mostly about immediate rewards."], ["Explain exploration versus exploitation and calculate the epsilon-greedy probabilities for epsilon = 0.2 with 2 actions.", "Exploitation uses the action that currently seems best. Exploration tries other actions to discover better ones. With epsilon = 0.2 and 2 actions, random exploration gives each action 0.2 / 2 = 0.1. The best-known action has probability 0.8 + 0.1 = 0.9, the other 0.1. The total is 1."], ["Using alpha = 0.5 and gamma = 0.9 in the corridor A, B, goal C (reward 10), calculate Q(B, right) and Q(A, right) after episodes 1 and 2. All Q start at 0.", "Episode 1: Q(A, right) = 0 + 0.5 x (0 + 0.9 x 0 - 0) = 0. Q(B, right) = 0 + 0.5 x (10 - 0) = 5. Episode 2: Q(A, right) = 0 + 0.5 x (0 + 0.9 x 5 - 0) = 2.25. Q(B, right) = 5 + 0.5 x (10 - 5) = 7.5."], ["Explain why standard backpropagation is not enough for RL and how policy gradients solve it.", "Backpropagation needs the correct answer to work out the error and slopes, but in RL we do not know the right action, only a reward afterwards. Policy gradients take a guess to calculate the derivative, then multiply the derivative by the reward (positive reward keeps its direction, negative reward flips it), and apply gradient descent with the updated derivative."], ["In the fries example, derivative 0.5, reward +1.0 and learning rate 1.0. Calculate the updated derivative and step size. What happens if the reward is -1.0?", "Updated derivative = 0.5 x 1.0 = 0.5. Step size = 1.0 x 0.5 = 0.5. With reward -1.0 the updated derivative is -0.5 and the step is -0.5, so the update goes in the opposite direction and makes the guessed action less likely."], ["Give two uses of RL and two problems.", "Uses: game playing, robotics (learning to walk), driving and control, and improving chatbot responses with human feedback. Problems: reward hacking (the agent cheats the reward), the need for many trials (costly or unsafe in the real world), delayed rewards (credit assignment), and hard-to-explain policies."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
