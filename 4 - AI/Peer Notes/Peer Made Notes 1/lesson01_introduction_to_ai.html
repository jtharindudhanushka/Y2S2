<div class="topbar"><div><h1>Lesson 1: Introduction to AI</h1><div class="sub">What AI is, where it came from, and how machines learn. Short steps, everyday pictures, check-yourself questions.</div></div><span class="source-tag">Lesson 1 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌱", "n": "What is AI?", "h": "<h2>What is AI?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> AI means making machines do things that normally need human thinking.</div><div class=\"r\"><b>🧪 Example:</b> Face unlock on a phone recognises your face. A chess program picks the best move.</div><div class=\"r\"><b>✅ Remember:</b> Only narrow AI (ANI) exists today. General AI (AGI) and super AI (ASI) are still ideas.</div></div>\n<div class=\"one\">Artificial Intelligence (AI) is the science of making machines do tasks that normally need a human brain: thinking, learning, seeing, understanding speech and making decisions.</div>\n<h3>Start with a picture</h3>\n<p>Think of a calculator. It is brilliant at one thing: adding and multiplying. But it cannot recognise your face, play chess or hold a conversation. Now think of a person. A person can learn to do almost anything. AI sits somewhere between these two pictures. That is why we describe AI in <b>three levels</b>.</p>\n<div class=\"grid\"><div class=\"L a1\"><b>ANI</b><br>Artificial <u>Narrow</u> Intelligence (also called \"weak AI\")<br>Does <b>one job</b> very well.<br><i>Face unlock, spam filter, translator, chess engine.</i><br><b>This is all the AI that exists today.</b></div>\n<div class=\"L a2\"><b>AGI</b><br>Artificial <u>General</u> Intelligence (also called \"strong AI\")<br>Could learn and do <b>any</b> thinking job a human can.<br><b>Does not exist yet.</b></div>\n<div class=\"L a3\"><b>ASI</b><br>Artificial <u>Super</u> Intelligence<br>Would be <b>smarter than all humans</b> at everything, even creativity and feelings.<br><b>Does not exist yet.</b></div></div>\n<div class=\"an\">🌍 <b>Memory trick:</b> <b>N</b>arrow = one job. <b>G</b>eneral = any job, like a human. <b>S</b>uper = better than every human.</div>\n<h3>Why is it called a \"disruptive technology\"?</h3>\n<p>\"Disruptive\" means it does not just make old tools a little better. It changes how whole industries work, like smartphones changed cameras, maps and shopping.</p>\n<p><b>Examples of disruptive technologies:</b> AI, smartphones, cloud computing, blockchain and the internet. Another example is <b>blockchain</b>. For a long time, <b>centralization</b> (one authority holds and controls the data) was the base of modern technology. Blockchain introduced <b>decentralization</b> (no single owner) as an alternative. Both systems exist side by side, and the choice depends on the use case.</p>\n<h3>Why do we need to study AI?</h3>\n<p>To face disruptive technologies and to create new products and tools. AI can give better solutions to the problems we face (often by <b>optimization</b>: finding the best answer). AI is the science of developing techniques to generate intelligence artificially. A simple picture: humans have a \"carbon brain\" and AI is a \"silicon brain\".</p>\n<h3>Strong AI and weak AI (older names)</h3>\n<ul><li><b>Strong AI:</b> a machine that is truly thinking like a human brain, with the functionality of a real human brain. (This is close to what we now call AGI.)</li><li><b>Weak AI:</b> a machine that pretends to be intelligent and performs a function, such as browsing the internet, disease detection or the recommendations on a shopping site. (This is close to ANI.)</li></ul>\n<p><b>More examples of narrow AI (ANI):</b> voice assistants like Siri and Alexa, Google Maps and face recognition systems. <b>AGI</b> would be able to learn new tasks without being retrained. A hypothetical example is a robot that can study, cook, drive and solve problems like a human.</p>\n<details><summary>Check yourself 1</summary><p>A chess program is which type of AI? <b>Answer:</b> ANI, because it does only one job.</p></details>\n<details><summary>Check yourself 2</summary><p>Which type of AI could do any thinking task a human can? <b>Answer:</b> AGI. It does not exist yet.</p></details>"}, {"i": "⏳", "n": "A short history", "h": "<h2>A short history of AI</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> AI got its name in 1956. World War II pushed computers forward.</div><div class=\"r\"><b>🧪 Example:</b> Alan Turing helped break the Enigma code. In 1959 Arthur Samuel's checkers program learned to beat its own creator.</div><div class=\"r\"><b>✅ Remember:</b> 1950 Turing Test. 1956 the name \"AI\" (McCarthy). 1959 the name \"Machine Learning\" (Samuel).</div></div>\n<div class=\"one\">AI did not appear overnight. A few key moments explain where it came from.</div>\n<div class=\"tl\">\n<div><span class=\"yr\">1939 to 1945: World War II.</span> Wars need fast thinking. <b>Enigma</b> was a German machine that scrambled messages into secret code. <b>Alan Turing</b> helped build a machine called the <b>Bombe</b> to find the settings and break the code. <b>Colossus</b> and <b>ENIAC</b> became some of the first electronic computers.</div>\n<div><span class=\"yr\">1943.</span> McCulloch and Pitts made the first maths model of an <b>artificial neuron</b>. (You will see neurons again in Lesson 7.)</div>\n<div><span class=\"yr\">1948.</span> <b>Norbert Wiener</b> wrote about <b>Cybernetics</b>: systems that sense, adjust and act in a loop. A thermostat is a simple example: it senses the temperature and switches the heater on or off.</div>\n<div><span class=\"yr\">1950.</span> Alan Turing asked, <b>\"Can machines think?\"</b> and proposed the <b>Turing Test</b>.</div>\n<div><span class=\"yr\">1956.</span> The <b>Dartmouth Conference</b>. <b>John McCarthy</b> named the field <b>\"Artificial Intelligence\"</b>. (He also made LISP, an early AI programming language.) <b>Marvin Minsky</b> helped found the field and the MIT AI Lab.</div>\n<div><span class=\"yr\">1959.</span> <b>Arthur Samuel</b> at IBM named <b>\"Machine Learning\"</b>: computers learning without being given every step. His checkers program learned to beat its creator.</div></div>\n<h3>The Turing Test, in simple words</h3>\n<p>A judge chats by text with two hidden players: a human and a machine. If the judge cannot tell which is the machine, the machine <b>passes</b>. It tests whether a machine <i>behaves</i> like a human, not whether it truly understands.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> a phone call where you must guess whether the voice is a real person or a robot.</div>\n<h3>A challenge to the Turing Test: the Chinese Room (John Searle)</h3>\n<p>Imagine a person who does <b>not</b> understand Chinese, sitting in a room with a huge, very powerful rule book (a knowledge base). Questions written in Chinese are passed in. The person looks up the rules, follows them (a mapping function from question to answer) and passes out perfect answers in Chinese. To someone outside, it looks as if the person understands Chinese. But inside, nobody understands anything: they are just following rules.</p>\n<p>Searle's point: <b>a computer can act intelligent without really being intelligent.</b> It may pass a test like the Turing Test just by following rules, without any understanding.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> a parrot that repeats perfect sentences. It sounds clever, but it does not know what the words mean.</div>\n<details><summary>Check yourself 1</summary><p>Who named \"Artificial Intelligence\", and in which year? <b>Answer:</b> John McCarthy, 1956.</p></details>\n<details><summary>Check yourself 2</summary><p>When does a machine pass the Turing Test? <b>Answer:</b> When the judge cannot tell it apart from the human.</p></details>"}, {"i": "📜", "n": "Rules vs data", "h": "<h2>Two ways to build AI: rules or data</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Old AI follows rules that people write. New AI learns the rules from examples.</div><div class=\"r\"><b>🧪 Example:</b> Rule-based: \"If the email says WIN MONEY, it is spam.\" Data-driven: learn from 10,000 emails already marked spam or not spam.</div><div class=\"r\"><b>✅ Remember:</b> Data-driven AI wins today because of big data and fast computers.</div></div>\n<div class=\"one\">There are two big ways to build an AI system. Understanding the difference is the key to this whole module.</div>\n<h3>Way 1: write the rules (GOFAI)</h3>\n<p>GOFAI means \"Good Old-Fashioned AI\". Experts write the rules by hand and the computer follows them. It is also called <b>rule-based</b> or <b>symbolic</b> AI. An <b>expert system</b> is a program that stores an expert's rules, such as \"if fever and rash, then possible measles\".</p>\n<p><b>Rule-based approach:</b> facts and rules are written with symbols. Example: <b>IF temperature &gt; 38&deg;C THEN the patient has a fever.</b> Rule-based programming languages include <b>Prolog</b> and <b>LISP</b> (LISP is not rule-based by default but can be used for rule-based AI; McCarthy created it to implement these ideas).</p>\n<p><b>Data-driven approach:</b> we have lots of data, and from the data we find patterns in the environment, with a continuous feed of new data. Today the rule-based approach is called <b>GOFAI</b> and the data-driven approach is called <b>Machine Learning</b>.</p>\n<h3>Way 2: learn from data</h3>\n<p>Nobody writes the rules. We show the computer thousands of examples and it finds the pattern itself.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> Rule-based AI is cooking from a recipe book: you follow exact steps someone wrote. Data-driven AI is a child learning what a dog is by seeing many dogs. Nobody gave the child a rule book.</div>\n<h3>Why does data-driven AI work so well today?</h3>\n<ul><li><b>Lots of data</b> from phones, websites and sensors.</li><li><b>Huge computing power.</b> A <b>GPU</b> is a chip that does thousands of small calculations at the same time. A <b>TPU</b> is a chip made by Google for AI maths. <b>Cloud computing</b> means renting powerful computers over the internet.</li></ul>\n<h3>Big data and the 3 Vs</h3>\n<p>\"Big data\" is described with three words (Doug Laney, 2001):</p>\n<div class=\"grid\"><div class=\"card\"><b>📦 Volume</b><br>How <b>much</b> data</div><div class=\"card\"><b>⚡ Velocity</b><br>How <b>fast</b> new data arrives</div><div class=\"card\"><b>🎨 Variety</b><br>How many <b>types</b>: tables, text, video, audio</div></div>\n<div class=\"an\">🌍 <b>Analogy: a river.</b> Volume = how much water. Velocity = how fast it flows. Variety = what floats in it: fish, leaves, plastic.</div>\n<details><summary>Check yourself 1</summary><p>What does GOFAI use? <b>Answer:</b> Rules written by people.</p></details>\n<details><summary>Check yourself 2</summary><p>Name the 3 Vs. <b>Answer:</b> Volume, Velocity, Variety.</p></details>"}, {"i": "🧠", "n": "How machines learn", "h": "<h2>How a machine learns: the StatQuest story</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Build a model from training data. Judge it on testing data it has never seen.</div><div class=\"r\"><b>🧪 Example:</b> A wiggly line can fit the training dots perfectly and still predict new dots badly.</div><div class=\"r\"><b>✅ Remember:</b> Choose a method by how well it does on testing data, not by how fancy it is.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"A Gentle Introduction to Machine Learning\"</b><br>The video says machine learning is all about making <b>predictions</b> and <b>classifications</b>. It shows this with two examples, a decision tree and a line fitted to dots, and then makes one big point: <b>to decide which method is best, test it on data it has not seen.</b> The three parts below follow the video.</div>\n<h3>Part 1: a decision tree (classification)</h3>\n<p>A decision tree is a set of yes/no questions that ends in a prediction. In the video, a silly tree predicts whether a person will love StatQuest:</p>\n<div class=\"tree\">Do they like machine learning?\n ├─ Yes → they will love StatQuest\n └─ No  → Do they like statistics?\n          ├─ Yes → they will love StatQuest\n          └─ No  → they might not love StatQuest</div>\n<p>(In the video the tree also asks about silly songs first, but the answers lead to the same result. The idea is what matters: questions lead to a prediction.) <b>Classification</b> means predicting a category, like \"will love\" or \"will not love\".</p>\n<h3>Part 2: a line fitted to dots (prediction of a number)</h3>\n<p>The video imagines measuring how much yam people eat and how fast they run the 100 metres. Each person is a dot. A straight line through the dots shows the trend: more yam, faster running. To predict, you read a new person's yam amount, go to the line, and read off the predicted speed. This is called <b>regression</b> (predicting a number).</p>\n<h3>Part 3: training data and testing data</h3>\n<p>The dots we use to build the model are the <b>training data</b>. We draw two lines on them:</p>\n<ul><li>A <b>straight black line</b> that goes through the middle of the dots, missing some of them a little.</li><li>A <b>wiggly green squiggle</b> that touches almost every training dot, so it fits the training data better.</li></ul>\n<p>Which is better? You cannot tell from the training dots alone. So we measure <b>new people</b> that the model has never seen. These are the <b>testing data</b>. For each new person, measure the distance between the prediction and the real speed, then add up all the distances. This is the <b>total error</b>.</p>\n<div class=\"wrap\"><table><tr><th>Model</th><th>Total error on training data</th><th>Total error on testing data</th></tr><tr><td>Straight black line</td><td>8</td><td>12</td></tr><tr><td>Wiggly green squiggle</td><td>0</td><td>30</td></tr></table></div>\n<p>(These numbers are an example to show the pattern.) The squiggle looks perfect on the training data (error 0) but is much worse on the testing data (error 30). The black line is the better model, because it predicts new people better. When a model fits the training data very well but predicts new data badly, we call it <b>overfitting</b>. It has memorised the training dots, including their random wiggles.</p>\n<div class=\"an\">🌍 <b>Analogy: practice papers and the real exam.</b> Training data = practice papers. Testing data = the real exam with new questions. A student who memorises the answers of the practice papers may score 100% at home and still fail the real exam.</div>\n<h3>The big message</h3>\n<ul><li>There are many fancy machine learning methods (deep learning, neural networks, and new ones every year).</li><li>The most important thing is <b>not</b> how fancy the method is. It is <b>how well it predicts the testing data</b>.</li><li>So we try several methods, test each one on the testing data, and pick the best.</li><li>Which dots become training and which become testing is a choice. There are proper ways to decide the split (you will see 80% training and 20% testing in Lesson 5).</li></ul>\n<details><summary>Check yourself 1</summary><p>A model has training error 0 and testing error 30. Another has training error 8 and testing error 12. Which is better? <b>Answer:</b> The second one, because it predicts unseen data better. The first is overfitting.</p></details>\n<details><summary>Check yourself 2</summary><p>What do we use testing data for? <b>Answer:</b> To measure how well a model predicts data it has never seen, so we can choose the best method.</p></details>"}, {"i": "🕸️", "n": "The AI map", "h": "<h2>The AI map: how the big words fit together</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> AI is the big umbrella. Machine learning sits inside it, then neural networks, then deep learning.</div><div class=\"r\"><b>🧪 Example:</b> ChatGPT is a transformer, which is a kind of deep learning model.</div><div class=\"r\"><b>✅ Remember:</b> AI contains ML, which contains NN, which contains DL.</div></div>\n<div class=\"one\">You will hear many big words: AI, ML, neural networks, deep learning. They are not separate things. They fit inside each other like Russian dolls.</div>\n<div class=\"c c1\">AI (the whole umbrella)<div class=\"c c2\" style=\"margin-top:8px\">ML: learns from data<div class=\"c c3\" style=\"margin-top:8px\">NN: neural networks, brain-inspired<div class=\"c c4\" style=\"margin-top:8px\">DL: deep learning, networks with many layers<div class=\"c c5\" style=\"margin-top:8px\">Transformers (used in ChatGPT)</div></div></div></div></div>\n<ul><li><b>Neural network (NN):</b> layers of simple connected units that pass numbers along, loosely inspired by the brain.</li><li><b>Deep learning (DL):</b> a neural network with many layers.</li><li><b>Transformer:</b> a deep learning model that reads all the words of a text together and decides which words matter to each other.</li></ul>\n<h3>Other AI methods that sit beside machine learning</h3>\n<div class=\"grid\"><div class=\"card\"><b>GA</b><br>Genetic Algorithms: copy evolution to find good answers (Lesson 4)</div><div class=\"card\"><b>SI</b><br>Swarm Intelligence: copy ants and birds</div><div class=\"card\"><b>FL</b><br>Fuzzy Logic: \"degrees of true\" instead of only true or false</div><div class=\"card\"><b>RB</b><br>Rule-Based systems (the GOFAI style)</div></div>\n<p>These methods can be <b>mixed</b> (hybridized). For example, Learning Classifier Systems (LCS) combine ideas from genetic algorithms and machine learning.</p>\n<details><summary>Check yourself 1</summary><p>Put in order, biggest to smallest: DL, AI, NN, ML. <b>Answer:</b> AI, ML, NN, DL.</p></details>\n<details><summary>Check yourself 2</summary><p>What does \"deep\" mean in deep learning? <b>Answer:</b> The neural network has many layers.</p></details>"}, {"i": "🔮", "n": "Predict or create", "h": "<h2>Predictive AI and Generative AI</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Predictive AI answers questions about data. Generative AI makes new things.</div><div class=\"r\"><b>🧪 Example:</b> Predict a house price (regression). Write a poem (generative).</div><div class=\"r\"><b>✅ Remember:</b> A label means classification. A number means regression. A future value means time series.</div></div>\n<div class=\"one\">Most AI does one of two jobs: it <b>predicts</b> something from data, or it <b>creates</b> something new.</div>\n<div class=\"an\">🌍 <b>Analogy:</b> Predictive AI is an <b>examiner</b> who checks and labels things. Generative AI is an <b>artist</b> who makes something new.</div>\n<h3>Predictive AI: three kinds</h3>\n<div class=\"wrap\"><table><tr><th>Kind</th><th>The answer is...</th><th>Example</th></tr><tr><td><b>Classification</b></td><td>A category</td><td>Is this email spam or not?</td></tr><tr><td><b>Regression</b></td><td>A number</td><td>What will this house sell for?</td></tr><tr><td><b>Time series forecasting</b></td><td>A future value, using past values in time order</td><td>What will tomorrow's temperature be?</td></tr></table></div>\n<h3>Generative AI</h3>\n<p>It <b>creates</b> new text, images, audio, video or code. For example, ChatGPT writes text one word at a time, and music-generation AI makes new songs. This is also called <b>Gen AI</b>.</p>\n<p>Predictive AI is also called <b>discriminative AI</b>: it is used to classify or predict something from input data, such as email spam detection or face recognition.</p>\n<details><summary>Check yourself 1</summary><p>Predicting a student's final mark out of 100 is which kind? <b>Answer:</b> Regression, because the answer is a number.</p></details>\n<details><summary>Check yourself 2</summary><p>Deciding if a photo shows a cat or a dog is which kind? <b>Answer:</b> Classification, because the answer is a category.</p></details>"}, {"i": "👁️", "n": "AI agents", "h": "<h2>How AI interacts with the world</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An AI system senses, thinks and acts in a loop.</div><div class=\"r\"><b>🧪 Example:</b> Robot vacuum: a bump sensor feels a wall, the system picks a new path, the wheels turn.</div><div class=\"r\"><b>✅ Remember:</b> Sensors in, system decides, actuators out.</div></div>\n<div class=\"one\">An AI system often works as a loop: it senses the world, decides what to do, and acts. Then it senses again.</div>\n<div class=\"flow\"><div class=\"chip\">👀 Sensors<br><small>camera, microphone</small></div><span class=\"arr\">➜</span><div class=\"chip\">🧠 Intelligent system<br><small>decides</small></div><span class=\"arr\">➜</span><div class=\"chip\">🦾 Actuators<br><small>motors, outputs</small></div></div>\n<div class=\"an\">🌍 <b>Analogy: you.</b> Your eyes and ears sense. Your brain decides. Your hands and legs act. Then you look again.</div>\n<h3>Embodied and disembodied AI</h3>\n<div class=\"two\"><div><b>🚗 Embodied AI</b><br>Has a physical body and acts in the real world.<br><i>A self-driving car, a robot vacuum.</i></div><div><b>💬 Disembodied AI</b><br>Software only, with no body.<br><i>ChatGPT, a spam filter.</i></div></div>\n<p>More examples: embodied AI includes self-driving cars and humanoid robots. Disembodied AI includes ChatGPT and Google Translate.</p>\n<details><summary>Check yourself 1</summary><p>What do actuators do? <b>Answer:</b> They act on the world, like motors and wheels.</p></details>\n<details><summary>Check yourself 2</summary><p>Is a spam filter embodied or disembodied? <b>Answer:</b> Disembodied, because it is software only.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the difficult words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> GPU = a chip that does thousands of small calculations at the same time.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Algorithm</b></td><td>Step-by-step instructions to solve a problem, like a recipe</td></tr>\n<tr><td><b>Enigma</b></td><td>A German machine that scrambled messages into secret code in WWII</td></tr>\n<tr><td><b>Bombe</b></td><td>Turing's machine that helped break the Enigma code</td></tr>\n<tr><td><b>Colossus, ENIAC</b></td><td>Among the first electronic computers (1940s)</td></tr>\n<tr><td><b>Cybernetics</b></td><td>Systems that sense, adjust and act in a loop, like a thermostat</td></tr>\n<tr><td><b>LISP, Prolog</b></td><td>Old programming languages made for AI</td></tr>\n<tr><td><b>Expert system</b></td><td>A program that stores an expert's if-then rules</td></tr>\n<tr><td><b>GPU, TPU</b></td><td>Chips that do thousands of small calculations at once. Great for AI maths.</td></tr>\n<tr><td><b>Cloud computing</b></td><td>Renting powerful computers over the internet</td></tr>\n<tr><td><b>Model</b></td><td>The pattern a machine learns from data</td></tr>\n<tr><td><b>Training data</b></td><td>The examples used to build a model</td></tr>\n<tr><td><b>Testing data</b></td><td>New examples used only to check the model</td></tr>\n<tr><td><b>Overfitting</b></td><td>Fitting the training data too closely, so new data is predicted badly</td></tr>\n<tr><td><b>Decision tree</b></td><td>A set of yes/no questions that leads to a prediction</td></tr></table></div>"}];const M=[["Which type of AI exists today?", ["AGI", "ASI", "ANI", "All three"], 2, "All current AI is ANI. AGI and ASI are only ideas."], ["Which AI could do ANY thinking task a human can?", ["ANI", "AGI", "GOFAI", "Weak AI"], 1, "AGI is Strong or human-level AI."], ["Who named 'Artificial Intelligence' at the 1956 Dartmouth Conference?", ["Alan Turing", "Arthur Samuel", "John McCarthy", "Norbert Wiener"], 2, "McCarthy named it. Samuel named Machine Learning in 1959."], ["The machine passes the Turing Test when:", ["It answers every question right", "The judge cannot tell it from the human", "It wins at chess", "It does maths fast"], 1, "It is about human-like conversation."], ["Who named 'Machine Learning' with a checkers program?", ["Minsky", "Turing", "Arthur Samuel", "Laney"], 2, "Arthur Samuel, IBM, 1959."], ["GOFAI mainly uses:", ["Big data", "Hand-written rules and logic", "Neural networks", "Random guesses"], 1, "GOFAI is rule-based or symbolic AI."], ["Why did data-driven AI win recently?", ["More rules", "Big data and strong computing (GPU, TPU, cloud)", "Small data", "The Turing Test"], 1, "Lots of data plus fast hardware."], ["The 3 Vs of Big Data are:", ["Volume, Velocity, Variety", "Value, Version, Variance", "Volume, Validity, Vision", "Velocity, Vector, Variety"], 0, "Amount, speed and types of data."], ["A GPU is useful for AI because it:", ["Stores rules", "Does thousands of small calculations at the same time", "Writes the code", "Connects to the internet"], 1, "AI maths is lots of small calculations."], ["An expert system is a program that:", ["Learns from big data", "Stores an expert's if-then rules", "Has a robot body", "Writes poems"], 1, "It is a rule-based (GOFAI) system."], ["In StatQuest, the dots used to build the model are called:", ["Testing data", "Training data", "Noise", "Labels only"], 1, "Training data builds the model."], ["In StatQuest, the new people measured to judge the model are called:", ["Training data", "Testing data", "The model", "The tree"], 1, "Testing data is new data the model has not seen."], ["A wiggly line touches every training dot but predicts new dots badly. This is:", ["Underfitting", "Overfitting", "A perfect model", "Classification"], 1, "It memorised the training data."], ["Model A: training error 8, testing error 12. Model B: training error 0, testing error 30. Which should we choose?", ["Model A", "Model B", "Both equal", "Neither"], 0, "Choose by the testing error, which is lower for A."], ["The most important thing when choosing a machine learning method is:", ["How fancy it is", "How new it is", "How well it predicts the testing data", "How many layers it has"], 2, "Testing performance decides."], ["A decision tree predicting 'will love StatQuest or not' is an example of:", ["Classification", "Regression", "Clustering", "Generation"], 0, "The answer is a category."], ["Predicting a person's 100 m speed from the amount of yam eaten is:", ["Classification", "Regression", "Clustering", "Generation"], 1, "The answer is a number."], ["Predicting an exact house price is:", ["Classification", "Regression", "Clustering", "Generation"], 1, "A number means regression."], ["Which is inside the other? (biggest to smallest)", ["DL, NN, ML, AI", "AI, ML, NN, DL", "ML, AI, DL, NN", "AI, NN, ML, DL"], 1, "AI contains ML, which contains NN, which contains DL."], ["Which is embodied AI?", ["ChatGPT", "Spam filter", "Self-driving car", "Chess website"], 2, "It has a body with sensors and actuators."], ["Actuators are used to:", ["Sense the world", "Decide", "Act on the world", "Store data"], 2, "Sensors sense, the system decides, actuators act."], ["A thermostat that senses temperature and switches a heater is an example of:", ["Cybernetics (sense, adjust, act)", "A transformer", "Deep learning", "Clustering"], 0, "Wiener's cybernetics is about sense-adjust-act loops."], ["Cloud computing means:", ["Weather prediction", "Renting powerful computers over the internet", "A type of neural network", "Storing data on paper"], 1, "You use someone else's powerful machines."], ["Which is an example of a disruptive technology?", ["Smartphones", "A paper clip", "A pencil", "A chalkboard"], 0, "Disruptive technologies change the normal way things are done and replace older methods."], ["Blockchain is described as a disruptive technology because it introduced:", ["Decentralization as an alternative to centralization", "More central control", "Slower computers", "Paper records"], 0, "Both centralized and decentralized systems exist, depending on the use case."], ["Weak AI is best described as AI that:", ["Pretends to be intelligent and performs a function", "Truly thinks like a human", "Is smarter than humans", "Has no software"], 0, "Examples: disease detection and recommender systems."], ["In Searle's Chinese Room argument, the person in the room:", ["Follows rules to give answers without understanding Chinese", "Understands Chinese perfectly", "Is a computer expert", "Cannot answer"], 0, "A computer can act intelligent without real understanding."], ["'IF temperature > 38 THEN the patient has a fever' is an example of:", ["A rule-based (GOFAI) rule", "A neural network", "A genetic algorithm", "Unsupervised learning"], 0, "It is an if-then rule written with symbols."], ["Today the data-driven approach is called:", ["Machine Learning", "GOFAI", "Prolog", "Cybernetics"], 0, "The rule-based approach is GOFAI."]];const K=[["A friend says 'ChatGPT is AGI'. Do you agree? Explain.", "No. ChatGPT is a narrow AI (ANI). It is very good at language tasks but cannot do every thinking task a human can. AGI is still an idea. ChatGPT is also disembodied (software only)."], ["Why did AI move from rule-based GOFAI to data-driven AI?", "Writing rules by hand for every situation is slow and cannot cover messy real life. Today we have big data (volume, velocity, variety) and strong computing (GPU, TPU, cloud), so machines can learn the patterns themselves."], ["Why must we judge a model on testing data and not on training data? Use the line and squiggle example.", "The squiggle touches every training dot, so its training error is 0, but it has memorised the random wiggles and predicts new people badly (testing error 30). The straight line has a bigger training error (8) but predicts new people better (12). Testing data shows how a model will really perform, so we choose the line. A model that fits training data very well but tests badly is overfitting."], ["Explain the sense-think-act loop using a robot vacuum.", "Sensors (bump sensor, camera) find walls and dirt. The intelligent system decides the path. Actuators (wheels, brush) move and clean. Then it senses again and repeats. It is embodied AI."], ["Explain the difference between classification, regression and time series forecasting with one example each.", "Classification predicts a category (spam or not spam). Regression predicts a number (a house price). Time series forecasting predicts a future value from past values in time order (tomorrow's temperature)."], ["Explain the Chinese Room argument and what it says about the Turing Test.", "A person who does not understand Chinese sits in a room with a huge rule book. Chinese questions come in, the person follows the rules and passes out perfect Chinese answers. From outside it looks like understanding, but inside there is none. Searle argues that a computer can act intelligent just by following rules without real understanding, so passing a test like the Turing Test does not prove real intelligence."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
