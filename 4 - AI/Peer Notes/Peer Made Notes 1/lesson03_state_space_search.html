<div class="topbar"><div><h1>Lesson 3: State Space Search</h1><div class="sub">How an AI finds a path to a goal: states, operators, BFS, DFS, heuristics, A* and famous hard problems.</div></div><span class="source-tag">Lesson 3 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🧭", "n": "What is AI search?", "h": "<h2>What is AI search, and why does it matter?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> AI search is finding a sequence of steps that leads from a starting situation to a goal.</div><div class=\"r\"><b>🧪 Example:</b> Finding the shortest route from A to E on a map.</div><div class=\"r\"><b>✅ Remember:</b> Three aims of search: find a solution, find all solutions, find the best solution.</div></div>\n<div class=\"one\">AI search is the process of finding a <b>sequence of actions</b> (steps) that leads from an <b>initial state</b> to a <b>goal state</b>.</div>\n<div class=\"an\">🌍 <b>Analogy: finding your way in a new city.</b> You are at the bus stand (start). You want to reach the hotel (goal). You try roads, turn back from dead ends, and compare routes. That trial and comparison is search.</div>\n<h3>Where search is used</h3>\n<ul><li><b>Problem solving</b> (puzzles, scheduling).</li><li><b>Game playing</b> (finding moves, avoiding obstacles).</li><li><b>Route planning</b> (maps and navigation).</li><li><b>Optimization</b> (finding the best settings).</li></ul>\n<h3>Why search is important in AI</h3>\n<ul><li>It lets machines make intelligent decisions.</li><li>It solves complex problems.</li><li>It lets us navigate huge search spaces to find <b>optimal</b> (best) or <b>near-optimal</b> (almost best) solutions.</li></ul>\n<p>Problem-solving AI agents, such as AI assistants that plan tasks or answer questions, need to do some search to get their job done.</p>\n<h3>Three aims of a search</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>1. Find a solution</b><br>Any answer that works.</div><div class=\"L a2\"><b>2. Find all the solutions</b><br>Every answer that works.</div><div class=\"L a3\"><b>3. Find the best solution</b><br>The answer with the lowest cost or highest value.</div></div>\n<h3>Search appears in many places</h3>\n<ol><li><b>Weights of a neural network.</b> Finding the best weight values is a search. Each training cycle changes the weights and reduces the output error. We look for the weight value where the error is lowest (Lesson 7).</li><li><b>Linear regression.</b> We can try many (m, c) pairs for the line y = m x + c. The best pair is the one with the least error, found by search (Lesson 6).</li><li><b>Path-finding agents.</b> To find the shortest distance from A to E on a map with many routes, we search among the possible routes.</li><li><b>The travelling salesman problem.</b> Visit every city once and come back, as cheaply as possible (see the \"Famous problems\" tab).</li><li><b>Games.</b> A game character needs search to find a path that avoids obstacles and to pick the best moves.</li></ol>\n<div class=\"why\"><b>State space search is the core idea behind much of AI.</b> The next tab shows how we describe a search problem.</div>\n<details><summary>Check yourself 1</summary><p>Name the three aims of search. <b>Answer:</b> Find a solution, find all solutions, find the best solution.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is choosing the best weights in a neural network called a search? <b>Answer:</b> We try different weight values and look for the ones that give the lowest error.</p></details>"}, {"i": "🔎", "n": "State space search", "h": "<h2>State space search: describing the problem</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Describe a problem as states joined by legal steps, then explore from the start to a goal.</div><div class=\"r\"><b>🧪 Example:</b> In a maze, each spot is a state and each move is an operator.</div><div class=\"r\"><b>✅ Remember:</b> Initial state, operators, state space, goal test. The answer is the path.</div></div>\n<div class=\"one\">In <b>state space search</b> the problem is a set of situations (<b>states</b>). The computer moves from one state to another using legal steps until it reaches a state that passes the goal test.</div>\n<div class=\"an\">🌍 <b>Analogy: a maze or GPS.</b> Every spot in the maze is a <b>state</b>. Every move is an <b>operator</b>. Where you start is the <b>initial state</b>. The exit is the <b>goal</b>.</div>\n<h3>The 4 parts</h3>\n<div class=\"grid\"><div class=\"L a1\"><b>Initial state</b><br>Where the problem starts.</div><div class=\"L a2\"><b>Operators</b><br>The legal steps that change one state into another.</div><div class=\"L a3\"><b>State space</b><br>All the states reachable from the initial state.</div><div class=\"L a4\"><b>Goal test</b><br>A check for whether a state is an acceptable answer.</div></div>\n<p>The \"instructions\" that change one state into another are called <b>operators</b>.</p>\n<h3>What is a state?</h3>\n<p>A state is a possible solution configuration: a complete snapshot of the problem at one moment, holding everything needed to decide what can happen next.</p>\n<ul><li>Every state is a candidate answer. The goal state is the one that passes the goal test.</li><li>States are written compactly, for example the pair (2, 4).</li><li><b>Two states are the same if their contents are identical</b>, even if they were reached by different paths. This is what lets us avoid repeating work.</li></ul>\n<h3>The answer is the path</h3>\n<p>The answer is the <b>path</b>, the sequence of operators used, not just the final state. A GPS gives you the route, not only the address.</p>\n<h3>The same idea in classical AI and in ML</h3>\n<div class=\"wrap\"><table><tr><th></th><th>Classical search</th><th>Machine learning</th></tr><tr><td>The states are</td><td>Separate and countable (a chess board is in one arrangement or another)</td><td>Sets of parameter values, such as neural network weights, which are real numbers</td></tr><tr><td>Type of space</td><td>Discrete</td><td>Continuous: infinitely many states between any two</td></tr><tr><td>How we move</td><td>Apply an operator to jump to the next state</td><td>Take small steps guided by gradient descent</td></tr><tr><td>The goal</td><td>One exact state</td><td>A region of low error</td></tr></table></div>\n<div class=\"an\">🌍 <b>Analogy: stairs and a ramp.</b> Discrete = stairs: you stand on step 2 or step 3, never 2.4. Continuous = a ramp: endless positions in between. The idea is the same (find a good configuration in a space of possibilities). Only the shape of the space and the way we move differ.</div>\n<details><summary>Check yourself 1</summary><p>What are the 4 parts of a search problem? <b>Answer:</b> Initial state, operators, state space, goal test.</p></details>\n<details><summary>Check yourself 2</summary><p>Are the states (3, 1) reached two different ways the same state? <b>Answer:</b> Yes. States with identical contents are the same state, whatever path reached them.</p></details>"}, {"i": "🌊", "n": "BFS", "h": "<h2>Breadth-First Search (BFS)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Search the whole breadth first: every state at depth 1, then depth 2, and so on.</div><div class=\"r\"><b>🧪 Example:</b> On the tree A, B, C, D, E, F the order is A, B, C, D, E, F.</div><div class=\"r\"><b>✅ Remember:</b> Queue, visited list, complete, shortest path, high memory.</div></div>\n<div class=\"sq\"><b>Blind search has many names</b><br>Breadth-first and depth-first search are called <b>uninformed</b>, <b>blind</b>, <b>exhaustive</b> or <b>brute force</b> search. They know only the operators and the goal test. They cannot tell which state is closer to the goal.</div>\n<div class=\"one\">BFS explores the search tree <b>level by level</b>, horizontally. It uses a <b>queue</b> (first in, first out) and a <b>visited list</b> of generated states, used to prune repeats.</div>\n<div class=\"an\">🌍 <b>Analogy: ripples on a pond.</b> Drop a stone and the ripple widens one ring at a time. Or: check every room on floor 1, then every room on floor 2.</div>\n<h3>The steps</h3>\n<ol><li>Put the initial state in the queue and mark it visited.</li><li>Remove the front state. If it passes the goal test, stop and return the path.</li><li>Apply every operator to it.</li><li>Discard successors that cause no change or are already visited.</li><li>Add the rest to the back of the queue, mark them visited, and repeat.</li></ol>\n<h3>Worked example on a small tree</h3>\n<div class=\"tree\">        A\n       / \\\n      B   C\n     / \\   \\\n    D   E   F  (goal)</div>\n<div class=\"wrap\"><table><tr><th>Step</th><th>Take from the front</th><th>Queue after adding children</th></tr><tr><td>1</td><td>A</td><td>B, C</td></tr><tr><td>2</td><td>B</td><td>C, D, E</td></tr><tr><td>3</td><td>C</td><td>D, E, F</td></tr><tr><td>4</td><td>D</td><td>E, F</td></tr><tr><td>5</td><td>E</td><td>F</td></tr><tr><td>6</td><td>F: goal found</td><td></td></tr></table></div>\n<h3>Properties</h3>\n<ul><li><b>Complete:</b> yes. If a solution exists, BFS finds it.</li><li><b>Optimal:</b> yes, when every step costs the same. The first goal found is the shallowest.</li><li><b>Time and space:</b> about b<sup>d</sup>, where b is the <b>branching factor</b> (choices per state) and d is the depth of the goal. With b = 2 and d = 3: 2 &times; 2 &times; 2 = <b>8</b> states. With b = 10 and d = 5: <b>100,000</b>.</li><li><b>Weakness:</b> memory, since a whole level must be held at once.</li></ul>\n<details><summary>Check yourself 1</summary><p>Which structure does BFS use? <b>Answer:</b> A queue.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is BFS memory-hungry? <b>Answer:</b> It stores a whole level of the tree at once, and the number of states grows like b<sup>d</sup>.</p></details>"}, {"i": "🕳️", "n": "DFS", "h": "<h2>Depth-First Search (DFS)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Follow one branch as deep as possible, then back up (backtrack) to try another.</div><div class=\"r\"><b>🧪 Example:</b> On the same tree the order is A, B, D, E, C, F.</div><div class=\"r\"><b>✅ Remember:</b> Stack, low memory, not complete, not guaranteed shortest.</div></div>\n<div class=\"one\">DFS follows <b>one branch as deep as possible</b>, then <b>backtracks</b> to the most recent state that still has an unexplored option. It uses a <b>stack</b> (last in, first out), or recursion.</div>\n<div class=\"an\">🌍 <b>Analogy: exploring one tunnel to its end.</b> You walk to the end, then walk back to the last junction and try a different tunnel.</div>\n<h3>Worked example (same tree)</h3>\n<p>We take the top item of the stack and push its children, with the first child on top.</p>\n<div class=\"wrap\"><table><tr><th>Step</th><th>Take from the top</th><th>Stack after pushing children (top first)</th></tr><tr><td>1</td><td>A</td><td>B, C</td></tr><tr><td>2</td><td>B</td><td>D, E, C</td></tr><tr><td>3</td><td>D</td><td>E, C</td></tr><tr><td>4</td><td>E</td><td>C</td></tr><tr><td>5</td><td>C</td><td>F</td></tr><tr><td>6</td><td>F: goal found</td><td></td></tr></table></div>\n<p>DFS visited A, B, D, E, C, F. It went all the way down the left side before trying C.</p>\n<h3>Properties</h3>\n<ul><li><b>Complete:</b> no. It can loop forever in a deep or cyclic space.</li><li><b>Optimal:</b> no.</li><li><b>Time:</b> about b<sup>m</sup>, where m is the maximum depth.</li><li><b>Space:</b> about b &times; m. Its strength is <b>low memory use</b>, since it keeps only one branch.</li></ul>\n<h3>BFS compared with DFS</h3>\n<div class=\"wrap\"><table><tr><th></th><th>BFS</th><th>DFS</th></tr><tr><td>Order</td><td>Level by level (wide)</td><td>Branch by branch (deep)</td></tr><tr><td>Structure</td><td>Queue</td><td>Stack</td></tr><tr><td>Shortest path</td><td>Guaranteed (equal step costs)</td><td>Not guaranteed</td></tr><tr><td>Complete?</td><td>Yes</td><td>No</td></tr><tr><td>Memory</td><td>High</td><td>Low</td></tr></table></div>\n<details><summary>Check yourself 1</summary><p>Which structure does DFS use? <b>Answer:</b> A stack (or recursion).</p></details>\n<details><summary>Check yourself 2</summary><p>Why does DFS need little memory? <b>Answer:</b> It stores only the current branch (about b &times; m states).</p></details>"}, {"i": "🫙", "n": "The two-jug puzzle", "h": "<h2>A full BFS example: the two-jug puzzle</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Use BFS to measure exactly 2 litres with a 3L jug and a 4L jug.</div><div class=\"r\"><b>🧪 Example:</b> Start (0,0). Fill the 4L jug to get (0,4). Pour into the 3L jug to get (3,1).</div><div class=\"r\"><b>✅ Remember:</b> Prune repeats with a visited list. BFS finds the goal (2,0) after 5 steps.</div></div>\n<div class=\"one\">Two jugs with no markings: 3 litres and 4 litres, with unlimited water. Measure exactly 2 litres.</div>\n<h3>Set it up</h3>\n<ul><li><b>State:</b> (x, y), where x = litres in the 3L jug and y = litres in the 4L jug.</li><li><b>Initial state:</b> (0, 0). <b>Goal:</b> (2, 0) or (0, 2).</li></ul>\n<h3>The 6 operators (tried in this order)</h3>\n<div class=\"wrap\"><table><tr><th>No.</th><th>Operator</th><th>Result</th></tr><tr><td>1</td><td>Fill 3L</td><td>(3, y)</td></tr><tr><td>2</td><td>Fill 4L</td><td>(x, 4)</td></tr><tr><td>3</td><td>Empty 3L</td><td>(0, y)</td></tr><tr><td>4</td><td>Empty 4L</td><td>(x, 0)</td></tr><tr><td>5</td><td>Pour 3L into 4L</td><td>pour until the 4L jug is full or the 3L jug is empty</td></tr><tr><td>6</td><td>Pour 4L into 3L</td><td>pour until the 3L jug is full or the 4L jug is empty</td></tr></table></div>\n<p><b>How much does a pour move?</b> The smaller of (what the source holds) and (the free space in the other jug). From (0, 4), pour 4L into 3L: the source holds 4 and the 3L jug has 3 free, so 3 litres move and we get (3, 1).</p>\n<p>A successor is <b>discarded</b> if it causes no change, or if it is already visited. Otherwise the search would repeat work and loop.</p>\n<h3>Run BFS</h3>\n<div class=\"wrap\"><table><tr><th>Level</th><th>Queue</th><th>Expanded</th><th>New states added</th></tr>\n<tr><td>0</td><td>(0,0)</td><td>(0,0)</td><td>(3,0), (0,4)</td></tr>\n<tr><td>1</td><td>(3,0), (0,4)</td><td>both</td><td>(3,4), (0,3), (3,1)</td></tr>\n<tr><td>2</td><td>(3,4), (0,3), (3,1)</td><td>all three</td><td>(3,3), (0,1)</td></tr>\n<tr><td>3</td><td>(3,3), (0,1)</td><td>both</td><td>(2,4), (1,0)</td></tr>\n<tr><td>4</td><td>(2,4), (1,0)</td><td>(2,4)</td><td>(2,0): goal</td></tr></table></div>\n<p>The goal is found 5 steps from the start. Eleven states out of twenty were generated. The rest were never needed.</p>\n<h3>The answer is the path</h3>\n<p>(0,0) &rarr; (3,0) &rarr; (0,3) &rarr; (3,3) &rarr; (2,4) &rarr; (2,0). In words: fill the 3L jug, pour it into the 4L jug, fill the 3L jug again, pour into the 4L jug until it is full (leaving 2 litres in the 3L jug), then empty the 4L jug.</p>\n<h3>What the example shows</h3>\n<ul><li><b>BFS is blind.</b> It never knew (3,3) was better than (3,4). It expanded both because both were on the same level.</li><li><b>Pruning is essential.</b> Without the visited list, (3,0) would regenerate (0,0), which would regenerate (3,0), forever. It also removed the duplicate (3,4) that two parents both produced.</li><li><b>The first goal found is the shortest</b>, because no level is skipped.</li><li><b>The cost is memory.</b> A whole level is stored at once, which is why heuristic search was developed.</li></ul>\n<div class=\"why\">The order in which you try the operators is a choice. A different order can change the order in which states are found, but BFS still finds a shortest path.</div>\n<details><summary>Check yourself 1</summary><p>From (3, 0), what does \"pour 3L into 4L\" give? <b>Answer:</b> (0, 3). The 3L jug holds 3 and the 4L jug has 4 free, so 3 litres move.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is the first goal that BFS finds a shortest path? <b>Answer:</b> BFS checks level by level and never skips a level.</p></details>"}, {"i": "🧭", "n": "Heuristics and A*", "h": "<h2>Informed search: heuristics, Greedy, Uniform cost and A*</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Use a smart guess h(n) of the distance to the goal to search the most promising states first.</div><div class=\"r\"><b>🧪 Example:</b> A* scores a state by f = g + h: cost so far plus the guess of the cost to go.</div><div class=\"r\"><b>✅ Remember:</b> Greedy uses only h. Uniform cost uses only g. A* uses g + h.</div></div>\n<div class=\"one\">A <b>heuristic</b> h(n) estimates how close a state is to the goal. A lower value means a more promising state. It lets the search expand promising states first, which greatly reduces the number of expansions. It is an <b>estimate, not a guarantee</b>.</div>\n<div class=\"an\">🌍 <b>Analogy: the hot-and-cold game, or Google Maps.</b> A map app knows the straight-line distance to your destination. It uses this to try roads that head the right way first. Google Maps style route finding uses this idea (the A* method).</div>\n<h3>Examples of heuristics</h3>\n<ul><li>The straight-line distance to a destination.</li><li>The number of misplaced tiles in the 8-puzzle.</li></ul>\n<h3>Three methods, one small map</h3>\n<p>Start S, goal G. Roads (with distance): S&ndash;A 1, S&ndash;B 4, A&ndash;B 2, A&ndash;G 6, B&ndash;G 3. The heuristic h(n) is the guessed distance to G: h(S) = 5, h(A) = 4, h(B) = 2, h(G) = 0. The costs of the full routes: S&rarr;A&rarr;B&rarr;G = 1 + 2 + 3 = <b>6</b>. S&rarr;B&rarr;G = 4 + 3 = 7. S&rarr;A&rarr;G = 1 + 6 = 7. The best route is S, A, B, G with cost 6.</p>\n<h3>1. Uniform Cost Search (uninformed)</h3>\n<p>Always expand the state with the <b>smallest total path cost so far</b>, g(n). It finds the lowest-cost path, but it does not use any guess about the goal, so it can explore many states.</p>\n<h3>2. Greedy Best-First Search (informed)</h3>\n<p>Always expand the state with the smallest h(n), ignoring the cost so far. From S the neighbours are A (h = 4) and B (h = 2), so it goes to B, then to G (h = 0). The route S, B, G costs <b>7</b>. It is fast, but it is <b>not guaranteed to be the best route</b>.</p>\n<h3>3. A* (A-star)</h3>\n<div class=\"fm\">f(n) = g(n) + h(n)</div>\n<p>g(n) = the real cost from the start to n. h(n) = the guessed cost from n to the goal. A* always expands the state with the smallest f. If h never overestimates the true remaining cost (an <b>admissible</b> heuristic), A* finds the shortest path.</p>\n<div class=\"wrap\"><table><tr><th>Step</th><th>Expand</th><th>What A* finds (g, h, f)</th></tr>\n<tr><td>1</td><td>S (f = 0 + 5 = 5)</td><td>A: g = 1, h = 4, f = 5. B: g = 4, h = 2, f = 6.</td></tr>\n<tr><td>2</td><td>A (smallest f = 5)</td><td>B through A: g = 1 + 2 = 3, f = 3 + 2 = 5 (better than 6, so update). G through A: g = 1 + 6 = 7, f = 7.</td></tr>\n<tr><td>3</td><td>B (f = 5)</td><td>G through B: g = 3 + 3 = 6, f = 6 + 0 = 6 (better than 7, so update).</td></tr>\n<tr><td>4</td><td>G (f = 6)</td><td>Goal reached. Total cost 6.</td></tr></table></div>\n<p>A* returns S &rarr; A &rarr; B &rarr; G with cost <b>6</b>, the best route, and it used the guess to avoid wandering.</p>\n<div class=\"wrap\"><table><tr><th>Method</th><th>Uses</th><th>Best route guaranteed?</th></tr><tr><td>Uniform cost</td><td>g(n) only</td><td>Yes</td></tr><tr><td>Greedy best-first</td><td>h(n) only</td><td>No (found cost 7 here)</td></tr><tr><td>A*</td><td>g(n) + h(n)</td><td>Yes, with an admissible h</td></tr></table></div>\n<details><summary>Check yourself 1</summary><p>g = 3 and h = 4 for a state. What is f in A*? <b>Answer:</b> f = 3 + 4 = 7.</p></details>\n<details><summary>Check yourself 2</summary><p>Why can Greedy best-first miss the best route? <b>Answer:</b> It looks only at the guess h(n) and ignores the cost already spent.</p></details>"}, {"i": "🌉", "n": "Why not equations?", "h": "<h2>Why not solve it with equations?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Straight-line maths methods (like linear programming) assume linear, continuous, convex problems. Search problems are not.</div><div class=\"r\"><b>🧪 Example:</b> A jug holds 2 or 3 litres, never 2.4.</div><div class=\"r\"><b>✅ Remember:</b> The answer is a sequence of actions, so we explore step by step.</div></div>\n<div class=\"one\">The graphical and simplex methods come from <b>Linear Programming (LP)</b>. They assume a linear objective, linear constraints, continuous variables and a convex region of allowed answers.</div>\n<h3>What is linear programming?</h3>\n<p><b>Example:</b> a bakery makes cakes (profit 5 each) and cookies (profit 2 each). A cake takes 2 hours, a cookie takes 1 hour, and there are 10 hours. Maximize 5 &times; cakes + 2 &times; cookies, with 2 &times; cakes + cookies &le; 10.</p>\n<p>The best answer is at a <b>corner</b> of the allowed area. Corners: (0 cakes, 0 cookies) gives profit 0. (5, 0) gives 25. (0, 10) gives 20. The best is 5 cakes, profit 25. The <b>graphical method</b> draws the limits on a graph and picks the best corner. The <b>simplex method</b> hops from corner to corner.</p>\n<h3>Why they cannot be used for search problems</h3>\n<ul><li><b>The world is not linear.</b> Real relationships are curved, conditional and interacting.</li><li><b>Many states are discrete.</b> A jug holds 2 litres or 3, never 2.4 as a meaningful answer.</li><li><b>The answer is a sequence of actions,</b> not a single point. LP returns values, not a plan.</li><li><b>Constraints are logical rules</b> (\"you cannot pour into a full jug\"), not linear inequalities.</li><li>The graphical method works only for two or three variables.</li><li>In a <b>non-convex</b> space (a shape with dents and several peaks), a corner point is not guaranteed to be the best, so simplex logic fails.</li></ul>\n<p>So we must explore the space <b>step by step</b> instead of solving it algebraically.</p>\n<details><summary>Check yourself 1</summary><p>Why can't LP give the steps of the jug puzzle? <b>Answer:</b> LP returns values, not a sequence of actions, and the jug rules are logical, not linear.</p></details>\n<details><summary>Check yourself 2</summary><p>What does \"convex\" mean? <b>Answer:</b> A shape with no dents, so a best corner is guaranteed.</p></details>"}, {"i": "🧳", "n": "Famous problems", "h": "<h2>Famous search problems: travelling salesman and knapsack</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Some search problems have so many possible answers that trying them all is impossible for big cases.</div><div class=\"r\"><b>🧪 Example:</b> 10 cities have 9! = 362,880 routes with a fixed start. 20 cities have about 1.2 &times; 10<sup>17</sup>.</div><div class=\"r\"><b>✅ Remember:</b> For n cities with a fixed start there are (n &minus; 1)! orders.</div></div>\n<h3>The travelling salesman problem (TSP)</h3>\n<p>A salesman must visit each city exactly once and come back to the starting city. All cities are connected and the paths work both ways. Find the cheapest (shortest) tour.</p>\n<p>With a fixed starting city, there are <b>(n &minus; 1)!</b> possible orders for n cities. (The sign ! means factorial: 4! = 4 &times; 3 &times; 2 &times; 1 = 24.)</p>\n<div class=\"wrap\"><table><tr><th>Cities n</th><th>Routes (n &minus; 1)!</th></tr><tr><td>5</td><td>4! = 24</td></tr><tr><td>10</td><td>9! = 362,880</td></tr><tr><td>20</td><td>19! = 121,645,100,408,832,000 (about 1.2 &times; 10<sup>17</sup>)</td></tr></table></div>\n<p>(If a route and its reverse count as the same tour, the number is half of this.)</p>\n<p>TSP is called <b>NP-hard</b>: there is no known fast method that always finds the best tour for every size. When the problem is large, trying every route cannot be done. So we use smart methods such as heuristics and genetic algorithms (Lesson 4) to find very good routes.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> planning a delivery round through 20 shops. Even if you could check a million routes every second, 1.2 &times; 10<sup>17</sup> routes would take about 3,800 years. You need a clever shortcut.</div>\n<h3>The knapsack problem</h3>\n<p>You have a bag that can carry a limited weight, and items with a weight and a value. Choose the items with the <b>greatest total value</b> without going over the weight limit.</p>\n<p><b>Example:</b> weight limit 5. Items: A (weight 2, value 3), B (weight 3, value 4), C (weight 4, value 5).</p>\n<div class=\"wrap\"><table><tr><th>Choice</th><th>Total weight</th><th>Total value</th><th>Allowed?</th></tr><tr><td>A + B</td><td>5</td><td>7</td><td>Yes</td></tr><tr><td>A + C</td><td>6</td><td>8</td><td>No, too heavy</td></tr><tr><td>B + C</td><td>7</td><td>9</td><td>No, too heavy</td></tr><tr><td>C alone</td><td>4</td><td>5</td><td>Yes</td></tr><tr><td>B alone</td><td>3</td><td>4</td><td>Yes</td></tr></table></div>\n<p>The best allowed choice is A + B with value 7. With many items, the number of combinations explodes, so it is also a hard search problem.</p>\n<details><summary>Check yourself 1</summary><p>How many routes for 6 cities with a fixed start? <b>Answer:</b> 5! = 120.</p></details>\n<details><summary>Check yourself 2</summary><p>In the knapsack example, why is A + C not allowed? <b>Answer:</b> Its weight is 2 + 4 = 6, which is over the limit of 5.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Backtrack = go back to the last choice and try another.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Search</b></td><td>Finding a sequence of steps from a start to a goal</td></tr>\n<tr><td><b>State</b></td><td>A snapshot of the problem at one moment, like (3, 1)</td></tr>\n<tr><td><b>Operator</b></td><td>A legal step that changes one state into another</td></tr>\n<tr><td><b>State space</b></td><td>All the states reachable from the start</td></tr>\n<tr><td><b>Goal test</b></td><td>A check that says whether a state is an answer</td></tr>\n<tr><td><b>Path</b></td><td>The list of steps from the start to the goal</td></tr>\n<tr><td><b>Visited list</b></td><td>States already seen, to avoid repeating them</td></tr>\n<tr><td><b>Pruning</b></td><td>Dropping states that are repeats or add nothing</td></tr>\n<tr><td><b>Blind (uninformed) search</b></td><td>Search that knows only operators and the goal test (BFS, DFS)</td></tr>\n<tr><td><b>Queue / stack</b></td><td>First in, first out / last in, first out</td></tr>\n<tr><td><b>Backtrack</b></td><td>Go back to the last choice and try another</td></tr>\n<tr><td><b>Branching factor (b), depth (d)</b></td><td>Choices per state / steps to the goal</td></tr>\n<tr><td><b>Complete</b></td><td>Always finds a solution if one exists</td></tr>\n<tr><td><b>Optimal</b></td><td>Always finds the best solution</td></tr>\n<tr><td><b>Heuristic h(n)</b></td><td>A guess of how close a state is to the goal</td></tr>\n<tr><td><b>g(n)</b></td><td>The real cost from the start to state n</td></tr>\n<tr><td><b>Admissible</b></td><td>A heuristic that never overestimates the true remaining cost</td></tr>\n<tr><td><b>NP-hard</b></td><td>No known fast method that always finds the best answer for every size</td></tr>\n<tr><td><b>Discrete / continuous</b></td><td>Separate steps like stairs / endless values like a ramp</td></tr></table></div>"}];const M=[["Which is NOT one of the 4 parts of a search problem?", ["Initial state", "Operators", "Goal test", "Learning rate"], 3, "Learning rate is from machine learning. The 4 parts: initial state, operators, state space, goal test."], ["The legal steps that change a state are called:", ["Heuristics", "Operators", "Goals", "Nodes"], 1, "Operators move you between states."], ["What is the real answer to a search problem?", ["Only the final state", "The path (sequence of operators)", "The number of states", "The heuristic value"], 1, "Like a GPS: you need the route, not just the address."], ["BFS uses which data structure?", ["Stack", "Queue", "Heap", "Table"], 1, "Queue = first in, first out = level by level."], ["DFS uses a:", ["Queue", "Stack (or recursion)", "Heap", "Table"], 1, "Stack = last in, first out = deep first."], ["On the tree A -> (B, C), B -> (D, E), C -> F, BFS visits the states in the order:", ["A, B, D, E, C, F", "A, B, C, D, E, F", "A, C, B, F, E, D", "F, C, B, A"], 1, "BFS goes level by level."], ["On the same tree, DFS (first child first) visits the states in the order:", ["A, B, C, D, E, F", "A, B, D, E, C, F", "A, C, F, B, D, E", "D, E, B, F, C, A"], 1, "DFS goes deep along B before trying C."], ["BFS with equal step costs always:", ["Loops forever", "Finds the shortest path", "Uses little memory", "Needs a heuristic"], 1, "It checks level by level, so the first goal found is the shallowest."], ["The main weakness of BFS is:", ["It is not complete", "High memory use", "It cannot find goals", "It needs derivatives"], 1, "A whole level must be stored at once."], ["Why can DFS fail to find a solution?", ["It uses a queue", "It can follow a deep or looping branch forever", "It checks every state", "It uses a heuristic"], 1, "It may never return from an endless branch."], ["A state space has branching factor b = 3 and the goal at depth d = 4. Roughly how many states, using b^d?", ["12", "64", "81", "7"], 2, "3 x 3 x 3 x 3 = 81."], ["A heuristic h(n) is:", ["An exact guaranteed distance", "An estimate of closeness to the goal", "An operator", "The goal test"], 1, "A smart guess, like warmer or colder."], ["Towns have h = 6, 2 and 9. A heuristic search tries first the town with h =", ["6", "2", "9", "All together"], 1, "The smallest h is the closest."], ["Why can't linear programming solve the jug puzzle?", ["It is too slow to type", "The steps are separate and rule-based, and the answer is a sequence", "It needs a queue", "It needs more jugs"], 1, "LP assumes straight-line limits and gives values, not sequences."], ["Classic search is ___ and ML parameter search is ___.", ["continuous, discrete", "discrete, continuous", "blind, informed", "fast, slow"], 1, "Stairs (separate steps) vs a ramp (endless values between)."], ["In the jug puzzle, the two children of (0,0) are:", ["(3,3) and (0,1)", "(3,0) and (0,4)", "(2,0) and (0,2)", "(3,4) and (0,3)"], 1, "Fill 3L gives (3,0). Fill 4L gives (0,4). Other operators change nothing."], ["From (0, 4), pouring the 4L jug into the 3L jug gives:", ["(3, 1)", "(0, 0)", "(4, 0)", "(3, 4)"], 0, "The 3L jug has 3 litres of free space, so 3 litres move."], ["In the jug puzzle, BFS finds the goal (2, 0) after how many steps from the start?", ["2", "4", "5", "11"], 2, "The goal is found when expanding depth 4, so it is 5 steps from the start."], ["Why keep a visited list in BFS?", ["To count states", "To stop repeated states and endless loops", "To compute the heuristic", "To speed up the goal test"], 1, "Without it (3,0) and (0,0) would keep recreating each other."], ["Linear programming works best when:", ["All limits and goals are straight lines", "The steps are separate and rule-based", "The answer is a sequence of actions", "There is no goal"], 0, "LP needs linear limits."], ["AI search is the process of finding:", ["A sequence of actions from an initial state to a goal state", "Only the last state", "A random number", "A colour"], 0, "Search finds the steps that lead to the goal."], ["Which is NOT one of the three aims of a search?", ["Find a solution", "Find all solutions", "Find the best solution", "Delete the problem"], 3, "The aims are: find a solution, find all solutions, find the best solution."], ["Choosing the best weights of a neural network is an example of:", ["A search for the values with the lowest error", "A sorting task", "A crisp rule", "A colour change"], 0, "We try different weights and look for the lowest error."], ["In linear regression, the search is over:", ["Pairs (m, c) for the line y = m x + c", "City names", "Image channels", "Jug sizes"], 0, "The best pair is the one with the least error."], ["Blind search is also called:", ["Uninformed, exhaustive or brute force search", "A* search", "Heuristic search", "Fuzzy search"], 0, "It knows only operators and the goal test."], ["DFS uses about how much memory?", ["b x m (one branch)", "b^d (a whole level)", "Zero", "The same as BFS"], 0, "That is why its memory use is low."], ["In A*, the score of a state is:", ["f(n) = g(n) + h(n)", "f(n) = h(n) only", "f(n) = g(n) only", "f(n) = g(n) x h(n)"], 0, "Cost so far plus the guessed cost to go."], ["Greedy best-first search expands the state with:", ["The smallest h(n)", "The smallest g(n)", "The largest f(n)", "A random choice"], 0, "It looks only at the guess."], ["Uniform cost search expands the state with:", ["The smallest total path cost so far, g(n)", "The smallest h(n)", "The most children", "The fewest children"], 0, "It finds the lowest-cost path without using a guess."], ["On the map S-A 1, S-B 4, A-B 2, A-G 6, B-G 3, the cheapest route from S to G costs:", ["6", "7", "8", "4"], 0, "S, A, B, G: 1 + 2 + 3 = 6."], ["With the same map and h(S) = 5, h(A) = 4, h(B) = 2, h(G) = 0, Greedy best-first from S goes to:", ["B", "A", "G directly", "Stays at S"], 0, "B has the smallest h (2)."], ["For 5 cities with a fixed start, how many tour orders are there (n - 1)!?", ["24", "120", "5", "4"], 0, "4! = 24."], ["In the knapsack example (limit 5; A weight 2 value 3; B weight 3 value 4; C weight 4 value 5), the best allowed choice is:", ["A + B (value 7)", "A + C (value 8)", "B + C (value 9)", "C alone (value 5)"], 0, "A + B weighs 5 and is worth 7. The others heavier than 5 are not allowed, and C alone is worth only 5."], ["TSP is described as NP-hard. This means:", ["No known fast method always finds the best tour for every size", "It is always easy", "It has no solution", "It needs no search"], 0, "For large problems we use heuristics and methods like genetic algorithms."]];const K=[["Explain how BFS and DFS differ, using the tree A -> (B, C), B -> (D, E), C -> F.", "BFS uses a queue and visits level by level: A, B, C, D, E, F. DFS uses a stack and goes deep first: A, B, D, E, C, F. BFS finds the shortest path but needs more memory. DFS needs little memory but may follow a loop forever and does not guarantee the shortest path."], ["Why is BFS called 'blind' search? How does a heuristic help?", "BFS knows only the operators and the goal test. It cannot tell which state is closer to the goal, so it expands every state on a level equally. A heuristic scores each state by estimated closeness to the goal, so the search tries the best-looking states first, usually reaching the goal faster. It is only an estimate."], ["Give two reasons why graphical or simplex methods cannot solve the two-jug problem.", "(1) The states are separate (a jug holds 2 or 3 litres, not 2.4) and the rules are logical ('cannot pour into a full jug'), not straight-line limits. (2) The answer is a sequence of actions, but LP gives only values."], ["In the two-jug problem, expand (0,4) using the 6 operators. Which new states appear?", "Fill 3L gives (3,4): already generated by (3,0), so it is dropped. Fill 4L: no change. Empty 3L: no change. Empty 4L gives (0,0): visited. Pour 3L into 4L: nothing to pour. Pour 4L into 3L gives (3,1): NEW. So only (3,1) is added."], ["Explain the three aims of search and give two examples of search from this lesson.", "The aims are to find a solution, to find all solutions and to find the best solution. Examples: finding the best weights of a neural network (searching for the lowest error), finding the best (m, c) for a line in linear regression, finding the shortest route on a map, the travelling salesman problem, and choosing moves in games."], ["Explain how A* works on the map S-A 1, S-B 4, A-B 2, A-G 6, B-G 3 with h(S) = 5, h(A) = 4, h(B) = 2, h(G) = 0. State the route and its cost.", "A* expands the state with the smallest f = g + h. S: f = 5. It finds A (g = 1, f = 5) and B (g = 4, f = 6). Expand A: B through A has g = 3, f = 5, so B is updated; G through A has g = 7, f = 7. Expand B: G through B has g = 6, f = 6, so G is updated. Expand G: done. Route S, A, B, G with cost 6."], ["Compare Uniform cost, Greedy best-first and A*.", "Uniform cost expands by g(n), the cost so far, and finds the cheapest path but uses no guess. Greedy best-first expands by h(n) only, which is fast but may miss the best route. A* uses f(n) = g(n) + h(n), and finds the best route when h never overestimates the true remaining cost."], ["Why is the travelling salesman problem hard? Use numbers.", "With a fixed start there are (n - 1)! tour orders. For 5 cities that is 24, for 10 cities 362,880, and for 20 cities about 1.2 x 10^17. Trying every route is impossible for large n, and no known fast method always finds the best tour (NP-hard), so we use heuristics or methods such as genetic algorithms."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
