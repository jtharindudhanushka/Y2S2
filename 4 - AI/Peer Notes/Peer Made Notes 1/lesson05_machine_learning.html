<div class="topbar"><div><h1>Lesson 5: Machine Learning</h1><div class="sub">Learning from data: how machines predict, group and improve. Short steps, everyday pictures and worked numbers.</div></div><span class="source-tag">Lesson 5 of 12</span></div>
<div id="main"></div></div></main>
<script>
const T=[{"i": "🌱", "n": "What is ML?", "h": "<h2>What is machine learning?</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A computer learns patterns from examples and uses them to predict or decide. Nobody writes the rules.</div><div class=\"r\"><b>🧪 Example:</b> Show it 1,000 photos labelled cat or dog. It learns the difference, then names a new photo.</div><div class=\"r\"><b>✅ Remember:</b> Data in, pattern (the model) learned, predictions out.</div></div>\n<div class=\"one\">Machine learning (ML) is a branch of AI where a computer system learns patterns from data and uses those patterns to make predictions, decisions or new content.</div>\n<div class=\"an\">🌍 <b>Analogy: learning to spot a ripe mango.</b> Nobody gives you a rule book. You see many mangoes and slowly learn: yellow and slightly soft means ripe. After enough mangoes you can judge a new one you have never seen. A computer does this with numbers instead of mangoes.</div>\n<h3>Where ML sits</h3>\n<p>ML is one branch of AI. Genetic algorithms, swarm intelligence and fuzzy logic are other AI methods that sit beside it (Lesson 1). The pattern that ML learns is called a <b>model</b>.</p>\n<h3>Two big kinds of ML work</h3>\n<div class=\"grid\"><div class=\"L a4\"><b>🎯 Predictive</b><br>Predict an outcome from given information.<br><i>Example: predict next month's sales or a student's exam marks.</i></div><div class=\"L a5\"><b>🎨 Generative</b><br>Create new content based on learned patterns.<br><i>Example: predict the next word, again and again, to write text.</i></div></div>\n<div class=\"why\"><b>Careful:</b> people often say \"supervised ML is mostly predictive, unsupervised is generative\". But understand the difference: <b>unsupervised</b> is about <i>how</i> a machine learns (no answers given). <b>Generative</b> is about <i>what</i> it makes (new content). They overlap, but they are not the same thing.</div>\n<h3>The four jobs ML can do</h3>\n<ol><li><b>Regression:</b> predict a number.</li><li><b>Classification:</b> predict a category.</li><li><b>Forecasting:</b> predict future values from past values in time order.</li><li><b>Optimization:</b> find the best possible answer for one or more goals (like the genetic algorithm in Lesson 4).</li></ol>\n<details><summary>Check yourself 1</summary><p>Is \"predict the temperature tomorrow\" classification or regression? <b>Answer:</b> Regression, because the answer is a number.</p></details>\n<details><summary>Check yourself 2</summary><p>What is a \"model\"? <b>Answer:</b> The pattern a machine learns from data.</p></details>"}, {"i": "🧩", "n": "3 ways to learn", "h": "<h2>The three ways a machine can learn</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Learn with answers, learn without answers, or learn from rewards.</div><div class=\"r\"><b>🧪 Example:</b> Emails marked spam or not (supervised). Sorting shoppers into groups (unsupervised). A game character earning points (reinforcement).</div><div class=\"r\"><b>✅ Remember:</b> Answers given? Supervised. No answers? Unsupervised. Rewards and penalties? Reinforcement.</div></div>\n<div class=\"one\">The three types are three different ways of learning: with a teacher, without a teacher, or by trial and error.</div>\n<div class=\"grid\"><div class=\"L a1\"><b>👩‍🏫 Supervised (SL)</b><br>Learns with a teacher. The data has questions AND correct answers.</div><div class=\"L a2\"><b>🔍 Unsupervised (USL)</b><br>No teacher. The data has no answers. The machine finds groups and patterns itself.</div><div class=\"L a3\"><b>🎮 Reinforcement (RL)</b><br>Learns by trying actions and getting rewards or penalties.</div></div>\n<h3>One picture for each</h3>\n<ul><li><b>Supervised:</b> studying past exam questions together with their model answers. Later you answer a new question.</li><li><b>Unsupervised:</b> sorting a pile of mixed buttons into groups by shape and colour, with nobody telling you the groups.</li><li><b>Reinforcement:</b> training a puppy. A treat for sitting, no treat for jumping on the sofa.</li></ul>\n<h3>Supervised learning splits again</h3>\n<ul><li>Predicting a <b>class</b> (classification).</li><li>Predicting a <b>number</b> (regression).</li><li>Predicting a <b>value from a time series</b> (forecasting).</li></ul>\n<h3>The quickest way to tell them apart</h3>\n<ol><li>Does the data have correct answers? <b>Supervised.</b></li><li>No answers, just finding groups? <b>Unsupervised.</b></li><li>An agent acting and getting rewards? <b>Reinforcement.</b></li></ol>\n<details><summary>Check yourself 1</summary><p>A robot learns to walk by getting a reward for each step forward. Which type? <b>Answer:</b> Reinforcement learning.</p></details>\n<details><summary>Check yourself 2</summary><p>Grouping customers by behaviour with no labels is which type? <b>Answer:</b> Unsupervised learning (clustering).</p></details>"}, {"i": "🧱", "n": "Data words", "h": "<h2>The words used to describe data</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A data table has rows (records), columns (features) and one answer column (the label).</div><div class=\"r\"><b>🧪 Example:</b> Row = one student. Features = hours studied and attendance. Label = final grade.</div><div class=\"r\"><b>✅ Remember:</b> Features go in. The label is what the model tries to predict.</div></div>\n<div class=\"one\">Before we go further, learn the small set of words used for data. Every ML topic uses them.</div>\n<div class=\"wrap\"><table><tr><th>Student</th><th>Hours studied (x1)</th><th>Attendance % (x2)</th><th>Final GPA</th><th>Grade</th></tr><tr><td>1</td><td>10</td><td>90</td><td>3.4</td><td>B</td></tr><tr><td>2</td><td>2</td><td>50</td><td>1.8</td><td>D</td></tr></table></div>\n<ul><li><b>Record (example):</b> one row, one student.</li><li><b>Feature (input, x):</b> one column that describes the record: hours studied, attendance. Also called attribute or dimension.</li><li><b>Label (answer, y):</b> the thing we want to predict. Here GPA (a number, so regression) or Grade (a category, so classification).</li><li><b>Labelled data:</b> every record has its answer. <b>Unlabelled data:</b> no answer column.</li><li><b>Model:</b> the pattern the machine learned. Think of it as a rule it worked out by itself.</li><li><b>Training:</b> showing the machine many examples. <b>Prediction:</b> the model's answer for a new input.</li><li><b>Sample:</b> the small part of the data we actually have. <b>Population:</b> everyone we care about.</li><li><b>Noise:</b> random flukes that are not a real pattern, like a hard-working student who scored low because they were sick that day.</li></ul>\n<div class=\"an\">🌍 <b>Putting it together:</b> you give the machine a table of past students. Each row is a record. Hours and attendance are features. The grade column is the label. The machine trains on it and builds a model. Then you give it a new student's features and it makes a prediction.</div>\n<details><summary>Check yourself 1</summary><p>In the table, which columns are features and which is the label (for predicting Grade)? <b>Answer:</b> Features: hours studied and attendance. Label: Grade.</p></details>\n<details><summary>Check yourself 2</summary><p>What is noise? <b>Answer:</b> Random flukes in the data that are not a real pattern.</p></details>"}, {"i": "🎯", "n": "Supervised ML", "h": "<h2>Supervised learning: predicting answers</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Learn from solved examples, then predict the answer for a new input.</div><div class=\"r\"><b>🧪 Example:</b> Pass or fail = classification. Marks out of 100 = regression. Next week's sales = time series.</div><div class=\"r\"><b>✅ Remember:</b> A category means classification. A number means regression. A future value in time order means time series.</div></div>\n<div class=\"one\">Supervised learning is split by the kind of answer we want: a category, a number, or a future value.</div>\n<h3>1. Classification: predict a category</h3>\n<p>The model puts an input into a class. Two choices (yes/no, spam/not spam) is <b>binary classification</b>. Three or more choices (class 1, 2, 3, 4) is <b>multiclass classification</b>. Examples: is this email spam? Does this X-ray show a broken bone?</p>\n<p>A <b>decision tree</b> is one classification method: a set of yes/no questions that ends in a prediction (Lesson 1).</p>\n<h3>2. Regression: predict a number</h3>\n<p>The model gives a number on a smooth scale: exam marks, house price, tomorrow's temperature.</p>\n<h3>3. Time series (forecasting): predict the future from the past</h3>\n<p>The data is in time order, so the order matters. The model looks for a <b>trend</b> (going up over time), <b>seasonality</b> (repeating cycles like weekends) and <b>lag</b> (yesterday affects today).</p>\n<p><b>Example:</b> sales on days 1 to 5 were 300, 310, 312, 320, 325. What will day 6 be?</p>\n<ul><li><b>Follow the trend:</b> the daily changes are 10, 2, 8, 5. Their average is (10 + 2 + 8 + 5) &divide; 4 = 6.25. Day 6 is about 325 + 6.25 = <b>331.25</b>.</li><li><b>Average the last 3 days:</b> (312 + 320 + 325) &divide; 3 = <b>319</b>. This is lower, because an average of old values lags behind a rising trend.</li><li><b>Let ML learn it with lag features:</b> a table with yesterday's sales as input and today's as the answer (the full method is in Lesson 8).</li></ul>\n<details><summary>Check yourself 1</summary><p>Predict whether a customer will buy (yes or no). Which kind? <b>Answer:</b> Binary classification.</p></details>\n<details><summary>Check yourself 2</summary><p>Daily changes of 4, 6 and 5 give an average change of? <b>Answer:</b> (4 + 6 + 5) &divide; 3 = 5.</p></details>"}, {"i": "💰", "n": "Donor example", "h": "<h2>A real example: choosing whom to contact</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Use two models to decide who to contact: will they give, and how much?</div><div class=\"r\"><b>🧪 Example:</b> 70% sure &times; 1200 = 840 expected. Minus a phone cost of 10 gives 830 profit.</div><div class=\"r\"><b>✅ Remember:</b> Expected value = probability &times; amount. Contact a person only if it beats the cost.</div></div>\n<div class=\"one\">A charity has records of 1 million possible donors. Contacting a person costs money, so the charity wants to contact only the people who are likely to give enough to be worth it. This is the classic \"KDD'98\" marketing problem.</div>\n<h3>The problem</h3>\n<ul><li>Contacting a person by <b>phone call</b> costs <b>10/-</b>. A <b>letter</b> costs <b>25/-</b>.</li><li>Contacting all 1 million people wastes money on those who will give nothing.</li><li>So we use ML to guess who will give, and how much.</li></ul>\n<h3>The data</h3>\n<div class=\"wrap\"><table><tr><th>Donor ID</th><th>Donated last year</th><th>Amount last year</th><th>Model 1 prediction</th><th>Model 2 amount</th><th>Probability &times; amount</th></tr>\n<tr><td>1</td><td>1</td><td>1000</td><td>1</td><td>1200</td><td>70% &times; 1200</td></tr>\n<tr><td>2</td><td>0</td><td>0</td><td>1</td><td>500</td><td>60% &times; 500</td></tr>\n<tr><td>3</td><td>1</td><td>5000</td><td>0</td><td>0</td><td>0</td></tr></table></div>\n<ul><li><b>Donated last year</b> and <b>Amount last year</b> are facts from the past (1 = yes, 0 = no). Together with other details like age and income, they are the <b>features</b>.</li><li><b>Model 1</b> is a classification model: will this person donate this time? 1 = yes, 0 = no.</li><li><b>Model 2</b> is a regression model: how much would they give?</li></ul>\n<h3>Step by step: should we contact this person?</h3>\n<ol><li><b>Model 1</b> says whether they will give. Donor 3 gets 0, so we stop there.</li><li><b>Model 2</b> says how much (donor 1: 1200).</li><li><b>Expected value = probability &times; amount.</b> Donor 1: 0.70 &times; 1200 = 840. Donor 2: 0.60 &times; 500 = 300.</li><li><b>Subtract the contact cost</b> to see the real profit. Donor 1 by phone: 840 &minus; 10 = <b>830</b>. Donor 2 by letter: 300 &minus; 25 = <b>275</b>. Donor 3 by phone: 0 &minus; 10 = <b>&minus;10</b>, a loss, so skip.</li></ol>\n<p>The general formula is <b>Expected value = sum of (P &times; D)</b>, where P is the probability and D is the predicted amount. The \"sum\" sign means add up the same thing for every case.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> a shopkeeper has 1 million flyers and each costs money to deliver. He gives flyers only to houses likely to buy something worth more than the flyer cost.</div>\n<h3>Where the genetic algorithm fits</h3>\n<p>A GA (Lesson 4) can choose which donors to contact. A chromosome (1 1 0 1 1) for donors P1 to P5 means: contact donors 1, 2, 4 and 5, skip donor 3. The <b>fitness is the profit = expected income minus cost</b>.</p>\n<p><b>Worked example.</b> Expected incomes: 840, 300, 0, 200, 120. Each contact costs 10.</p>\n<ul><li>Chromosome <b>11011</b>: income 840 + 300 + 200 + 120 = 1460. Cost 4 &times; 10 = 40. Profit = <b>1420</b>.</li><li>Chromosome <b>11111</b>: income 1460. Cost 5 &times; 10 = 50. Profit = <b>1410</b>.</li></ul>\n<p>11011 wins because contacting donor 3 costs 10 and brings nothing.</p>\n<h3>Optimization in simple words</h3>\n<p><b>Optimization</b> means finding the best possible solution for one or more goals. Example: minimize cost. <b>Multi-objective optimization</b> chases two or more goals at once, such as minimizing both cost and CO&#8322; emissions.</p>\n<details><summary>Check yourself 1</summary><p>Probability 0.80, amount 500, letter cost 25. Profit? <b>Answer:</b> 0.80 &times; 500 = 400. 400 &minus; 25 = 375.</p></details>\n<details><summary>Check yourself 2</summary><p>Why is donor 3 skipped? <b>Answer:</b> Expected income is 0, so contacting costs 10 and brings nothing.</p></details>"}, {"i": "🧹", "n": "Preparing data", "h": "<h2>Getting the data ready</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Clean and improve the data before the machine learns from it.</div><div class=\"r\"><b>🧪 Example:</b> Date of birth becomes age (engineering). Student ID is dropped (selection).</div><div class=\"r\"><b>✅ Remember:</b> Engineering = make a new useful feature. Selection = remove useless ones. Z-score = how far from average.</div></div>\n<div class=\"one\">Before a machine learns, we prepare the data. This is called <b>data preprocessing</b>. Two main methods are feature engineering and feature selection.</div>\n<div class=\"an\">🌍 <b>Analogy: cooking.</b> Before cooking you wash, peel and chop the ingredients, and you leave out ingredients that do not belong in the dish. A good meal needs good preparation, and so does a good model.</div>\n<h3>1. Feature engineering: make better features</h3>\n<ul><li>From <b>date of birth</b>, make <b>age</b>. A model can use age easily, but a date is hard to use.</li><li>From <b>weight</b> and <b>height</b>, make <b>BMI = weight &divide; height&sup2;</b>. For 60 kg and 1.5 m: 1.5 &times; 1.5 = 2.25, and 60 &divide; 2.25 = 26.7.</li></ul>\n<h3>2. Feature selection: keep only the useful features</h3>\n<p>Drop columns that do not help. To predict marks, <b>hours studied</b> helps, but <b>student ID number</b> does not. Fewer features means a faster model, less noise and less trouble from too many dimensions (see \"Too many features\").</p>\n<h3>3. The Z-score</h3>\n<p>A Z-score tells you <b>how far a value is from the average, counted in steps called standard deviations</b>.</p>\n<div class=\"fm\">z = (x &minus; mean) &divide; standard deviation</div>\n<p><b>Example:</b> marks 40, 50, 60, 70, 80.</p>\n<ol><li>Mean = (40 + 50 + 60 + 70 + 80) &divide; 5 = 60.</li><li>Differences from the mean: &minus;20, &minus;10, 0, 10, 20.</li><li>Square them: 400, 100, 0, 100, 400. Add: 1000. Divide by 5: 200.</li><li>Square root: standard deviation = about 14.14.</li><li>For the mark 80: z = (80 &minus; 60) &divide; 14.14 = <b>1.41</b>. For 60: z = 0. For 40: z = &minus;1.41.</li></ol>\n<p><b>Meaning:</b> 80 is 1.41 steps above average. 60 is exactly average. 40 is 1.41 steps below.</p>\n<p><b>Why useful:</b> it puts features of very different sizes on the same scale. Without it, a big-number feature like salary would drown a small-number feature like age when the machine measures distances.</p>\n<details><summary>Check yourself 1</summary><p>Making \"age\" from \"date of birth\" is engineering or selection? <b>Answer:</b> Feature engineering.</p></details>\n<details><summary>Check yourself 2</summary><p>Mean 60, standard deviation 10, value 80. Z-score? <b>Answer:</b> (80 &minus; 60) &divide; 10 = 2.</p></details>"}, {"i": "🔍", "n": "Unsupervised ML", "h": "<h2>Unsupervised learning: finding patterns without answers</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> No answers are given. The machine finds groups (clustering) or items bought together (association).</div><div class=\"r\"><b>🧪 Example:</b> Shoppers fall into groups like bargain hunters and luxury buyers. Burger patties and buns often come with ketchup.</div><div class=\"r\"><b>✅ Remember:</b> The machine finds the groups. Humans give them names.</div></div>\n<div class=\"one\">There is no teacher and no answer column. The machine looks at the data and groups similar things.</div>\n<h3>1. Clustering: make groups of similar items</h3>\n<p>The machine measures how <b>close</b> items are (their distance) and puts nearby items into the same group, called a <b>cluster</b>.</p>\n<div class=\"an\">🌍 <b>Analogy: students at a school assembly.</b> Without any instruction they naturally stand in groups of friends. A clustering method does the same with data points.</div>\n<p><b>Example:</b> student data with height, weight, Z-score, GPA 1 and GPA 2. If we look at only height and weight we may see 2 clusters, which we can guess are two groups of students. The machine does <b>not</b> know the names of the groups. It only sees 2 clusters. A human gives the names.</p>\n<p><b>Adding a feature can change the clusters.</b> If we add a third feature, such as the Z-score, the old clusters can disappear and new ones can form, because the points are now measured in a new way. This leads to the idea of \"too many features\" later.</p>\n<h3>2. Association rules: find \"if this, then that\"</h3>\n<p>It looks at many shopping baskets and finds items that often appear together.</p>\n<p><b>Example: 10 shopping baskets.</b> 5 baskets contain patties and buns. Of those 5, <b>4</b> also contain ketchup.</p>\n<ul><li><b>Support</b> = how common the whole combination is = 4 &divide; 10 = <b>40%</b>.</li><li><b>Confidence</b> = how reliable the rule is = 4 &divide; 5 = <b>80%</b>.</li></ul>\n<p>The rule: patties + buns, then ketchup (confidence 80%). A shop can put ketchup near the buns or sell a bundle.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> in a class of 10, 5 students carry a red pen and a ruler, and 4 of them also carry a calculator. So if a student has a red pen and a ruler, there is an 80% chance of a calculator too.</div>\n<details><summary>Check yourself 1</summary><p>Does the machine name the clusters? <b>Answer:</b> No. It only finds the groups. Humans name them.</p></details>\n<details><summary>Check yourself 2</summary><p>8 baskets have bread and butter, and 6 of them also have jam. Confidence of \"bread and butter, then jam\"? <b>Answer:</b> 6 &divide; 8 = 75%.</p></details>"}, {"i": "🎮", "n": "Reinforcement", "h": "<h2>Reinforcement learning (RL)</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An agent tries actions in an environment and learns from rewards (+) and penalties (-).</div><div class=\"r\"><b>🧪 Example:</b> A dog sits and gets a treat. It jumps on the sofa and hears \"no\". It learns what to do.</div><div class=\"r\"><b>✅ Remember:</b> State, then action, then reward. The policy is the rule for choosing the action.</div></div>\n<div class=\"one\">Reinforcement learning is a type of ML where an <b>agent</b> learns by interacting with an <b>environment</b> and getting feedback as rewards (positive) or penalties (negative).</div>\n<div class=\"an\">🌍 <b>Analogy: training a dog, or playing a video game.</b> The dog sits and gets a treat (reward). It jumps on the sofa and hears \"no\" (penalty). After many tries it learns what to do. A game character learns the same way: collect coins (+), fall in the lava (-).</div>\n<p><b>Real example:</b> robots from Boston Dynamics (some walk on four legs like dogs) can use RL ideas to learn useful movements by trying and getting feedback.</p>\n<h3>The four words of RL</h3>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Symbol</th><th>Meaning</th><th>Robot example</th></tr><tr><td>State</td><td>s</td><td>The current situation</td><td>The robot is standing in front of a step</td></tr><tr><td>Action</td><td>a</td><td>What the agent does</td><td>Lift the leg, turn, or wait</td></tr><tr><td>Policy</td><td>&pi;</td><td>The rule for choosing actions</td><td>\"In front of a step, usually lift the leg\"</td></tr><tr><td>Probability</td><td>p</td><td>The chance of choosing that action</td><td>0.7 for lifting the leg</td></tr></table></div>\n<p>Read the table like a story: the robot is in a <b>state</b> (in front of a step). It must pick an <b>action</b> (lift leg, turn or wait). Its <b>policy</b> is the rule that decides, and the rule gives each action a <b>probability</b>.</p>\n<h3>The policy formula: &pi;(s, a) = p</h3>\n<p>Read it as: \"In state s, the policy &pi; picks action a with probability p.\" Example: in state s1 (in front of a step), &pi;(s1, lift leg) = 0.7, &pi;(s1, turn) = 0.2, &pi;(s1, wait) = 0.1. The probabilities add up to 1 (0.7 + 0.2 + 0.1 = 1.0), because the robot must choose something.</p>\n<p>Learning means changing these probabilities. Actions that earn rewards get a higher p over time.</p>\n<details><summary>Check yourself 1</summary><p>In RL, what is the \"agent\"? <b>Answer:</b> The learner that takes actions, such as the robot or the game character.</p></details>\n<details><summary>Check yourself 2</summary><p>Can the probabilities in a policy for one state be 0.5, 0.4 and 0.3? <b>Answer:</b> No. They must add up to 1, and these add up to 1.2.</p></details>"}, {"i": "📏", "n": "Too many features", "h": "<h2>Too many features: dimensions and PCA</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A dimension is one feature (one column). Too many features make the data spread out and look empty.</div><div class=\"r\"><b>🧪 Example:</b> 1 feature = a line. 2 = a page. 3 = a box. 200 features = a space you cannot picture.</div><div class=\"r\"><b>✅ Remember:</b> More features means emptier space, which makes learning harder. PCA squeezes many features into few.</div></div>\n<div class=\"one\"><b>Attribute = feature = dimension = column.</b> These four words mean the same thing. A record with 200 features is a point in 200 dimensions.</div>\n<div class=\"wrap\"><table><tr><th>Features</th><th>What we measure</th><th>Where the data lives</th></tr><tr><td>1</td><td>height only</td><td>on a line</td></tr><tr><td>2</td><td>height and weight</td><td>on a flat page (a graph)</td></tr><tr><td>3</td><td>height, weight, shoe size</td><td>inside a box</td></tr><tr><td>hundreds</td><td>many measurements</td><td>in a space we cannot picture</td></tr></table></div>\n<h3>Problem 1: the data becomes sparse (empty)</h3>\n<p>Suppose each feature has 10 possible levels and we have 100 data points. Count the \"boxes\" the data must fill:</p>\n<div class=\"wrap\"><table><tr><th>Features</th><th>Boxes (10 to the power of features)</th><th>Points per box (100 &divide; boxes)</th></tr><tr><td>1</td><td>10</td><td>10</td></tr><tr><td>2</td><td>100</td><td>1</td></tr><tr><td>3</td><td>1,000</td><td>0.1</td></tr><tr><td>50</td><td>10<sup>50</sup></td><td>almost 0</td></tr></table></div>\n<p>With 1 feature there are 10 boxes. With 2 features there are 10 &times; 10 = 100 boxes. The count multiplies by 10 each time we add a feature. With 3 features most boxes are empty (0.1 points each). The data looks like a few dots lost in a huge empty space, and the model has too little data around each spot to learn from.</p>\n<h3>Problem 2: distances lose meaning</h3>\n<p>Many methods measure how close two items are. In very high dimensions almost every pair of points ends up about the same distance apart. If everything looks equally far, the machine cannot tell which items are truly similar.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> compare two students on 1 subject and you can easily say who is closer. Compare them on 200 subjects and almost every pair differs somewhere, so all pairs look about equally different.</div>\n<h3>Problem 3: overfitting and heavy computing</h3>\n<p>With hundreds of features the model needs a lot of computing power, and it can mistake random noise for a real pattern (overfitting, next tab).</p>\n<h3>The fix: dimensionality reduction with PCA</h3>\n<p><b>PCA</b> (Principal Component Analysis) makes a few new features that keep most of the important variation in the data. <b>Variation</b> means how spread out the data points are. If every student had the same height, height would tell us nothing. PCA keeps the directions with the most spread.</p>\n<div class=\"an\">🌍 <b>Analogy: a photo.</b> A real scene is 3D but a photo is 2D. A good photo keeps most of what you care about. PCA looks for the best \"angle\".</div>\n<p><b>Example:</b> four students with (height, weight): (150, 45), (160, 52), (170, 60), (180, 68). Taller students are heavier, so the points lie almost on one line. One number, \"overall body size\", describes each student almost as well as two numbers. That number is the <b>first principal component (PC1)</b>. If PC1 holds 95% of the variation, keeping only PC1 halves the columns and loses only 5% of the information.</p>\n<p>An <b>autoencoder</b> is a small neural network that squeezes the data into a short code and rebuilds the original from it. If the rebuilt data is close, the code is a good summary.</p>\n<details><summary>Check yourself 1</summary><p>With 10 levels per feature, how many boxes do 4 features make? <b>Answer:</b> 10 &times; 10 &times; 10 &times; 10 = 10,000.</p></details>\n<details><summary>Check yourself 2</summary><p>What does PCA do? <b>Answer:</b> It makes a few new features that keep most of the information, so we can use fewer columns.</p></details>"}, {"i": "⚖️", "n": "Train, test, bias, variance", "h": "<h2>Training, testing, bias and variance</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Train on one part of the data. Test on a part the model has never seen.</div><div class=\"r\"><b>🧪 Example:</b> With 1,000 records: 800 to train and 200 to test.</div><div class=\"r\"><b>✅ Remember:</b> Good on training but bad on testing = overfit. Bad on both = underfit. Good on both = just right.</div></div>\n<div class=\"sq\"><b>🎬 StatQuest: \"Machine Learning Fundamentals: Bias and Variance\"</b><br>The video predicts a mouse's <b>height from its weight</b>. The true relationship is a <b>curve</b>. It shows that a straight line (linear regression) cannot follow the curve, which is <b>bias</b>, and that a very flexible squiggly line fits the training data almost perfectly but does badly on new data, which is <b>variance</b>. The aim is to find a balance between the two. Ways to find the balance include regularization, boosting and bagging.</div>\n<h3>Step 1: sample and population</h3>\n<p>We cannot measure every mouse in the world (the <b>population</b>). We measure a few (a <b>sample</b>) and build the model from it. A model trained on one sample can perform badly on other samples. This is the <b>bias-variance problem</b>.</p>\n<h3>Step 2: split into training and testing sets</h3>\n<p>Keep about <b>80%</b> for <b>training</b> (the model learns from it) and <b>20%</b> for <b>testing</b> (the model never sees it while learning). With 1,000 records that is 800 and 200.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> training data = practice papers. Testing data = the real exam. A student who memorised the practice answers may look brilliant at home and still fail the real exam.</div>\n<h3>Step 3: the straight line has high bias (underfitting)</h3>\n<p>The true link between weight and height is a curve. A straight line cannot bend, so it misses the shape. This failure to capture the real relationship is <b>bias</b>. A model that is too simple is <b>underfitting</b>: it makes big errors on the training data <b>and</b> on the testing data.</p>\n<h3>Step 4: the squiggly line has high variance (overfitting)</h3>\n<p>A very flexible squiggly line can pass through every training dot, so its training error is almost zero. But it also copies the random noise. On the testing data it does badly, and its predictions would change a lot if we trained on a different sample. That is <b>variance</b>, and the result is <b>overfitting</b>.</p>\n<h3>Step 5: the sweet spot</h3>\n<p>A good model is flexible enough to follow the real pattern but not so flexible that it copies the noise. It does well on both training and testing data.</p>\n<div class=\"wrap\"><table><tr><th>Model</th><th>Training error</th><th>Testing error</th><th>Problem</th></tr><tr><td>Straight line</td><td>10</td><td>12</td><td>High bias (underfit)</td></tr><tr><td>Balanced curve</td><td>4</td><td>5</td><td>Good</td></tr><tr><td>Squiggly line</td><td>0</td><td>20</td><td>High variance (overfit)</td></tr></table></div>\n<p>(Example numbers. \"Error\" is a score of how wrong the model is, so lower is better.) The straight line has high error on both. The squiggly line has zero training error but a big testing error, and the big gap warns you of overfitting. The balanced curve has low error on both. Always compare training error with testing error.</p>\n<details><summary>Check yourself 1</summary><p>Training error 1 and testing error 15. Diagnosis? <b>Answer:</b> Overfitting (high variance): it memorised the training data.</p></details>\n<details><summary>Check yourself 2</summary><p>Training error 12 and testing error 13. Diagnosis? <b>Answer:</b> Underfitting (high bias): the model is too simple, so both errors are high.</p></details>"}, {"i": "📊", "n": "Judging a model", "h": "<h2>How good is a model? Scores and cross-validation</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> Count the model's hits and misses, then turn them into scores.</div><div class=\"r\"><b>🧪 Example:</b> A spam filter with 85 correct answers out of 100 has accuracy 85%.</div><div class=\"r\"><b>✅ Remember:</b> Accuracy, precision, recall. Cross-validation tests on every part of the data in turn.</div></div>\n<h3>1. The confusion matrix</h3>\n<p>A spam filter checks 100 emails. 40 are really spam and 60 are normal. Results:</p>\n<div class=\"wrap\"><table><tr><th></th><th>Filter says SPAM</th><th>Filter says NORMAL</th></tr><tr><th>Really spam (40)</th><td>30 (TP)</td><td>10 (FN)</td></tr><tr><th>Really normal (60)</th><td>5 (FP)</td><td>55 (TN)</td></tr></table></div>\n<ul><li><b>TP (true positive):</b> spam correctly caught. 30.</li><li><b>FN (false negative):</b> spam that slipped through. 10.</li><li><b>FP (false positive):</b> a normal email wrongly called spam. 5.</li><li><b>TN (true negative):</b> a normal email correctly left alone. 55.</li></ul>\n<p>Check: 30 + 10 + 5 + 55 = 100.</p>\n<h3>2. Four scores from the same numbers</h3>\n<ul><li><b>Accuracy</b> = (TP + TN) &divide; all = (30 + 55) &divide; 100 = <b>85%</b>. How often is it right overall?</li><li><b>Precision</b> = TP &divide; (TP + FP) = 30 &divide; 35 = <b>85.7%</b>. When it says spam, how often is it right?</li><li><b>Recall (sensitivity)</b> = TP &divide; (TP + FN) = 30 &divide; 40 = <b>75%</b>. Of all real spam, how much did it catch?</li><li><b>Specificity</b> = TN &divide; (TN + FP) = 55 &divide; 60 = <b>91.7%</b>. Of all normal emails, how many did it leave alone?</li></ul>\n<div class=\"an\">🌍 <b>Analogy: a fishing net.</b> Recall asks \"how many of the fish did my net catch?\". Precision asks \"of what I caught, how much is fish and not rubbish?\".</div>\n<h3>3. Cross-validation</h3>\n<p>One 80/20 split can be lucky or unlucky. In <b>cross-validation</b> we cut the data into several parts (folds), for example 5. Each round, 4 parts train the model and the 1 left-out part tests it. We do this 5 times so every part is the test part once. Then we average the scores.</p>\n<p>Example scores: 80, 84, 78, 86, 82. Average = (80 + 84 + 78 + 86 + 82) &divide; 5 = 410 &divide; 5 = <b>82</b>.</p>\n<div class=\"an\">🌍 <b>Analogy:</b> instead of judging a student on one exam, you use 5 different exams and take the average.</div>\n<details><summary>Check yourself 1</summary><p>TP = 20, FN = 10, FP = 10, TN = 60. Accuracy? <b>Answer:</b> (20 + 60) &divide; 100 = 80%.</p></details>\n<details><summary>Check yourself 2</summary><p>Scores 70, 80, 90 from 3 folds. Average? <b>Answer:</b> (70 + 80 + 90) &divide; 3 = 80.</p></details>"}, {"i": "🛠️", "n": "The ML workflow", "h": "<h2>The steps of an ML project</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> An ML project follows 8 steps, from the question to using the model.</div><div class=\"r\"><b>🧪 Example:</b> Predict whether a student will pass the module.</div><div class=\"r\"><b>✅ Remember:</b> Define, collect, prepare, split, train, test, improve, use.</div></div>\n<div class=\"one\">Everything in this lesson fits into one workflow. Here it is, using \"predict whether a student will pass the module\" as the example.</div>\n<ol><li><b>Define the problem.</b> We predict pass or fail, so this is classification.</li><li><b>Collect data.</b> Records of past students: hours studied, attendance and the result.</li><li><b>Prepare the data.</b> Fix missing values, make good features, drop useless columns.</li><li><b>Split the data.</b> For example 80% to train and 20% to test.</li><li><b>Train a model</b> on the training data.</li><li><b>Test it</b> on the testing data. Check accuracy, precision and recall.</li><li><b>Improve it.</b> If both errors are high the model is too simple. If training is good but testing is bad, it is overfitting. Try more data or another method.</li><li><b>Use it.</b> Predict for the new students.</li></ol>\n<details><summary>Check yourself 1</summary><p>What is the first step of an ML project? <b>Answer:</b> Define the problem: what to predict and what type of task it is.</p></details>\n<details><summary>Check yourself 2</summary><p>Training is great and testing is bad. What next? <b>Answer:</b> The model is overfitting. Try more data, a simpler model or a different method.</p></details>"}, {"i": "📚", "n": "Words list", "h": "<h2>Hard words in one place</h2>\n<div class=\"glance\"><div class=\"t\">⚡ At a glance</div><div class=\"r\"><b>🧠 Idea:</b> A quick reference for the words in this lesson.</div><div class=\"r\"><b>🧪 Example:</b> Feature = one column that describes a record.</div><div class=\"r\"><b>✅ Remember:</b> Come back here whenever a word is unclear.</div></div>\n<div class=\"wrap\"><table><tr><th>Word</th><th>Plain meaning</th></tr>\n<tr><td><b>Model</b></td><td>The pattern a machine learns from data</td></tr>\n<tr><td><b>Feature, label</b></td><td>An input column / the answer we want to predict</td></tr>\n<tr><td><b>Supervised, unsupervised, reinforcement</b></td><td>Learning with answers / without answers / from rewards</td></tr>\n<tr><td><b>Classification, regression</b></td><td>Predict a category / predict a number</td></tr>\n<tr><td><b>Cluster</b></td><td>A group of similar items</td></tr>\n<tr><td><b>Support, confidence</b></td><td>How common a combination is / how reliable an if-then rule is</td></tr>\n<tr><td><b>Agent, policy</b></td><td>The learner in RL / its rule for choosing actions</td></tr>\n<tr><td><b>Z-score</b></td><td>How many standard deviations a value is from the average</td></tr>\n<tr><td><b>Dimension</b></td><td>One feature (one column)</td></tr>\n<tr><td><b>PCA</b></td><td>A way to squeeze many features into a few</td></tr>\n<tr><td><b>Bias</b></td><td>A model too simple to capture the real pattern</td></tr>\n<tr><td><b>Variance</b></td><td>A model that changes a lot with different training data</td></tr>\n<tr><td><b>Overfitting, underfitting</b></td><td>Too closely fitted to the training data / too simple</td></tr>\n<tr><td><b>Confusion matrix</b></td><td>A table of hits and misses (TP, FN, FP, TN)</td></tr>\n<tr><td><b>Cross-validation</b></td><td>Testing on each part of the data in turn and averaging the scores</td></tr></table></div>"}];const M=[["Which describes machine learning best?", ["Humans write every rule", "A computer learns patterns from data", "A robot with a body", "Only chatbots"], 1, "ML learns patterns from data instead of following hand-written rules."], ["The pattern a machine learns from data is called a:", ["Gene", "Model", "Prompt", "State"], 1, "We train a model from examples."], ["Supervised learning uses data that has:", ["No answers", "Inputs and correct answers (labels)", "Only rewards", "Only images"], 1, "Labelled data means each example comes with its answer."], ["Grouping customers by behaviour with no labels is:", ["Supervised learning", "Unsupervised learning", "Reinforcement learning", "Regression"], 1, "No answers are given, so it is unsupervised (clustering)."], ["A robot learns to walk using rewards and penalties. This is:", ["Supervised", "Unsupervised", "Reinforcement learning", "Classification"], 2, "Learning from rewards and penalties is reinforcement learning."], ["Predicting whether an email is spam is:", ["Regression", "Classification", "Clustering", "Time series"], 1, "The answer is a category (spam or not spam)."], ["Predicting a house price is:", ["Classification", "Regression", "Clustering", "Association"], 1, "The answer is a number."], ["Predicting tomorrow's electricity demand from past days is:", ["Time series forecasting", "Clustering", "Binary classification", "RL"], 0, "The data is in time order and we predict a future value."], ["Classifying into 4 possible classes is called:", ["Binary classification", "Multiclass classification", "Regression", "Clustering"], 1, "3 or more classes = multiclass."], ["A model gives donation probability 0.60 and amount 500. The expected value is:", ["300", "500", "560", "1100"], 0, "0.60 x 500 = 300."], ["Another donor: probability 0.70 and amount 1200. The expected value is:", ["840", "1200", "1270", "700"], 0, "0.70 x 1200 = 840."], ["In the market-basket example, 40 of 50 buyers also buy ketchup. The rule strength is:", ["40%", "50%", "80%", "90%"], 2, "40 / 50 = 0.80 = 80%."], ["In RL, the 'agent' is:", ["The data set", "The learner that takes actions", "The reward", "The cluster"], 1, "The agent acts inside an environment."], ["In RL, the policy pi(s, a) = p means:", ["The reward of action a", "The probability of choosing action a in state s", "The size of the data", "The number of clusters"], 1, "A policy says how likely each action is in each state."], ["Which four words mean the same thing in ML?", ["Attribute, feature, dimension, column", "Model, policy, state, reward", "Cluster, class, rule, gene", "Train, test, label, target"], 0, "Attribute = feature = dimension = column."], ["With 10 levels per feature, 3 features make how many 'boxes'?", ["30", "100", "1,000", "10,000"], 2, "10 x 10 x 10 = 1,000."], ["The curse of dimensionality means that as dimensions increase:", ["Data gets denser", "Data gets sparse and distances lose meaning", "Models get simpler", "Training gets faster"], 1, "Space grows fast, data points become isolated and far apart."], ["Which technique reduces dimensions?", ["PCA", "Roulette wheel", "BFS", "Few-shot prompting"], 0, "PCA and autoencoders compress data into fewer dimensions."], ["A common training/testing split is:", ["50% / 50%", "80% / 20%", "10% / 90%", "100% / 0%"], 1, "Often about 80% to train and 20% to test."], ["A model has training error 0 but testing error 20. It is:", ["Underfitting", "Overfitting", "Perfect", "Unsupervised"], 1, "Great on training but bad on new data is overfitting."], ["A straight line fitted to curved data shows:", ["High variance", "High bias (underfitting)", "Overfitting", "No error"], 1, "It is too simple to capture the real shape."], ["A 'feature' in a data table is:", ["The answer we want to predict", "One column that describes an item", "The final model", "A reward"], 1, "Features are the inputs, such as hours studied."], ["A 'label' is:", ["An input column", "The correct answer for a record", "A cluster name", "A type of noise"], 1, "Labelled data means each record has its answer."], ["Making 'age' from 'date of birth' is:", ["Feature selection", "Feature engineering", "Clustering", "Overfitting"], 1, "You create a new, more useful feature from an existing one."], ["Removing a useless 'student ID' column is:", ["Feature engineering", "Feature selection", "Regression", "Training"], 1, "You keep only the useful features."], ["Marks 40, 50, 60, 70, 80 have mean 60 and standard deviation about 14.14. The Z-score of 80 is about:", ["0.71", "1.41", "20", "5.66"], 1, "(80 - 60) / 14.14 = 1.41."], ["Expected value 300 and letter cost 25. The profit is:", ["325", "300", "275", "25"], 2, "300 - 25 = 275."], ["In the donor chromosome 1 1 0 1 1, the 0 means:", ["Contact donor 3", "Skip donor 3", "Donor 3 gave 0 last year", "Stop the algorithm"], 1, "Each gene says contact (1) or skip (0) for that donor."], ["Why can chromosome 11011 beat 11111 in the example?", ["It has more genes", "Contacting donor 3 costs money but brings no income", "11111 has no donors", "Mutation changed it"], 1, "Donor 3 has expected income 0 but still costs 10 to contact."], ["4 of 10 baskets contain patties, buns and ketchup. The support of the rule is:", ["4%", "40%", "80%", "10%"], 1, "4 / 10 = 40%."], ["5 baskets have patties and buns, and 4 of them also have ketchup. The confidence is:", ["40%", "50%", "80%", "125%"], 2, "4 / 5 = 0.80."], ["The purpose of PCA is to:", ["Pick parents in a GA", "Reduce the number of features while keeping most of the variation", "Predict rewards", "Add noise"], 1, "It builds a few new features that keep the main patterns."], ["In a confusion matrix, a false positive (FP) is:", ["Spam correctly caught", "A normal email wrongly called spam", "Spam that was missed", "A normal email left alone"], 1, "The filter said positive (spam) but it was wrong."], ["TP = 30, TN = 55, FP = 5, FN = 10. The accuracy is:", ["75%", "85%", "85.7%", "91.7%"], 1, "(30 + 55) / 100 = 85%."], ["With the same numbers, recall = TP / (TP + FN) is:", ["75%", "85%", "85.7%", "30%"], 0, "30 / 40 = 75%."], ["With the same numbers, precision = TP / (TP + FP) is about:", ["75%", "85%", "85.7%", "91.7%"], 2, "30 / 35 = 0.857."], ["In 5-fold cross-validation, how many times is each record used for testing?", ["0", "1", "4", "5"], 1, "Each part is the test part exactly once."], ["Cross-validation scores are 80, 84, 78, 86, 82. The average is:", ["80", "82", "84", "410"], 1, "410 / 5 = 82."], ["In time series, a 'lag' feature is:", ["A random noise value", "An earlier value used as an input", "The final answer", "A cluster"], 1, "For example, yesterday's sales used to predict today's."], ["Sales 300, 310, 312, 320, 325. The average daily change is:", ["5", "6.25", "8", "25"], 1, "(10 + 2 + 8 + 5) / 4 = 6.25."], ["What is the first step of an ML project?", ["Train the model", "Define the problem", "Test the model", "Deploy"], 1, "First decide what you want to predict and what type of task it is."], ["The sweet spot model has:", ["High bias and high variance", "Low error on both training and testing data", "Zero training error only", "No data"], 1, "A good model works well on both."]];const K=[["Explain the difference between supervised and unsupervised learning, with one example each.", "Supervised learning uses labelled data: every example has a correct answer, so the model learns to predict answers for new data (example: predicting if an email is spam). Unsupervised learning uses data with no answers and finds groups or patterns itself (example: grouping shoppers by behaviour)."], ["A phone shop wants to (a) predict whether a customer will buy and (b) predict how much they will spend. Name the ML task for each.", "(a) is classification, because the answer is a category (buy or not buy). (b) is regression, because the answer is a number (the amount). The shop can multiply probability and amount to get an expected value."], ["Calculate the expected value for a donor with probability 0.45 and predicted amount 800. Say what it means.", "0.45 x 800 = 360. On average, contacting this donor is worth about 360. The charity can compare this with the cost of contacting and decide."], ["Describe reinforcement learning using a dog-training example. Name the agent, action, reward and penalty.", "The dog is the agent. The home is the environment. Sitting when told is an action. A treat is the reward. Jumping on the sofa gets a 'no', which is the penalty. Over many tries the dog does more of the actions that earn rewards."], ["Explain the curse of dimensionality and two problems it causes.", "When the number of features grows, the space grows extremely fast. (1) The data becomes sparse: points are lost in a huge empty space, so there is too little data around each point. (2) Distances lose meaning: almost all points look about equally far apart, so clustering and classification struggle. We reduce this with PCA or autoencoders."], ["A model has training error 2 and testing error 18. Another has training error 11 and testing error 12. Diagnose both and say which is better to improve.", "The first is overfitting (high variance): it memorised training data but fails on new data. The second is underfitting (high bias): it is too simple, so both errors are high. Neither is good. The first could be simplified or given more data. The second needs a more flexible model. The goal is low error on both."], ["Explain feature engineering and feature selection with one example each.", "Feature engineering means creating a new, more useful feature from existing ones, for example making age from date of birth, or BMI = weight / height squared. Feature selection means keeping only the features that help and dropping the rest, for example dropping the student ID column when predicting marks. Both are data preprocessing and help the model learn better."], ["Five donors have expected incomes 840, 300, 0, 200 and 120. Each contact costs 10. Compare the chromosomes 11011 and 11111 and say which a GA would prefer.", "For 11011: income 840 + 300 + 200 + 120 = 1460, cost 4 x 10 = 40, profit 1420. For 11111: income 1460, cost 5 x 10 = 50, profit 1410. A GA prefers 11011 because its fitness (profit) is higher. Donor 3 brings no income but costs 10."], ["A spam filter has TP = 20, FN = 10, FP = 10, TN = 60. Calculate accuracy, precision and recall.", "Total = 20 + 10 + 10 + 60 = 100. Accuracy = (20 + 60) / 100 = 80%. Precision = 20 / (20 + 10) = 66.7%. Recall = 20 / (20 + 10) = 66.7%. The filter is right 80% of the time overall, but it catches only two thirds of the spam, and one third of its spam alarms are wrong."], ["Why is cross-validation better than one single 80/20 split?", "One split can be lucky or unlucky depending on which records end up in the test set. Cross-validation tests on every part of the data in turn and averages the scores, so the result depends less on luck and is more reliable."]];
let cur=0;const $=s=>document.querySelector(s);const last=T.length;
function nav(){$('#nl').innerHTML=T.map((t,i)=>`<li><button class="nav-btn ${i==cur?'active':''}" onclick="go(${i})"><span class="num">${i+1}</span>${t.n}</button></li>`).join('')+`<li><button class="nav-btn ${cur==last?'active':''}" onclick="go(${last})"><span class="num">${last+1}</span>Q&amp;A</button></li>`;
const a=document.querySelector('.nav-btn.active');if(a)a.scrollIntoView({inline:'center',block:'nearest'})}
function go(i){cur=i;draw();window.scrollTo(0,0)}
function pager(){return `<div class="pager">${cur>0?`<button class="btn ghost" onclick="go(${cur-1})">&#8249; Back</button>`:'<span></span>'}${cur<last?`<button class="btn" onclick="go(${cur+1})">Next &#8250;</button>`:''}</div>`}
function draw(){nav();if(cur<last){$('#main').innerHTML='<div class="section">'+T[cur].h+pager()+'</div>';return}qa()}
function qa(){let sc=0,d=0,n=M.length,h=`<div class="section"><div class="score" id="sc">Score: 0 / ${n}</div><h2>Part A: MCQs (${n})</h2>`;
M.forEach((m,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<button class="opt" data-q="${i}" data-j="${j}">${o}</button>`).join('')}<div class="fb" id="w${i}"></div></div>`});
h+=`<h2>Part B: Think and write</h2><p style="color:var(--ink-soft)">Write your own answer first. Then open the model answer.</p>`;
K.forEach((k,i)=>{h+=`<div class="card"><p class="q">${i+1}. ${k[0]}</p><textarea placeholder="Type your answer..."></textarea><br><button class="btn" onclick="this.nextElementSibling.classList.toggle('show')">Show model answer</button><div class="model">${k[1]}</div></div>`});
h+=pager()+'</div>';$('#main').innerHTML=h;
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.q,j=+b.dataset.j,m=M[i];
document.querySelectorAll(`[data-q="${i}"]`).forEach((o,z)=>{o.disabled=true;if(z==m[2])o.classList.add('ok')});
if(j==m[2])sc++;else b.classList.add('no');d++;
const w=$('#w'+i);w.innerHTML=(j==m[2]?'Correct. ':'Not quite. ')+m[3];w.classList.add('show');
$('#sc').textContent=`Score: ${sc} / ${n}`+(d==n?'  (all answered)':'')})}
document.getElementById('pv').onclick=()=>$('#nl').scrollBy({left:-240,behavior:'smooth'});
document.getElementById('nx').onclick=()=>$('#nl').scrollBy({left:240,behavior:'smooth'});
draw();
</script></body></html>
