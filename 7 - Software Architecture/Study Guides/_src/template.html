<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
(function(){var t=null;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;})();
</script>
<style>
  :root{--bg:#fff;--fg:#1f2328;--muted:#656d76;--line:#d8dee4;--soft:#f6f8fa;--accent:#0b5cad;--ok:#1a7f37;--okbg:#e9f6ec;--bad:#cf222e;--badbg:rgba(207,34,46,.10);color-scheme:light}
  :root[data-theme=dark]{--bg:#14171a;--fg:#e6e8ea;--muted:#9aa3ad;--line:#2d333b;--soft:#1c2128;--accent:#6cb2ff;--ok:#56d364;--okbg:#14301c;--bad:#ff7b72;--badbg:rgba(255,123,114,.14);color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.65;font-size:16px}
  .wrap{max-width:860px;margin:0 auto;padding:24px 16px 64px}
  .crumb{color:var(--muted);font-size:13px;margin:0}
  h1{font-size:28px;margin:4px 0 6px}
  h2{font-size:20px;margin:36px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
  h3{font-size:16px;margin:22px 0 4px}
  p{margin:8px 0}
  .lead{color:var(--muted);margin-bottom:18px}
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;padding-top:8px}
  nav.tabs button{font:inherit;font-size:15px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted)}
  nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  section.panel{display:none}section.panel.on{display:block}
  table{border-collapse:collapse;width:100%;margin:12px 0;font-size:15px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--soft);font-weight:600}
  td:first-child{white-space:nowrap}
  code,pre{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:14px}
  pre{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;margin:10px 0;line-height:1.5}
  code{background:var(--soft);padding:1px 5px;border-radius:4px}
  pre code{background:none;padding:0}
  .box{background:var(--soft);border-left:3px solid var(--accent);padding:10px 14px;margin:14px 0;border-radius:0 6px 6px 0}
  .box b:first-child{display:block;margin-bottom:2px}
  ul,ol{margin:6px 0 6px 22px;padding:0}li{margin:3px 0}
  .q{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:14px 0}
  .q .t{font-weight:600;margin:0 0 8px}
  .opt{display:block;width:100%;text-align:left;font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:6px 0;cursor:pointer}
  .opt:hover:not(:disabled){background:var(--soft)}
  .opt.right{border-color:var(--ok);background:var(--okbg)}
  .opt.wrong{border-color:var(--bad);background:var(--badbg)}
  .ans{display:none;margin-top:8px;font-size:15px;color:var(--muted)}
  .q.done .ans{display:block}
  .score{position:sticky;top:50px;background:var(--bg);padding:8px 0;color:var(--muted);font-size:14px}
  button.link{font:inherit;font-size:14px;color:var(--accent);background:none;border:0;cursor:pointer;padding:0;text-decoration:underline}
  details{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0}
  summary{cursor:pointer;font-weight:600}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .top a{color:var(--accent);text-decoration:none}.top a:hover{text-decoration:underline}
  #theme{font:inherit;font-size:13px;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  svg.dg{width:100%;height:auto;max-width:640px;display:block;margin:12px 0;font-family:inherit}
  svg.dg .bx{fill:var(--soft);stroke:var(--fg);stroke-width:1.2}
  svg.dg .ar{stroke:var(--accent);stroke-width:1.8;fill:none;marker-end:url(#ah)}
  svg.dg text{fill:var(--fg);font-size:13px}
  svg.dg .sm{fill:var(--muted);font-size:12px}
  svg.dg .h{font-weight:700;font-size:14px}
  svg.dg .mono{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:13px}
  @media print{nav.tabs,.score{display:none}section.panel{display:block!important}}
</style>
</head>
<body>
<div class="wrap">
<svg width="0" height="0" style="position:absolute"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b5cad"/></marker></defs></svg>

  <div class="top"><p class="crumb"><a href="index.html">&larr; Software Architecture study guides</a> &middot; INTE 22293 &middot; {{PART}}</p><button id="theme" type="button"></button></div>
  <h1>{{H1}}</h1>
  <p class="lead">{{LEAD}}</p>

  <nav class="tabs" role="tablist">
    {{TABS}}
  </nav>

{{PANELS}}

</div>

<script>
const Q={{QJS}};
const mcq=document.getElementById('mcq'),sc=document.getElementById('sc'),tot=document.getElementById('tot');
let score=0;
function build(){
  mcq.innerHTML='';score=0;sc.textContent=0;tot.textContent=Q.length;
  Q.forEach((x,i)=>{
    const d=document.createElement('div');d.className='q';
    const p=document.createElement('p');p.className='t';p.textContent=(i+1)+'. '+x.q;d.appendChild(p);
    x.o.forEach((t,j)=>{
      const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+t;
      b.onclick=()=>{
        if(d.classList.contains('done'))return;
        d.classList.add('done');
        d.querySelectorAll('.opt').forEach((o,k)=>{o.disabled=true;if(k===x.a)o.classList.add('right')});
        if(j===x.a){score++;sc.textContent=score}else b.classList.add('wrong');
      };
      d.appendChild(b);
    });
    const a=document.createElement('div');a.className='ans';a.textContent='Answer: '+String.fromCharCode(65+x.a)+'. '+x.e;d.appendChild(a);
    mcq.appendChild(d);
  });
}
build();
document.getElementById('reset').onclick=build;
const tb=document.getElementById('theme');
function paint(){tb.textContent=document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode'}
tb.onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}paint()};
paint();
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));
  window.scrollTo(0,0);
});
</script>
</body>
</html>
